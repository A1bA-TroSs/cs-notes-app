1\n", "34/pg42747/cases/cases.json": "[\n  {\"name\": \"중간에서 끊김\", \"args\": [[4, 4, 0, 7, 2]], \"expected\": 3},\n  {\"name\": \"전부 0\", \"args\": [[0, 0, 0]], \"expected\": 0},\n  {\"name\": \"답이 배열에 없는 값\", \"args\": [[10, 10, 10]], \"expected\": 3},\n  {\"name\": \"논문 하나, 인용 1\", \"args\": [[1]], \"expected\": 1},\n  {\"name\": \"논문 하나, 인용 0\", \"args\": [[0]], \"expected\": 0},\n  {\"name\": \"같은 값이 많음\", \"args\": [[5, 5, 5, 5, 1]], \"expected\": 4},\n  {\"name\": \"h와 인용 수가 딱 같음\", \"args\": [[2, 2, 2, 2]], \"expected\": 2},\n  {\"name\": \"논문 수가 답\", \"args\": [[100, 100, 100, 100, 100, 100, 100]], \"expected\": 7}\n]\n", "34/pg42747/problem.json": "{\"kind\": \"func\", \"title\": \"프로그래머스 42747 H-Index\", \"entry\": \"solution\", \"time_limit\": 1.0, \"big_note\": \"n = 20,000 (원래 제약 1,000보다 크게)\"}\n", "34/pg42747/solution/brute.py": "def solution(citations):\n    # 정의 그대로: h를 크게부터 내려가며 \"h번 이상 인용된 논문이 h편 이상\"인지 센다\n    for h in range(len(citations), -1, -1):\n        if sum(1 for x in citations if x >= h) >= h:\n            return h\n", "34/pg42747/solution/gen.py": "def gen(rng):\n    n = rng.randint(1, 10)\n    hi = rng.choice([0, 3, 10, 10_000])        # 전부 0, 작은 값, 큰 값\n    return [[rng.randint(0, hi) for _ in range(n)]]\n\n\ndef gen_big(rng):\n    return [[rng.randint(0, 10_000) for _ in range(20_000)]]\n", "34/pg42747/solution/ref.py": "def solution(citations):\n    c = sorted(citations, reverse=True)\n    h = 0\n    for i, x in enumerate(c):\n        if x >= i + 1:        # 위에서 i+1번째 논문까지 모두 i+1번 이상 인용됐어요\n            h = i + 1\n        else:\n            break             # 내림차순이라 이후로는 더 안 돼요\n    return h\n", "35/boj1300/cases/01.in": "4\n10\n", "35/boj1300/cases/01.out": "6\n", "35/boj1300/cases/02.in": "1\n1\n", "35/boj1300/cases/02.out": "1\n", "35/boj1300/cases/03.in": "5\n25\n", "35/boj1300/cases/03.out": "25\n", "35/boj1300/cases/04.in": "5\n1\n", "35/boj1300/cases/04.out": "1\n", "35/boj1300/cases/05.in": "100000\n5\n", "35/boj1300/cases/05.out": "3\n", "35/boj1300/cases/06.in": "10\n50\n", "35/boj1300/cases/06.out": "24\n", "35/boj1300/cases/07.in": "7\n30\n", "35/boj1300/cases/07.out": "16\n", "35/boj1300/problem.json": "{\"kind\": \"stdio\", \"title\": \"백준 1300 K번째 수\", \"time_limit\": 1.5, \"big_note\": \"N = 100,000, k = 10⁹\"}\n", "35/boj1300/solution/brute.py": "import sys\n\nn = int(sys.stdin.readline())\nk = int(sys.stdin.readline())\nb = sorted(i * j for i in range(1, n + 1) for j in range(1, n + 1))   # 배열을 실제로 만들어 정렬\nprint(b[k - 1])\n", "35/boj1300/solution/gen.py": "def gen(rng):\n    n = rng.randint(1, 30)\n    k = rng.choice([1, n * n, rng.randint(1, n * n)])   # 맨 앞, 맨 뒤도 섞어요\n    return f\"{n}\\n{k}\\n\"\n\n\ndef gen_big(rng):\n    return \"100000\\n1000000000\\n\"\n", "35/boj1300/solution/ref.py": "import sys\n\n\ndef main():\n    n = int(sys.stdin.readline())\n    k = int(sys.stdin.readline())\n\n    def count(x):                        # x 이하인 칸의 개수: i행에는 min(x // i, n)개\n        total = 0\n        for i in range(1, min(n, x) + 1):\n            total += min(x // i, n)\n        return total\n\n    lo, hi = 1, k                        # B[k] ≤ k 이니 k가 확실한 상한\n    while lo < hi:                       # 첫 번째 True: count(x) >= k인 가장 작은 x\n        mid = (lo + hi) // 2\n        if count(mid) >= k:\n            hi = mid\n        else:\n            lo = mid + 1\n    print(lo)\n\n\nmain()\n", "35/boj1654/cases/01.in": "3 7\n10\n15\n20\n", "35/boj1654/cases/01.out": "5\n", "35/boj1654/cases/02.in": "1 1\n1\n", "35/boj1654/cases/02.out": "1\n", "35/boj1654/cases/03.in": "3 3\n5\n9\n3\n", "35/boj1654/cases/03.out": "4\n", "35/boj1654/cases/04.in": "2 2\n2147483647\n2147483647\n", "35/boj1654/cases/04.out": "2147483647\n", "35/boj1654/cases/05.in": "2 10\n5\n5\n", "35/boj1654/cases/05.out": "1\n", "35/boj1654/cases/06.in": "1 1000000\n2147483647\n", "35/boj1654/cases/06.out": "2147\n", "35/boj1654/problem.json": "{\"kind\": \"stdio\", \"title\": \"백준 1654 랜선 자르기\", \"time_limit\": 1.0, \"big_note\": \"K = 10,000, 길이 최대 2³¹−1, N = 1,000,000\"}\n", "35/boj1654/solution/brute.py": "import sys\n\ndata = sys.stdin.read().split()\nk, n = int(data[0]), int(data[1])\nlines = list(map(int, data[2:2 + k]))\nbest = 0\nfor length in range(1, max(lines) + 1):     # 가능한 길이를 전부 시험\n    cnt = 0\n    for x in lines:\n        cnt += x // length\n    if cnt >= n:\n        best = length\nprint(best)\n", "35/boj1654/solution/gen.py": "def gen(rng):\n    k = rng.randint(1, 6)\n    lines = [rng.randint(1, 40) for _ in range(k)]\n    n = rng.randint(k, max(k, sum(lines)))      # K ≤ N, 답이 1 이상이 되게 N ≤ 총 길이\n    return f\"{k} {n}\\n\" + \"\\n\".join(map(str, lines)) + \"\\n\"\n\n\ndef gen_big(rng):\n    k = 10_000\n    lines = [rng.randint(1, 2**31 - 1) for _ in range(k)]\n    return f\"{k} 1000000\\n\" + \"\\n\".join(map(str, lines)) + \"\\n\"\n", "35/boj1654/solution/ref.py": "import sys\n\n\ndef main():\n    data = sys.stdin.buffer.read().split()\n    k, n = int(data[0]), int(data[1])\n    lines = list(map(int, data[2:2 + k]))\n\n    def ok(length):                      # 이 길이로 잘라서 n개 이상 나오나\n        return sum(x // length for x in lines) >= n\n\n    lo, hi = 1, max(lines)               # 하한 1: 0이면 나누기 에러, 답은 1 이상이 보장돼요\n    while lo < hi:                       # 마지막 True\n        mid = (lo + hi + 1) // 2         # lo = mid를 쓰니 올림\n        if ok(mid):\n            lo = mid\n        else:\n            hi = mid - 1\n    print(lo)\n\n\nmain()\n", "35/boj2110/cases/01.in": "6 3\n10\n1\n21\n6\n15\n3\n", "35/boj2110/cases/01.out": "9\n", "35/boj2110/cases/02.in": "2 2\n1\n1000000000\n", "35/boj2110/cases/02.out": "999999999\n", "35/boj2110/cases/03.in": "4 4\n5\n1\n4\n10\n", "35/boj2110/cases/03.out": "1\n", "35/boj2110/cases/04.in": "4 3\n10\n1\n7\n4\n", "35/boj2110/cases/04.out": "3\n", "35/boj2110/cases/05.in": "6 4\n101\n1\n102\n2\n100\n3\n", "35/boj2110/cases/05.out": "2\n", "35/boj2110/cases/06.in": "4 3\n0\n500000000\n1000000000\n499999999\n", "35/boj2110/cases/06.out": "500000000\n", "35/boj2110/problem.json": "{\"kind\": \"stdio\", \"title\": \"백준 2110 공유기 설치\", \"time_limit\": 1.5, \"big_note\": \"N = 200,000, 좌표 최대 10⁹, C = 1,000\"}\n", "35/boj2110/solution/brute.py": "import sys\nfrom itertools import combinations\n\ndata = sys.stdin.read().split()\nn, c = int(data[0]), int(data[1])\nxs = sorted(map(int, data[2:2 + n]))\nbest = 0\nfor pick in combinations(xs, c):             # c개 집을 고르는 모든 경우\n    gap = min(b - a for a, b in zip(pick, pick[1:]))\n    best = max(best, gap)\nprint(best)\n", "35/boj2110/solution/gen.py": "def gen(rng):\n    n = rng.randint(2, 8)\n    xs = rng.sample(range(0, rng.choice([10, 30, 100])), n)   # 서로 다른 좌표, 정렬 안 함\n    c = rng.randint(2, n)\n    return f\"{n} {c}\\n\" + \"\\n\".join(map(str, xs)) + \"\\n\"\n\n\ndef gen_big(rng):\n    n = 200_000\n    xs = rng.sample(range(0, 1_000_000_001), n)\n    return f\"{n} 1000\\n\" + \"\\n\".join(map(str, xs)) + \"\\n\"\n", "35/boj2110/solution/ref.py": "import sys\n\n\ndef main():\n    data = sys.stdin.buffer.read().split()\n    n, c = int(data[0]), int(data[1])\n    xs = sorted(map(int, data[2:2 + n]))     # 입력은 정렬돼 있지 않아요\n\n    def ok(d):                               # 간격 d 이상으로 c대를 놓을 수 있나 (그리디)\n        cnt, last = 1, xs[0]                 # 첫 집에는 무조건 놓아요\n        for x in xs:\n            if x - last >= d:\n                cnt += 1\n                last = x\n                if cnt >= c:\n                    return True\n        return False\n\n    lo, hi = 1, (xs[-1] - xs[0]) // (c - 1)  # 좌표가 서로 달라서 1은 항상 가능해요\n    while lo < hi:                           # 마지막 True\n        mid = (lo + hi + 1) // 2\n        if ok(mid):\n            lo = mid\n        else:\n            hi = mid - 1\n    print(lo)\n\n\nmain()\n", "35/lc0033/cases/cases.json": "[\n  {\"name\": \"회전된 오른쪽 덩어리에 있음\", \"args\": [[15, 18, 22, 3, 7, 11], 7], \"expected\": 4},\n  {\"name\": \"없음\", \"args\": [[15, 18, 22, 3, 7, 11], 9], \"expected\": -1},\n  {\"name\": \"왼쪽 끝 값\", \"args\": [[4, 5, 6, 7, 0, 1, 2], 4], \"expected\": 0},\n  {\"name\": \"원소 하나, 없음\", \"args\": [[1], 0], \"expected\": -1},\n  {\"name\": \"원소 하나, 있음\", \"args\": [[1], 1], \"expected\": 0},\n  {\"name\": \"회전 없음, 맨 뒤\", \"args\": [[1, 3, 5, 7, 9], 9], \"expected\": 4},\n  {\"name\": \"두 칸, lo == mid\", \"args\": [[3, 1], 1], \"expected\": 1},\n  {\"name\": \"세 칸, 오른쪽 끝\", \"args\": [[5, 1, 3], 3], \"expected\": 2}\n]\n", "35/lc0033/problem.json": "{\"kind\": \"func\", \"title\": \"LeetCode 33 Search in Rotated Sorted Array\", \"entry\": \"search\", \"time_limit\": 0.005, \"big_note\": \"len(nums) = 2,000,000 (원래 제약 5,000보다 크게 잡아서 한 칸씩 훑으면 걸려요)\"}\n", "35/lc0033/solution/brute.py": "def search(nums: list[int], target: int) -> int:\n    for i, x in enumerate(nums):\n        if x == target:\n            return i\n    return -1\n", "35/lc0033/solution/gen.py": "def gen(rng):\n    n = rng.randint(1, 9)\n    a = sorted(rng.sample(range(-10, 11), n))\n    k = rng.randint(0, n - 1)                 # 0이면 회전 없음\n    nums = a[k:] + a[:k]\n    target = rng.choice(nums) if rng.random() < 0.6 else rng.randint(-12, 12)\n    return [nums, target]\n\n\ndef gen_big(rng):\n    a = list(range(0, 4_000_000, 2))\n    k = 1_234_567\n    return [a[k:] + a[:k], 1_000_001]         # 없는 값\n", "35/lc0033/solution/ref.py": "def search(nums: list[int], target: int) -> int:\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[lo] <= nums[mid]:                    # 왼쪽 절반 [lo, mid]가 정렬됨 (lo == mid일 때도)\n            if nums[lo] <= target < nums[mid]:\n                hi = mid - 1\n            else:\n                lo = mid + 1\n        else:                                        # 오른쪽 절반 [mid, hi]가 정렬됨\n            if nums[mid] < target <= nums[hi]:\n                lo = mid + 1\n            else:\n                hi = mid - 1\n    return -1\n", "35/lc0704/cases/cases.json": "[\n  {\"name\": \"가운데쯤에 있음\", \"args\": [[-3, 0, 4, 8, 15, 23], 8], \"expected\": 3},\n  {\"name\": \"없음 (사이 값)\", \"args\": [[-3, 0, 4, 8, 15, 23], 5], \"expected\": -1},\n  {\"name\": \"원소 하나, 있음\", \"args\": [[7], 7], \"expected\": 0},\n  {\"name\": \"원소 하나, 없음\", \"args\": [[7], 3], \"expected\": -1},\n  {\"name\": \"맨 앞\", \"args\": [[1, 2, 3, 4, 5], 1], \"expected\": 0},\n  {\"name\": \"맨 뒤\", \"args\": [[1, 2, 3, 4, 5], 5], \"expected\": 4},\n  {\"name\": \"모든 값보다 작음\", \"args\": [[2, 4, 6], -100], \"expected\": -1},\n  {\"name\": \"모든 값보다 큼\", \"args\": [[2, 4, 6], 100], \"expected\": -1}\n]\n", "35/lc0704/problem.json": "{\"kind\": \"func\", \"title\": \"LeetCode 704 Binary Search\", \"entry\": \"search\", \"time_limit\": 0.005, \"big_note\": \"len(nums) = 2,000,000 (원래 제약 10⁴보다 크게 잡아서 한 칸씩 훑으면 걸려요)\"}\n", "35/lc0704/solution/brute.py": "def search(nums: list[int], target: int) -> int:\n    for i, x in enumerate(nums):\n        if x == target:\n            return i\n    return -1\n", "35/lc0704/solution/gen.py": "def gen(rng):\n    n = rng.randint(1, 10)\n    nums = sorted(rng.sample(range(-15, 16), n))   # 서로 다른 값, 음수 포함\n    if rng.random() < 0.5:\n        target = rng.choice(nums)                   # 있는 값 (맨 앞·맨 뒤 포함)\n    else:\n        target = rng.randint(-17, 17)               # 없을 수도, 범위 밖일 수도\n    return [nums, target]\n\n\ndef gen_big(rng):\n    nums = list(range(0, 4_000_000, 2))             # 짝수 200만 개\n    return [nums, 3_999_999]                        # 없는 값, 끝 근처\n", "35/lc0704/solution/ref.py": "def search(nums: list[int], target: int) -> int:\n    lo, hi = 0, len(nums) - 1        # 닫힌 구간 [lo, hi]\n    while lo <= hi:                  # 한 칸 남아도 확인해야 해서 <=\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            lo = mid + 1             # mid는 이미 봤으니 빼요\n        else:\n            hi = mid - 1\n    return -1\n", "36/boj1406/cases/01.in": "abc\n9\nL\nL\nB\nP x\nD\nD\nP y\nL\nP z\n", "36/boj1406/cases/01.out": "xbczy\n", "36/boj1406/cases/02.in": "ab\n5\nL\nL\nL\nB\nP z\n", "36/boj1406/cases/02.out": "zab\n", "36/boj1406/cases/03.in": "ab\n3\nD\nD\nB\n", "36/boj1406/cases/03.out": "a\n", "36/boj1406/cases/04.in": "abc\n4\nB\nB\nB\nB\n", "36/boj1406/cases/04.out": "\n", "36/boj1406/cases/05.in": "a\n4\nP b\nL\nL\nP c\n", "36/boj1406/cases/05.out": "cab\n", "36/boj1406/cases/06.in": "hello\n8\nL\nL\nB\nB\nP a\nD\nD\nP p\n", "36/boj1406/cases/06.out": "halop\n", "36/boj1406/problem.json": "{\"kind\": \"stdio\", \"title\": \"백준 1406 에디터\", \"time_limit\": 1.5, \"big_note\": \"글자 100,000개 + 명령 500,000개 (커서를 맨 앞으로 옮긴 뒤 40만 번 삽입)\"}\n", "36/boj1406/solution/brute.py": "import sys\n\nlines = sys.stdin.read().split('\\n')\ns = lines[0].strip()\ncur = len(s)                         # 커서 = 앞에 있는 글자 수\nfor line in lines[2:2 + int(lines[1])]:\n    cmd = line.split()\n    if cmd[0] == 'L':\n        cur = max(0, cur - 1)\n    elif cmd[0] == 'D':\n        cur = min(len(s), cur + 1)\n    elif cmd[0] == 'B':\n        if cur > 0:\n            s = s[:cur - 1] + s[cur:]\n            cur -= 1\n    else:\n        s = s[:cur] + cmd[1] + s[cur:]\n        cur += 1\nprint(s)\n", "36/boj1406/solution/gen.py": "def gen(rng):\n    s = ''.join(rng.choice('abc') for _ in range(rng.randint(1, 6)))\n    m = rng.randint(1, 15)\n    cmds = []\n    for _ in range(m):\n        c = rng.choice('LLDDBBPP')                 # 경계에서 무시되는 명령이 자주 나오게\n        cmds.append(f\"P {rng.choice('xyz')}\" if c == 'P' else c)\n    return f\"{s}\\n{m}\\n\" + \"\\n\".join(cmds) + \"\\n\"\n\n\ndef gen_big(rng):\n    # 36장 1단계의 최악 입력: 글자 10만 개, 커서를 맨 앞으로(L 10만 번), 그 자리에 40만 번 삽입\n    s = ''.join(rng.choice('abcdefghijklmnopqrstuvwxyz') for _ in range(100_000))\n    cmds = ['L'] * 100_000 + [f\"P {rng.choice('xyz')}\" for _ in range(400_000)]\n    return f\"{s}\\n{len(cmds)}\\n\" + \"\\n\".join(cmds) + \"\\n\"\n", "36/boj1406/solution/ref.py": "import sys\n\n\ndef main():\n    input = sys.stdin.readline\n    left = list(input().rstrip())    # 커서 왼쪽 (끝 = 커서 바로 왼쪽 글자)\n    right = []                       # 커서 오른쪽, 거꾸로 (끝 = 커서 바로 오른쪽 글자)\n    for _ in range(int(input())):\n        cmd = input().split()\n        c = cmd[0]\n        if c == 'L':\n            if left:\n                right.append(left.pop())\n        elif c == 'D':\n            if right:\n                left.append(right.pop())\n        elif c == 'B':\n            if left:\n                left.pop()\n        else:                        # 'P x'\n            left.append(cmd[1])\n    print(''.join(left) + ''.join(reversed(right)))\n\n\nmain()\n", "36/lc0143/cases/cases.json": "[\n  {\"name\": \"짝수 길이\", \"args\": [[1, 2, 3, 4]], \"expected\": [1, 4, 2, 3]},\n  {\"name\": \"홀수 길이\", \"args\": [[1, 2, 3, 4, 5]], \"expected\": [1, 5, 2, 4, 3]},\n  {\"name\": \"노드 하나\", \"args\": [[1]], \"expected\": [1]},\n  {\"name\": \"노드 둘\", \"args\": [[1, 2]], \"expected\": [1, 2]},\n  {\"name\": \"노드 셋\", \"args\": [[1, 2, 3]], \"expected\": [1, 3, 2]},\n  {\"name\": \"중복 값\", \"args\": [[7, 7, 8, 8, 9, 9]], \"expected\": [7, 9, 7, 9, 8, 8]}\n]\n", "36/lc0143/problem.json": "{\"kind\": \"func\", \"title\": \"LeetCode 143 Reorder List\", \"entry\": \"reorder_list\", \"args_type\": [\"list\"], \"ret_arg\": 0, \"time_limit\": 0.2, \"big_note\": \"노드 50,000개 (O(n²)이면 여기서 십수 초 걸린 뒤 실패해요)\"}\n", "36/lc0143/solution/brute.py": "def reorder_list(head):\n    nodes = []\n    while head:\n        nodes.append(head)\n        head = head.next\n    i, j = 0, len(nodes) - 1\n    order = []\n    while i <= j:                    # 앞에서 하나, 뒤에서 하나\n        order.append(nodes[i])\n        if i != j:\n            order.append(nodes[j])\n        i, j = i + 1, j - 1\n    for a, b in zip(order, order[1:]):\n        a.next = b\n    order[-1].next = None\n", "36/lc0143/solution/gen.py": "def gen(rng):\n    n = rng.choice([1, 2, 3, rng.randint(1, 11)])\n    return [[rng.randint(1, 6) for _ in range(n)]]      # 중복 값이 자주 나오게\n\n\ndef gen_big(rng):\n    return [[rng.randint(1, 1000) for _ in range(50_000)]]\n", "36/lc0143/solution/ref.py": "from lib import ListNode  # noqa: F401\n\n\ndef reorder_list(head):\n    # 1) 중간 찾기: fast를 head.next에서 출발시켜 앞 동이 길거나 같게\n    slow, fast = head, head.next\n    while fast and fast.next:\n        slow, fast = slow.next, fast.next.next\n    second = slow.next\n    slow.next = None                 # 둘로 끊기 (안 끊으면 고리가 생겨요)\n\n    # 2) 뒤 동 뒤집기\n    prev = None\n    while second:\n        nxt = second.next\n        second.next = prev\n        prev, second = second, nxt\n    second = prev\n\n    # 3) 번갈아 이어 붙이기\n    first = head\n    while second:\n        f_nxt, s_nxt = first.next, second.next\n        first.next = second\n        second.next = f_nxt\n        first, second = f_nxt, s_nxt\n", "36/lc0146/cases/cases.json": "[\n  {\"name\": \"꽉 차면 가장 오래된 것을 버림\", \"args\": [[\"LRUCache\", \"put\", \"put\", \"get\", \"put\", \"get\", \"get\", \"get\"], [[2], [1, 10], [2, 20], [1], [3, 30], [2], [3], [1]]], \"expected\": [null, null, null, 10, null, -1, 30, 10]},\n  {\"name\": \"있는 키에 put하면 값이 바뀌고 최근이 됨\", \"args\": [[\"LRUCache\", \"put\", \"put\", \"put\", \"put\", \"get\", \"get\", \"get\"], [[2], [1, 1], [2, 2], [1, 100], [3, 3], [1], [2], [3]]], \"expected\": [null, null, null, null, null, 100, -1, 3]},\n  {\"name\": \"용량 1\", \"args\": [[\"LRUCache\", \"put\", \"put\", \"get\", \"get\", \"put\", \"get\"], [[1], [1, 1], [2, 2], [1], [2], [2, 5], [2]]], \"expected\": [null, null, null, -1, 2, null, 5]},\n  {\"name\": \"빈 캐시에서 get\", \"args\": [[\"LRUCache\", \"get\"], [[3], [5]]], \"expected\": [null, -1]},\n  {\"name\": \"get도 최근으로 만듦\", \"args\": [[\"LRUCache\", \"put\", \"put\", \"get\", \"put\", \"get\", \"get\"], [[2], [1, 1], [2, 2], [1], [3, 3], [2], [1]]], \"expected\": [null, null, null, 1, null, -1, 1]},\n  {\"name\": \"꽉 찬 상태에서 있는 키 갱신은 버리지 않음\", \"args\": [[\"LRUCache\", \"put\", \"put\", \"put\", \"get\", \"get\"], [[2], [1, 1], [2, 2], [2, 22], [1], [2]]], \"expected\": [null, null, null, null, 1, 22]},\n  {\"name\": \"키 0, 값 0\", \"args\": [[\"LRUCache\", \"put\", \"get\", \"put\", \"get\", \"get\"], [[2], [0, 0], [0], [1, 0], [1], [0]]], \"expected\": [null, null, 0, null, 0, 0]}\n]\n", "36/lc0146/problem.json": "{\"kind\": \"func\", \"title\": \"LeetCode 146 LRU Cache\", \"entry\": \"run_ops\", \"time_limit\": 0.6, \"big_note\": \"용량 3,000, 호출 200,000번, 키 0~10,000\"}\n", "36/lc0146/solution/brute.py": "class LRUCache:\n    \"\"\"키를 사용 순서대로 리스트에 들고 다니는 느린 버전. 앞 = 가장 오래됨.\"\"\"\n\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.order = []          # 키들, 오래된 것부터\n        self.vals = {}\n\n    def _touch(self, key):\n        self.order.remove(key)\n        self.order.append(key)\n\n    def get(self, key):\n        if key not in self.vals:\n            return -1\n        self._touch(key)\n        return self.vals[key]\n\n    def put(self, key, value):\n        if key in self.vals:\n            self._touch(key)\n        else:\n            self.order.append(key)\n            if len(self.order) > self.cap:\n                old = self.order.pop(0)\n                del self.vals[old]\n        self.vals[key] = value\n\n\ndef run_ops(ops, args):\n    cache = LRUCache(*args[0])\n    out = [None]\n    for op, a in zip(ops[1:], args[1:]):\n        out.append(getattr(cache, op)(*a))\n    return out\n", "36/lc0146/solution/gen.py": "def gen(rng):\n    cap = rng.randint(1, 3)\n    ops, args = [\"LRUCache\"], [[cap]]\n    for _ in range(rng.randint(1, 20)):\n        key = rng.randint(0, 4)                    # 키 0, 값 0도 나오게\n        if rng.random() < 0.5:\n            ops.append(\"get\"); args.append([key])\n        else:\n            ops.append(\"put\"); args.append([key, rng.randint(0, 9)])\n    return [ops, args]\n\n\ndef gen_big(rng):\n    cap = 3000\n    ops, args = [\"LRUCache\"], [[cap]]\n    for _ in range(200_000):\n        key = rng.randint(0, 10_000)\n        if rng.random() < 0.5:\n            ops.append(\"get\"); args.append([key])\n        else:\n            ops.append(\"put\"); args.append([key, rng.randint(0, 100_000)])\n    return [ops, args]\n", "36/lc0146/solution/ref.py": "class Node:\n    __slots__ = ('key', 'val', 'prev', 'next')\n\n    def __init__(self, key=0, val=0):\n        self.key, self.val = key, val\n        self.prev = self.next = None\n\n\nclass LRUCache:\n    def __init__(self, capacity: int):\n        self.cap = capacity\n        self.map = {}                              # key → Node\n        self.head, self.tail = Node(), Node()      # 더미 둘: head 쪽이 최근, tail 쪽이 오래됨\n        self.head.next, self.tail.prev = self.tail, self.head\n\n    def _remove(self, node):                       # 쥐고 있는 노드 떼기 O(1)\n        node.prev.next = node.next\n        node.next.prev = node.prev\n\n    def _add_front(self, node):                    # head 바로 뒤에 붙이기 O(1)\n        node.prev, node.next = self.head, self.head.next\n        self.head.next.prev = node\n        self.head.next = node\n\n    def get(self, key: int) -> int:\n        node = self.map.get(key)\n        if node is None:                           # 값 0도 있을 수 있으니 is None으로\n            return -1\n        self._remove(node)\n        self._add_front(node)\n        return node.val\n\n    def put(self, key: int, value: int) -> None:\n        node = self.map.get(key)\n        if node is not None:                       # 있는 키: 값 바꾸고 맨 앞으로 (버리지 않음)\n            node.val = value\n            self._remove(node)\n            self._add_front(node)\n            return\n        if len(self.map) == self.cap:              # 꽉 찼으면 tail 앞(가장 오래된 것) 버리기\n            lru = self.tail.prev\n            self._remove(lru)\n            del self.map[lru.key]                  # 노드에 key를 들고 있는 이유\n        node = Node(key, value)\n        self.map[key] = node\n        self._add_front(node)\n\n\ndef run_ops(ops, args):\n    cache = LRUCache(*args[0])\n    out = [None]\n    for op, a in zip(ops[1:], args[1:]):\n        out.append(getattr(cache, op)(*a))\n    return out\n", "36/lc0206/cases/cases.json": "[\n  {\"name\": \"다섯 개\", \"args\": [[1, 2, 3, 4, 5]], \"expected\": [5, 4, 3, 2, 1]},\n  {\"name\": \"빈 리스트\", \"args\": [[]], \"expected\": []},\n  {\"name\": \"노드 하나\", \"args\": [[7]], \"expected\": [7]},\n  {\"name\": \"노드 둘\", \"args\": [[1, 2]], \"expected\": [2, 1]},\n  {\"name\": \"중복 값\", \"args\": [[3, 3, 1]], \"expected\": [1, 3, 3]},\n  {\"name\": \"음수 섞임\", \"args\": [[-1, 0, -5, 2]], \"expected\": [2, -5, 0, -1]}\n]\n", "36/lc0206/problem.json": "{\"kind\": \"func\", \"title\": \"LeetCode 206 Reverse Linked List\", \"entry\": \"reverse_list\", \"args_type\": [\"list\"], \"ret_type\": \"list\", \"time_limit\": 0.1, \"big_note\": \"노드 100,000개 (원래 제약 5,000보다 크게: 재귀는 여기서 터져요)\"}\n", "36/lc0206/solution/brute.py": "from lib import ListNode\n\n\ndef reverse_list(head):\n    vals = []\n    while head:\n        vals.append(head.val)\n        head = head.next\n    new_head = None\n    for v in vals:                 # 앞에서부터 꺼내 새 노드를 맨 앞에 끼우면 역순\n        new_head = ListNode(v, new_head)\n    return new_head\n", "36/lc0206/solution/gen.py": "def gen(rng):\n    n = rng.choice([0, 1, 2, rng.randint(0, 10)])\n    return [[rng.randint(-5, 5) for _ in range(n)]]\n\n\ndef gen_big(rng):\n    return [[rng.randint(-5000, 5000) for _ in range(100_000)]]\n", "36/lc0206/solution/ref.py": "from lib import ListNode  # noqa: F401\n\n\ndef reverse_list(head):\n    prev, cur = None, head\n    while cur:\n        nxt = cur.next       # 1) 뒤를 먼저 잡아 두고\n        cur.next = prev      # 2) 화살표를 뒤집고\n        prev, cur = cur, nxt # 3) 한 칸 전진\n    return prev              # 끝나면 cur는 None, prev가 새 head\n", "36/pg81303/cases/cases.json": "[\n  {\"name\": \"마지막 행을 지우면 위로\", \"args\": [5, 4, [\"C\", \"C\", \"Z\"]], \"expected\": \"OOOOX\"},\n  {\"name\": \"되돌리기는 가장 최근 것부터\", \"args\": [6, 1, [\"C\", \"C\", \"Z\"]], \"expected\": \"OXOOOO\"},\n  {\"name\": \"커서 위에 되돌아와도 선택은 그대로\", \"args\": [5, 0, [\"C\", \"D 1\", \"Z\", \"U 1\", \"C\"]], \"expected\": \"OXOOO\"},\n  {\"name\": \"되돌린 행도 다시 이동·삭제 대상\", \"args\": [5, 1, [\"C\", \"Z\", \"U 1\", \"C\"]], \"expected\": \"OXOOO\"},\n  {\"name\": \"지운 행을 건너뛰며 이동\", \"args\": [7, 3, [\"C\", \"C\", \"U 1\", \"D 1\", \"C\", \"Z\"]], \"expected\": \"OOOXXOO\"},\n  {\"name\": \"맨 위 행부터 계속 지우기\", \"args\": [5, 0, [\"C\", \"C\", \"C\", \"C\"]], \"expected\": \"XXXXO\"},\n  {\"name\": \"전부 되돌리기\", \"args\": [5, 2, [\"C\", \"U 2\", \"C\", \"Z\", \"Z\"]], \"expected\": \"OOOOO\"},\n  {\"name\": \"멀리 이동한 뒤 되돌리기\", \"args\": [10, 5, [\"C\", \"U 3\", \"C\", \"D 5\", \"Z\", \"C\"]], \"expected\": \"OOOOOXOOOX\"}\n]\n", "36/pg81303/problem.json": "{\"kind\": \"func\", \"title\": \"프로그래머스 81303 표 편집\", \"entry\": \"solution\", \"time_limit\": 0.5, \"big_note\": \"n = 1,000,000, 2만 행 삭제 → 지운 구간을 가로지르는 이동 2천 번 → 전부 되돌리기\"}\n", "36/pg81303/solution/brute.py": "import bisect\n\n\ndef solution(n, k, cmd):\n    rows = list(range(n))        # 살아 있는 행 번호, 항상 오름차순\n    cur = k                      # rows 안의 위치\n    stack = []\n    for c in cmd:\n        if c[0] == 'U':\n            cur -= int(c[2:])\n        elif c[0] == 'D':\n            cur += int(c[2:])\n        elif c[0] == 'C':\n            stack.append(rows.pop(cur))\n            if cur == len(rows):\n                cur -= 1\n        else:\n            r = stack.pop()\n            pos = bisect.bisect_left(rows, r)\n            rows.insert(pos, r)\n            if pos <= cur:       # 위쪽에 끼면 선택한 행의 위치가 한 칸 밀려요\n                cur += 1\n    alive = set(rows)\n    return ''.join('O' if i in alive else 'X' for i in range(n))\n", "36/pg81303/solution/gen.py": "def gen(rng):\n    import bisect\n    n = rng.randint(5, 10)\n    k = rng.randrange(n)\n    rows, cur, stack = list(range(n)), k, []   # 명령이 항상 올바르도록 표를 같이 굴려요\n    cmd = []\n    for _ in range(rng.randint(1, 12)):\n        choices = []\n        if cur > 0:\n            choices.append('U')\n        if cur < len(rows) - 1:\n            choices.append('D')\n        if len(rows) > 1:\n            choices += ['C', 'C']            # 지우기를 자주\n        if stack:\n            choices += ['Z', 'Z']\n        op = rng.choice(choices)\n        if op == 'U':\n            x = rng.randint(1, cur); cur -= x; cmd.append(f\"U {x}\")\n        elif op == 'D':\n            x = rng.randint(1, len(rows) - 1 - cur); cur += x; cmd.append(f\"D {x}\")\n        elif op == 'C':\n            stack.append(rows.pop(cur))\n            cur = min(cur, len(rows) - 1)\n            cmd.append(\"C\")\n        else:\n            r = stack.pop()\n            pos = bisect.bisect_left(rows, r)\n            rows.insert(pos, r)\n            cur += pos <= cur\n            cmd.append(\"Z\")\n    return [n, k, cmd]\n\n\ndef gen_big(rng):\n    # 커서 바로 아래 2만 행을 지운 뒤, 지운 구간을 가로지르는 이동을 2천 번 하고, 전부 되돌려요\n    n, k = 1_000_000, 400_000\n    cmd = [\"C\"] * 20_000\n    cmd += [\"U 5\", \"D 5\"] * 1_000\n    cmd += [\"Z\"] * 20_000\n    cmd += [\"D 3\", \"U 3\"] * 1_000\n    return [n, k, cmd]\n", "36/pg81303/solution/ref.py": "def solution(n: int, k: int, cmd: list[str]) -> str:\n    prv = [i - 1 for i in range(n)]      # 위 행 번호 (없으면 -1)\n    nxt = [i + 1 for i in range(n)]      # 아래 행 번호 (없으면 n)\n    alive = [True] * n\n    stack = []                           # 지운 행 번호, 최근 것이 끝\n    cur = k\n    for c in cmd:\n        op = c[0]\n        if op == 'U':\n            for _ in range(int(c[2:])):\n                cur = prv[cur]\n        elif op == 'D':\n            for _ in range(int(c[2:])):\n                cur = nxt[cur]\n        elif op == 'C':\n            alive[cur] = False\n            stack.append(cur)\n            p, q = prv[cur], nxt[cur]\n            if p >= 0:\n                nxt[p] = q\n            if q < n:\n                prv[q] = p\n            cur = q if q < n else p      # 마지막 행이면 위로\n            # 지운 행의 prv/nxt는 지우지 않고 둬요: 되돌릴 자리를 기억해요\n        else:                            # 'Z'\n            r = stack.pop()\n            alive[r] = True\n            p, q = prv[r], nxt[r]\n            if p >= 0:\n                nxt[p] = r\n            if q < n:\n                prv[q] = r\n    return ''.join('O' if a else 'X' for a in alive)\n", "37/boj11725/cases/01.in": "2\n2 1\n", "37/boj11725/cases/01.out": "1\n", "37/boj11725/cases/02.in": "7\n3 1\n1 5\n7 3\n2 7\n6 5\n4 6\n", "37/boj11725/cases/02.out": "7\n1\n6\n1\n5\n3\n", "37/boj11725/cases/03.in": "6\n6 5\n5 4\n4 3\n3 2\n2 1\n", "37/boj11725/cases/03.out": "1\n2\n3\n4\n5\n", "37/boj11725/cases/04.in": "6\n1 2\n1 3\n1 4\n1 5\n1 6\n", "37/boj11725/cases/04.out": "1\n1\n1\n1\n1\n", "37/boj11725/cases/05.in": "8\n5 8\n3 5\n2 3\n7 2\n1 7\n7 4\n4 6\n", "37/boj11725/cases/05.out": "7\n2\n7\n3\n4\n1\n5\n", "37/boj11725/cases/06.in": "5\n3 2\n2 1\n1 4\n4 5\n", "37/boj11725/cases/06.out": "1\n2\n1\n4\n", "37/boj11725/problem.json": "{\"kind\": \"stdio\", \"title\": \"백준 11725 트리의 부모 찾기\", \"time_limit\": 1.0, \"big_note\": \"N = 100,000, 한 줄로 늘어진 트리\"}\n", "37/boj11725/solution/brute.py": "import sys\n\n# 부모를 아는 노드와 이어진 간선을 찾을 때까지 간선 목록을 계속 훑어요. 최악 O(N²)\ndata = sys.stdin.read().split()\nn = int(data[0])\nedges = [(int(data[1 + 2 * i]), int(data[2 + 2 * i])) for i in range(n - 1)]\nparent = {1: 0}\nleft = edges[:]\nwhile left:\n    rest = []\n    for a, b in left:\n        if a in parent:\n            parent[b] = a\n        elif b in parent:\n            parent[a] = b\n        else:\n            rest.append((a, b))\n    left = rest\nfor v in range(2, n + 1):\n    print(parent[v])\n", "37/boj11725/solution/gen.py": "def tree_edges(rng, n, chain=False):\n    \"\"\"노드 1..n의 랜덤 트리. 번호와 간선 순서, 간선 방향을 섞어요.\"\"\"\n    label = list(range(1, n + 1))\n    rng.shuffle(label)\n    k = label.index(1)\n    label[0], label[k] = label[k], label[0]   # 위치 0이 루트 1\n    if chain and n > 1:\n        mid = rng.randrange(n)                  # 루트가 사슬 중간에 오게\n        order = label[1:mid + 1][::-1] + [1] + label[mid + 1:]\n        edges = [(order[i], order[i + 1]) for i in range(n - 1)]\n    else:\n        edges = [(label[i], label[rng.randrange(i)]) for i in range(1, n)]\n    edges = [(a, b) if rng.random() < 0.5 else (b, a) for a, b in edges]\n    rng.shuffle(edges)\n    return edges\n\n\ndef fmt(n, edges):\n    return f\"{n}\\n\" + \"\".join(f\"{a} {b}\\n\" for a, b in edges)\n\n\ndef gen(rng):\n    n = rng.randint(2, 12)\n    return fmt(n, tree_edges(rng, n, chain=rng.random() < 0.3))\n\n\ndef gen_big(rng):\n    n = 100_000\n    # 루트 1이 사슬의 한쪽 끝: 깊이 99,999. 재귀 DFS는 여기서 죽어요\n    label = list(range(2, n + 1))\n    rng.shuffle(label)\n    order = [1] + label\n    edges = [(order[i + 1], order[i]) for i in range(n - 1)]\n    rng.shuffle(edges)\n    return fmt(n, edges)\n", "37/boj11725/solution/ref.py": "import sys\nfrom collections import deque\n\n\ndef main():\n    data = sys.stdin.buffer.read().split()\n    n = int(data[0])\n    adj = [[] for _ in range(n + 1)]\n    for i in range(n - 1):\n        a, b = int(data[1 + 2 * i]), int(data[2 + 2 * i])\n        adj[a].append(b)\n        adj[b].append(a)\n    parent = [0] * (n + 1)\n    parent[1] = 1                 # 루트는 자기 자신으로 표시해 '방문함'으로 써요\n    q = deque([1])\n    while q:                      # 재귀 없이 BFS: 깊이가 10만이어도 안전\n        u = q.popleft()\n        for v in adj[u]:\n            if not parent[v]:\n                parent[v] = u\n                q.append(v)\n    sys.stdout.write(\"\\n\".join(map(str, parent[2:])) + \"\\n\")\n\n\nmain()\n", "37/boj5639/cases/01.in": "7\n", "37/boj5639/cases/01.out": "7\n", "37/boj5639/cases/02.in": "30\n20\n10\n25\n40\n35\n50\n", "37/boj5639/cases/02.out": "10\n25\n20\n35\n50\n40\n30\n", "37/boj5639/cases/03.in": "1\n2\n3\n4\n5\n", "37/boj5639/cases/03.out": "5\n4\n3\n2\n1\n", "37/boj5639/cases/04.in": "5\n4\n3\n2\n1\n", "37/boj5639/cases/04.out": "1\n2\n3\n4\n5\n", "37/boj5639/cases/05.in": "10\n20\n15\n12\n18\n30\n", "37/boj5639/cases/05.out": "12\n18\n15\n30\n20\n10\n", "37/boj5639/cases/06.in": "40\n10\n5\n30\n20\n35\n60\n50\n45\n70\n", "37/boj5639/cases/06.out": "5\n20\n35\n30\n10\n45\n50\n70\n60\n40\n", "37/boj5639/problem.json": "{\"kind\": \"stdio\", \"title\": \"백준 5639 이진 검색 트리\", \"time_limit\": 1.0, \"big_note\": \"노드 10,000개, 한쪽으로 치우친 트리\"}\n", "37/boj5639/solution/brute.py": "import sys\n\n# 전위 순서대로 BST에 하나씩 넣고(삽입 순서가 전위면 같은 트리가 돼요), 스택 두 개로 후위 순회\nkeys = list(map(int, sys.stdin.read().split()))\nleft, right = {}, {}\nroot = keys[0]\nfor k in keys[1:]:\n    cur = root\n    while True:\n        side = left if k < cur else right\n        if cur in side:\n            cur = side[cur]\n        else:\n            side[cur] = k\n            break\nst, rev = [root], []\nwhile st:\n    n = st.pop()\n    rev.append(n)\n    if n in left:\n        st.append(left[n])\n    if n in right:\n        st.append(right[n])\nprint(\"\\n\".join(map(str, reversed(rev))))\n", "37/boj5639/solution/gen.py": "def preorder(keys):\n    \"\"\"keys를 순서대로 넣은 BST의 전위 순회.\"\"\"\n    left, right, root = {}, {}, keys[0]\n    for k in keys[1:]:\n        cur = root\n        while True:\n            side = left if k < cur else right\n            if cur in side:\n                cur = side[cur]\n            else:\n                side[cur] = k\n                break\n    out, st = [], [root]\n    while st:\n        n = st.pop()\n        out.append(n)\n        if n in right:\n            st.append(right[n])\n        if n in left:\n            st.append(left[n])\n    return out\n\n\ndef gen(rng):\n    n = rng.randint(1, 12)\n    keys = rng.sample(range(1, 30), n)\n    r = rng.random()\n    if r < 0.15:\n        keys.sort()                      # 오른쪽으로만\n    elif r < 0.3:\n        keys.sort(reverse=True)          # 왼쪽으로만\n    return \"\".join(f\"{k}\\n\" for k in preorder(keys))\n\n\ndef gen_big(rng):\n    keys = sorted(rng.sample(range(1, 1_000_000), 10_000), reverse=True)   # 왼쪽으로 늘어진 한 줄\n    return \"\".join(f\"{k}\\n\" for k in keys)\n", "37/boj5639/solution/ref.py": "import sys\n\n\ndef main():\n    pre = list(map(int, sys.stdin.buffer.read().split()))\n    sys.setrecursionlimit(len(pre) + 100)   # 한 줄 트리면 깊이가 N\n    out, i = [], 0\n\n    def build(hi):\n        # pre[i]부터, 값이 hi보다 작은 동안이 지금 서브트리예요\n        nonlocal i\n        if i == len(pre) or pre[i] > hi:\n            return\n        root = pre[i]\n        i += 1\n        build(root)          # 왼쪽: root보다 작은 값들\n        build(hi)            # 오른쪽: root보다 크고 hi보다 작은 값들\n        out.append(root)     # 후위: 자식 다음에 나\n\n    build(float(\"inf\"))\n    sys.stdout.write(\"\\n\".join(map(str, out)) + \"\\n\")\n\n\nmain()\n", "37/lc0098/cases/cases.json": "[\n  {\"name\": \"작은 올바른 BST\", \"args\": [[2, 1, 3]], \"expected\": true},\n  {\"name\": \"오른쪽 자식이 작음\", \"args\": [[5, 1, 4, null, null, 3, 6]], \"expected\": false},\n  {\"name\": \"손자 위반: 3이 5의 오른쪽에\", \"args\": [[5, 4, 6, null, null, 3, 7]], \"expected\": false},\n  {\"name\": \"중복 값은 안 됨\", \"args\": [[2, 2, 2]], \"expected\": false},\n  {\"name\": \"왼쪽 자식이 같음\", \"args\": [[1, 1]], \"expected\": false},\n  {\"name\": \"노드 하나 (최댓값)\", \"args\": [[2147483647]], \"expected\": true},\n  {\"name\": \"정수 최솟값과 최댓값\", \"args\": [[-2147483648, null, 2147483647]], \"expected\": true},\n  {\"name\": \"깊은 곳의 위반 (왼쪽 서브트리 안의 큰 값)\", \"args\": [[10, 5, 15, 2, 8, 12, 20, null, null, 7, 11]], \"expected\": false},\n  {\"name\": \"포화 BST\", \"args\": [[8, 4, 12, 2, 6, 10, 14, 1, 3, 5, 7, 9, 11, 13, 15]], \"expected\": true}\n]\n", "37/lc0098/problem.json": "{\"kind\": \"func\", \"title\": \"LeetCode 98 Validate Binary Search Tree\", \"entry\": \"is_valid_bst\", \"args_type\": [\"tree\"], \"time_limit\": 1.0, \"big_note\": \"노드 10,000개, 올바른 BST(끝까지 다 봐야 함)\"}\n", "37/lc0098/solution/brute.py": "def is_valid_bst(root) -> bool:\n    # 정의 그대로: 모든 노드에서 왼쪽 서브트리 전부 < 나 < 오른쪽 서브트리 전부. O(N²)\n    def values(n):\n        return [] if not n else values(n.left) + [n.val] + values(n.right)\n\n    def check(n):\n        if not n:\n            return True\n        if any(v >= n.val for v in values(n.left)):\n            return False\n        if any(v <= n.val for v in values(n.right)):\n            return False\n        return check(n.left) and check(n.right)\n    return check(root)\n", "37/lc0098/solution/gen.py": "from collections import deque\n\n\ndef to_arr(root):\n    out, q = [], deque([root])\n    while q:\n        n = q.popleft()\n        if n is None:\n            out.append(None)\n            continue\n        out.append(n[0])\n        q.append(n[1])\n        q.append(n[2])\n    while out and out[-1] is None:\n        out.pop()\n    return out\n\n\ndef bst_from(keys):\n    \"\"\"keys를 순서대로 넣은 BST. 노드는 [값, 왼, 오] 리스트.\"\"\"\n    root = None\n    for k in keys:\n        node = [k, None, None]\n        if root is None:\n            root = node\n            continue\n        cur = root\n        while True:\n            i = 1 if k < cur[0] else 2\n            if cur[i] is None:\n                cur[i] = node\n                break\n            cur = cur[i]\n    return root\n\n\ndef all_nodes(root):\n    st, out = [root], []\n    while st:\n        n = st.pop()\n        if n:\n            out.append(n)\n            st += [n[1], n[2]]\n    return out\n\n\ndef gen(rng):\n    n = rng.randint(1, 10)\n    keys = rng.sample(range(-6, 7), n)\n    root = bst_from(keys)\n    r = rng.random()\n    nodes = all_nodes(root)\n    if r < 0.35:                         # 값 하나를 바꿔서 대개 깨지게 (손자 위반, 중복 포함)\n        rng.choice(nodes)[0] = rng.randint(-7, 7)\n    elif r < 0.55 and len(nodes) > 1:    # 두 값을 맞바꾸기\n        a, b = rng.sample(nodes, 2)\n        a[0], b[0] = b[0], a[0]\n    elif r < 0.65:                       # 경계값\n        rng.choice(nodes)[0] = rng.choice([-2**31, 2**31 - 1])\n    return [to_arr(root)]\n\n\ndef gen_big(rng):\n    keys = distinct(rng, -2**31, 2**31 - 1, 10_000)\n    return [to_arr(bst_from(keys))]\n\n\ndef distinct(rng, lo, hi, k):\n    \"\"\"서로 다른 정수 k개. (range 길이가 2³¹을 넘으면 브라우저(32비트 wasm)의 rng.sample이 터져서 직접 뽑아요)\"\"\"\n    s = set()\n    while len(s) < k:\n        s.add(rng.randint(lo, hi))\n    xs = list(s)\n    rng.shuffle(xs)\n    return xs\n", "37/lc0098/solution/ref.py": "from typing import Optional\n\nfrom lib import TreeNode\n\n\ndef is_valid_bst(root: Optional[TreeNode]) -> bool:\n    def ok(node, lo, hi):\n        if not node:\n            return True\n        if not (lo < node.val < hi):          # 물려받은 허용 범위를 벗어남\n            return False\n        return ok(node.left, lo, node.val) and ok(node.right, node.val, hi)   # 왼쪽은 위 한계, 오른쪽은 아래 한계를 나로 좁혀요\n    return ok(root, float(\"-inf\"), float(\"inf\"))\n", "37/lc0104/cases/cases.json": "[\n  {\"name\": \"예제 (3, 9, 20, 15, 7)\", \"args\": [[3, 9, 20, null, null, 15, 7]], \"expected\": 3},\n  {\"name\": \"빈 트리\", \"args\": [[]], \"expected\": 0},\n  {\"name\": \"노드 하나\", \"args\": [[0]], \"expected\": 1},\n  {\"name\": \"오른쪽 자식만\", \"args\": [[1, null, 2]], \"expected\": 2},\n  {\"name\": \"깊은 쪽이 왼쪽 안쪽\", \"args\": [[1, 2, 3, null, 4, null, null, 5]], \"expected\": 4},\n  {\"name\": \"음수 값도 노드\", \"args\": [[-1, -2, -3, -4, null, null, -5]], \"expected\": 3},\n  {\"name\": \"한쪽으로 치우친 트리 (깊이 700)\", \"args\": [[1, 2, null, 3, null, 4, null, 5, null, 6, null, 7, null, 8, null, 9, null, 10, null, 11, null, 12, null, 13, null, 14, null, 15, null, 16, null, 17, null, 18, null, 19, null, 20, null, 21, null, 22, null, 23, null, 24, null, 25, null, 26, null, 27, null, 28, null, 29, null, 30, null, 31, null, 32, null, 33, null, 34, null, 35, null, 36, null, 37, null, 38, null, 39, null, 40, null, 41, null, 42, null, 43, null, 44, null, 45, null, 46, null, 47, null, 48, null, 49, null, 50, null, 51, null, 52, null, 53, null, 54, null, 55, null, 56, null, 57, null, 58, null, 59, null, 60, null, 61, null, 62, null, 63, null, 64, null, 65, null, 66, null, 67, null, 68, null, 69, null, 70, null, 71, null, 72, null, 73, null, 74, null, 75, null, 76, null, 77, null, 78, null, 79, null, 80, null, 81, null, 82, null, 83, null, 84, null, 85, null, 86, null, 87, null, 88, null, 89, null, 90, null, 91, null, 92, null, 93, null, 94, null, 95, nu
