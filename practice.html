계 없음(`True`), 과목 하나, 마름모(3을 두 길로 만나지만 사이클 아님), 사이클 뒤에 매달린 과목, **사이클이 없는 덩어리와 사이클이 있는 덩어리가 섞임**(손 케이스 6: 진입 차수 0인 과목이 있어도 `False`).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n\"어떤 과목에서 출발해 자기 자신으로 돌아올 수 있나\"를 과목마다 BFS로 확인해요. 과목 하나에 O(V + E), 전체 **O(V·(V + E))** ≈ 2,000 × 7,000 = 1,400만 번. 큰 입력에서 이 채점기로 약 0.6초라 제한 0.4초를 넘어요. `solution/brute.py`는 더 단순하게 도달 가능 표를 O(V³)으로 채워서 `reach[i][i]`를 봐요(작은 입력 비교용).\n\n## 4. 병목 → 패턴 찾기 (핵심)\n과목마다 따로 출발하면 같은 화살표를 V번 다시 따라가요. 질문을 뒤집어 보세요. \"사이클이 있나?\" 대신 \"**실제로 한 과목씩 들어 나갈 수 있나?**\"\n- 지금 들을 수 있는 과목 = 남은 선수 과목이 0인 과목(진입 차수 0).\n- 그걸 들으면 그 과목을 기다리던 과목들의 남은 수가 줄어요. 0이 되면 또 들을 수 있어요.\n- 사이클 위의 과목은 서로를 기다려서 영원히 0이 안 돼요 → **꺼낸 수 < V** 이면 사이클.\n각 과목은 한 번 큐에 들어가고, 각 화살표는 한 번만 줄여요 → O(V + E). 위상 정렬(Kahn)이에요(41장 8단계).\n\n트리거 단어: \"**선수 과목**\", \"먼저 해야 한다\", \"가능한 순서가 있나\" → Kahn 위상 정렬 (41장 패턴 트리거 표).\n\n## 5. 코드\n```python\nfrom collections import deque\n\ndef can_finish(num_courses, prerequisites):\n    adj = [[] for _ in range(num_courses)]\n    indeg = [0] * num_courses\n    for a, b in prerequisites:          # b → a\n        adj[b].append(a)\n        indeg[a] += 1\n    q = deque(i for i in range(num_courses) if indeg[i] == 0)\n    taken = 0\n    while q:\n        u = q.popleft()\n        taken += 1\n        for v in adj[u]:\n            indeg[v] -= 1\n            if indeg[v] == 0:\n                q.append(v)\n    return taken == num_courses\n```\n이 문제는 순서 자체를 안 물어서 `order` 리스트 대신 `taken` 개수만 세요.\n\n## 왜 이 코드가 정답인가\n\n- **불변식**: `q`에는 선수 과목을 다 들은(`indeg` 0) 과목만 있고, `taken`은 그렇게 들은 과목 수예요.\n- **빠뜨리지 않는 이유**: 사이클이 없으면 남은 과목 중 `indeg` 0인 과목이 반드시 있어서 `taken`이 `num_courses`까지 올라가요. 사이클이 있으면 그 과목들은 서로를 기다려 `indeg`가 0이 안 되니 `taken`이 모자라요.\n- **끝나는 이유**: 과목은 큐에 한 번, 간선은 한 번씩만 봐서 O(V+E)예요.\n- **깨지는 가정**: `[a, b]`가 b → a라는 방향이에요. 이 문제는 방향을 뒤집어도 사이클 유무가 같아서 통과하지만, 순서를 출력하는 210번에서는 거꾸로 된 순서가 나와요.\n\n## 6. 예제로 추적 (확인)\n손 케이스 6을 실제로 돌린 값이에요. 과목 6개, 간선 0→1, 1→2 (사이클 없는 덩어리)와 3→4, 4→5, 5→3 (사이클).\n| 회차 | 꺼내기 전 큐 | 꺼낸 것 | 진입 차수 (0..5) | 꺼낸 뒤 큐 |\n|---|---|---|---|---|\n| 시작 | `[0]` | — | 0, 1, 1, 1, 1, 1 | `[0]` |\n| 1 | `[0]` | 0 | 0, 0, 1, 1, 1, 1 | `[1]` |\n| 2 | `[1]` | 1 | 0, 0, 0, 1, 1, 1 | `[2]` |\n| 3 | `[2]` | 2 | 0, 0, 0, 1, 1, 1 | `[]` |\n큐가 비었는데 `taken = 3 < 6`. 3, 4, 5는 진입 차수가 끝까지 1이에요 → `False` ✓. \"진입 차수 0인 과목이 하나라도 있으면 된다\"는 착각이 여기서 깨져요.\n\n## 7. 복잡도\n인접 리스트 만들기 O(E), 각 과목이 큐에 한 번, 각 간선을 한 번 줄임 → **O(V + E)**, 메모리 O(V + E).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| DFS에서 \"본 적 있는 과목을 또 만나면 사이클\" | 마름모를 사이클로 판정 | 손 케이스 4 (마름모) |\n| 재귀 DFS (세 가지 상태는 맞음), 재귀 한도 그대로 | `RecursionError` | 큰 입력 (한 줄로 이어진 2,000개) |\n| 과목마다 BFS로 자기 자신에게 돌아오는지 확인 | 답은 맞지만 O(V·(V+E)) | 큰 입력 (약 0.6초 > 0.4초) |\n| 진입 차수 0인 과목이 있는지만 확인 | 다른 덩어리의 사이클을 놓침 | 손 케이스 6 |\n| `taken == num_courses` 대신 `q`가 빈 걸로 판단 | 항상 `True` | 손 케이스 2 |\n\n## 9. 면접에서 30초로 설명하기\n\"과목을 정점, 선수 관계를 b에서 a로 가는 간선으로 보면, 모든 과목을 들을 수 있다는 건 사이클이 없다는 뜻입니다. Kahn 알고리즘으로 진입 차수가 0인 과목을 큐에 넣고, 꺼낼 때마다 이웃의 진입 차수를 줄여 0이 되면 넣습니다. 사이클 위의 과목은 진입 차수가 0이 될 수 없으니, 꺼낸 과목 수가 전체보다 적으면 False입니다. O(V + E)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **들을 순서 자체를 돌려달라면?** LeetCode 210 「Course Schedule II」예요. `taken` 대신 `order`에 꺼낸 순서를 담고, 길이가 V면 그걸, 아니면 빈 리스트를 돌려줘요. 이때는 방향을 뒤집으면 틀려요.\n2. **DFS로 사이클을 찾으려면?** 상태를 세 가지(안 감 / 지금 경로 위 / 끝남)로 두고, \"지금 경로 위\"인 정점으로 가는 간선을 만나면 사이클이에요. 41장 면접 질문 5의 꼬리 질문이에요. 파이썬에서는 재귀 한도를 올리거나 스택으로 바꿔야 해요.\n3. **실무에서는?** 파이썬 `graphlib.TopologicalSorter`가 사이클이면 `prepare()`에서 `CycleError`를 내요(41장 8단계 \"실무에도 그대로 있어요\"). 빌드 시스템과 CI가 이 모양이에요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 15분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 210 「Course Schedule II」, 백준 2252 「줄 세우기」(이 장 다음 문제), 백준 1766 「문제집」(사전 순 → 힙).\n", "starter": "# LeetCode 207 — 함수 몸통을 채우세요.  채점: python algo/judge.py 41/lc0207\n\n\ndef can_finish(num_courses: int, prerequisites: list[list[int]]) -> bool:\n    pass\n"}, {"id": "41b/boj11657", "chapter": "41b", "slug": "boj11657", "title": "백준 11657 타임머신", "kind": "stdio", "ext": ".py", "tier": "Gold IV (solved.ac)", "role": "핵심", "target": "30분", "url": "https://solved.ac/problems/id/11657", "time_limit": 1.0, "ref_time": 0.18812279199482873, "problem": "# 백준 11657 타임머신\n\n- 원문: https://solved.ac/problems/id/11657\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold IV (solved.ac) · 역할: 핵심 · 목표 시간: 30분\n- 짝이 되는 장: 41b. 가중치 그래프\n\n## 문제 (요약)\n도시 N개와 버스 M대가 있어요. 버스마다 출발 도시, 도착 도시, 걸리는 시간이 있고 한 방향으로만 가요. 걸리는 시간은 **음수일 수도 있어요**(타임머신이라 과거로 가요). 1번 도시에서 출발해요.\n- 1번에서 출발해 돌아다니다가 **시간을 끝없이 거꾸로 돌릴 수 있으면** `-1` 한 줄만 출력해요.\n- 그렇지 않으면 2번부터 N번 도시까지 차례로, 가장 빨리 도착하는 시간을 한 줄씩 출력해요. 갈 수 없는 도시는 `-1`이에요.\n\n## 제약\n- 1 ≤ N ≤ 500, 1 ≤ M ≤ 6,000\n- 시간 C는 −10,000 ≤ C ≤ 10,000\n- 출발과 도착이 같은 버스(자기 자신으로 가는 버스)도, 같은 두 도시 사이 버스 여러 대도 있을 수 있어요\n- 입력: 첫 줄 `N M`, 다음 M줄에 `출발 도착 시간`\n- 출력: 위 규칙대로 `-1` 한 줄, 또는 N−1줄\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 41b/boj11657` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 1916처럼 힙으로 될까<\/summary>\n\n손 케이스 01을 손으로 해 보세요. 1→2가 5, 1→3이 6, 3→2가 −4예요. 힙에서 (5, 2)가 먼저 나와요. \"꺼낸 순간 확정\"이라면 2번은 5로 굳는데, 진짜 답은 6 + (−4) = 2예요. 시간이 음수인 간선이 있으면 무엇이 무너질까요(41b장 6단계)? 그리고 \"끝없이 거꾸로 돌릴 수 있다\"는 그래프에 무엇이 있다는 뜻일까요?\n<\/details>\n\n<details><summary>힌트 2: 확정을 포기하고 바퀴를 세기<\/summary>\n\n모든 버스를 쭉 훑으며 더 빨리 갈 수 있으면 고치기를 **N−1바퀴** 해요. 최단 경로는 버스를 많아야 N−1대 타니까 그거면 충분해요. 그다음 **한 바퀴 더** 훑었는데도 줄어드는 도시가 있으면, 고리를 돌수록 시간이 줄어드는 **음수 사이클**이 있다는 뜻이에요. 41b장 7단계의 벨만-포드, 템플릿 두 번째 함수예요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- **1번에서 못 가는 도시에서는 출발하지 마세요.** `dist[u]`가 아직 무한대인데 `dist[u] + w`를 비교하면, 1번과 상관없는 곳의 음수 사이클을 잡아 `-1`을 내요(손 케이스 03). `INF`를 `10**9` 같은 정수로 두면 특히 위험해요.\n- 음수 사이클 판정은 N−1바퀴가 **끝난 뒤** 한 바퀴 더예요. 바퀴 수를 N−2로 줄이면 사슬이 긴 그래프에서 덜 줄어요(손 케이스 07).\n- 음수 사이클이 있으면 `-1` **한 줄만** 출력하고 끝이에요. 다른 도시 답을 섞으면 안 돼요.\n- 갈 수 없는 도시는 무한대가 아니라 `-1`로 출력해요.\n- 자기 자신으로 가는 음수 버스(`1 1 -1`)도 음수 사이클이에요(손 케이스 05).\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 11657 타임머신\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"방향 그래프, 간선 비용이 음수일 수 있음, 1번에서 전부로 최단 경로, 1번에서 닿는 음수 사이클이 있으면 -1.\" 확인할 것:\n- 음수 간선이 있나요? → **있어요** → 다익스트라의 \"꺼내면 확정\"이 깨져요 (손 케이스 01)\n- 음수 사이클이 1번에서 **못 가는 곳**에 있으면? → 상관없어요. 다른 도시 답을 그대로 출력해요 (손 케이스 03)\n- 갈 수 없는 도시는? → `-1` (손 케이스 04)\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n손 케이스 01: 1→2 직행 5보다 1→3→2 = 6 + (−4) = 2가 빨라요. 2번을 거쳐 4번은 2 + 2 = 4. 답 `2 6 4`.\n경계: 1에서 닿는 음수 고리 2→3→2(02 → `-1`), 못 닿는 음수 고리(03 → `3 -1 -1`), 아무 데도 못 감(04), N = 1에 음수 자기 버스(05 → `-1`), 합이 0인 고리는 음수 사이클이 아님(06 → `0 -5`), 사슬을 거꾸로 적어 N−1바퀴가 꽉 필요함(07), 다른 도시는 멀쩡해도 음수 고리가 닿으면 `-1` 한 줄(08).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n플로이드-워셜로 모든 쌍을 구하고(41b장 8단계), 1번에서 닿는 도시 i가 `d[i][i] < 0`이면 음수 사이클이에요. **O(N³)** = 500³ = 1억 2,500만 번이라 파이썬에서는 10초가 넘어요(41b장 8단계 \"현실 감각\" 표에서 V = 500은 12초). `solution/brute.py`가 이 방식이에요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n출발점이 하나뿐인데 모든 쌍을 구하는 게 낭비예요. 한 점에서 출발하는 도구는 다익스트라인데, 음수 간선 때문에 못 써요.\n- 다익스트라가 맞는 근거는 \"0 이상을 더하면 더 작아질 수 없다\"였어요. 음수 간선이 있으면 이 문장이 거짓이에요(41b장 6단계).\n- 그래서 **확정을 포기해요.** 모든 간선을 훑으며 줄일 수 있으면 줄이기를 N−1바퀴. 최단 경로는 간선을 많아야 N−1개 쓰고, 한 바퀴마다 간선 하나 분량씩은 반드시 자리를 잡아요(41b장 7단계).\n- **N번째 바퀴**에서도 줄어들면, 간선을 N개 이상 써서 더 싸졌다는 뜻 = 고리를 돌아서 줄였다 = 음수 사이클이에요. 판정이 공짜로 따라와요.\n\n트리거 단어: \"**음수**\", \"과거로\", \"되돌린다\", \"환급\" + 최단 → 벨만-포드 (41b장 패턴 트리거 표).\n\n## 5. 코드\n```python\nINF = float(\"inf\")\ndist = [INF] * (n + 1)\ndist[1] = 0\nfor _ in range(n - 1):                     # V-1바퀴\n    changed = False\n    for u, v, w in edges:\n        if dist[u] != INF and dist[u] + w < dist[v]:   # 못 가는 도시에서는 출발 안 함\n            dist[v] = dist[u] + w\n            changed = True\n    if not changed:\n        break                              # 조기 종료\nfor u, v, w in edges:                      # 한 바퀴 더\n    if dist[u] != INF and dist[u] + w < dist[v]:\n        print(-1)\n        return\nprint(\"\\n\".join(str(d) if d != INF else \"-1\" for d in dist[2:]))\n```\n\n## 왜 이 코드가 정답인가\n\n- **불변식**: i바퀴가 끝나면 `dist[v]`는 간선 i개 이하를 쓰는 1→v 경로의 최솟값 이하이고, 늘 실제 어떤 경로의 길이예요.\n- **빠뜨리지 않는 이유**: 음수 사이클이 없으면 최단 경로는 도시를 두 번 지나지 않아 간선이 N−1개 이하라, N−1바퀴면 전부 확정돼요. 그 뒤 한 바퀴에서 또 줄면 1번에서 닿는 음수 사이클이 있다는 뜻이에요.\n- **끝나는 이유**: 바퀴 수가 최대 N−1(+1)로 고정이라 O(NM) = 500 × 6,000 = 300만이에요.\n- **깨지는 가정**: 못 가는 도시에서 출발하지 않는다는 `dist[u] != INF` 검사예요. INF를 큰 정수로 두고 이 검사를 빼면, 1번에서 못 가는 음수 사이클이 값을 줄여서 `-1`을 잘못 출력해요.\n\n## 6. 예제로 추적 (확인)\n손 케이스 07을 실제로 돌린 값이에요. 간선은 적힌 순서대로 `4→5 −1, 3→4 −1, 2→3 −1, 1→2 −1, 1→5 10, 1→2 3`이에요.\n| 바퀴 | 이 바퀴에 고친 도시 | dist[1..5] 뒤 |\n|---|---|---|\n| 1 | 2(−1), 5(10) | 0, −1, ∞, ∞, 10 |\n| 2 | 3(−2) | 0, −1, −2, ∞, 10 |\n| 3 | 4(−3) | 0, −1, −2, −3, 10 |\n| 4 | 5(−4) | 0, −1, −2, −3, −4 |\n| 확인 바퀴 | 없음 → 음수 사이클 없음 | |\n답 `-1 -2 -3 -4` ✓. 사슬을 거꾸로 적어서 **한 바퀴에 한 칸씩만** 전진해요. N − 1 = 4바퀴가 정확히 필요했어요. 3바퀴에서 멈추면 5번이 10으로 남아요.\n\n손 케이스 03에서 `dist[u] != INF`를 빼고 `INF = 10**9`로 두면 이렇게 돼요(실제로 돌린 값).\n| 바퀴 | dist[1..4] 뒤 |\n|---|---|\n| 1 | 0, 3, 999999999, 999999998 |\n| 2 | 0, 3, 999999998, 999999997 |\n| 4 (확인) | 0, 3, 999999996, 999999995 → 아직 줄어요 → `-1` ✗ |\n1번에서 못 가는 3↔4 고리를 \"무한대에서 출발해\" 돌면서 줄여 버렸어요. 정답은 `3 -1 -1`이에요.\n\n## 7. 복잡도\n바퀴 N−1개 × 간선 M개 → **O(N·M)** = 500 × 6,000 = 300만 번. 메모리 O(N + M). 큰 입력(사슬을 거꾸로 적어 499바퀴를 꽉 채움)에서 약 0.2초예요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `done` 배열 다익스트라 (\"꺼내면 확정\") | 2번이 5로 굳음 | 손 케이스 01 |\n| 지연 삭제 다익스트라 (1916 템플릿 그대로) | 음수 사이클에서 계속 줄어들어 끝나지 않음 | 손 케이스 02 (강제 종료) |\n| `dist[u] != INF` 확인 없음 + `INF = 10**9` | 못 닿는 음수 고리로 `-1` | 손 케이스 03 |\n| 확인 바퀴(N번째) 없음 | 음수 사이클인데 숫자를 출력 | 손 케이스 02, 05, 08 |\n| 바퀴를 N−2번만 | 긴 사슬 끝이 덜 줄어듦 | 손 케이스 07 |\n| 갈 수 없는 도시를 `inf`로 출력 | 출력 형식 틀림 | 손 케이스 03, 04 |\n| 플로이드-워셜 | 답은 맞지만 O(N³) | 큰 입력 (시간 초과) |\n\n`float(\"inf\")`를 쓰면 `inf + (−5)`도 `inf`라서 확인 줄이 없어도 우연히 맞아요. 그래도 습관으로 넣어요. 다른 언어나 정수 INF에서는 바로 틀려요.\n\n## 9. 면접에서 30초로 설명하기\n\"음수 간선이 있어서 다익스트라의 꺼내면 확정이 성립하지 않습니다. 그래서 벨만-포드로 모든 간선을 V−1바퀴 완화합니다. 최단 경로는 간선을 많아야 V−1개 쓰니까 충분하고, 한 바퀴를 더 돌았는데 줄어드는 정점이 있으면 출발점에서 닿는 음수 사이클입니다. 출발점에서 못 가는 정점에서는 완화하지 않습니다. O(V·E)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **C++이나 Java로 짠다면 무엇을 조심하나요?** 거리의 범위예요. 음수 사이클을 500바퀴 돌면 −10,000 × 6,000 × 500 = −300억까지 내려갈 수 있어서 32비트 정수가 넘쳐요. `long long`을 써요. 파이썬은 정수 크기 제한이 없어서 이 문제가 없어요(백준 11657에서 유명한 함정).\n2. **어느 도시들이 −∞인지까지 알려 달라면?** 확인 바퀴에서 줄어든 도시에서 BFS로 닿는 도시가 전부 −∞예요. 또는 N번 더 돌리며 줄어든 도시를 −∞로 퍼뜨려요.\n3. **음수 간선은 있지만 사이클이 없는 DAG라면?** 위상 정렬 순서로 한 번만 완화하면 O(V + E)예요(41장 8단계 위상 정렬). 벨만-포드는 순서를 모를 때 쓰는 도구예요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 1865 「웜홀」(출발점이 정해지지 않은 음수 사이클 판정), LeetCode 787 「Cheapest Flights Within K Stops」(바퀴 수 = 갈아타기 제한), 백준 11404 「플로이드」.\n", "starter": "# 백준 11657 타임머신 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 41b/boj11657\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "41b/boj1368", "chapter": "41b", "slug": "boj1368", "title": "백준 1368 물대기", "kind": "stdio", "ext": ".py", "tier": "Gold II (solved.ac)", "role": "도전", "target": "50분", "url": "https://solved.ac/problems/id/1368", "time_limit": 1.0, "ref_time": 0.029478375014150515, "problem": "# 백준 1368 물대기\n\n- 원문: https://solved.ac/problems/id/1368\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold II (solved.ac) · 역할: 도전 · 목표 시간: 50분\n- 짝이 되는 장: 41b. 가중치 그래프\n\n## 문제 (요약)\n논이 N개 있어요. 모든 논에 물을 대야 해요. 논에 물을 대는 방법은 두 가지예요.\n- 그 논에 직접 우물을 파요. 논 i에 우물을 파는 비용은 `W_i`예요.\n- 이미 물이 들어온 논에서 물길을 끌어와요. 논 i와 j를 잇는 비용은 `P_ij`예요(양방향).\n\n모든 논에 물을 대는 최소 비용을 출력하세요.\n\n## 제약\n- 1 ≤ N ≤ 300\n- 1 ≤ `W_i` ≤ 100,000, 1 ≤ `P_ij` ≤ 100,000 (i ≠ j), `P_ij = P_ji`, `P_ii = 0`\n- 입력: 첫 줄 N, 다음 N줄에 `W_1`…`W_N`(한 줄에 하나), 다음 N줄에 N×N 행렬 P / 출력: 최소 비용 하나\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 41b/boj1368` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 우물이 없다면 어떤 문제일까<\/summary>\n\n우물을 딱 한 곳에만 판다고 정해져 있다면, 나머지는 \"모든 논을 잇는 최소 비용\"이에요. 41b장 11단계의 \"이 문제는 MST다를 알아보는 법\" 표를 떠올려 보세요. 그런데 우물은 여러 곳에 팔 수 있어요. 가장 싼 우물 하나만 파고 나머지를 이으면 될까요? 우물이 싸고 물길이 비싼 경우를 하나 만들어 보세요.\n<\/details>\n\n<details><summary>힌트 2: 우물 비용을 간선으로 바꾸기<\/summary>\n\n우물 비용은 정점에 붙은 값이라 크루스칼에 바로 못 넣어요. 그렇다면 **물 그 자체를 정점 하나로** 만들어 보면 어떨까요? 가상의 정점 0(\"수원\")을 두고, 0과 논 i 사이에 비용 `W_i`짜리 간선을 놓아요. \"논 i에 우물을 판다\" = \"0—i 간선을 고른다\"예요.\n이제 정점 N + 1개를 전부 잇는 최소 비용을 구하면 돼요. 모든 논이 0과 이어지면 물이 다 들어간 거예요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 정점이 N + 1개라 MST의 간선은 **N개**예요. `n - 1`에서 멈추면 하나 덜 골라요.\n- 유니온 파인드 배열 크기도 `n + 1`이에요.\n- 행렬은 대칭이라 `i < j`인 칸만 간선으로 넣으면 돼요. 간선은 약 45,000개라 정렬해도 빨라요.\n- `W`는 한 줄에 하나씩, `P`는 한 줄에 N개씩 들어와요. 전부 `split()`으로 한 번에 읽으면 줄 모양을 신경 쓰지 않아도 돼요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 1368 물대기\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"논 N개를 전부 물에 닿게 한다. 방법은 그 논에 우물(정점 비용) 또는 물이 든 논과 연결(간선 비용). 최소 총비용.\" 확인할 것:\n- 우물은 몇 개까지 팔 수 있나요? → **제한 없어요.** 한 개 이상은 꼭 필요해요(손 케이스 02는 전부 파야 해요).\n- 물길은 양방향인가요? → 네, 행렬이 대칭이에요.\n- N = 1이면? → 우물 하나가 답이에요(손 케이스 01).\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n손 케이스 04: 우물 `5 9 9 6`, 논 1—2와 3—4만 1이고 나머지 물길은 20이에요. 논 1과 4에 우물(5 + 6), 1—2와 3—4를 연결(1 + 1) → **13**. 우물 하나(5)로 전부 이으면 5 + 1 + 20 + 1 = 27이에요.\n경계: N = 1(01), 물길이 비싸서 전부 우물(02), 우물 하나 + 나머지 전부 연결(03), 우물 두 개(04), 우물과 물길이 전부 같은 값(05), 물길 하나는 싸고 다른 하나는 비싸서 섞어야 함(06).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n우물을 팔 논의 집합을 전부 시도해요. 집합을 정하면 \"그 논들은 이미 물이 있다\"로 보고 나머지를 프림으로 붙여요. 집합이 2^N개라 **O(2^N · N²)**. N = 300이면 2^300이라 불가능해요. `solution/brute.py`가 이 방식이고, N ≤ 7인 스트레스에서만 써요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n### 중간 시도: 가장 싼 우물 하나 + 논끼리 MST\n\"모든 논을 잇는 최소 비용\"은 MST예요(41b장 11단계). 그래서 가장 싼 우물 하나를 파고 논끼리 크루스칼을 돌리고 싶어져요. 손 케이스 02(우물 `2 3 4`, 물길 전부 100)에서 이렇게 하면 2 + 100 + 100 = **202**가 나와요. 정답은 우물 셋을 다 파는 **9**예요. 물길이 비싸면 우물을 여러 개 파는 게 이득인데, 이 방법은 우물을 하나로 고정해 버려요.\n\"우물을 몇 개, 어디에\" 고르는 게 진짜 문제라서 브루트포스처럼 집합을 전부 볼 수밖에 없어 보여요.\n\n### 해법: 우물을 간선으로 바꾸기\n막힌 이유는 우물 비용이 **정점에 붙은 값**이라 크루스칼에 넣을 수 없어서예요. 그러면 정점에 붙은 값을 간선으로 바꿔요.\n- 가상의 정점 0(\"수원\")을 하나 더 둬요. 0—i 간선의 비용은 `W_i`예요.\n- \"논 i에 우물을 판다\" = \"0—i 간선을 고른다\", \"논 i와 j를 잇는다\" = \"i—j 간선을 고른다\".\n- 모든 논에 물이 든다 = 모든 논이 0과 연결된다. 정점 N + 1개를 잇는 최소 비용 = **MST**예요.\n- 우물을 몇 개 팔지는 크루스칼이 알아서 정해요. 0—i 간선이 싸면 여러 개 고르고, 물길이 싸면 하나만 골라요.\n\n트리거 단어: \"**전부** 연결/공급\", \"최소 비용\" → MST. 여기에 \"**직접 설치하는 비용**(정점 비용)\"이 섞이면 → 가상 정점 하나에 그 비용을 간선으로 매달아요 (41b장 11단계, 패턴 트리거 표).\n\n## 5. 코드\n```python\nedges = [(w[i], 0, i + 1) for i in range(n)]          # 수원 0 — 논 i = 우물\nfor i in range(n):\n    for j in range(i + 1, n):\n        edges.append((p[i][j], i + 1, j + 1))         # 논 i — 논 j = 물길\nedges.sort()\nparent = list(range(n + 1))                            # 정점 n + 1개\n\ndef find(x):\n    while parent[x] != x:\n        parent[x] = parent[parent[x]]\n        x = parent[x]\n    return x\n\ntotal = used = 0\nfor c, u, v in edges:\n    ru, rv = find(u), find(v)\n    if ru != rv:                                       # 사이클이 아니면 집어요\n        parent[ru] = rv\n        total += c\n        used += 1\n        if used == n:                                  # 간선 n개면 끝\n            break\nprint(total)\n```\n\n## 왜 이 코드가 정답인가\n\n- **불변식**: 수원 0을 정점으로 더해서 우물 비용 `w[i]`가 간선 `(0, i+1)`이 돼요. `parent`로 묶인 덩어리는 지금까지 고른 간선이 만든 사이클 없는 숲이에요.\n- **빠뜨리지 않는 이유**: 모든 논이 물을 받는 것은 정점 n+1개가 연결되는 것과 같아서 답은 이 그래프의 MST예요. 두 덩어리를 잇는 가장 싼 간선은 어떤 MST에 들어가니(컷 성질) 싼 간선부터 집어도 최적이에요.\n- **끝나는 이유**: 간선 약 n²/2개 정렬이 O(E log E)이고, 정점 n+1개의 신장 트리는 간선 n개라 `used == n`에서 멈춰요.\n- **깨지는 가정**: 수원 정점이에요. 그것 없이 논끼리 MST만 구하고 우물을 따로 고르면, 우물을 여러 개 파는 게 싼 경우(손 케이스 02)를 놓쳐요.\n\n## 6. 예제로 추적 (확인)\n손 케이스 07을 실제로 돌린 기록이에요. 우물은 `8 19 18 5 12 30`이에요.\n| 순서 | 간선 (비용) | 뜻 | 집나? | 누적 |\n|---|---|---|---|---|\n| 1 | 2—4 (1) | 물길 | 집음 | 1 |\n| 2 | 1—6 (3) | 물길 | 집음 | 4 |\n| 3 | 0—4 (5) | 논 4에 우물 | 집음 | 9 |\n| 4 | 4—6 (7) | 물길 | 집음 | 16 |\n| 5 | 0—1 (8) | 논 1에 우물 | **버림** (1은 6—4—0으로 이미 수원과 이어짐) | 16 |\n| 6 | 4—5 (8) | 물길 | 집음 | 24 |\n| 7 | 3—5 (9) | 물길 | 집음 → 간선 6개, 끝 | 33 |\n답 33 ✓. 우물은 논 4 하나만 팠어요. 5번째 줄이 핵심이에요. 논 1의 우물(8)은 꽤 싸지만, 이미 물이 들어온 덩어리라 크루스칼이 사이클로 보고 버렸어요. \"어디에 우물을 팔까\"를 따로 고민하지 않아도 돼요.\n\n## 7. 복잡도\n간선 E = N(N−1)/2 + N ≈ 45,000개. 정렬이 지배해서 **O(N² log N)**, 메모리 O(N²). 큰 입력(N = 300)에서 0.06초예요.\n프림을 힙 없이 \"안쪽과 바깥을 잇는 가장 싼 간선\"을 매번 전부 훑어서 짜면 O(N³)이고, N = 300에서 0.7초가 나와요. 채점기 제한(1초) 안이지만 아슬아슬해요. 가상 정점 모델링만 맞으면 크루스칼이든 프림이든 괜찮아요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 가장 싼 우물 하나 + 논끼리 MST | 물길이 비싸도 우물을 하나만 팜 | 손 케이스 02 |\n| 논마다 `min(우물, 가장 싼 물길)`을 더함 | 물길 양쪽이 서로에게 기대서 물이 없는 덩어리가 생김 | 손 케이스 04 |\n| 간선을 `n - 1`개에서 멈춤 | 정점이 n + 1개인 걸 잊어서 하나 덜 고름 | 손 케이스 02, 03 |\n| 유니온 파인드 배열을 `n`칸으로 | 논 n번에서 `IndexError` | 손 케이스 01 |\n| 우물 집합을 전부 시도 | 답은 맞지만 2^N | 큰 입력 (끝나지 않음) |\n\n## 9. 면접에서 30초로 설명하기\n\"모든 논에 물을 대는 최소 비용이니 MST인데, 우물 비용이 간선이 아니라 정점에 붙어 있습니다. 그래서 수원을 뜻하는 가상 정점 0을 추가하고, 0과 각 논 사이에 우물 비용을 간선으로 놓습니다. 그러면 정점 N + 1개짜리 그래프의 MST가 답이고, 우물을 몇 개 어디에 팔지는 크루스칼이 자동으로 정합니다. 간선이 N²개라 O(N² log N)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **왜 가상 정점을 붙여도 MST가 맞나요?** 원래 문제의 모든 해(우물 집합 + 물길)는 새 그래프의 신장 트리 하나와 비용이 같아요. 모든 논이 0과 이어져야 물이 드니까요. 거꾸로 새 그래프의 신장 트리도 원래 문제의 해예요. 해와 신장 트리가 일대일로 대응하니 최소끼리도 같아요.\n2. **같은 아이디어를 어디에 또 쓰나요?** \"여러 출발점 중 아무 데서나 시작\"하는 최단 경로가 있어요. 가상 출발점 하나에서 각 후보로 비용 0(또는 시작 비용) 간선을 놓고 다익스트라를 한 번 돌려요. 41장의 멀티 소스 BFS와 같은 생각이에요.\n3. **간선이 N²개인데 프림이 낫지 않나요?** 조밀한 그래프에서는 힙 없는 O(V²) 프림이 이론상 가장 좋아요(41b장 5단계의 \"힙을 빼면\" 이야기와 같은 이유). N = 300이면 둘 다 충분히 빨라서, 손에 익은 크루스칼 템플릿을 그대로 쓰는 게 실수가 적어요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 25분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 1168 「Optimize Water Distribution in a Village」(같은 문제의 영어판), 백준 10423 「전기가 부족해」(발전소 여러 개를 가상 정점 하나로 묶기), 프로그래머스 「섬 연결하기」(41b장 끝까지 따라가기 ②).\n", "starter": "# 백준 1368 물대기 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 41b/boj1368\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "41b/boj1717", "chapter": "41b", "slug": "boj1717", "title": "백준 1717 집합의 표현", "kind": "stdio", "ext": ".py", "tier": "Gold V (solved.ac)", "role": "핵심", "target": "25분", "url": "https://solved.ac/problems/id/1717", "time_limit": 1.5, "ref_time": 0.09074704197701067, "problem": "# 백준 1717 집합의 표현\n\n- 원문: https://solved.ac/problems/id/1717\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold V (solved.ac) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 41b. 가중치 그래프\n\n## 문제 (요약)\n0부터 n까지 정수 n+1개가 있고, 처음에는 모두 각자 혼자인 집합이에요. 연산이 m개 주어져요.\n- `0 a b`: a가 든 집합과 b가 든 집합을 하나로 합쳐요.\n- `1 a b`: a와 b가 같은 집합에 있으면 `YES`, 아니면 `NO`를 한 줄에 출력해요.\n\n## 제약\n- 1 ≤ n ≤ 1,000,000, 1 ≤ m ≤ 100,000\n- 0 ≤ a, b ≤ n. a와 b가 같을 수도 있어요.\n- 입력: 첫 줄 `n m`, 다음 m줄에 `연산 a b`\n- 출력: `1` 연산마다 `YES` 또는 `NO` 한 줄 (백준은 대소문자 무관, 이 채점기는 대문자로 비교해요)\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 41b/boj1717` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 질문마다 BFS를 돌리면<\/summary>\n\n`1 a b`가 최대 10만 번이에요. 질문마다 그래프를 탐색하면 한 번에 O(n)이라 끝나지 않아요(41b장 9단계 \"첫 번째 시도\"). 집합마다 **이름표** 하나를 들고 있으면 질문은 비교 한 번이에요. 그런데 합칠 때 한쪽 이름표를 전부 고쳐 쓰면 합치기가 O(n)이에요. 이름표를 전부 고치지 않고 합치려면 무엇을 들고 있어야 할까요?\n<\/details>\n\n<details><summary>힌트 2: 대표를 가리키는 부모 배열<\/summary>\n\n각 원소가 자기 위의 한 명만 가리키게 해요(`parent[x]`). 따라 올라가다 자기 자신을 가리키는 원소가 그 집합의 **대표**예요. `find(x)`는 대표를 돌려주고, 합치기는 **대표 하나만** 다른 대표 밑에 매달아요. 질문은 `find(a) == find(b)`예요. 41b장 9~10단계의 유니온 파인드, 템플릿의 `DSU`예요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- `parent[b] = a`처럼 **원소를** 매달면 틀려요. 반드시 `parent[find(b)] = find(a)`, 대표끼리예요.\n- 아무 최적화도 없으면 합치는 순서에 따라 트리가 한 줄로 늘어져서 `find` 한 번이 O(n)이에요(41b장 10단계). **경로 압축**이나 **union by size** 중 하나는 꼭 넣어요.\n- 재귀 `find`(`parent[x] = find(parent[x])`)는 압축 전 깊이가 그대로 재귀 깊이예요. 파이썬 기본 한도 1,000을 넘겨요. 반복문 두 번으로 짜요.\n- 원소는 0부터 n까지 **n+1개**예요. 배열 크기를 `n + 1`로 잡아요.\n- 입력이 최대 10만 줄이에요. `sys.stdin`으로 한꺼번에 읽고, 출력도 모아서 한 번에 써요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 1717 집합의 표현\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"그룹 합치기와 같은 그룹인지 묻기를 섞어서 최대 10만 번.\" 확인할 것:\n- 원소가 몇 개인가요? → 0부터 n까지 **n+1개** (손 케이스 04: n = 4인데 `1 4 0`을 물어요)\n- 합친 걸 다시 쪼개나요? → 아니요, 합치기만 해요. 그래서 유니온 파인드가 딱 맞아요\n- a = b인 연산이 나오나요? → 나와요. `0 1 1`은 아무 일도 없고, `1 1 1`은 `YES` (손 케이스 01)\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n손 케이스 01: `{1, 3}`을 만든 뒤 1과 7은 `NO`, `{6, 7}`을 만든 뒤에도 7과 1은 `NO`, 둘을 합친 뒤 `1 1 1`은 `YES`.\n경계: 합치기 전에 자기 자신을 묻기(02의 `1 0 0` → YES), 이미 같은 집합을 거꾸로 또 합치기(02의 `0 3 2`), 공통 원소를 거쳐 이어짐(03, 07), 0과 n 끝 원소(04), n = 1(05), 한 줄로 이어진 사슬(06).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n원소마다 집합 번호표를 들고, 합칠 때는 한쪽 번호표를 가진 원소를 **전부** 다른 번호로 고쳐 써요. 질문은 O(1)인데 합치기가 O(n)이에요. n = 100만, 합치기 5만 번이면 **500억 번**이라 끝나지 않아요(41b장 9단계 \"찍어 보기\"). `solution/brute.py`가 이 방식이에요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n병목은 \"합칠 때 그룹 전체를 건드린다\"예요. 그룹 전체가 아니라 **대표 한 명만** 옮기면 돼요.\n- 각 원소가 자기 위의 한 명만 가리켜요(`parent[x]`). 따라 올라가다 자기 자신을 가리키는 원소가 대표예요(41b장 9단계 \"대표를 가리키는 손가락\").\n- 합치기 = `parent[find(b)] = find(a)`. 질문 = `find(a) == find(b)`.\n- 그런데 합치는 순서가 나쁘면 트리가 한 줄로 늘어져 `find`가 O(n)이에요(41b장 10단계). 그래서 **경로 압축**(올라간 길을 전부 대표에 매달기)과 **union by size**(작은 트리를 큰 트리 밑에)를 넣어요. 둘 다 넣으면 연산당 분할 상환 O(α(n))이에요.\n\n트리거 단어: \"**같은 집합인가**\", \"합친다\", \"같은 팀/네트워크인가\" → 유니온 파인드 단독 (41b장 패턴 트리거 표).\n\n## 5. 코드\n```python\nparent = list(range(n + 1))            # 0..n\nsize = [1] * (n + 1)\n\ndef find(x):                           # 반복문 + 경로 압축\n    r = x\n    while parent[r] != r:              # 1단계: 대표를 찾는다\n        r = parent[r]\n    while parent[x] != r:              # 2단계: 지나온 노드를 전부 대표에 매단다\n        parent[x], x = r, parent[x]\n    return r\n\nfor op, a, b in ops:\n    ra, rb = find(a), find(b)\n    if op == 0:\n        if ra != rb:\n            if size[ra] < size[rb]:\n                ra, rb = rb, ra        # 작은 트리를 큰 트리 밑에\n            parent[rb] = ra\n            size[ra] += size[rb]\n    else:\n        out.append(\"YES\" if ra == rb else \"NO\")\n```\n`parent[x], x = r, parent[x]`는 오른쪽을 먼저 다 계산해요. 그래서 \"x의 원래 부모\"로 넘어가면서 x는 대표에 매달려요.\n\n## 왜 이 코드가 정답인가\n\n- **불변식**: `find(a) == find(b)`이면 그리고 그때만 a와 b가 같은 집합이에요. `size[r]`은 대표 r 아래 원소 수예요.\n- **빠뜨리지 않는 이유**: 합치기는 대표끼리만 이어서 두 집합 전체가 한 대표를 갖게 되고, 경로 압축은 대표는 그대로 두고 부모만 바꿔서 이 성질을 지켜요.\n- **끝나는 이유**: 크기 기준 합치기로 높이가 O(log n)이고 경로 압축까지 더해 연산당 거의 상수예요. `find`가 반복문이라 n = 10⁶이어도 재귀 한도에 안 걸려요.\n- **깨지는 가정**: 합친 집합을 다시 쪼개지 않는다는 것이에요. 분리 연산이 있으면 유니온 파인드로는 못 해요. 원소가 0..n이라 `parent`를 n칸으로 잡으면 `IndexError`가 나요.\n\n## 6. 예제로 추적 (확인)\n손 케이스 01(n = 7)을 실제로 돌린 값이에요. `parent`는 0번부터 7번까지예요.\n| 연산 | find(a), find(b) | 한 일 | 출력 | parent[0..7] 뒤 |\n|---|---|---|---|---|\n| `0 1 3` | 1, 3 | 크기가 같아 3을 1 밑에 | | 0, 1, 2, **1**, 4, 5, 6, 7 |\n| `1 1 7` | 1, 7 | 대표가 달라요 | NO | 그대로 |\n| `0 7 6` | 7, 6 | 6을 7 밑에 | | 0, 1, 2, 1, 4, 5, **7**, 7 |\n| `1 7 1` | 7, 1 | 대표가 달라요 | NO | 그대로 |\n| `0 3 7` | 1, 7 | 크기 2 대 2, 7을 1 밑에 | | 0, 1, 2, 1, 4, 5, 7, **1** |\n| `0 4 2` | 4, 2 | 2를 4 밑에 | | 0, 1, **4**, 1, 4, 5, 7, 1 |\n| `0 1 1` | 1, 1 | 이미 같은 대표, 아무것도 안 함 | | 그대로 |\n| `1 1 1` | 1, 1 | 같은 대표 | YES | 그대로 |\n답 `NO NO YES` ✓. `0 3 7`에서 3이 아니라 **3의 대표 1**과 7의 대표 7을 이었다는 게 핵심이에요. 이제 6은 6 → 7 → 1로 깊이 2예요. 다음에 `find(6)`을 부르면 경로 압축이 `parent[6]`을 1로 바꿔요.\n\n## 7. 복잡도\n경로 압축 + union by size → 연산당 분할 상환 **O(α(n))**, 전체 O(n + m·α(n)). 메모리 O(n). 큰 입력(사슬 두 개 + 맨 끝 원소 질문 5만 번)에서 약 0.14초예요. 둘 중 하나만 넣어도 이 큰 입력은 0.2초 안에 통과해요(41b장 10단계 \"흔한 오해\"와 같은 결과).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `parent[b] = a` (대표가 아니라 원소를 매달기) | 이미 묶인 걸 거꾸로 또 합치면 고리가 생겨 `find`가 영원히 돎 | 손 케이스 02 (시간 초과로 강제 종료) |\n| 최적화 없는 `parent[find(b)] = find(a)` | 답은 맞지만 사슬에서 `find` 한 번이 2.5만 칸 | 큰 입력 (시간 초과) |\n| 재귀 `find`, 재귀 한도 그대로 | `RecursionError` | 큰 입력 (런타임 에러) |\n| 재귀 `find` + `sys.setrecursionlimit(10**6)` | 이 채점기는 통과해요. 백준에서는 메모리·스택 때문에 위험할 수 있어요 | 통과 (반복문을 권해요) |\n| 배열을 `n` 크기로 | 원소 n에서 `IndexError` | 손 케이스 04, 05 |\n| 출력을 `print`로 10만 번 | 답은 맞지만 느림 | 백준에서 시간 초과 가능. 모아서 한 번에 |\n\n큰 입력은 사슬을 **두 방향으로** 하나씩 만들어요. `parent[find(b)] = find(a)`로 짜든 `parent[find(a)] = find(b)`로 짜든 둘 중 하나는 한 줄로 늘어져요.\n\n## 9. 면접에서 30초로 설명하기\n\"합치기와 같은 집합인지 묻기만 있어서 유니온 파인드를 씁니다. 부모 배열로 각 집합을 대표 하나가 이끄는 트리로 두고, 합칠 때는 대표끼리만 잇습니다. 트리가 한 줄로 늘어지지 않게 find에서 경로 압축을, union에서 작은 트리를 큰 트리 밑에 붙입니다. 연산당 분할 상환 O(α(n))이라 사실상 상수입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **α(n)이 뭐고, O(1)이라고 해도 되나요?** 아커만 역함수예요. 현실의 모든 n에서 4 이하지만 상수는 아니라서, \"분할 상환 O(α(n)), 사실상 상수\"가 정확해요(41b장 10단계 \"복잡도를 정직하게\").\n2. **집합의 크기나 집합 개수도 물으면?** `size[find(x)]`가 크기예요. 개수는 처음 n+1에서 합치기가 성공할 때마다 1씩 빼면 돼요(41b장 템플릿 `groups`, 실무에서는 4번).\n3. **합친 걸 다시 떼어 내야 하면?** 경로 압축이 구조를 바꿔 버려서 그대로는 못 해요. 질문을 거꾸로 처리해 \"떼기\"를 \"합치기\"로 바꾸거나, 압축 없이 union by size만 쓰고 바뀐 칸을 스택에 적어 되돌려요(롤백 유니온 파인드). 이름만 알면 충분해요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 1976 「여행 가자」, 백준 4195 「친구 네트워크」(크기 묻기), LeetCode 547 「Number of Provinces」, LeetCode 684 「Redundant Connection」(사이클 판정).\n", "starter": "# 백준 1717 집합의 표현 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 41b/boj1717\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "41b/boj1916", "chapter": "41b", "slug": "boj1916", "title": "백준 1916 최소비용 구하기", "kind": "stdio", "ext": ".py", "tier": "Gold V (solved.ac)", "role": "워밍업", "target": "15분", "url": "https://solved.ac/problems/id/1916", "time_limit": 1.0, "ref_time": 0.05873925000196323, "problem": "# 백준 1916 최소비용 구하기\n\n- 원문: https://solved.ac/problems/id/1916\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold V (solved.ac) · 역할: 워밍업 · 목표 시간: 15분\n- 짝이 되는 장: 41b. 가중치 그래프\n\n## 문제 (요약)\n도시 N개와 버스 M대가 있어요. 버스마다 출발 도시, 도착 도시, 요금이 있고 **한 방향으로만** 가요. 도시 A에서 도시 B로 가는 최소 요금을 출력하세요. A에서 B로 갈 수 있는 경우만 주어져요.\n\n## 제약\n- 1 ≤ N ≤ 1,000, 1 ≤ M ≤ 100,000\n- 요금은 0 이상 100,000 미만의 정수\n- 같은 두 도시 사이에 버스가 여러 대 있을 수 있어요\n- 입력: 첫 줄 `N`, 둘째 줄 `M`, 다음 M줄에 `출발 도착 요금`, 마지막 줄에 `A B`\n- 출력: 최소 요금 하나\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요. 41b장 끝까지 따라가기 ①(백준 1753)을 **보지 않고** 짜는 게 목표예요.\n2. `python algo/judge.py 41b/boj1916` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 41장의 BFS로 될까<\/summary>\n\n버스마다 요금이 달라요. 41장의 BFS는 \"몇 번 갈아탔나\"를 세는 도구라서, 한 번에 10원짜리 버스보다 두 번 갈아타는 1원 + 1원 길을 놓쳐요. \"지금까지 든 돈이 가장 적은 도시부터\" 넓혀 가려면 큐를 무엇으로 바꿔야 할까요?\n<\/details>\n\n<details><summary>힌트 2: 큐를 최소 힙으로<\/summary>\n\n`(지금까지 요금, 도시)`를 최소 힙에 넣고, 가장 싼 것부터 꺼내요. 꺼낸 도시에서 나가는 버스로 더 싸게 갈 수 있는 도시를 찾으면 거리를 고치고 힙에 다시 넣어요. 41b장 2단계의 다익스트라, 템플릿 첫 번째 함수예요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 힙에 넣는 순서는 `(거리, 도시)`예요. 튜플은 첫 원소로 비교해요.\n- **넣을 때 방문 처리하면 틀려요.** 처음 발견한 요금이 최소라는 보장이 없어요(41b장 4단계). `if nd < dist[v]`로 거리만 고쳐요.\n- 같은 도시가 힙에 여러 번 들어가요. 꺼냈을 때 `d > dist[u]`이면 낡은 항목이니 버려요(41b장 3단계).\n- 요금 0인 버스도 있어요. 그래도 음수가 아니라 다익스트라는 맞아요.\n- A와 B가 같으면 답은 0이에요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 1916 최소비용 구하기\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"방향 그래프, 간선 비용 0 이상, A에서 B까지 최소 비용.\" 확인할 것:\n- 방향이 있나요? → **있어요**, 버스는 한 방향 (손 케이스 05)\n- 음수 요금이 있나요? → 없어요, 0은 있어요 → 다익스트라가 맞아요\n- 같은 두 도시 사이 버스가 여러 대면? → 인접 리스트에 다 넣으면 알아서 싼 게 이겨요 (손 케이스 02)\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n손 케이스 01: 1→5 직행이 10원이지만 1→4(1)→5(3) = 4원, 1→3(3)→5(1) = 4원. 답 4.\n경계: 같은 두 도시의 버스 여러 대(02 → 4+1 = 5), A = B(03 → 0), 요금 0 버스(04 → 0), 반대 방향이 싸지만 못 씀(05 → 100), \"처음 발견한 요금\"이 최소가 아님(06 → 3).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n확정 같은 건 생각하지 말고 \"모든 버스를 훑으며 더 싸게 갈 수 있으면 고치기\"를 N−1바퀴(벨만-포드 모양, 41b장 7단계). **O(N·M)** = 1,000 × 100,000 = 1억 번이라 시간 초과예요. 고칠 게 없으면 멈추는 조기 종료를 넣어도, 최단 경로가 999번 갈아타는 큰 입력에서는 거의 1,000바퀴를 돌아요(이 채점기에서 강제 종료). `solution/brute.py`가 이 방식이에요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n브루트포스는 이미 답이 정해진 도시에서 나가는 버스까지 매 바퀴 다시 훑어요. 어떤 도시의 최소 요금이 **확정**되는 순간을 알 수 있다면, 그 도시의 버스는 한 번만 보면 돼요.\n- 요금이 음수가 아니면, 아직 확정 안 된 도시 중 **지금 요금이 가장 싼 도시**는 더 싸질 수 없어요. 다른 길로 돌아오면 요금이 더해지기만 하니까요(41b장 2단계 \"왜 맞을까요\").\n- \"가장 싼 것 꺼내기\"를 빠르게 하는 게 최소 힙이에요. BFS의 FIFO 큐를 힙으로 바꾼 것 = 다익스트라.\n- 더 싼 길을 찾으면 힙에 **새로** 넣고, 옛 항목은 꺼낼 때 `d > dist[u]`로 버려요(41b장 3단계, 지연 삭제).\n\n트리거 단어: 간선에 \"**요금**\", \"비용\", \"시간\"이 붙음 + 최소 → 다익스트라 (41b장 패턴 트리거 표).\n\n## 5. 코드\n```python\ndist = [INF] * (n + 1)\ndist[src] = 0\npq = [(0, src)]                        # (거리, 정점)\nwhile pq:\n    d, u = heapq.heappop(pq)\n    if d > dist[u]:\n        continue                       # 낡은 항목\n    if u == dst:\n        break                          # 꺼낸 순간 확정 → 목표면 끝\n    for v, w in adj[u]:\n        nd = d + w\n        if nd < dist[v]:               # 거리 갱신 (방문 처리가 아니에요)\n            dist[v] = nd\n            heapq.heappush(pq, (nd, v))\nprint(dist[dst])\n```\n`if u == dst: break`는 없어도 맞아요. 목표가 하나일 때만 쓸 수 있는 조기 종료예요.\n\n## 왜 이 코드가 정답인가\n\n- **불변식**: 힙에서 `(d, u)`를 꺼냈고 `d == dist[u]`이면 `dist[u]`는 확정된 최단 거리예요. `d > dist[u]`인 항목은 낡아서 건너뛰어요.\n- **빠뜨리지 않는 이유**: u에 더 싸게 닿는 경로가 있다면 아직 힙에 있는 정점(거리 ≥ d)을 거쳐야 하고, 요금이 0 이상이라 그 뒤로 줄어들 수 없어요. 그래서 `dst`를 꺼낸 순간 `break`해도 돼요.\n- **끝나는 이유**: 거리가 줄 때만 push하니 힙 항목은 O(M)개, 전체 O(M log M)이에요.\n- **깨지는 가정**: 요금이 음수가 아니라는 것이에요. 음수 간선이 있으면 확정된 정점이 나중에 더 싸질 수 있어서 틀려요(그땐 벨만-포드, 11657번).\n\n## 6. 예제로 추적 (확인)\n손 케이스 01을 실제로 돌린 값이에요.\n| 꺼낸 (거리, 도시) | 고친 도시 (새 거리) | dist[1..5] | 꺼낸 뒤 힙 |\n|---|---|---|---|\n| (0, 1) | 2(2), 3(3), 4(1), 5(10) | 0, 2, 3, 1, 10 | (1,4) (2,2) (3,3) (10,5) |\n| (1, 4) | 5(4) | 0, 2, 3, 1, 4 | (2,2) (3,3) (4,5) (10,5) |\n| (2, 2) | — (2→4는 4원이라 1보다 비쌈) | 0, 2, 3, 1, 4 | (3,3) (4,5) (10,5) |\n| (3, 3) | — (3→5는 4원, 같아서 안 고침) | 0, 2, 3, 1, 4 | (4,5) (10,5) |\n| (4, 5) | 목표 → 끝 | | |\n답 4 ✓. 힙에 남은 `(10, 5)`가 **낡은 항목**이에요. 조기 종료가 없었다면 꺼낼 때 `10 > dist[5] = 4`라서 버려졌을 거예요. 1→5 직행(10원)을 처음 발견했지만 그게 최소가 아니었다는 게 표의 첫 줄과 둘째 줄에 보여요.\n\n## 7. 복잡도\n각 간선이 힙에 최대 한 번 넣기를 일으켜요 → 힙 크기 O(M), 연산당 O(log M) → **O(M log N)** (log M ≤ 2 log N). 메모리 O(N + M). 큰 입력에서 약 0.1초예요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 넣을 때 방문 처리 (BFS 습관) | 처음 발견한 비싼 요금으로 굳음 | 손 케이스 01, 06 |\n| 41장 BFS에 요금만 더함 | 갈아탄 횟수가 적은 길을 고름 | 손 케이스 01 |\n| 양방향으로 저장 | 반대 방향 버스를 씀 | 손 케이스 05 |\n| `dist` 초기값을 작은 수(예: 10⁸)로 | 요금 합이 최대 약 10⁸이라 겹칠 수 있음 | 스트레스에서는 드묾. `float('inf')`로 |\n| 벨만-포드처럼 모든 간선을 반복해 훑기 | 답은 맞지만 O(N·M) | 큰 입력 (시간 초과로 강제 종료) |\n\n## 9. 면접에서 30초로 설명하기\n\"요금이 음수가 아닌 방향 그래프의 단일 출발 최단 경로라서 다익스트라를 씁니다. (거리, 도시)를 최소 힙에 넣고 가장 싼 것부터 꺼내면, 꺼낸 순간 그 도시의 거리가 확정됩니다. 이웃으로 더 싸게 갈 수 있으면 거리를 고치고 다시 넣고, 낡은 항목은 꺼낼 때 버립니다. O(M log N)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **경로까지 출력하라면?** 거리를 고칠 때 `prev[v] = u`를 적고 B에서 거꾸로 따라가 뒤집어요(41b장 실무에서는 5번). 백준 11779 「최소비용 구하기 2」가 이 문제예요.\n2. **N이 1,000이면 힙 없이 O(N²)로도 되나요?** 돼요. 100만 번이라 이 문제에서는 오히려 비슷해요. 41b장 5단계처럼 간선이 적은(희소) 그래프에서 힙이 압도적으로 이겨요. 코딩 테스트는 대개 희소해서 힙 버전을 외워요.\n3. **요금이 음수인 버스가 있으면?** \"꺼낸 순간 확정\"이 깨져요. 벨만-포드로 가요(41b장 6~7단계, 다음 문제 백준 11657).\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 1753 「최단경로」, 백준 11779 「최소비용 구하기 2」(경로 복원), LeetCode 743 「Network Delay Time」.\n", "starter": "# 백준 1916 최소비용 구하기 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 41b/boj1916\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "41b/pg72413", "chapter": "41b", "slug": "pg72413", "title": "프로그래머스 72413 합승 택시 요금", "kind": "func", "ext": ".py", "tier": "Lv. 3 (프로그래머스)", "role": "핵심", "target": "35분", "url": "https://school.programmers.co.kr/learn/courses/30/lessons/72413", "time_limit": 1.5, "ref_time": 0.011741292022634298, "problem": "# 프로그래머스 72413 합승 택시 요금\n\n- 원문: https://school.programmers.co.kr/learn/courses/30/lessons/72413 (2021 KAKAO BLIND RECRUITMENT)\n- 난이도: Lv. 3 (프로그래머스) · 역할: 핵심 · 목표 시간: 35분\n- 짝이 되는 장: 41b. 가중치 그래프\n\n## 문제 (요약)\n지점 n개와 양방향 택시 길이 있어요. 길마다 요금이 있어요. 두 사람이 지점 `s`에서 함께 출발해요. 한 사람은 `a`로, 다른 사람은 `b`로 집에 가요.\n- 두 사람은 원하는 만큼 택시를 **같이 타고** 가다가 어느 지점에서 내려 각자 따로 갈 수 있어요. 같이 탄 구간의 요금은 한 번만 내요.\n- 처음부터 따로 타도 돼요.\n\n두 사람이 낸 택시 요금의 합이 가장 적을 때의 금액을 돌려주세요.\n\n## 제약\n- 3 ≤ n ≤ 200, `s`, `a`, `b`는 서로 다른 지점\n- `fares`의 원소는 `[c, d, f]`: 지점 c와 d 사이 요금이 f (1 ≤ f ≤ 100,000), 양방향\n- 같은 두 지점 사이 요금은 한 번만 주어져요. 길이 하나도 없는 지점도 있을 수 있어요\n- `s`에서 `a`와 `b`로 가는 길은 항상 있어요\n\n## 함수\n```python\ndef solution(n: int, s: int, a: int, b: int, fares: list[list[int]]) -> int\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 41b/pg72413` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 프로그래머스에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 경로를 두 토막으로 나눠 보기<\/summary>\n\n두 사람의 이동은 언제나 \"같이 가는 토막\"과 \"따로 가는 토막 둘\"로 나뉘어요. 두 사람이 내리는 지점을 `k`라고 부르면 총 요금은 무엇과 무엇의 합일까요? `k`가 될 수 있는 지점은 몇 개인가요? 처음부터 따로 타는 경우는 `k`가 어디일 때인가요?\n<\/details>\n\n<details><summary>힌트 2: 어떤 거리들이 필요한가<\/summary>\n\n총 요금은 `dist(s, k) + dist(k, a) + dist(k, b)`예요. 모든 `k`를 시도하면 끝이에요. 그러려면 `s`에서의 거리, `k`에서 `a`·`b`까지의 거리가 필요해요.\n41b장 8단계는 이걸 플로이드-워셜로 모든 쌍을 구해서 풀어요. 그런데 길이 **양방향**이라 `dist(k, a) = dist(a, k)`예요. 그러면 출발점을 몇 개만 두고 다익스트라를 돌려도 되지 않을까요?\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 인접 리스트에 **양쪽 방향**을 다 넣어요. 한쪽만 넣으면 거꾸로 적힌 요금을 못 써요.\n- 플로이드-워셜이라면 거쳐 가는 정점 `k`의 반복문이 **가장 바깥**이에요(41b장 8단계). 안쪽에 두면 예제는 맞고 랜덤에서 틀려요.\n- 길이 없는 지점은 거리가 무한대예요. 그 `k`는 답이 될 수 없으니 `float(\"inf\")`로 두면 `min`이 알아서 걸러요.\n- 3중 반복문 플로이드는 n = 200에서 파이썬으로 0.7초쯤 걸려요. 통과는 하지만 다익스트라 3번은 0.01초예요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 프로그래머스 72413 합승 택시 요금\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"s에서 같이 출발해 어떤 지점 k까지 합승하고, 거기서 a와 b로 갈라진다. 총 요금 최소.\" 확인할 것:\n- 길이 양방향인가요? → **네.** 이게 풀이를 가볍게 만들어요.\n- 처음부터 따로 타도 되나요? → 돼요. k = s인 경우예요(손 케이스 「처음부터 따로 타는 게 이득」).\n- 한 사람 집까지 같이 가도 되나요? → 돼요. k = a인 경우예요(손 케이스 「한 사람 집까지 같이 감」).\n- 길이 없는 지점이 있나요? → 있을 수 있어요. 거리가 무한대예요(손 케이스 「아무 데도 안 이어진 지점이 있음」).\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n손 케이스 「같이 타다 갈라지는 게 이득」: 1에서 출발, 집은 4와 5. 1→4, 1→5 직행은 20씩이라 따로 타면 40이에요. 1→2를 같이 타고(10) 2에서 갈라지면 1 + 1을 더해 **12**예요.\n경계: 따로 타는 게 나음(k = s), 한 사람 집에서 갈라짐(k = a), 두 사람의 최단 경로 어디에도 없는 지점에서 갈라짐, 길이 없는 지점, 한 줄로 이어진 길.\n\n## 3. 브루트포스와 그 복잡도 (2분)\nk를 하나 정할 때마다 s→k, k→a, k→b를 다익스트라로 새로 구해요. k가 n개라 다익스트라를 3n번 = 600번 돌려요. 큰 입력에서 실제로 1.3초가 걸렸어요. 같은 거리를 수백 번 다시 구하는 낭비예요.\n41b장 8단계는 플로이드-워셜로 모든 쌍을 한 번에 구해요. **O(n³)** = 800만 번이고, 파이썬으로 0.7초쯤이에요. 이 문제의 n ≤ 200은 바로 그 한계에 맞춘 크기예요. `solution/brute.py`가 이 방식이에요. 맞는 풀이이고 채점기 제한(1.5초)도 통과해요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n총 요금은 `dist(s, k) + dist(k, a) + dist(k, b)`예요. 이 식에서 출발점이 **k로 바뀌는** 항이 둘이라 모든 쌍이 필요해 보여요.\n- 그런데 길이 양방향이에요. 그러면 `dist(k, a) = dist(a, k)`예요. \"k에서 a까지\"를 \"a에서 k까지\"로 뒤집어 읽으면 출발점이 **a 하나로 고정**돼요.\n- 그러니 다익스트라를 s, a, b에서 **세 번만** 돌리면 세 배열 `ds`, `da`, `db`가 생겨요. 답은 `min(ds[k] + da[k] + db[k])`예요.\n- 플로이드가 n번 할 일을 다익스트라 3번이 해요. 0.7초가 0.01초가 돼요.\n\n트리거 단어: \"같이 가다가 **어디선가 갈라진다**\", \"중간 지점을 고른다\" → 갈라지는 점 k를 전부 시도 + 거리 배열 몇 개. \"양방향\"이면 출발점을 뒤집어 다익스트라 횟수를 줄여요 (41b장 패턴 트리거 표, 8단계).\n\n## 5. 코드\n```python\nimport heapq\n\ndef solution(n, s, a, b, fares):\n    adj = [[] for _ in range(n + 1)]\n    for c, d, f in fares:\n        adj[c].append((d, f))              # 양방향\n        adj[d].append((c, f))\n\n    def dijkstra(src):\n        dist = [float(\"inf\")] * (n + 1)\n        dist[src] = 0\n        pq = [(0, src)]\n        while pq:\n            dd, u = heapq.heappop(pq)\n            if dd > dist[u]:\n                continue                   # 낡은 항목\n            for v, w in adj[u]:\n                nd = dd + w\n                if nd < dist[v]:\n                    dist[v] = nd\n                    heapq.heappush(pq, (nd, v))\n        return dist\n\n    ds, da, db = dijkstra(s), dijkstra(a), dijkstra(b)\n    return min(ds[k] + da[k] + db[k] for k in range(1, n + 1))\n```\n플로이드로 쓴다면 41b장 템플릿 그대로 `d`를 채우고 `min(d[s][k] + d[k][a] + d[k][b])`예요.\n\n## 왜 이 코드가 정답인가\n\n- **불변식**: `ds[k]`, `da[k]`, `db[k]`는 s, a, b에서 k까지의 최단 요금이에요. 길이 양방향이라 `da[k]`는 k→a 요금이기도 해요.\n- **빠뜨리지 않는 이유**: 어떤 최적 경로든 합승이 끝나는 지점 k가 하나 있고, 그 뒤 두 경로는 독립이라 비용이 `ds[k] + da[k] + db[k]`예요. k를 1..n 전부 보니 최적 k를 놓치지 않아요(따로 타기는 k = s).\n- **끝나는 이유**: 다익스트라 세 번 O(E log V)에 O(n) 훑기 한 번이에요.\n- **깨지는 가정**: 길이 양방향이라는 것이에요. 단방향이면 `da[k]`가 a→k 요금이라 k→a로 못 쓰고, 뒤집은 그래프에서 a, b 다익스트라를 돌려야 해요.\n\n## 6. 예제로 추적 (확인)\n손 케이스 「같이 타다 갈라지는 게 이득」을 실제로 돌린 세 배열이에요(지점 3은 길이 없어요).\n| k | ds[k] | da[k] | db[k] | 합 |\n|---|---|---|---|---|\n| 1 (따로 타기) | 0 | 11 | 11 | 22 |\n| 2 | 10 | 1 | 1 | **12** |\n| 3 | ∞ | ∞ | ∞ | ∞ |\n| 4 (a 집까지 같이) | 11 | 0 | 2 | 13 |\n| 5 (b 집까지 같이) | 11 | 2 | 0 | 13 |\n답 12 ✓. k = 1 줄이 22인 것도 보세요. 1→4 직행 20보다 1→2→4 = 11이 싸서 \"따로 타기\"도 직행이 아니에요. 각자의 최단 경로는 다익스트라가 알아서 찾아요.\n\n손 케이스 「요금이 거꾸로 적힌 한 줄 길」은 길이 `1—2—5—4—3` 한 줄이에요(s = 4, a = 1, b = 3). 정답은 k = 4(따로 타기)에서 0 + 17 + 4 = **21**이에요. 플로이드의 k를 가장 안쪽에 두고 돌리면(실제로 돌린 값) `d[4][1]`이 ∞로 남고, 유일하게 값이 나오는 k = 5에서 6 + 11 + 10 = **27**을 내요. 4→1은 중간 지점을 둘(5, 2) 거쳐야 하는데, k가 안쪽이면 쌍마다 한 번씩만 보고 지나가서 그걸 못 이어 붙여요.\n\n## 7. 복잡도\n다익스트라 3번 → **O(E log n)**, 메모리 O(n + E). 큰 입력(n = 200, 간선 19,900개)에서 0.01초예요. 플로이드는 O(n³)이고 0.7초예요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 합승을 안 고려하고 `ds[a] + ds[b]` | 따로 타는 값만 나옴 | 손 케이스 「같이 타다 갈라지는 게 이득」 |\n| 인접 리스트에 한 방향만 넣음 | 거꾸로 적힌 요금을 못 씀 | 손 케이스 「같이 타다 갈라지는 게 이득」 |\n| 플로이드에서 k를 가장 안쪽에 | 여러 지점을 거치는 길을 놓침 | 손 케이스 「요금이 거꾸로 적힌 한 줄 길」, 스트레스 |\n| k를 s, a, b 중에서만 고름 | 중간 지점에서 갈라지는 답을 놓침 | 손 케이스 「같이 타다 갈라지는 게 이득」 |\n| k마다 다익스트라를 새로 돌림 | 답은 맞지만 3n번 (1.3초) | 채점기는 통과시켜요. n이 조금만 커져도 시간 초과예요 |\n\n## 9. 면접에서 30초로 설명하기\n\"두 사람이 갈라지는 지점을 k라고 하면 총 요금은 s에서 k, k에서 a, k에서 b까지의 최단 거리 합입니다. 모든 k를 시도하면 됩니다. 길이 양방향이라 k에서 a까지는 a에서 k까지와 같으니, s, a, b에서 다익스트라를 세 번만 돌려 세 거리 배열을 만들고 k마다 더해서 최솟값을 고릅니다. O(E log V)입니다. n이 200이라 플로이드-워셜 O(n³)도 됩니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **길이 일방통행이면요?** `dist(s, k)`는 그대로 s에서 다익스트라예요. `dist(k, a)`는 \"모든 k에서 a로\"라서, 간선을 전부 **뒤집은 그래프**에서 a를 출발점으로 다익스트라를 돌리면 돼요. 여전히 3번이에요.\n2. **세 사람이 탄다면?** 갈라지는 방식이 여러 가지라(셋이 같이 가다 한 명 내리고, 둘이 더 가다 갈라지고…) 갈라지는 점이 둘이 돼요. k1, k2를 다 시도하면 O(n²)개 조합에 거리 배열 몇 개로 풀려요. 일반화하면 슈타이너 트리 문제라 어려워져요.\n3. **플로이드와 다익스트라 3번 중 무엇을 고르나요?** 질문마다 출발점이 많으면 플로이드, 출발점이 몇 개로 고정되면 다익스트라예요. 이 문제는 n이 작아서 둘 다 되고, 코드가 짧은 플로이드를 고르는 사람도 많아요. k 순서만 조심하면요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 20분 안에 힌트 없이 통과하면 졸업. 이번에 다익스트라로 풀었다면 다음엔 플로이드로, 반대도 해 보세요. 비슷한 문제: 백준 1238 「파티」(뒤집은 그래프로 다익스트라 2번), 백준 1504 「특정한 최단 경로」(꼭 거칠 점이 정해짐).\n", "starter": "# 프로그래머스 72413 합승 택시 요금 — 함수 몸통을 채우세요.  채점: python algo/judge.py 41b/pg72413\n\n\ndef solution(n, s, a, b, fares):\n    pass\n"}, {"id": "42/boj11053", "chapter": "42", "slug": "boj11053", "title": "백준 11053 가장 긴 증가하는 부분 수열", "kind": "stdio", "ext": ".py", "tier": "Silver II (solved.ac)", "role": "핵심", "target": "25분", "url": "https://solved.ac/problems/id/11053", "time_limit": 1.0, "ref_time": 0.023822916991775855, "problem": "# 백준 11053 가장 긴 증가하는 부분 수열\n\n- 원문: https://solved.ac/problems/id/11053\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Silver II (solved.ac) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 42. 동적 계획법 (1차원)\n\n## 문제 (요약)\n수열 A가 주어져요. 원소 몇 개를 **순서는 그대로 두고** 골라 만든 수열(부분 수열) 가운데, 값이 **엄격하게** 커지기만 하는 것의 최대 길이를 출력하세요. 고른 원소끼리 붙어 있을 필요는 없어요. 같은 값이 두 번 이어지면 증가가 아니에요.\n\n## 제약\n- 1 ≤ N ≤ 1,000, 1 ≤ Aᵢ ≤ 1,000\n- 입력: 첫 줄 `N`, 둘째 줄 수열 / 출력: 길이 하나\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 42/boj11053` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 다음 원소를 붙이려면 무엇을 알아야 하나<\/summary>\n\n지금까지 만든 증가 수열 뒤에 `a[i]`를 붙일 수 있는지 판단하려면, 그 수열에 대해 무엇을 알아야 할까요? 길이만으로는 부족해요.\n<\/details>\n\n<details><summary>힌트 2: 상태에 \"여기서 끝난다\"를 넣기<\/summary>\n\n`dp[i]` = **a[i]를 마지막 원소로 하는** 가장 긴 증가 부분 수열의 길이. 그러면 마지막 값이 a[i]로 확정돼요. `dp[i]`는 a[j] < a[i]인 앞쪽 j들의 `dp[j] + 1` 중 최댓값이에요(그런 j가 없으면 1). 42장 6단계 그대로예요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 답은 `dp[n-1]`이 아니라 `max(dp)`예요. 가장 긴 수열이 마지막 원소에서 끝난다는 보장이 없어요.\n- 비교는 `<`예요. `<=`로 쓰면 같은 값이 이어진 수열도 세요.\n- `dp`를 1로 초기화해요. 0으로 두면 혼자 있는 원소가 길이 0이 돼요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 11053 가장 긴 증가하는 부분 수열\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"순서를 유지하며 몇 개를 골라서, 엄격하게 증가하는 수열의 최대 길이.\" 확인 질문이에요.\n- 고른 원소가 붙어 있어야 하나요? → **아니요.** 부분 수열이지 부분 배열(연속 구간)이 아니에요.\n- 같은 값이 이어지면? → **증가가 아니에요.** `<`로 비교해요.\n- N이 얼마나 큰가요? → 1,000. O(N²) = 100만이라 충분해요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`3 1 4 1 5 9 2 6` → `3 4 5 9`나 `1 4 5 6`처럼 길이 4가 최대예요.\n경계: N = 1(답 1), 전부 같은 값(답 1), 감소 수열(답 1), 이미 정렬(답 N), 가장 긴 수열이 **중간에서 끝나는** 경우 `2 9 3 3 4 1`(답 3, 마지막 원소 1에서 끝나는 길이는 1).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n원소마다 \"고른다/안 고른다\"로 2ᴺ개의 부분 수열을 다 만들고, 증가하는지 확인해요. **O(2ᴺ·N)**이에요. N = 1,000이면 2¹⁰⁰⁰이라 불가능해요. N = 25쯤에서 이미 몇 초가 걸려요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n브루트포스는 \"a[4] = 5에서 끝나는 좋은 수열\"을 그 뒤에 무엇을 붙이든 **매번 다시** 만들어요. 그런데 a[4]로 끝나는 수열 중 뒤에 붙일 때 중요한 건 **길이 하나**뿐이에요. 마지막 값은 어차피 5니까요. 이게 중복 부분 문제예요.\n\n상태를 처음에 \"0..i에서 가장 긴 길이\"로 잡으면 막혀요. 다음 원소를 붙일 수 있는지 알려면 **마지막 값**이 필요한데, 그 상태는 길이만 알려 주거든요(42장 6단계 \"해법 시도 1\"). 그래서 42장의 **상태를 찾는 질문 1**(\"다음 한 걸음을 고르려면 무엇을 알아야 하나?\")에 답해서 상태에 \"여기서 끝난다\"를 못 박아요.\n\n| 레시피 | 이 문제에서 |\n|---|---|\n| ① 상태 | `dp[i]` = **a[i]를 마지막 원소로** 하는 가장 긴 증가 부분 수열의 길이 |\n| ② 점화식 | a[i] 바로 앞 원소가 무엇이었나? → `dp[i] = 1 + max(dp[j] for j < i if a[j] < a[i])`, 그런 j가 없으면 1 |\n| ③ 기저 사례 | 모든 i에서 `dp[i] = 1`로 시작 (a[i] 혼자인 수열) |\n| ④ 순서와 답 | i를 왼쪽부터 채워요(j < i만 읽으니까). 답은 **`max(dp)`** — 마지막 칸이 아니에요 |\n\n**재귀 → 메모 → 표** 과정이에요.\n\n```python\n# (가) 느린 재귀: f(i) = a[i]에서 끝나는 최장 길이\n#     정렬된 입력에서 호출이 2ᴺ − 1번. N = 22에서 419만 번, 1초\ndef f(i):\n    best = 1\n    for j in range(i):\n        if a[j] < a[i]:\n            best = max(best, f(j) + 1)\n    return best\nanswer = max(f(i) for i in range(n))\n\n# (나) 메모: @cache를 붙이면 서로 다른 f(i)는 N개, 각각 O(N) → O(N²)\n#     단, 정렬된 입력에서 f(n-1)부터 부르면 재귀 깊이가 N까지 가요.\n#     N = 1,000이면 파이썬 기본 한도(1,000)에 걸려요. 위처럼 i를 작은 쪽부터 부르면 피해 가지만,\n#     그건 이미 \"작은 칸부터 채우기\", 즉 표와 같은 순서예요\nfrom functools import cache\nf = cache(f)\n\n# (다) 표: j < i만 읽으니 왼쪽부터 채우면 재귀가 필요 없어요\ndp = [1] * n\nfor i in range(n):\n    for j in range(i):\n        if a[j] < a[i]:\n            dp[i] = max(dp[i], dp[j] + 1)\nanswer = max(dp)\n```\n\n트리거 단어: \"부분 수열\"(연속 아님), \"증가하는\", \"가장 긴\" → i에서 끝나는 상태의 1차원 DP (42장 6단계). N이 1,000 정도면 O(N²), 10⁶이면 이진 탐색 버전(백준 12015)이에요.\n\n## 5. 코드\n```python\nimport sys\n\ndata = sys.stdin.read().split()\nn = int(data[0])\na = list(map(int, data[1:1 + n]))\ndp = [1] * n                       # 기저: 혼자 있어도 길이 1\nfor i in range(n):\n    for j in range(i):\n        if a[j] < a[i] and dp[j] + 1 > dp[i]:\n            dp[i] = dp[j] + 1\nprint(max(dp))                     # 답: 어디서 끝나든 최댓값\n```\n\n## 왜 이 코드가 정답인가\n\n- **불변식**: `dp[i]`는 `a[i]`로 끝나는 증가 부분 수열의 최대 길이예요.\n- **빠뜨리지 않는 이유**: `a[i]`로 끝나는 수열은 `a[i]` 혼자(1)이거나, `a[j] < a[i]`인 어떤 j로 끝나는 수열 뒤에 `a[i]`를 붙인 것이에요. 안쪽 루프가 j < i를 전부 보고, 답은 끝 자리에 상관없이 `max(dp)`예요.\n- **끝나는 이유**: j < i인 `dp[j]`는 이미 채워져 있고, 이중 루프 O(N²) = 100만이에요.\n- **깨지는 가정**: 엄격히 증가라서 `<`예요. `<=`로 쓰면 `10 10`처럼 같은 값이 이어진 입력에서 길이를 더 크게 세요.\n\n## 6. 예제로 추적 (확인)\n`3 1 4 1 5 9 2 6`을 코드로 돌려 찍었어요.\n\n| i | a[i] | a[j] < a[i]인 j | 그 j들의 dp | dp[i] | 앞 원소 |\n|---|---|---|---|---|---|\n| 0 | 3 | 없음 | — | 1 | — |\n| 1 | 1 | 없음 | — | 1 | — |\n| 2 | 4 | 0, 1 | 1, 1 | 2 | a[0]=3 |\n| 3 | 1 | 없음 | — | 1 | — |\n| 4 | 5 | 0, 1, 2, 3 | 1, 1, 2, 1 | 3 | a[2]=4 |\n| 5 | 9 | 0~4 | 1, 1, 2, 1, 3 | 4 | a[4]=5 |\n| 6 | 2 | 1, 3 | 1, 1 | 2 | a[1]=1 |\n| 7 | 6 | 0, 1, 2, 3, 4, 6 | 1, 1, 2, 1, 3, 2 | 4 | a[4]=5 |\n\n`max(dp) = 4` ✓ (앞 원소를 거꾸로 따라가면 9 ← 5 ← 4 ← 3, 수열 `3 4 5 9`)\n\n## 7. 복잡도\n상태 N개 × 상태 하나를 채울 때 앞의 j를 전부 봄 O(N) = **O(N²)**, 메모리 O(N). 42장에서 처음으로 \"칸 하나의 비용\"이 O(1)이 아닌 경우예요. N = 1,000이면 이 채점기 기준 0.05초 안팎이에요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 답을 `dp[n-1]`로 읽음 | 가장 긴 수열이 중간에서 끝나면 작게 나옴 | 손 케이스 07 |\n| `a[j] <= a[i]` (같은 값 허용) | 같은 값이 많으면 크게 나옴 | 손 케이스 03 |\n| 상태를 \"0..i까지 최장\"으로 잡고 `dp[i] = dp[i-1] + (a[i] > a[i-1])` | 바로 옆만 봐서 틀림 | 손 케이스 01 |\n| `dp`를 0으로 초기화 | 전부 1 작게 나옴 | 손 케이스 01 |\n\n## 9. 면접에서 30초로 설명하기\n\"`dp[i]`를 a[i]에서 끝나는 가장 긴 증가 부분 수열의 길이로 둡니다. 끝나는 위치를 상태에 넣어야 마지막 값을 알고, 다음 원소를 붙일 수 있는지 판단할 수 있어서입니다. a[j] < a[i]인 앞쪽 j들 중 dp가 가장 큰 것에 1을 더하고, 답은 마지막 칸이 아니라 전체 최댓값입니다. 상태 N개에 칸마다 O(N)이라 O(N²)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **N이 100만이면?** O(N²)은 안 돼요. \"길이 L인 증가 수열의 가장 작은 끝값\"을 `tails`에 들고 가며 `bisect_left`로 자리를 찾으면 O(N log N)이에요. 바로 다음 문제 백준 12015예요.\n2. **실제 수열도 출력하라면?** `dp[i]`를 만든 j를 `prev[i]`에 적어 두고, `max(dp)`인 칸에서 거꾸로 따라가요. 6단계 표의 \"앞 원소\" 열이 그거예요(백준 14002).\n3. **LIS의 개수를 세라면?** `count[i]`를 하나 더 들고 가요. 더 긴 길이를 찾으면 덮어쓰고, 같은 길이면 더해요(LeetCode 673). 상태 칸을 늘리는 연습이에요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 15분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 300 Longest Increasing Subsequence, 백준 11055 「가장 큰 증가하는 부분 수열」(길이 대신 합), 백준 11722 「가장 긴 감소하는 부분 수열」, 백준 14002 (수열 출력).\n", "starter": "# 백준 11053 가장 긴 증가하는 부분 수열 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 42/boj11053\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "42/boj12015", "chapter": "42", "slug": "boj12015", "title": "백준 12015 가장 긴 증가하는 부분 수열 2", "kind": "stdio", "ext": ".py", "tier": "Gold II (solved.ac)", "role": "도전", "target": "45분", "url": "https://solved.ac/problems/id/12015", "time_limit": 1.5, "ref_time": 0.28278495802078396, "problem": "# 백준 12015 가장 긴 증가하는 부분 수열 2\n\n- 원문: https://solved.ac/problems/id/12015\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold II (solved.ac) · 역할: 도전 · 목표 시간: 45분\n- 짝이 되는 장: 42. 동적 계획법 (1차원) (+ 35장 이진 탐색)\n\n## 문제 (요약)\n백준 11053과 같은 질문이에요. 수열에서 순서를 지키며 골라 만든, 값이 **엄격하게** 커지는 부분 수열의 최대 길이를 출력하세요. 다른 점은 크기 하나예요. 수열이 **100만 개**까지 들어와요.\n\n## 제약\n- 1 ≤ N ≤ 1,000,000, 1 ≤ Aᵢ ≤ 1,000,000\n- 입력: 첫 줄 `N`, 둘째 줄 수열 / 출력: 길이 하나\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요. 11053을 먼저 풀고 오세요.\n2. `python algo/judge.py 42/boj12015` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: O(N²)에서 무엇을 낭비하나<\/summary>\n\n11053 풀이는 i마다 앞의 j를 **전부** 훑어서 \"a[j] < a[i]인 것 중 dp[j]가 가장 큰 것\"을 찾아요. 그런데 길이가 같은 두 수열이 있다면, 뒤에 무언가를 붙이기에 어느 쪽이 더 유리할까요? 끝값이 큰 쪽, 작은 쪽?\n<\/details>\n\n<details><summary>힌트 2: 상태를 뒤집기<\/summary>\n\n\"위치 → 길이\" 대신 \"길이 → 가장 작은 끝값\"을 들고 가요. `tails[L-1]` = 지금까지 본 원소로 만든 길이 L짜리 증가 수열의 끝값 중 최솟값. 이 배열은 **항상 오름차순**이에요. 그러니 새 원소 x가 들어갈 자리를 35장의 이진 탐색으로 찾을 수 있어요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- `bisect_left`예요. `bisect_right`를 쓰면 같은 값이 길이를 늘려서 `2 2 2`가 3이 돼요.\n- 자리가 끝이면 `append`, 아니면 그 자리를 **덮어써요**(끼워 넣기 `insert`가 아니에요).\n- 답은 `len(tails)`예요. `tails` 자체는 실제 LIS가 아닐 수 있어요.\n- 입력이 100만 개라 `sys.stdin.buffer.read().split()`으로 한 번에 읽어요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 12015 가장 긴 증가하는 부분 수열 2\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"엄격하게 증가하는 부분 수열의 최대 길이. 단 N이 100만.\" 확인 질문이에요.\n- 수열 자체도 출력해야 하나요? → **아니요, 길이만.** 이게 tails 방법을 가능하게 해요.\n- N = 10⁶이면 목표 복잡도는? → O(N log N)까지. O(N²) = 10¹²는 불가능해요(30장 경험칙).\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`3 1 4 1 5 9 2 6 5` → `1 4 5 9`, `1 2 5 6` 등 길이 4.\n경계: N = 1, 전부 같은 값(답 1, `bisect_right`를 쓰면 틀림), 감소 수열(답 1), 앞쪽 큰 수 몇 개 뒤에 작은 수가 길게 이어짐 `10 11 12 1 2 3 4`(답 4, 처음 셋이 만든 길이 3을 나중에 넘어서요).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n부분 수열을 다 만들면 O(2ᴺ·N). 1차 개선이 11053의 DP예요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n### 4-1. 재귀 → 메모 → 표: 여기까지가 11053\n| 레시피 | 11053 방식 |\n|---|---|\n| ① 상태 | `dp[i]` = a[i]에서 끝나는 가장 긴 증가 부분 수열의 길이 |\n| ② 점화식 | `dp[i] = 1 + max(dp[j] for j < i if a[j] < a[i])` (없으면 1) |\n| ③ 기저 사례 | 모든 `dp[i] = 1` |\n| ④ 순서와 답 | 왼쪽부터, 답은 `max(dp)` |\n\n```python\n# (가) 느린 재귀: f(i)가 f(j)를 전부 다시 불러요. 정렬된 입력에서 호출 2ᴺ − 1번\ndef f(i):\n    return 1 + max((f(j) for j in range(i) if a[j] < a[i]), default=0)\n\n# (나) 메모: @cache → 서로 다른 f(i)는 N개, 각각 O(N). O(N²)\n# (다) 표: 왼쪽부터 dp를 채움. 역시 O(N²)\ndp = [1] * n\nfor i in range(n):\n    for j in range(i):\n        if a[j] < a[i]:\n            dp[i] = max(dp[i], dp[j] + 1)\nprint(max(dp))\n```\n\n### 4-2. 중간 풀이가 왜 모자라나\n(다)는 맞는 풀이예요. 이 폴더의 `solution/brute.py`가 바로 그 코드고, 스트레스 테스트의 기준으로 써요. 그런데 42장에서 잰 값이 N = 5,000에 483ms예요. N이 200배면 시간은 4만 배라 **약 5시간**이에요. 메모·표로 바꾼 건 \"같은 질문을 두 번 안 하기\"였고, 이제 남은 병목은 **칸 하나를 채우는 비용 O(N)**이에요.\n\n### 4-3. 칸 하나의 비용을 줄이기: 상태를 뒤집어요\ndp[i]를 채울 때 정말 알아야 하는 건 \"a[i]보다 작은 값으로 끝나는 수열 중 가장 긴 길이\"예요. 여기서 관찰 하나.\n- **길이가 같은 두 수열이 있으면 끝값이 작은 쪽이 항상 유리해요.** 뒤에 붙일 수 있는 값이 더 많으니까요. 끝값이 큰 쪽은 버려도 돼요.\n\n그래서 길이별로 \"가장 작은 끝값\" 하나씩만 들고 가요. 위치가 아니라 **길이를 축**으로 잡은 1차원 DP예요.\n\n| 레시피 | tails 방식 |\n|---|---|\n| ① 상태 | `tails[L-1]` = 지금까지 본 원소로 만든 **길이 L** 증가 부분 수열들의 끝값 중 **최솟값** |\n| ② 점화식 | 새 원소 x마다: `tails[k] ≥ x`인 첫 k를 찾아 `tails[k] = x`로 바꿔요(x가 길이 k+1 수열의 더 작은 끝값이 돼요). 그런 k가 없으면 맨 뒤에 붙여요(가장 긴 수열이 1 늘어요) |\n| ③ 기저 사례 | 아무것도 안 봤을 때 `tails = []` |\n| ④ 순서와 답 | 원소를 왼쪽부터 한 번씩. 답은 **`len(tails)`** |\n\n왜 이진 탐색이 되나: `tails`는 항상 **엄격하게 오름차순**이에요. 길이 L+1 수열에서 마지막 원소를 떼면 길이 L 수열이 되고 그 끝값은 더 작으니, `tails[L-1] < tails[L]`이 유지돼요. 그래서 \"x 이상인 첫 자리\"를 35장의 `bisect_left`로 O(log N)에 찾아요.\n\n트리거 단어: \"가장 긴 증가하는 부분 수열\" + N ≥ 10⁵ → tails + 이진 탐색. \"칸 하나의 비용\"이 병목이면 상태(축)를 바꾸라는 신호예요(42b장 7단계 \"축 자체를 바꾸기\"와 같은 생각).\n\n## 5. 코드\n```python\nimport sys\nfrom bisect import bisect_left\n\ndata = sys.stdin.buffer.read().split()\nn = int(data[0])\ntails = []                               # 기저: 빈 배열\nfor x in map(int, data[1:1 + n]):\n    k = bisect_left(tails, x)            # x 이상인 첫 자리\n    if k == len(tails):\n        tails.append(x)                  # 가장 긴 수열이 1 늘어요\n    else:\n        tails[k] = x                     # 길이 k+1을 더 작은 끝값으로\nprint(len(tails))                        # 답\n```\n\n## 왜 이 코드가 정답인가\n\n- **불변식**: `tails[k]`는 길이 k+1인 증가 부분 수열의 끝값 중 가장 작은 값이고, `tails`는 늘 엄격히 오름차순이에요.\n- **빠뜨리지 않는 이유**: 끝값이 작을수록 뒤에 붙일 수 있는 수가 많으니 길이마다 가장 작은 끝값만 들고 가도 잃는 게 없어요. x는 `bisect_left` 자리 k에 들어가 `tails[k-1] < x` 뒤에 붙은 길이 k+1을 기록해요.\n- **끝나는 이유**: 원소마다 이분 탐색 한 번이라 O(N log N), N = 10⁶에서도 돼요.\n- **깨지는 가정**: 길이만 묻는다는 것이에요. `tails`는 실제 부분 수열이 아니라서 수열을 출력하려면 부모 인덱스를 따로 기록해야 해요. `bisect_right`로 바꾸면 같은 값이 길이를 늘려서 틀려요.\n\n## 6. 예제로 추적 (확인)\n`3 1 4 1 5 9 2 6 5`를 코드로 돌려 찍었어요.\n\n| x | k = bisect_left | 동작 | tails |\n|---|---|---|---|\n| 3 | 0 | 붙임 | [3] |\n| 1 | 0 | tails[0] = 1 | [1] |\n| 4 | 1 | 붙임 | [1, 4] |\n| 1 | 0 | tails[0] = 1 (같은 값, 길이 안 늘어요) | [1, 4] |\n| 5 | 2 | 붙임 | [1, 4, 5] |\n| 9 | 3 | 붙임 | [1, 4, 5, 9] |\n| 2 | 1 | tails[1] = 2 | [1, 2, 5, 9] |\n| 6 | 3 | tails[3] = 6 | [1, 2, 5, 6] |\n| 5 | 2 | tails[2] = 5 | [1, 2, 5, 6] |\n\n답 `len(tails) = 4` ✓. 마지막 `tails = [1, 2, 5, 6]`은 원래 수열에서 이 순서로 고를 수 없어요(6이 마지막 5보다 앞에 있어요). **길이만 맞고 수열 자체는 아니에요.**\n\n## 7. 복잡도\n원소 N개 × 이진 탐색 O(log N) = **O(N log N)**, 메모리 O(N)(`tails` 길이 ≤ LIS 길이). 이 채점기 기준 N = 100만에 0.4초 안팎이에요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `bisect_right` | 같은 값이 길이를 늘림 (`2 2 2 2 2 2` → 6) | 손 케이스 03 |\n| 덮어쓰기 대신 `tails.insert(k, x)` | 길이가 계속 늘어남 | 손 케이스 01 |\n| 11053의 O(N²) 그대로 | 정답이지만 느림 | 큰 입력 |\n| 이진 탐색을 직접 짜다 경계 실수 (`lo <= hi` / `mid ± 1`) | 무한 루프 또는 한 칸 어긋남 | 손 케이스 또는 스트레스 |\n\n## 9. 면접에서 30초로 설명하기\n\"기본은 `dp[i]` = i에서 끝나는 최장 길이로 O(N²)인데, N이 100만이라 칸 하나를 채우는 O(N)을 줄여야 합니다. 길이가 같다면 끝값이 작은 수열이 항상 유리하니, 길이별로 가장 작은 끝값만 `tails`에 들고 갑니다. `tails`는 항상 오름차순이라 새 원소가 들어갈 자리를 이진 탐색으로 찾아 덮어쓰거나 맨 뒤에 붙입니다. 답은 `tails`의 길이이고 O(N log N)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **실제 LIS 수열을 출력하라면?** `tails`엔 값 대신 인덱스를 넣고, 원소마다 \"내 앞 원소 인덱스\"(`prev[i] = tails_idx[k-1]`)를 적어 둬요. 끝에서 거꾸로 따라가면 돼요(백준 14003).\n2. **증가가 아니라 \"감소하지 않는\"(≤) 부분 수열이면?** 같은 값이 길이를 늘려야 하니 `bisect_right`로 바꿔요. 이번 문제의 오답이 그 문제의 정답이에요.\n3. **이게 왜 DP인가요? 그리디 같은데요.** 상태(길이별 최소 끝값)를 정의하고 원소마다 갱신하는 1차원 DP예요. \"같은 길이면 끝값이 작은 게 낫다\"는 관찰이 상태를 길이당 하나로 줄여 준 거예요. 인내심 정렬(patience sorting)이라는 이름으로도 불려요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 25분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 11053(같은 질문, 작은 N), 백준 12738 「가장 긴 증가하는 부분 수열 3」(음수 포함), 백준 14003 「가장 긴 증가하는 부분 수열 5」(수열 출력), LeetCode 300, LeetCode 354 Russian Doll Envelopes.\n", "starter": "# 백준 12015 가장 긴 증가하는 부분 수열 2 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 42/boj12015\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "42/boj9095", "chapter": "42", "slug": "boj9095", "title": "백준 9095 1, 2, 3 더하기", "kind": "stdio", "ext": ".py", "tier": "Silver III (solved.ac)", "role": "워밍업", "target": "15분", "url": "https://solved.ac/problems/id/9095", "time_limit": 1.0, "ref_time": 0.00018833301146514714, "problem": "# 백준 9095 1, 2, 3 더하기\n\n- 원문: https://solved.ac/problems/id/9095\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Silver III (solved.ac) · 역할: 워밍업 · 목표 시간: 15분\n- 짝이 되는 장: 42. 동적 계획법 (1차원)\n\n## 문제 (요약)\n정수 n이 주어져요. 1, 2, 3만 써서 더해 n을 만드는 방법이 몇 가지인지 세요. **더하는 순서가 다르면 다른 방법**이에요. 예를 들어 3은 `1+1+1`, `1+2`, `2+1`, `3`으로 네 가지예요.\n\n## 제약\n- 테스트 케이스가 여러 개예요. 각 n은 1 이상 11 미만이에요.\n- 입력: 첫 줄 `T`, 다음 T줄에 n 하나씩 / 출력: 케이스마다 방법의 수 한 줄\n- 이 채점기는 T를 1,000까지 넣어요(원문에는 T 범위가 적혀 있지 않아요).\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 42/boj9095` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 마지막에 더한 수<\/summary>\n\nn을 만드는 식을 아무거나 하나 떠올려 보세요. 그 식의 **맨 마지막 항**은 1, 2, 3 중 하나예요. 마지막 항이 1이었다면, 그 앞부분은 무엇을 만드는 식일까요?\n<\/details>\n\n<details><summary>힌트 2: 상태와 점화식<\/summary>\n\n`dp[i]` = 1, 2, 3을 더해 i를 만드는 방법의 수. 마지막 항으로 경우를 나누면 겹치지도 빠지지도 않아요. 42장 1단계 계단 오르기에서 \"마지막 한 걸음\"을 물었던 것과 똑같아요. 이번엔 걸음이 세 종류일 뿐이에요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 기저를 `dp[1]=1, dp[2]=2, dp[3]=4`로 직접 적거나, `dp[0]=1`(아무것도 안 더하는 방법 하나)로 두고 i−k ≥ 0인 항만 더해요.\n- `dp[3]`을 3으로 적는 실수가 많아요. `3` 하나짜리 식도 세야 해요.\n- n이 최대 10이니 표를 한 번만 10칸까지 채우고, 케이스마다 꺼내 쓰면 돼요.\n- 출력은 케이스마다 한 줄이에요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 9095 1, 2, 3 더하기\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"1, 2, 3을 순서 있게 더해서 n을 만드는 방법의 수.\" 확인 질문은 둘이에요.\n- `1+2`와 `2+1`은 다른 방법인가요? → **네, 다른 방법이에요** (이게 점화식 모양을 정해요)\n- n의 범위는? → 1 이상 10 이하. 아주 작아요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\nn = 4를 손으로 적어 봐요. `1+1+1+1`, `1+1+2`, `1+2+1`, `2+1+1`, `2+2`, `1+3`, `3+1` → 7가지.\n경계: n = 1(1가지), n = 2(`1+1`, `2` → 2가지), n = 3(4가지, `3` 하나짜리를 빼먹기 쉬워요), n = 10(274가지, 가장 큰 값).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n1, 2, 3으로 된 수열을 길이 1부터 n까지 전부 만들어서 합이 n인 것을 세요. 수열 개수가 3 + 3² + … + 3ⁿ ≈ 3ⁿ이라 **O(3ⁿ)**이에요. n = 10이면 약 9만 개라 이 문제는 통과해요. 하지만 n이 30만 돼도 2천억 개라 끝나지 않아요.\n**면접 팁**: 제약이 작아서 브루트포스가 통과해도, \"n이 커지면 어떻게 되나\"를 먼저 말하면 점수가 올라가요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n브루트포스는 `1+2+…`로 시작하는 식과 `2+1+…`로 시작하는 식의 **뒷부분을 따로따로** 다시 만들어요. 둘 다 \"남은 n−3을 만드는 방법\"인데요. 같은 질문을 여러 번 하고 있어요 → 42장의 **중복되는 부분 문제**예요.\n\n42장 4단계 레시피로 적어요.\n\n| 레시피 | 이 문제에서 |\n|---|---|\n| ① 상태 | `dp[i]` = 1, 2, 3을 순서 있게 더해 **정확히 i**를 만드는 방법의 수 |\n| ② 점화식 | 마지막 항이 1, 2, 3 중 하나 → `dp[i] = dp[i-1] + dp[i-2] + dp[i-3]` |\n| ③ 기저 사례 | `dp[0] = 1` (아무것도 안 더하는 방법 하나), 음수 인덱스는 0으로 봐요. 직접 적으면 `dp[1]=1, dp[2]=2, dp[3]=4` |\n| ④ 순서와 답 | i를 작은 쪽부터 채워요. 답은 `dp[n]` |\n\n마지막 항으로 나누면 세 경우가 **겹치지 않고**(마지막 항이 둘일 수 없으니까) **빠짐없이**(마지막 항은 꼭 셋 중 하나니까) 나뉘어요. 그래서 그냥 더하면 돼요.\n\n**재귀 → 메모 → 표**로 옮겨 가는 과정이에요. 세 코드는 같은 점화식을 쓰고, 계산 순서만 달라요.\n\n```python\n# (가) 느린 재귀: 점화식을 그대로 옮겼어요. f(10)에서 호출 979번, f(30)이면 1억 9천만 번\ndef f(n):\n    if n < 0:\n        return 0\n    if n == 0:\n        return 1\n    return f(n - 1) + f(n - 2) + f(n - 3)\n\n# (나) 메모: 줄 하나(@cache)로 같은 질문을 두 번 안 해요. 서로 다른 호출은 n + 1개\nfrom functools import cache\n\n@cache\ndef f(n):\n    if n < 0:\n        return 0\n    if n == 0:\n        return 1\n    return f(n - 1) + f(n - 2) + f(n - 3)\n\n# (다) 표: 재귀를 지우고 작은 칸부터 채워요 (42장 3단계)\ndp = [0] * 11\ndp[0] = 1\nfor i in range(1, 11):\n    dp[i] = sum(dp[i - k] for k in (1, 2, 3) if i - k >= 0)\n```\n\n트리거 단어: \"방법의 수\", \"1, 2, 3을 더해\", \"순서가 다르면 다른 것\" → 마지막 한 걸음으로 나누는 1차원 DP (42장 템플릿 B).\n\n## 5. 코드\n```python\nimport sys\n\ndata = sys.stdin.read().split()\nt = int(data[0])\ndp = [0] * 11\ndp[0] = 1                                  # 기저: 아무것도 안 더하는 방법\nfor i in range(1, 11):\n    dp[i] = sum(dp[i - k] for k in (1, 2, 3) if i - k >= 0)\nprint('\\n'.join(str(dp[int(x)]) for x in data[1:1 + t]))\n```\nn이 10 이하라서 표를 **한 번만** 끝까지 채우고 케이스마다 꺼내 써요. 케이스마다 다시 채워도 통과하지만, 이렇게 하면 T가 아무리 커도 O(T)예요.\n\n## 왜 이 코드가 정답인가\n\n- **불변식**: `dp[i]`는 1, 2, 3을 순서 있게 더해 i를 만드는 방법의 수예요. `dp[0] = 1`은 \"아무것도 안 더함\" 한 가지예요.\n- **빠뜨리지 않는 이유**: 모든 방법은 마지막에 더한 수 k(1, 2, 3)로 겹치지 않게 나뉘고, 그 앞은 i−k를 만드는 방법이에요. 그래서 세 항의 합이 빠짐도 중복도 없어요.\n- **끝나는 이유**: n ≤ 10이라 표를 한 번 채우고 케이스마다 꺼내요. O(T).\n- **깨지는 가정**: `1+2`와 `2+1`을 다르게 센다는 것이에요. 같은 방법으로 세라고 하면 이 점화식은 중복을 세서, 동전을 바깥 루프에 둔 조합 DP(9084번)가 필요해요.\n\n## 6. 예제로 추적 (확인)\n실제로 코드를 돌려 찍은 표예요.\n\n| i | dp[i-1] | dp[i-2] | dp[i-3] | dp[i] |\n|---|---|---|---|---|\n| 0 | — | — | — | 1 (기저) |\n| 1 | 1 | — | — | 1 |\n| 2 | 1 | 1 | — | 2 |\n| 3 | 2 | 1 | 1 | 4 |\n| 4 | 4 | 2 | 1 | 7 |\n| 5 | 7 | 4 | 2 | 13 |\n| 6 | 13 | 7 | 4 | 24 |\n| 7 | 24 | 13 | 7 | 44 |\n| 8 | 44 | 24 | 13 | 81 |\n| 9 | 81 | 44 | 24 | 149 |\n| 10 | 149 | 81 | 44 | 274 |\n\nn = 4 → 7. 2단계에서 손으로 센 7가지와 같아요 ✓\n\n## 7. 복잡도\n표를 채우는 데 칸 11개 × 항 3개 = O(1)(n의 상한이 10이니까). 일반적으로는 상태 n개 × 칸당 O(1) = **O(n)**, 메모리 O(n)이에요. 바로 앞 세 칸만 읽으니 변수 세 개로 굴리면 O(1) 공간(42장 템플릿 C)이에요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 기저를 `dp[3] = 3`으로 적음 (`3` 하나짜리 식을 빼먹음) | n ≥ 3에서 전부 작게 나옴 | 손 케이스 01 (02의 n = 3에서도 걸려요) |\n| 순서를 무시하고 조합으로 셈 (1, 2, 3 루프를 바깥에 둠, 42b장 4단계) | n = 4에서 7 대신 4 | 손 케이스 01 |\n| `dp[0] = 0`으로 두고 점화식만 돌림 | 전부 0 | 손 케이스 01 |\n| 첫 줄 T를 n으로 읽음 | 출력 줄 수가 틀림 | 손 케이스 01 |\n\n## 9. 면접에서 30초로 설명하기\n\"n을 만드는 식의 마지막 항은 1, 2, 3 중 하나입니다. 마지막이 1이면 앞부분은 n−1을 만드는 식이고, 2나 3도 마찬가지입니다. 그래서 `dp[i] = dp[i-1] + dp[i-2] + dp[i-3]`이고, 기저는 아무것도 안 더하는 `dp[0] = 1`입니다. 작은 i부터 채우면 O(n)이고, 단순 재귀로 쓰면 같은 부분 문제를 반복해서 O(3ⁿ)이 됩니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **순서가 다르면 같은 방법으로 친다면?** 조합을 세는 문제가 돼요. `1+2`와 `2+1`을 한 번만 세려면 수를 쓰는 순서를 \"1들 → 2들 → 3들\"로 고정해야 해요. 수 루프를 바깥, 금액 루프를 안쪽에 두면 돼요(42b장 4단계, 백준 15989 「1, 2, 3 더하기 4」).\n2. **n이 10⁶이고 답을 1,000,000,009로 나눈 나머지로 내라면?** 같은 점화식에 매 칸 `% MOD`를 붙여요. 표가 10⁶칸이라 재귀(메모)는 깊이 한도에 걸리고, 보텀업이 맞아요(백준 15988 「1, 2, 3 더하기 3」).\n3. **같은 수를 연속해서 쓰면 안 된다면?** 다음 항을 고르려면 **마지막에 쓴 수**를 알아야 해요. 상태에 칸을 하나 더 둬서 `dp[i][last]`로 가요(백준 15990 「1, 2, 3 더하기 5」). 42장 면접 질문 3번의 \"상태 하나로 부족한 경우\"예요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 2748 「피보나치 수 2」, LeetCode 70 Climbing Stairs, 백준 15988·15989·15990 (1, 2, 3 더하기 시리즈).\n", "starter": "# 백준 9095 1, 2, 3 더하기 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 42/boj9095\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "42/lc0213", "chapter": "42", "slug": "lc0213", "title": "LeetCode 213 House Robber II", "kind": "func", "ext": ".py", "tier": "Medium (LeetCode)", "role": "핵심", "target": "25분", "url": "https://leetcode.com/problems/house-robber-ii/", "time_limit": 1.0, "ref_time": 1.8875027308240533e-05, "problem": "# LeetCode 213 House Robber II\n\n- 원문: https://leetcode.com/problems/house-robber-ii/\n- 난이도: Medium (LeetCode) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 42. 동적 계획법 (1차원)\n\n## 문제 (요약)\n집들이 **원 모양으로** 둘러 있고, 집마다 돈이 있어요. 바로 옆 두 집을 같은 밤에 털면 경보가 울려요. 원이라서 첫 집과 마지막 집도 서로 옆집이에요. 경보 없이 털 수 있는 돈의 최댓값을 돌려주세요.\n\n## 제약\n- 1 ≤ 집 수 ≤ 100, 0 ≤ 집마다 돈 ≤ 1,000\n\n## 함수\n```python\ndef rob(nums: list[int]) -> int:\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`의 함수를 채워요. 타이머를 켜세요.\n2. `python algo/judge.py 42/lc0213` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고, `../../log.md`에 기록해요. 프로그래머스 「도둑질」도 같은 구조예요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 원이 없다면<\/summary>\n\n집이 일렬이라면(첫 집과 마지막 집이 이웃이 아니라면) 풀 수 있나요? 그 문제부터 풀어 두세요. 원형이 일렬과 다른 점은 **딱 한 쌍**(첫 집, 마지막 집)뿐이에요.\n<\/details>\n\n<details><summary>힌트 2: 경우를 둘로 쪼개기<\/summary>\n\n최적해는 첫 집과 마지막 집을 **동시에** 털 수 없어요. 그러니 \"첫 집을 안 턴다\" 또는 \"마지막 집을 안 턴다\" 중 적어도 하나에 들어가요. 각각은 일렬 문제예요. 둘 중 큰 값이 답이에요. 일렬 문제의 상태는 42장 4단계의 `dp[i]` = 집 0..i만 봤을 때의 최대 금액이에요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 집이 **한 채**면 `nums[1:]`과 `nums[:-1]`이 둘 다 빈 리스트라 0이 나와요. 따로 처리하세요.\n- 쪼갠 두 범위는 `nums[1:]`과 `nums[:-1]`이에요. 한쪽을 `nums[1:-1]`로 쓰면 첫 집과 끝 집을 둘 다 버려서 손해예요.\n- 일렬 부분은 변수 두 개로 굴리면 돼요(42장 템플릿 C).\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 213 House Robber II\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"원형으로 놓인 수들에서 이웃하지 않게 골라 합을 최대로.\" 확인 질문이에요.\n- 첫 집과 마지막 집이 이웃인가요? → **네.** 이게 198번(일렬)과 유일한 차이예요.\n- 집이 한 채면? → 그 집을 털어요. 자기 자신과는 이웃이 아니에요.\n- 돈이 음수일 수 있나요? → 아니요, 0 이상이에요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`[2, 7, 9, 3, 1]` → 일렬이라면 2 + 9 + 1 = 12. 그런데 원형에서는 집 0과 집 4가 이웃이라 안 돼요. 2 + 9 = 11이 최대예요.\n경계: 집 1채(답 = 그 값), 2채(둘 중 큰 값), 3채(셋 중 하나만 털 수 있음), `[6, 1, 1, 6]`(일렬이면 12지만 원형이면 7).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n집마다 털기/안 털기로 2ⁿ가지를 다 보고, 원형으로 이웃한 쌍이 없는 것 중 최대를 골라요. **O(2ⁿ·n)**. n = 100이면 2¹⁰⁰이라 불가능해요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n일렬 문제(198)에서는 \"집 0..i까지 최대\"라는 상태 하나로 충분했어요. 그런데 원형이면 마지막 집을 털 수 있는지가 **첫 집을 털었는지**에 달려 있어요. 상태에 그 정보가 없으니 점화식이 안 나와요.\n\n방법은 둘이에요. 상태에 \"첫 집을 털었나\"를 넣거나(축을 하나 늘리기, 42b장으로 가는 길), **경우를 쪼개서 아는 문제로 바꾸기**예요. 여기선 쪼개는 쪽이 간단해요(42장 4단계 \"변형: 집이 원형으로 둘러 있으면?\").\n- 최적해는 집 0과 집 n−1을 동시에 털지 못해요.\n- 그러니 \"집 n−1을 안 턴다\"(→ `nums[:-1]` 일렬) 또는 \"집 0을 안 턴다\"(→ `nums[1:]` 일렬) 중 적어도 하나에 속해요.\n- 두 일렬 문제의 답 중 큰 값이 원형의 답이에요. 두 경우가 겹칠 수는 있지만 `max`라서 괜찮아요(개수를 세는 문제였다면 겹침이 문제가 돼요).\n\n일렬 부분은 42장 4단계 레시피 그대로예요.\n\n| 레시피 | 일렬 문제 `rob_line(h)`에서 |\n|---|---|\n| ① 상태 | `dp[i]` = 집 **0..i만** 봤을 때(집 i를 털든 안 털든) 훔칠 수 있는 최대 금액 |\n| ② 점화식 | 집 i를 털었나? 안 털면 `dp[i-1]`, 털면 `dp[i-2] + h[i]` → `dp[i] = max(dp[i-1], dp[i-2] + h[i])` |\n| ③ 기저 사례 | `dp[-1] = dp[-2] = 0` (집이 없으면 0). 코드에선 `prev2 = prev1 = 0` |\n| ④ 순서와 답 | 왼쪽부터. 답은 마지막 칸 `dp[len-1]`. 원형 전체의 답은 `max(rob_line(nums[:-1]), rob_line(nums[1:]))`, 집 1채는 따로 |\n\n**재귀 → 메모 → 표** 과정이에요(일렬 부분).\n\n```python\n# (가) 느린 재귀: f(i) = 집 0..i의 최대. f(i-1)과 f(i-2)를 둘 다 불러서 O(1.6ⁿ)\ndef f(i):\n    if i < 0:\n        return 0\n    return max(f(i - 1), f(i - 2) + h[i])\n\n# (나) 메모: @cache 한 줄로 서로 다른 f(i)는 n개 → O(n). n ≤ 100이라 깊이도 괜찮아요\nfrom functools import cache\nf = cache(f)            # 단, h가 바뀌는 두 번의 호출마다 캐시를 새로 만들어야 해요\n\n# (다) 표 → 변수 두 개: 바로 앞 두 칸만 읽으니 O(1) 공간 (42장 템플릿 C)\nprev2 = prev1 = 0\nfor x in h:\n    prev2, prev1 = prev1, max(prev1, prev2 + x)\n```\n\n트리거 단어: \"원형\", \"첫 번째와 마지막이 붙어 있음\" → 그 연결을 끊는 경우 나누기 + 이미 아는 일렬 DP.\n\n## 5. 코드\n```python\ndef rob_line(houses):\n    prev2 = prev1 = 0                       # 기저: 집이 없으면 0\n    for x in houses:\n        prev2, prev1 = prev1, max(prev1, prev2 + x)\n    return prev1                            # 답: 마지막 칸\n\n\ndef rob(nums):\n    if len(nums) == 1:\n        return nums[0]\n    return max(rob_line(nums[:-1]), rob_line(nums[1:]))\n```\n\n## 왜 이 코드가 정답인가\n\n- **불변식**: `rob_line` 루프에서 `prev1`은 지금까지 본 집들로 낼 수 있는 최대, `prev2`는 한 집 전까지의 최대예요.\n- **빠뜨리지 않는 이유**: 집 x를 안 털면 `prev1`, 털면 바로 앞 집을 못 터니 `prev2 + x`라 둘의 max가 모든 경우예요. 원형에서는 첫 집과 마지막 집을 동시에 못 터니 최적해는 `nums[:-1]`이나 `nums[1:]` 중 하나에 꼭 들어가요.\n- **끝나는 이유**: 일렬 DP 두 번이라 O(n)이에요.\n- **깨지는 가정**: 집이 2채 이상이라는 것이에요. 1채면 두 슬라이스가 모두 비어 0이 나오니 `len(nums) == 1`을 따로 처리해요.\n\n## 6. 예제로 추적 (확인)\n`[2, 7, 9, 3, 1]`을 코드로 돌려 찍었어요. 각 줄은 `x`를 처리한 **뒤**의 값이에요.\n\n`rob_line([2, 7, 9, 3])` (마지막 집 제외)\n\n| x | prev2 (dp[i-1]) | prev1 (dp[i]) |\n|---|---|---|\n| 2 | 0 | 2 |\n| 7 | 2 | 7 |\n| 9 | 7 | 11 |\n| 3 | 11 | 11 |\n\n`rob_line([7, 9, 3, 1])` (첫 집 제외)\n\n| x | prev2 (dp[i-1]) | prev1 (dp[i]) |\n|---|---|---|\n| 7 | 0 | 7 |\n| 9 | 7 | 9 |\n| 3 | 9 | 10 |\n| 1 | 10 | 10 |\n\n`max(11, 10) = 11` ✓ (집 0과 집 2, 2 + 9)\n\n## 7. 복잡도\n일렬 문제 두 번 = **O(n)**, 변수 굴리기라 추가 메모리 O(1)(슬라이스 복사 O(n)은 인덱스 범위로 넘기면 없앨 수 있어요).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 집 1채를 따로 처리 안 함 | 0이 나옴 | 손 케이스 \"집 한 채\" |\n| 원형을 무시하고 일렬로 풂 | 첫 집과 끝 집을 같이 털어서 크게 나옴 | 손 케이스 \"세 채\" |\n| 한쪽을 `nums[1:-1]`로 자름 | 양 끝 중 하나를 털어야 최적일 때 작게 나옴 | 손 케이스 \"집 두 채\" (`[3, 8]`에서 3) |\n| 짝수 칸 합과 홀수 칸 합 중 큰 것 | 두 칸 이상 건너뛰어야 하는 경우를 놓침 | 손 케이스 \"마지막 집이 아주 큼\" (`3 + 100`은 두 칸 건너뜀) |\n\n## 9. 면접에서 30초로 설명하기\n\"원형이라 첫 집과 마지막 집이 이웃입니다. 최적해는 둘을 동시에 털 수 없으니 첫 집을 빼거나 마지막 집을 빼는 두 경우 중 하나에 속하고, 각각은 일렬 House Robber입니다. 일렬은 `dp[i] = max(dp[i-1], dp[i-2] + nums[i])`이고 앞 두 칸만 읽으니 변수 두 개로 됩니다. 두 결과 중 큰 값이 답이고 O(n), O(1)입니다. 집이 하나면 두 범위가 다 비니 따로 처리합니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **쪼개지 않고 한 번에 풀 수는 없나요?** 상태에 \"첫 집을 털었나\"(0/1)를 붙여 `dp[i][first]`로 두면 한 번에 돼요. 같은 i에서 상태가 두 갈래로 나뉘는, 42b장의 \"작은 상수 축\"이에요. 쪼개는 쪽이 코드가 짧아서 면접에선 보통 쪼개요.\n2. **어느 집을 털었는지도 돌려주라면?** 변수 굴리기 대신 표를 남기고, 끝에서 `dp[i] != dp[i-1]`이면 집 i를 털었다고 보고 i −= 2, 아니면 i −= 1로 되짚어요(42장 4단계 \"어느 집을 털었는지 되짚기\").\n3. **집이 트리 모양이면?** 부모와 자식이 이웃이에요. 노드마다 (턴 경우, 안 턴 경우) 두 값을 후위 순회로 돌려줘요(LeetCode 337).\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 15분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 198 House Robber, 프로그래머스 「도둑질」(같은 구조, 집 3채 이상 보장), 백준 2579 「계단 오르기」(42장 끝까지 따라가기 ②), LeetCode 337 House Robber III.\n", "starter": "# LeetCode 213 — 함수 몸통을 채우세요.  채점: python algo/judge.py 42/lc0213\n\n\ndef rob(nums: list[int]) -> int:\n    pass\n"}, {"id": "42/lc0322", "chapter": "42", "slug": "lc0322", "title": "LeetCode 322 Coin Change", "kind": "func", "ext": ".py", "tier": "Medium (LeetCode)", "role": "핵심", "target": "25분", "url": "https://leetcode.com/problems/coin-change/", "time_limit": 1.0, "ref_time": 0.006817791989305988, "problem": "# LeetCode 322 Coin Change\n\n- 원문: https://leetcode.com/problems/coin-change/\n- 난이도: Medium (LeetCode) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 42. 동적 계획법 (1차원)\n\n## 문제 (요약)\n동전 종류들과 목표 금액이 주어져요. 각 동전은 **몇 개든** 쓸 수 있어요. 금액을 **정확히** 만드는 데 필요한 동전의 최소 개수를 돌려주세요. 어떻게 해도 못 만들면 -1을 돌려줘요.\n\n## 제약\n- 1 ≤ 동전 종류 ≤ 12, 1 ≤ 동전 값 ≤ 2³¹ − 1 (값이 서로 달라요)\n- 0 ≤ amount ≤ 10,000\n\n## 함수\n```python\ndef coin_change(coins: list[int], amount: int) -> int:\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`의 함수를 채워요. 타이머를 켜세요.\n2. `python algo/judge.py 42/lc0322` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 큰 동전부터 쓰면 될까<\/summary>\n\n동전이 1, 3, 4원이고 6원을 만들어야 해요. 큰 것부터 쓰면 몇 개인가요? 손으로 찾은 최적은 몇 개인가요? 둘이 다르다면, 한 번 고른 동전을 되돌아보지 않는 방법으로는 안 돼요.\n<\/details>\n\n<details><summary>힌트 2: 축은 \"금액\"<\/summary>\n\n`dp[x]` = 금액 x를 정확히 만드는 최소 동전 수. 마지막에 넣은 동전이 c였다면 그 전에는 x − c를 만들었어요. 마지막 동전 후보를 전부 시도해서 최솟값을 남겨요. 42장 5단계, 템플릿 D예요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 기저는 `dp[0] = 0`, 나머지는 \"불가능\"을 뜻하는 센티널(INF 또는 amount + 1)로 채워요.\n- `c <= x` 검사를 먼저 해요. 파이썬은 음수 인덱스가 에러 없이 **뒤에서부터** 읽어서 조용히 틀리거나, 동전이 아주 크면 IndexError가 나요.\n- 마지막에 센티널이면 -1로 바꿔요. `inf`를 그대로 돌려주면 안 돼요.\n- amount = 0이면 답은 0이에요(-1이 아니에요).\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 322 Coin Change\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"동전을 무한히 써서 금액을 **정확히** 만들 때 최소 개수, 못 만들면 -1.\" 확인 질문이에요.\n- 동전 개수 제한이 있나요? → **없어요.** 같은 동전을 몇 번이든 써요.\n- 동전 단위에 규칙이 있나요(각 동전이 앞 동전의 배수 같은)? → **없어요.** 이게 그리디를 막아요.\n- amount = 0이면? → 동전 0개, 답 0.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`[1, 3, 4]`, 6원 → 그리디는 4 + 1 + 1로 3개, 최적은 3 + 3으로 **2개**. 그리디가 틀린다는 걸 여기서 직접 확인해요.\n경계: amount = 0(답 0), 못 만듦 `[2]`, 3원(답 -1), 모든 동전이 금액보다 큼, 엄청 큰 동전(2³¹ − 1)이 섞임.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n\"x원을 만드는 최소 개수\"를 마지막 동전을 하나씩 빼 보며 재귀로 구해요. 동전 종류가 k개면 호출이 매 단계 k갈래로 갈라져서 **O(k^amount)** 꼴이에요. `[1, 3, 4]`로 직접 세 보면 금액 25에서 호출 42만 번이고, 금액이 5 늘 때마다 약 11배씩 늘어요. amount = 10,000이면 절대 안 끝나요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n재귀 호출 트리를 보면 `f(6)`이 `f(5)`, `f(3)`, `f(2)`를 부르고, `f(5)`가 또 `f(2)`를 불러요. 금액은 0~amount 중 하나뿐이니, 서로 다른 질문은 **amount + 1개**밖에 없어요. 나머지는 전부 같은 질문의 반복이에요 → 중복 부분 문제.\n\n상태의 축이 \"몇 번째 원소\"가 아니라 **금액**이라는 게 42장 5단계의 포인트예요.\n\n| 레시피 | 이 문제에서 |\n|---|---|\n| ① 상태 | `dp[x]` = 금액 **x를 정확히** 만드는 최소 동전 개수 (불가능하면 INF) |\n| ② 점화식 | 마지막에 넣은 동전이 c → `dp[x] = min(dp[x - c] + 1)` (c ≤ x인 모든 동전 c에 대해) |\n| ③ 기저 사례 | `dp[0] = 0`, 나머지는 INF로 시작 |\n| ④ 순서와 답 | x를 1부터 올라가며 채워요(x − c < x만 읽으니까). 답은 `dp[amount]`, INF면 -1 |\n\n선택지가 동전 종류만큼이라 `min`의 항이 반복문이 됐어요. 그리고 \"불가능\"이 있어서 센티널이 필요해요(템플릿 D).\n\n**재귀 → 메모 → 표** 과정이에요.\n\n```python\n# (가) 느린 재귀: 점화식을 그대로. 금액 25에서 호출 42만 번\ndef f(x):\n    if x == 0:\n        return 0\n    best = INF\n    for c in coins:\n        if c <= x:\n            best = min(best, f(x - c) + 1)\n    return best\n\n# (나) 메모: @cache 한 줄. 서로 다른 f(x)는 amount + 1개, 각각 O(k)\n#     단, [1]로 10,000원이면 f(10000) → f(9999) → … 깊이 10,000으로 RecursionError\nfrom functools import cache\nf = cache(f)\n\n# (다) 표: 0원부터 올라가며 채우면 재귀가 필요 없어요\ndp = [0] + [INF] * amount\nfor x in range(1, amount + 1):\n    for c in coins:\n        if c <= x:\n            dp[x] = min(dp[x], dp[x - c] + 1)\n```\n\n트리거 단어: \"최소 개수\", \"몇 개든 써도 됨\", \"만들 수 없으면 -1\", 동전 단위가 임의 → 금액을 축으로 하는 1차원 DP. 그리디 금지.\n\n## 5. 코드\n```python\ndef coin_change(coins, amount):\n    INF = amount + 1                 # 동전을 amount개보다 많이 쓸 일은 없어요\n    dp = [0] + [INF] * amount        # 기저: 0원은 0개\n    for x in range(1, amount + 1):\n        for c in coins:\n            if c <= x and dp[x - c] + 1 < dp[x]:   # 범위 검사를 먼저\n                dp[x] = dp[x - c] + 1\n    return dp[amount] if dp[amount] < INF else -1\n```\nINF를 `float('inf')` 대신 `amount + 1`로 둔 건 정수만 다루려고예요. 1원짜리만 써도 amount개면 되니, 그보다 큰 값은 \"불가능\"이라는 뜻으로 충분해요.\n\n## 왜 이 코드가 정답인가\n\n- **불변식**: `dp[x]`는 x원을 정확히 만드는 최소 동전 수이고, 못 만들면 `INF`(= amount + 1)예요.\n- **빠뜨리지 않는 이유**: x원의 최적해에서 동전 하나 c를 빼면 x−c원의 최적해가 남아요(최적 부분 구조). `coins`를 전부 보니 마지막 동전이 무엇이든 덮어요.\n- **끝나는 이유**: x를 1부터 올리며 채워서 `dp[x - c]`는 이미 확정이고, O(amount × len(coins))예요.\n- **깨지는 가정**: 동전 단위에 배수 규칙이 없다는 것이에요. 그래서 그리디는 `coins = [1, 3, 4]`, `amount = 6`에서 4+1+1(3개)로 틀리고, DP는 3+3(2개)을 찾아요.\n\n## 6. 예제로 추적 (확인)\n`[1, 3, 4]`, 6원을 코드로 돌려 찍었어요. 괄호는 (마지막 동전, 그때 개수)예요.\n\n| x | 후보 dp[x−c] + 1 | dp[x] |\n|---|---|---|\n| 0 | — | 0 (기저) |\n| 1 | (1원, 1) | 1 |\n| 2 | (1원, 2) | 2 |\n| 3 | (1원, 3), (3원, 1) | 1 |\n| 4 | (1원, 2), (3원, 2), (4원, 1) | 1 |\n| 5 | (1원, 2), (3원, 3), (4원, 2) | 2 |\n| 6 | (1원, 3), **(3원, 2)**, (4원, 3) | **2** |\n\n답 2 ✓ 그리디가 고르는 4원 경로는 3개라서 `min`에서 밀려요.\n\n## 7. 복잡도\n상태 amount + 1개 × 칸마다 동전 k개 = **O(amount × k)**, 메모리 O(amount). 최대 10,000 × 12 = 12만 번이라 빨라요. 상태 개수가 입력 **숫자의 크기**(amount)에 비례한다는 점을 기억하세요. amount가 10⁹면 이 방법은 못 써요(42장 면접 질문 5번).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 큰 동전부터 쓰는 그리디 | 2 대신 3 | 손 케이스 \"그리디 반례\" |\n| 센티널을 -1로 바꾸지 않음 | `inf`나 `amount + 1`을 돌려줌 | 손 케이스 \"만들 수 없음\" |\n| `c <= x` 검사 없이 `dp[x - c]` | 동전이 금액보다 크면 IndexError (음수 인덱스가 리스트 밖으로 나감) | 손 케이스 \"모든 동전이 금액보다 큼\" |\n| amount = 0에서 -1을 돌려줌 | 0 대신 -1 | 손 케이스 \"금액 0\" |\n| 메모 재귀 (`@cache`) | 재귀 깊이가 수천이라 RecursionError | 손 케이스 \"큰 금액\" |\n\n## 9. 면접에서 30초로 설명하기\n\"동전 단위가 임의라 큰 것부터 쓰는 그리디는 틀립니다. 1, 3, 4원으로 6원이면 그리디는 3개, 최적은 2개입니다. 그래서 `dp[x]`를 x원을 만드는 최소 동전 수로 두고, 마지막에 넣은 동전 c를 모든 경우로 시도해 `dp[x - c] + 1`의 최솟값을 고릅니다. 기저는 `dp[0] = 0`이고 불가능은 센티널로 표시했다가 끝에서 -1로 바꿉니다. 시간은 금액 × 동전 종류입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **최소 개수가 아니라 만드는 방법의 수를 세라면?** `min` 대신 `+`, 기저는 `dp[0] = 1`. 그런데 `1+2`와 `2+1`을 같게 보려면 **동전 루프를 바깥**에 둬야 해요. 루프 순서가 세는 대상을 바꿔요(42b장 4단계, LeetCode 518, 백준 9084).\n2. **BFS로도 풀 수 있나요?** 네. 0원에서 출발해 동전 하나를 더하는 게 간선(가중치 1)인 그래프에서 amount까지의 최단 거리예요. 42장 5단계에서 「1로 만들기」를 BFS로 본 것과 같아요. 답이 작으면 BFS가 일찍 끝나서 유리할 때도 있어요.\n3. **실제로 쓴 동전 목록을 돌려주라면?** `dp[x]`를 갱신할 때 쓴 동전을 `last[x] = c`로 적어 두고, amount에서 `x -= last[x]`로 거꾸로 따라가요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 15분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 1463 「1로 만들기」(42장 끝까지 따라가기 ①), 백준 2294 「동전 2」(같은 문제의 백준판), LeetCode 279 Perfect Squares.\n", "starter": "# LeetCode 322 — 함수 몸통을 채우세요.  채점: python algo/judge.py 42/lc0322\n\n\ndef coin_change(coins: list[int], amount: int) -> int:\n    pass\n"}, {"id": "42b/boj9084", "chapter": "42b", "slug": "boj9084", "title": "백준 9084 동전", "kind": "stdio", "ext": ".py", "tier": "Gold V (solved.ac)", "role": "핵심", "target": "30분", "url": "https://solved.ac/problems/id/9084", "time_limit": 1.0, "ref_time": 0.04635749998851679, "problem": "# 백준 9084 동전\n\n- 원문: https://solved.ac/problems/id/9084\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold V (solved.ac) · 역할: 핵심 · 목표 시간: 30분\n- 짝이 되는 장: 42b. 동적 계획법 (2차원)\n\n## 문제 (요약)\n동전 종류(오름차순)와 목표 금액 M이 주어져요. 각 동전은 몇 개든 쓸 수 있어요. 금액 M을 만드는 **방법의 수**를 세요. 어떤 동전을 몇 개 썼는지가 같으면 같은 방법이에요. 즉 `1+2`와 `2+1`은 **한 가지**예요.\n\n## 제약\n- 테스트 케이스 T ≤ 10\n- 동전 종류 N ≤ 20, 동전 값 1 ~ 10,000 (서로 다르고 오름차순), 1 ≤ M ≤ 10,000\n- 답은 2³¹ − 1 이하\n- 입력: 첫 줄 `T`. 케이스마다 `N` / 동전 N개 / `M` 세 줄 / 출력: 케이스마다 방법의 수 한 줄\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 42b/boj9084` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 1+2와 2+1<\/summary>\n\n동전 1, 2, 5원으로 5원을 만드는 방법을 손으로 다 적어 보세요(4가지예요). 그다음 `dp[a] = 금액 a를 만드는 방법의 수`로 두고 \"마지막에 쓴 동전\"으로 나누어 세면 몇이 나오나요? 왜 더 많이 나올까요?\n<\/details>\n\n<details><summary>힌트 2: 두 번째 축은 \"어떤 동전까지 쓸 수 있나\"<\/summary>\n\n순서를 무시하려면 동전을 쓰는 순서를 하나로 **고정**하면 돼요. `dp[i][a]` = **앞의 i종류 동전만** 써서 금액 a를 만드는 방법의 수. 동전 i를 한 개도 안 쓰면 `dp[i-1][a]`, 한 개 이상 쓰면 하나를 빼고 `dp[i][a-c]`. 42b장 4단계예요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 1차원으로 접으면 **동전 루프가 바깥, 금액 루프가 안쪽**이에요. 반대로 하면 순열을 세요.\n- 금액 루프는 **앞으로**(`c`부터 `M`까지) 돌아요. 같은 동전을 여러 번 쓸 수 있으니까요.\n- `dp[0] = 1`(아무것도 안 쓰는 방법 하나)이에요. 0이면 전부 0이 나와요.\n- 케이스마다 `dp`를 새로 만들어요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 9084 동전\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"동전을 무한히 써서 금액 M을 만드는 **조합**의 수.\" 확인 질문이에요.\n- 같은 동전을 여러 번 써도 되나요? → **네.**\n- `1+2`와 `2+1`은 다른 방법인가요? → **같은 방법이에요.** 이게 루프 순서를 정해요.\n- 만들 수 없으면? → 0을 출력해요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n1, 2, 5원으로 5원 → `1+1+1+1+1`, `1+1+1+2`, `1+2+2`, `5` → 4가지.\n경계: 못 만듦(동전 3원으로 7원 → 0), 금액보다 작은 동전이 없음(→ 0), 동전 하나로 딱(1), 1원 하나로 10,000원(1), 테스트 케이스 여러 개(케이스마다 표를 새로).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n동전마다 \"몇 개 쓸지\"를 0개부터 다 시도하는 재귀예요. 각 동전 개수의 조합을 전부 보니 지수에 가까워요. 동전 3종만으로도 M = 400에서 호출 220만 번이고, 동전 20종에 M = 10,000이면 끝나지 않아요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n### 4-1. 1차원으로 먼저 시도하면 틀려요\n42장 Coin Change처럼 `dp[a]` = 금액 a를 만드는 방법의 수로 두고 \"마지막 동전\"으로 나누면 `dp[a] = Σ dp[a-c]`예요. 그런데 이건 `1+2`(마지막 2)와 `2+1`(마지막 1)을 **따로** 세요. 1, 2, 5원으로 5원에 4 대신 **9**가 나와요(순열의 수). 상태에 \"순서를 고정하는 정보\"가 없어서예요.\n\n### 4-2. 축 하나 더: 쓸 수 있는 동전의 범위\n42b장의 규칙: **점화식을 쓰는 데 필요한 정보가 상태에 없으면 그게 다음 축이에요.** 동전을 \"1원들 → 2원들 → 5원들\" 순서로만 쓴다고 정하면 순서가 하나로 고정돼요. 그래서 \"몇 번째 동전까지 쓸 수 있나\"를 축으로 넣어요. 42b장 5단계 레시피예요.\n\n| 레시피 | 이 문제에서 |\n|---|---|\n| ① 축 고르기 | 쓸 수 있는 동전 종류 수 i, 금액 a (용량·목표값이 따로 주어지는 신호) |\n| ② 상태 | `dp[i][a]` = **앞의 i종류 동전만** 써서 금액 **정확히 a**를 만드는 방법(조합)의 수 |\n| ③ 점화식 | 동전 i(값 c)를 한 개도 안 씀 → `dp[i-1][a]`, 한 개 이상 씀 → 하나 빼면 여전히 동전 1..i로 a−c를 만드는 문제 → `dp[i][a-c]`. 합쳐서 `dp[i][a] = dp[i-1][a] + dp[i][a-c]` (a ≥ c일 때) |\n| ④ 기저 | `dp[i][0] = 1` (아무것도 안 쓰는 방법 하나), `dp[0][a>0] = 0` (동전 없이 양수 금액은 불가) |\n| ⑤ 순서·답·접기 | i를 위에서 아래로, a를 작은 쪽부터. 답은 **`dp[N][M]`**. 위 줄과 **같은 줄의 왼쪽**을 읽으니 1차원으로 접고 금액 루프를 **앞으로**(무한 배낭) |\n\n\"안 씀\"과 \"한 개 이상 씀\"은 겹치지 않고 빠짐없어요. 그래서 더하기예요.\n\n**재귀 → 메모 → 표 → 한 줄** 과정이에요.\n\n```python\n# (가) 느린 재귀: f(i, a) = 동전 1..i로 a를 만드는 조합 수\ndef f(i, a):\n    if a == 0:\n        return 1\n    if i == 0:\n        return 0\n    c = coins[i - 1]\n    return f(i - 1, a) + (f(i, a - c) if a >= c else 0)\n\n# (나) 메모: @cache 한 줄 → 서로 다른 (i, a)는 (N+1)(M+1)개, O(NM)\n#     단 f(i, a) → f(i, a-1) → … 사슬이라 1원짜리가 있으면 깊이가 M = 10,000까지 가요\nfrom functools import cache\nf = cache(f)\n\n# (다) 표: 2차원 그대로\ndp = [[0] * (m + 1) for _ in range(n + 1)]\nfor i in range(n + 1):\n    dp[i][0] = 1\nfor i in range(1, n + 1):\n    c = coins[i - 1]\n    for a in range(1, m + 1):\n        dp[i][a] = dp[i - 1][a] + (dp[i][a - c] if a >= c else 0)\n\n# (라) 한 줄로 접기: 동전 루프 바깥, 금액 루프 안쪽·앞으로 (42b장 템플릿 4)\ndp = [1] + [0] * m\nfor c in coins:\n    for a in range(c, m + 1):\n        dp[a] += dp[a - c]     # 더하기 전 dp[a]는 \"위 줄\", dp[a-c]는 이미 고친 \"같은 줄\"\n```\n\n(라)에서 바깥 동전 루프가 2차원의 i 역할을 대신해요. 그래서 두 루프를 바꾸면 i가 사라지고 4-1의 순열 코드가 돼요.\n\n트리거 단어: \"방법의 수\", \"동전 무한\", \"순서 무관\" → 동전 바깥·금액 안쪽의 조합 DP. \"순서가 다르면 다른 방법\"이면 금액 바깥이에요.\n\n## 5. 코드\n```python\nimport sys\n\ndata = sys.stdin.read().split()\nt = int(data[0]); pos = 1\nout = []\nfor _ in range(t):\n    n = int(data[pos]); pos += 1\n    coins = list(map(int, data[pos:pos + n])); pos += n\n    m = int(data[pos]); pos += 1\n    dp = [0] * (m + 1)\n    dp[0] = 1                          # 기저\n    for c in coins:                    # 바깥 = 순서 고정 = 조합\n        for a in range(c, m + 1):      # 앞으로 = 같은 동전 여러 번\n            dp[a] += dp[a - c]\n    out.append(dp[m])                  # 답\nprint('\\n'.join(map(str, out)))\n```\n\n## 왜 이 코드가 정답인가\n\n- **불변식**: 동전 c까지 처리한 뒤 `dp[a]`는 지금까지 본 동전들로만 a원을 만드는 조합의 수예요.\n- **빠뜨리지 않는 이유**: 동전이 바깥 루프라 각 조합은 \"동전 순서대로 고른 개수\" 한 모양으로만 세어져요. 안쪽에서 a를 앞으로 돌려 `dp[a - c]`가 이번 동전을 이미 쓴 값이라 같은 동전 여러 번도 들어가요.\n- **끝나는 이유**: 케이스마다 O(N × M) ≤ 20 × 10,000이에요.\n- **깨지는 가정**: 루프 순서예요. 금액을 바깥, 동전을 안쪽에 두면 1+2와 2+1을 따로 세는 순열 수가 나오고, a를 뒤에서 앞으로 돌리면 동전을 한 번씩만 쓰는 0/1 배낭이 돼요.\n\n## 6. 예제로 추적 (확인)\n1, 2, 5원으로 5원. 2차원 표를 코드로 돌려 찍었어요. 1차원 코드에서 동전 하나를 처리한 직후의 `dp` 배열이 각 행과 **똑같아요**.\n\n| 쓸 수 있는 동전 \\ 금액 | 0 | 1 | 2 | 3 | 4 | 5 |\n|---|---|---|---|---|---|---|\n| 없음 (i = 0) | 1 | 0 | 0 | 0 | 0 | 0 |\n| 1원까지 | 1 | 1 | 1 | 1 | 1 | 1 |\n| 2원까지 | 1 | 1 | 2 | 2 | 3 | 3 |\n| 5원까지 | 1 | 1 | 2 | 2 | 3 | **4** |\n\n예: `dp[2원까지][4] = dp[1원까지][4] + dp[2원까지][2] = 1 + 2 = 3` (`1111`, `112`, `22`). 답 4 ✓\n루프를 바꾼 순열 코드는 같은 입력에서 `[1, 1, 2, 3, 5, 9]`라 9가 나와요.\n\n## 7. 복잡도\n케이스마다 칸 N × M개 × 칸당 O(1) = **O(NM)**, 메모리 O(M). 최악 10 × 20 × 10,000 = 200만 번이에요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 금액 루프 바깥, 동전 루프 안쪽 (순열을 셈) | 4 대신 9 | 손 케이스 01 |\n| 금액 루프를 거꾸로 (0/1 배낭이 됨, 동전마다 한 번만) | 4 대신 1 (동전마다 한 개씩이라 `5` 하나만 남음) | 손 케이스 01 |\n| `dp[0] = 0` | 전부 0 | 손 케이스 01 |\n| 케이스마다 `dp`를 새로 안 만듦 | 두 번째 케이스부터 틀림 | 손 케이스 05 |\n\n## 9. 면접에서 30초로 설명하기\n\"`1+2`와 `2+1`을 같게 세야 하니 동전을 쓰는 순서를 고정합니다. 상태를 앞의 i종류 동전으로 금액 a를 만드는 조합 수로 두면, 동전 i를 안 쓰는 `dp[i-1][a]`와 하나 이상 쓰는 `dp[i][a-c]`의 합이 됩니다. 1차원으로 접으면 동전 루프를 바깥에, 금액 루프를 안쪽에 앞으로 돌립니다. 기저는 `dp[0] = 1`이고 O(NM)입니다. 루프를 바꾸면 순열을 세게 됩니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **루프 순서를 바꾸면 정확히 무엇을 세나요?** 마지막에 쓴 동전이 다르면 다른 방법으로 치는 순열의 수예요. 1, 2, 5원으로 11원이면 조합 11, 순열 218이에요(42b장 4단계). LeetCode 377 Combination Sum IV가 그 문제예요.\n2. **동전마다 한 번만 쓸 수 있다면?** 0/1 배낭이 돼요. 점화식이 `dp[i-1][a-c]`(위 줄)로 바뀌고, 1차원에선 금액 루프를 **거꾸로** 돌아요(42b장 3단계).\n3. **방법의 수가 아니라 최소 동전 개수라면?** 순서가 상관없어서 루프 순서가 자유로워요. `+=` 대신 `min`이에요(42장 Coin Change).\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 15분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 2293 「동전 1」(메모리 제한이 빡빡해서 1차원 필수), LeetCode 518 Coin Change II, LeetCode 377 Combination Sum IV(순열 버전), 백준 12865 「평범한 배낭」(42b장 끝까지 따라가기 ①).\n", "starter": "# 백준 9084 동전 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 42b/boj9084\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "42b/boj9251", "chapter": "42b", "slug": "boj9251", "title": "백준 9251 LCS", "kind": "stdio", "ext": ".py", "tier": "Gold IV (solved.ac)", "role": "핵심", "target": "30분", "url": "https://solved.ac/problems/id/9251", "time_limit": 1.0, "ref_time": 0.0942476250056643, "problem": "# 백준 9251 LCS\n\n- 원문: https://solved.ac/problems/id/9251\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold IV (solved.ac) · 역할: 핵심 ·
