(N)이에요. 둘의 장점만 가져올 방법은?\n<\/details>\n\n<details><summary>힌트 2: 둘 다 들기<\/summary>\n\n31장 면접 질문 3번의 꼬리 질문이 바로 이 문제예요. **배열**에는 값을 빈칸 없이 담고, **dict**에는 `값 → 배열에서의 위치`를 담아요. 그러면 \"있나\"는 dict로 O(1)이에요. 남은 문제는 배열 중간에서 O(1)로 빼는 법이에요. 배열에서 O(1)로 뺄 수 있는 자리는 딱 한 곳, **맨 끝**이에요. 순서는 상관없는 집합이라는 점을 이용하세요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 지울 값 자리로 **마지막 값**을 옮긴 뒤 `pop()`해요. 옮긴 값의 dict 위치도 꼭 고치세요.\n- 지우는 값이 바로 마지막 값일 때를 손으로 따라가 보세요. `del pos[val]`을 `pos[last] = i`보다 **먼저** 하면, 지운 값이 dict에 되살아나요.\n- `random.choice(list(self.pos))`는 매번 리스트를 새로 만들어서 O(N)이에요.\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 380 Insert Delete GetRandom O(1)\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"중복 없는 집합인데, 넣기·빼기·무작위 뽑기가 전부 평균 O(1).\" 설계 문제라서 확인 질문이 중요해요.\n- 같은 값을 두 번 넣으면? → 두 번째는 `False`, 집합은 그대로.\n- 비어 있을 때 `getRandom`을 부르나요? → **안 불러요.** 예외 처리는 필요 없어요.\n- \"같은 확률\"이 정확히 뭔가요? → 지금 들어 있는 k개 각각이 1/k.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`insert 1, 2, 3, 4` → `remove 2` → `remove 4` → `remove 1` → 남은 값 `[3]`, 이제 `getRandom`은 항상 3.\n경계: 같은 값 두 번 insert, 없는 값 remove, **지우는 값이 배열의 마지막 값**인 경우, 하나 남은 값을 지우고 다시 넣기, -2³¹ 같은 극단값.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n리스트 하나에 담아요. `insert`는 `val in items`로 확인 O(N), `remove`는 `items.remove(val)` O(N), `getRandom`은 `random.choice(items)` O(1). 연산 20만 번에 원소 10만 개면 수십억 번 비교 → 시간 초과예요.\n`set` 하나로 바꾸면 insert/remove는 O(1)이 되지만 `random.choice(list(s))`가 매번 O(N)이에요. 병목이 옮겨 갈 뿐이에요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n두 자료구조의 가격표를 나란히 놓아 보면(31장 \"두 자료구조의 가격표\"), 서로가 못 하는 걸 상대가 해요.\n- 무작위 뽑기에는 **번호**가 필요 → 배열.\n- 있나 확인과 위치 찾기에는 **해시** → dict.\n그래서 둘 다 들고, dict에는 `값 → 배열 인덱스`를 담아요. 마지막 남은 문제는 \"배열 중간 삭제가 O(N)\"이에요. 해결은 **순서가 의미 없다**는 점이에요. 지울 자리에 마지막 값을 옮겨 덮고, 끝에서 `pop()`하면 O(1)이에요(swap-pop).\n\n트리거 단어: \"모두 O(1)\", \"무작위로 하나\", \"삭제\" → dict(값→인덱스) + 배열 swap-pop.\n\n## 5. 코드\n```python\nclass RandomizedSet:\n    def __init__(self):\n        self.vals = []      # 빈칸 없는 배열\n        self.pos = {}       # 값 → 배열 위치\n\n    def insert(self, val):\n        if val in self.pos:\n            return False\n        self.pos[val] = len(self.vals)\n        self.vals.append(val)\n        return True\n\n    def remove(self, val):\n        if val not in self.pos:\n            return False\n        i = self.pos[val]\n        last = self.vals[-1]\n        self.vals[i] = last          # 마지막 값을 지울 자리로\n        self.pos[last] = i\n        self.vals.pop()\n        del self.pos[val]            # 반드시 마지막에\n        return True\n\n    def getRandom(self):\n        return random.choice(self.vals)\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: 모든 메서드가 끝난 뒤 `self.vals`는 빈칸 없이 집합의 원소를 하나씩 담고, 모든 `v`에 대해 `self.vals[self.pos[v]] == v`예요.\n- **불변식이 유지되는 이유**: `remove`는 마지막 값 `last`를 `i`로 옮기고 `self.pos[last] = i`로 고친 뒤 끝을 `pop()`해요. `del self.pos[val]`을 마지막에 해서, `val`이 곧 `last`일 때도 `pos`에 지운 값이 남지 않아요.\n- **같은 확률인 이유**: `vals`에 빈칸도 중복도 없으니 `random.choice`가 k개 중 하나를 각각 1/k로 골라요.\n- **끝나는 이유**: dict 조회·대입, 리스트 끝 `append`/`pop`이 모두 평균 O(1)이에요.\n- **깨지는 가정**: `del self.pos[val]`을 `self.pos[last] = i`보다 먼저 하면, 지우는 값이 마지막 값일 때 `pos`에 지운 값이 다시 생겨요. 중간을 `list.remove`로 지우면 O(N)이 돼요.\n\n## 6. 예제로 추적 (확인)\n| 연산 | 반환 | vals | pos |\n|---|---|---|---|\n| insert 1, 2, 3, 4 | True ×4 | [1, 2, 3, 4] | {1:0, 2:1, 3:2, 4:3} |\n| remove 2 (i=1, last=4) | True | [1, 4, 3] | {1:0, 3:2, 4:1} |\n| remove 4 (i=1, last=3) | True | [1, 3] | {1:0, 3:1} |\n| remove 1 (i=0, last=3) | True | [3] | {3:0} |\n`remove 2`에서 4가 1번 자리로 옮겨 가고, `pos[4]`도 3 → 1로 바뀐 게 핵심이에요.\n**마지막 값 자신을 지울 때**: `vals = [1, 2]`에서 `remove 2`면 `i = 1`, `last = 2`. `vals[1] = 2`, `pos[2] = 1`(제자리), `pop()`, 그리고 `del pos[2]` → `{1:0}` ✓. `del`을 먼저 하면 `pos[2] = 1`이 2를 다시 살려 내요.\n\n## 7. 복잡도\n세 메서드 모두 dict 조회·대입 몇 번과 배열 끝 연산뿐이라 **평균 O(1)** 이에요(`append`는 분할 상환 O(1)). 메모리는 배열과 dict에 O(N).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 옮긴 값의 `pos[last]`를 안 고침 | 나중에 그 값을 지울 때 엉뚱한 자리를 덮음 | 손 케이스 「기본 흐름」 |\n| `del pos[val]`을 먼저 함 | 마지막 값 삭제 시 지운 값이 되살아남 | 손 케이스 「중복 insert, 없는 값 remove」 |\n| 리스트 하나로 `in`·`remove` | 정답이지만 O(N) | 큰 입력 (오래 걸려요) |\n| `random.choice(list(self.pos))` | 정답이지만 뽑기마다 O(N) | 큰 입력 |\n| 항상 `vals[0]`을 돌려줌 | 값은 맞지만 고르지 않음 | 손 케이스 「고르게 뽑기」 |\n\n## 9. 면접에서 30초로 설명하기\n\"무작위 뽑기에는 인덱스가 필요해서 배열을, 존재 확인과 삭제 위치 찾기에는 해시맵을 같이 씁니다. 해시맵은 값에서 배열 인덱스로 갑니다. 삭제는 순서가 의미 없다는 점을 이용해, 지울 자리에 배열의 마지막 값을 옮기고 그 값의 인덱스를 갱신한 뒤 끝에서 pop합니다. 세 연산 모두 평균 O(1)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **중복을 허용하면?** (LeetCode 381) dict의 값을 인덱스 하나가 아니라 **인덱스 집합**으로 바꿔요. 지울 때 그 집합에서 아무 인덱스 하나를 꺼내 같은 swap-pop을 하고, 옮겨진 마지막 값의 인덱스 집합도 고쳐요.\n2. **왜 `set`에서 `random.choice`를 바로 못 하나요?** 해시 테이블은 내부 배열에 빈칸이 섞여 있고 \"k번째 원소\"라는 개념이 없어요. 그래서 파이썬도 set에는 `random.choice`를 허용하지 않고, 리스트로 바꾸는 O(N)이 들어요.\n3. **가중치가 있는 무작위 뽑기라면?** (LeetCode 528) 누적 합 배열을 만들고 `[0, 총합)`의 난수를 이분 탐색으로 찾아요. O(log N)이에요(35장).\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 20분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 381 Insert Delete GetRandom O(1) - Duplicates allowed, LeetCode 146 LRU Cache(dict + 연결 리스트로 \"둘 다 들기\").\n", "starter": "# LeetCode 380 — 클래스의 세 메서드를 채우세요.  채점: python algo/judge.py 31/lc0380\nimport random\n\n\nclass RandomizedSet:\n    def __init__(self):\n        pass\n\n    def insert(self, val: int) -> bool:\n        pass\n\n    def remove(self, val: int) -> bool:\n        pass\n\n    def getRandom(self) -> int:\n        pass\n\n\n# ---- 채점용 실행기: 고치지 마세요 ----\ndef run_ops(ops, vals):\n    \"\"\"LeetCode식 연산 목록을 차례로 실행하고 반환값 목록을 돌려줘요.\"\"\"\n    out, obj = [], None\n    for op, v in zip(ops, vals):\n        if op == \"RandomizedSet\":\n            obj = RandomizedSet()\n            out.append(None)\n        else:\n            out.append(getattr(obj, op)(*v))\n    return out\n"}, {"id": "32/boj1806", "chapter": "32", "slug": "boj1806", "title": "백준 1806 부분합", "kind": "stdio", "ext": ".py", "tier": "Gold IV (solved.ac)", "role": "핵심", "target": "25분", "url": "https://solved.ac/problems/id/1806", "time_limit": 1.5, "ref_time": 0.021913332981057465, "problem": "# 백준 1806 부분합\n\n- 원문: https://solved.ac/problems/id/1806\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold IV (solved.ac) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 32. 투 포인터와 슬라이딩 윈도우\n\n## 문제 (요약)\n자연수 N개로 된 수열이 있어요. **연속한** 구간 중 합이 S 이상인 것들 가운데 **가장 짧은** 구간의 길이를 출력하세요. 그런 구간이 없으면 0을 출력해요.\n\n## 제약\n- 10 ≤ N < 100,000, 0 < S ≤ 100,000,000\n- 수열의 각 값은 10,000 이하의 자연수\n- 입력: 첫 줄 `N S`, 둘째 줄 수열 / 출력: 길이 하나\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 32/boj1806` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 무엇을 버리고 있나<\/summary>\n\n모든 (시작, 끝) 쌍을 보면 약 50억 번이에요. 그런데 `[i, j]`의 합이 이미 S 이상이면, `[i, j+1]`, `[i, j+2]`…는 볼 필요가 있을까요? 답이 될 수 없는 구간을 통째로 지울 방법을 찾아보세요.\n<\/details>\n\n<details><summary>힌트 2: 값이 전부 자연수라는 조건<\/summary>\n\n오른쪽 끝을 늘리면 합은 **늘기만** 하고, 왼쪽 끝을 당기면 **줄기만** 해요(단조성). 그래서 두 끝이 모두 되돌아가지 않아도 돼요. 32장 3단계의 \"자벌레\"를 떠올려 보세요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 기록은 합이 S 이상인 **동안** 줄이면서 매번 해요 (`if`가 아니라 `while`).\n- 길이는 `r - l + 1`이에요.\n- 답이 없을 때 0을 내야 해요. 처음 값을 `N + 1` 같은 센티널로 두고 마지막에 검사하세요.\n- 입력이 커요. `sys.stdin.readline` 또는 `sys.stdin.buffer.read()`를 쓰세요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 1806 부분합\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"연속 구간, 합 ≥ S, 그중 최소 길이. 없으면 0.\" 면접이라면 여기서 확인 질문을 해요.\n- 값에 0이나 음수가 있나요? → **없음, 전부 자연수** (이게 풀이를 결정해요)\n- 답이 없을 수 있나요? → 있음, 0 출력\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`5 1 3 5 10 7 4 9 2 8`, S=15 → `10 7` (17)이 길이 2. 길이 1로 15 이상인 값은 없으니 답 2.\n경계: 원소 하나로 바로 충족(답 1), 전체 합 < S(답 0), 마지막 몇 칸에서만 충족.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n모든 시작점 i에서 오른쪽으로 더하다 S 이상이 되면 멈춰요. 최악 O(N²) = 약 50억 번 → 파이썬으로는 시간 초과예요.\n**면접 팁**: 브루트포스를 먼저 말하고 복잡도를 붙이면, 최적화를 못 해도 기본 점수를 받아요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n브루트포스는 시작점이 하나 오른쪽으로 갈 때마다 끝점을 **처음부터 다시** 찾아요. 그런데\n- `[i, j]`가 처음으로 S 이상이 된 끝점이 j라면, `[i+1, …]`의 첫 충족 끝점은 **j보다 왼쪽일 수 없어요**. 값이 전부 양수라서 `[i+1, j-1]`의 합은 `[i, j-1]`의 합보다 작고, 그건 이미 S 미만이었으니까요.\n- 즉 끝점은 되돌아갈 필요가 없어요 → **두 포인터가 모두 한 방향으로만** 움직이는 가변 윈도.\n\n트리거 단어: \"연속\", \"자연수/양수\", \"최소 길이\" → 가변 슬라이딩 윈도 (32장 템플릿 B).\n\n## 5. 코드\n```python\nbest = n + 1\nl = total = 0\nfor r in range(n):\n    total += a[r]            # 오른쪽 확장\n    while total >= s:        # 유효한 동안\n        best = min(best, r - l + 1)   # 기록하고\n        total -= a[l]        # 왼쪽을 줄여 더 짧은 걸 시도\n        l += 1\nprint(best if best <= n else 0)\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: 매 반복에서 `total`은 `a[l..r]`의 합이에요. `while`이 끝나면 `total < s`, 즉 오른쪽 끝이 r일 때 `l`보다 왼쪽에서 시작하는 구간만 S 이상이에요.\n- **빠뜨리지 않는 이유**: 값이 전부 양수라서, 끝이 r일 때 S 이상인 가장 짧은 구간은 `while` 안에서 `l`을 당기며 기록한 마지막 길이예요. 시작점을 당기면 합이 줄 뿐이니, 버린 `l`로 시작하는 구간은 더 긴 끝점에서도 최소가 될 수 없어요.\n- **끝나는 이유**: `r`도 `l`도 앞으로만 가고 각각 최대 N번이라 O(N)이에요. `l`이 `r`을 넘으면 `total`이 0이라 `while`이 멈춰요.\n- **깨지는 가정**: 0이나 음수가 섞이면 `l`을 당겨도 합이 줄지 않거나 늘어서, 버린 시작점이 다시 필요해질 수 있어요. 그때는 누적 합 + 정렬/덱이 필요해요.\n\n## 6. 예제로 추적 (확인)\n| r | 더한 값 | total | while 안에서 | best |\n|---|---|---|---|---|\n| 0–3 | 5,1,3,5 | 14 | — | 11 |\n| 4 | 10 | 24 | 기록 5 → l=1 (19) → 기록 4 → l=2 (18) → 기록 3 → l=3 (15) → 기록 2 → l=4 (10) | 2 |\n| 5 | 7 | 17 | 기록 2 → l=5 (7) | 2 |\n나머지는 2보다 짧아질 수 없어요. 답 2 ✓\n\n## 7. 복잡도\n`while`이 중첩돼 보여도 `l`은 전체에서 최대 N번만 증가해요. 각 원소는 한 번 들어오고 한 번 나가요 → **O(N)**, 메모리 O(1).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 길이를 `r - l`로 계산 | 1 작게 나옴 | 손 케이스 01 |\n| `while` 대신 `if` | 한 번만 줄여서 더 짧은 답을 놓침 | 손 케이스 01 |\n| 답 없음을 처리 안 함 | `N+1`이나 `inf`가 출력됨 | 손 케이스 02 |\n| 이중 반복 | 정답이지만 느림 | 큰 입력 |\n\n## 9. 면접에서 30초로 설명하기\n\"값이 전부 양수라서 구간을 오른쪽으로 늘리면 합이 늘고 왼쪽을 줄이면 합이 줄어듭니다. 그래서 오른쪽 끝을 하나씩 늘리다가 합이 S 이상이 되면, 조건이 깨질 때까지 왼쪽을 줄이면서 길이를 기록합니다. 두 포인터가 모두 한 방향으로만 가니 각 원소가 최대 두 번 처리돼 O(N)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **값에 음수가 섞이면?** 단조성이 깨져서 윈도가 틀려요. \"합 ≥ S인 최소 길이\"는 누적 합 + 단조 덱(LeetCode 862, Hard)으로 가요. \"합이 정확히 K인 개수\"라면 누적 합 + 해시맵(LeetCode 560).\n2. **이진 탐색으로도 풀 수 있나요?** 네. 누적 합이 증가하니 각 i에서 `prefix[i] + S` 이상인 첫 위치를 이분 탐색 → O(N log N). 윈도보다 느리지만 \"길이 L로 가능한가?\"를 이분 탐색하는 방식도 맞아요(35장).\n3. **스트림으로 값이 계속 들어오면?** 윈도는 이미 온라인 알고리즘이에요. 덱에 윈도 안의 값만 들고 있으면 메모리 O(윈도 크기).\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 15분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 2003 「수들의 합 2」, LeetCode 209.\n", "starter": "# 백준 1806 부분합 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 32/boj1806\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "32/boj2003", "chapter": "32", "slug": "boj2003", "title": "백준 2003 수들의 합 2", "kind": "stdio", "ext": ".py", "tier": "Silver IV (solved.ac)", "role": "워밍업", "target": "15분", "url": "https://solved.ac/problems/id/2003", "time_limit": 1.0, "ref_time": 0.0012288750149309635, "problem": "# 백준 2003 수들의 합 2\n\n- 원문: https://solved.ac/problems/id/2003\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Silver IV (solved.ac) · 역할: 워밍업 · 목표 시간: 15분\n- 짝이 되는 장: 32. 투 포인터와 슬라이딩 윈도우\n\n## 문제 (요약)\n자연수 N개로 된 수열과 자연수 M이 있어요. **연속한** 구간 중 합이 **정확히 M**인 구간이 몇 개인지 출력하세요.\n\n## 제약\n- 1 ≤ N ≤ 10,000, 1 ≤ M ≤ 300,000,000\n- 수열의 각 값은 30,000 이하의 자연수\n- 입력: 첫 줄 `N M`, 둘째 줄 수열 / 출력: 개수 하나\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 32/boj2003` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 어디서 본 문제인가<\/summary>\n\n백준 1806 「부분합」(32장 끝까지 따라가기 ①)과 비교해 보세요. 값이 전부 자연수인 것도, 연속 구간인 것도 같아요. 달라진 건 \"S 이상인 최소 길이\"가 \"정확히 M인 개수\"로 바뀐 것뿐이에요.\n<\/details>\n\n<details><summary>힌트 2: 언제 줄이고, 언제 세나<\/summary>\n\n자연수라서 늘리면 합이 커지고 줄이면 작아져요(32장 3단계의 단조성). 오른쪽 끝을 하나 늘릴 때마다, 합이 M을 **넘는 동안** 왼쪽을 줄여요. 줄이기가 끝나면 지금 윈도의 합은 M 이하예요. 그때 **정확히 M인지** 확인하고 세요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 줄이기는 `if`가 아니라 `while`이에요. 큰 값 하나가 들어오면 여러 칸을 한꺼번에 버려야 해요.\n- 세기는 줄이기 **뒤에** 해요. 앞에서 세면 줄인 뒤에야 M이 되는 구간을 놓쳐요.\n- 같은 오른쪽 끝에서 합이 M인 구간은 많아야 하나예요(값이 양수라서). 그래서 `if total == m` 한 번이면 충분해요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 2003 수들의 합 2\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"연속 구간 중 합이 정확히 M인 것의 개수.\" 확인 질문은 이래요.\n- 값에 0이나 음수가 있나요? → **없어요, 전부 자연수.** 1806과 같은 신호예요.\n- 답이 0일 수 있나요? → 있어요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`2 3 1 4 5 2 3 1`, M = 5 → `[2, 3]`, `[1, 4]`, `[5]`, `[2, 3]`(뒤쪽)으로 **4개**예요. 같은 값의 구간이라도 위치가 다르면 따로 세요.\n경계: 전부 1이고 M = 1(원소마다 하나씩, N개), 전체 합보다 M이 큼(0), 원소 하나가 곧 M, 마지막 원소 하나가 M이고 앞쪽 전체 합도 M인 경우(`1 2 3 4 5 15`, M = 15 → 2개), 모든 값이 M보다 커서 윈도가 계속 비는 경우.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n모든 시작점 i에서 오른쪽으로 더하다가 M 이상이 되면 멈춰요. 최악 O(N²) = 5천만 번이라 파이썬으로는 몇 초가 걸려요. 값이 작고 M이 크면 \"멈춤\"이 늦게 와서 거의 다 돌아요(채점기의 큰 입력이 이 경우예요).\n\n## 4. 병목 → 패턴 찾기 (핵심)\n1806과 똑같은 낭비예요. 시작점이 오른쪽으로 한 칸 가면, 브루트포스는 끝점을 처음부터 다시 찾아요. 그런데 값이 양수라서 끝점은 되돌아갈 필요가 없어요. 두 포인터가 모두 한 방향으로만 움직이면 돼요.\n1806과 다른 점은 **조건이 \"같다\"** 라는 것뿐이에요. 그래서 줄이는 조건을 \"넘는 동안(`> M`)\"으로 두고, 줄이기가 끝난 뒤 \"같은가\"를 확인해요. 줄이기가 끝난 윈도는 \"오른쪽 끝이 r일 때 합이 M 이하인 가장 긴 윈도\"라서, 합이 M인 구간이 있다면 바로 그거예요.\n\n트리거 단어: \"연속\", \"자연수\", \"합이 M\" → 가변 윈도 (32장 3단계, 템플릿 B의 변형).\n\n## 5. 코드\n```python\ncount = l = total = 0\nfor r in range(n):\n    total += a[r]              # 오른쪽 확장\n    while total > m:           # 넘치는 동안 줄이기\n        total -= a[l]\n        l += 1\n    if total == m:             # 줄인 뒤 확인\n        count += 1\nprint(count)\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `while`이 끝난 뒤 `total`은 `a[l..r]`의 합이고 `total <= m`이에요. 그 윈도는 끝이 r이면서 합이 M 이하인 가장 긴 구간이에요.\n- **빠뜨리지 않는 이유**: 값이 양수라 끝이 r인 구간의 합은 시작점이 왼쪽일수록 커요. 합이 정확히 M인 구간이 있다면 시작점은 하나뿐이고, 그게 줄이기가 끝난 `l`이에요. 그래서 `total == m` 확인 한 번으로 끝점마다 많아야 하나를 빠짐없이 세요.\n- **끝나는 이유**: `l`과 `r`이 각각 최대 N번 앞으로만 가서 O(N)이에요.\n- **깨지는 가정**: 자연수라는 조건이 핵심이에요. 0이 섞이면 같은 끝점에서 합이 M인 시작점이 여럿일 수 있는데 이 코드는 하나만 세요. 음수가 섞이면 단조성이 깨져서 누적 합 + 해시맵(2015)이 필요해요.\n\n## 6. 예제로 추적 (확인)\n`a = [2, 3, 1, 4, 5, 2, 3, 1]`, M = 5\n| r | 더한 값 | 줄이기 (`> 5`인 동안) | 줄인 뒤 l, total | count |\n|---|---|---|---|---|\n| 0 | 2 | — | 0, 2 | 0 |\n| 1 | 3 | — | 0, 5 → 같음 | 1 |\n| 2 | 1 | 2를 뺌 | 1, 4 | 1 |\n| 3 | 4 | 3을 뺌 | 2, 5 → 같음 | 2 |\n| 4 | 5 | 1을 뺌(9), 4를 뺌(5) | 4, 5 → 같음 | 3 |\n| 5 | 2 | 5를 뺌 | 5, 2 | 3 |\n| 6 | 3 | — | 5, 5 → 같음 | 4 |\n| 7 | 1 | 2를 뺌 | 6, 4 | 4 |\n답 4 ✓. r = 4에서 `while`이 두 번 돈 걸 보세요. `if`였다면 9에서 한 번만 빼고 끝나서 `[5]`를 놓쳐요.\n\n## 7. 복잡도\n`l`은 전체에서 최대 N번만 증가해요. 각 원소가 한 번 들어오고 한 번 나가니 **O(N)**, 메모리 O(1).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 줄이기를 `if`로 씀 | 한 칸만 줄여서 정답 구간을 놓침 (3) | 손 케이스 01 |\n| 세기를 줄이기 **앞에서** 함 | 줄인 뒤에야 M이 되는 구간을 놓침 (2) | 손 케이스 01 |\n| 이중 반복 (M 이상이면 끊기) | 정답이지만 O(N²) | 큰 입력 |\n\n## 9. 면접에서 30초로 설명하기\n\"값이 전부 양수라서 구간을 늘리면 합이 커지고 줄이면 작아집니다. 오른쪽 끝을 하나씩 늘리면서 합이 M을 넘는 동안 왼쪽을 줄이고, 줄이기가 끝났을 때 합이 정확히 M이면 셉니다. 각 원소가 한 번 들어오고 한 번 나가니 O(N)이고 공간은 O(1)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **값에 0이 섞이면?** 같은 합을 가진 구간이 한 오른쪽 끝에 여러 개 생겨요(앞에 0이 붙은 것들). 이 코드는 그중 가장 긴 것 하나만 세서 틀려요. 누적 합 + 해시맵이 가장 안전해요(백준 2015, LeetCode 560).\n2. **음수가 섞이면?** 단조성이 깨져서 윈도 자체가 틀려요(32장 6단계). 누적 합 + 해시맵으로 가요. 31장 백준 2015가 바로 그 문제예요.\n3. **N이 1,000만이고 메모리가 작다면?** 윈도 방식은 지금 윈도 안의 값만 있으면 돼서 값을 스트림으로 읽으며 덱(deque)에 담아도 돼요. 해시맵 방식보다 메모리에서 유리해요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 1806 「부분합」, 백준 1644 「소수의 연속합」, LeetCode 209 Minimum Size Subarray Sum.\n", "starter": "# 백준 2003 수들의 합 2 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 32/boj2003\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "32/boj2470", "chapter": "32", "slug": "boj2470", "title": "백준 2470 두 용액", "kind": "stdio", "ext": ".py", "tier": "Gold V (solved.ac)", "role": "핵심", "target": "30분", "url": "https://solved.ac/problems/id/2470", "time_limit": 1.0, "ref_time": 0.03633137498400174, "problem": "# 백준 2470 두 용액\n\n- 원문: https://solved.ac/problems/id/2470\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold V (solved.ac) · 역할: 핵심 · 목표 시간: 30분\n- 짝이 되는 장: 32. 투 포인터와 슬라이딩 윈도우\n\n## 문제 (요약)\n용액 N개의 특성값이 주어져요. 양수는 산성, 음수는 알칼리성이고 값은 모두 달라요. **서로 다른 두 용액**을 섞으면 특성값이 두 값의 합이 돼요. 합이 **0에 가장 가까운** 두 용액을 골라 특성값을 **오름차순**으로 출력하세요. 그런 쌍이 여럿이면 아무거나 하나 출력하면 돼요.\n\n## 제약\n- 2 ≤ N ≤ 100,000\n- 특성값은 -1,000,000,000 이상 1,000,000,000 이하이고 서로 달라요\n- 산성만 있거나 알칼리성만 있을 수도 있어요\n- 입력: 첫 줄 N, 둘째 줄 특성값 / 출력: 두 값 (작은 것 먼저)\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 32/boj2470` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요. 정답이 여럿일 수 있어서, 채점기는 \"합의 절댓값이 최적인가\"로 확인해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 쌍을 다 보면<\/summary>\n\n쌍은 약 50억 개예요. 연속 구간이 아니라 **아무 두 개**를 고르는 문제라서, 원래 순서는 답과 상관없어요. 순서를 마음대로 바꿔도 된다면 무엇을 먼저 하고 싶나요?\n<\/details>\n\n<details><summary>힌트 2: 양 끝에서 모으기<\/summary>\n\n정렬한 뒤 32장 1·2단계처럼 양 끝에 손가락을 올려요. 합 `a[l] + a[r]`이 **음수**면, `l`과 짝지을 수 있는 남은 모든 값은 `a[r]` 이하라서 합이 더 음수 쪽이에요. 즉 `l`이 들어간 쌍은 지금보다 0에 가까워질 수 없어요(격자에서 한 줄 통째로 지우기). 양수면 대칭으로 `r`을 지워요. 움직이기 전에 매번 지금 합을 기록하세요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 최솟값 초기값을 `10**9` 같은 상수로 두면, 두 값 합이 20억 가까이 되는 경우(전부 큰 양수)에 한 번도 갱신이 안 돼요. 첫 쌍의 값으로 시작하거나 `float('inf')`를 쓰세요.\n- 출력은 오름차순이에요. 정렬된 배열에서 `a[l]`, `a[r]` 순서로 출력하면 저절로 맞아요.\n- 합이 0이면 바로 멈춰도 돼요.\n- 정렬을 빼먹으면 에러 없이 조용히 틀려요(32장 1단계의 사고).\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 2470 두 용액\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"서로 다른 두 수의 합의 절댓값을 최소로. 그 두 수를 오름차순으로.\" 확인 질문은 이래요.\n- 같은 용액을 두 번 써도 되나요? → **안 돼요.** 서로 다른 두 개예요.\n- 정답이 여럿이면? → 아무거나.\n- 전부 양수(또는 전부 음수)일 수 있나요? → 있어요. 그때는 가장 작은 두 양수(또는 가장 큰 두 음수)가 답이에요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`-7 12 -3 25 4 -40` → `-3 + 4 = 1`이 가장 0에 가까워요. 출력 `-3 4`.\n경계: 전부 양수(`3 8 1 20` → `1 3`), 전부 음수(`-2 -1`), 합이 정확히 0인 쌍, N = 2, 합이 ±20억에 가까운 경우(초기값 함정), 최적 쌍이 여럿인 경우(`-5 4 6` → `-5 4`, `-5 6` 둘 다 정답).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n모든 쌍 `(i, j)`의 합을 봐요. O(N²) = 약 50억 → 시간 초과예요.\n다른 길로, 정렬 후 각 `x`마다 `-x`에 가장 가까운 값을 이분 탐색할 수도 있어요. O(N log N)으로 통과하지만 경계 처리가 까다로워요(35장).\n\n## 4. 병목 → 패턴 찾기 (핵심)\n브루트포스는 쌍 하나를 볼 때마다 그 쌍에 대해서만 배워요. 하지만 **정렬돼 있다면** 쌍 하나를 보고 후보 한 줄을 통째로 지울 수 있어요.\n- `a[l] + a[r] < 0`이면, `j < r`인 모든 `j`에 대해 `a[l] + a[j] < a[l] + a[r] < 0`이라 더 음수 쪽이에요. `l`이 들어간 쌍 중 0에 가장 가까운 건 이미 본 `(l, r)`이니, `l`을 버려요.\n- `> 0`이면 대칭으로 `r`을 버려요.\n32장 1·2단계와 다른 점은 \"합 = 목표\"를 **찾는** 게 아니라 \"0과의 거리\"를 **최소화**한다는 것뿐이에요. 그래서 움직이기 전에 매번 기록해요.\n\n트리거 단어: \"두 개를 골라\", \"합이 0에 가장 가까운\", 순서 무관 → 정렬 + 양 끝 투 포인터 (32장 템플릿 A).\n\n## 5. 코드\n```python\na.sort()\nl, r = 0, n - 1\nbest = (abs(a[l] + a[r]), a[l], a[r])\nwhile l < r:\n    s = a[l] + a[r]\n    if abs(s) < best[0]:\n        best = (abs(s), a[l], a[r])\n    if s < 0:\n        l += 1\n    elif s > 0:\n        r -= 1\n    else:\n        break\nprint(best[1], best[2])\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: 반복을 시작할 때, `l`보다 왼쪽이나 `r`보다 오른쪽 원소가 들어간 쌍 중 최선은 이미 `best`에 기록돼 있어요.\n- **빠뜨리지 않는 이유**: `s < 0`이면 `l`과 짝지을 수 있는 남은 `j < r`은 모두 합이 더 음수라 0에서 더 멀어요. 그러니 `l`이 들어간 최선은 방금 본 `(l, r)`이고 `l`을 버려도 돼요. `s > 0`이면 대칭으로 `r`을 버려요. `s == 0`이면 더 좋을 수 없어 멈춰요.\n- **끝나는 이유**: 매 반복 `l`이 늘거나 `r`이 줄어서 `l < r`이 깨질 때까지 최대 N−1번이에요. 정렬까지 O(N log N)이에요.\n- **깨지는 가정**: 정렬이 전제예요. 정렬하지 않으면 \"버린 쪽\"의 근거가 사라져요. `l < r`이라 같은 용액을 두 번 쓰지 않아요. 출력은 `a[l] < a[r]`이라 저절로 작은 것 먼저예요.\n\n## 6. 예제로 추적 (확인)\n정렬: `[-40, -7, -3, 4, 12, 25]`\n| l, r | a[l], a[r] | 합 | 최선 (절댓값, 쌍) | 이동 |\n|---|---|---|---|---|\n| 0, 5 | −40, 25 | −15 | 15, (−40, 25) | 음수 → l++ |\n| 1, 5 | −7, 25 | 18 | 15, (−40, 25) | 양수 → r−− |\n| 1, 4 | −7, 12 | 5 | 5, (−7, 12) | 양수 → r−− |\n| 1, 3 | −7, 4 | −3 | 3, (−7, 4) | 음수 → l++ |\n| 2, 3 | −3, 4 | 1 | 1, (−3, 4) | 양수 → r−−, l < r 아님 → 끝 |\n출력 `-3 4` ✓\n\n## 7. 복잡도\n정렬 O(N log N) + 투 포인터 O(N)(매번 `l`이나 `r` 중 하나가 한 칸, 합쳐서 N−1번 이하) → **O(N log N)**. 메모리는 정렬에 O(N).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 초기값을 `10**9`로 둠 | 합이 20억 가까운 경우 갱신이 안 돼 `0 0` 같은 값 출력 | 손 케이스 08 |\n| 정렬을 빼먹음 | 조용히 틀린 쌍 | 손 케이스 01 |\n| 큰 값을 먼저 출력 | 오름차순이 아님 | 손 케이스 01 |\n| 이중 반복 | 정답이지만 O(N²) | 큰 입력 |\n| C++/Java에서 `int`로 합을 계산 | 20억 근처에서 오버플로 (파이썬은 괜찮아요) | 백준 제출 시 |\n\n## 9. 면접에서 30초로 설명하기\n\"쌍의 순서는 상관없으니 먼저 정렬합니다. 양 끝에 포인터를 두고, 합을 기록한 다음 합이 음수면 왼쪽을, 양수면 오른쪽을 안쪽으로 옮깁니다. 합이 음수일 때 왼쪽 값과 남은 어떤 값을 짝지어도 더 음수 쪽이라 0에 가까워질 수 없으니, 그 값을 안전하게 버릴 수 있습니다. 정렬 O(N log N)에 탐색 O(N)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **세 용액이면?** (백준 2473, LeetCode 16 3Sum Closest) 하나를 고정하고 나머지 둘을 같은 투 포인터로 찾아요. O(N²)이에요. 32장 끝까지 따라가기 ②의 3Sum과 같은 틀이에요.\n2. **정렬 없이 O(N)으로 할 수 있나요?** \"정확히 0\"이면 해시 set으로 `-x`를 찾으면 O(N)이에요(31장 Two Sum). 하지만 \"가장 가까운\"은 해시가 못 해요. 해시는 정확히 같은 키만 찾고, \"가장 가까운 키\"에는 순서가 필요해요.\n3. **값이 같은 용액이 있을 수 있다면?** 투 포인터는 인덱스로 움직여서 `l < r`만 지키면 같은 값 두 개도 서로 다른 용액으로 잘 다뤄요. 해시 방식이었다면 개수를 세야 해요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 15분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 2467 「용액」(이미 정렬됨), 백준 3273 「두 수의 합」, LeetCode 167 Two Sum II.\n", "starter": "# 백준 2470 두 용액 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 32/boj2470\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "32/lc0003", "chapter": "32", "slug": "lc0003", "title": "LeetCode 3 Longest Substring Without Repeating Characters", "kind": "func", "ext": ".py", "tier": "Medium (LeetCode)", "role": "핵심", "target": "25분", "url": "https://leetcode.com/problems/longest-substring-without-repeating-characters/", "time_limit": 0.3, "ref_time": 0.024511999974492937, "problem": "# LeetCode 3 Longest Substring Without Repeating Characters\n\n- 원문: https://leetcode.com/problems/longest-substring-without-repeating-characters/\n- 난이도: Medium (LeetCode) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 32. 투 포인터와 슬라이딩 윈도우\n\n## 문제 (요약)\n문자열 `s`가 주어져요. 같은 글자가 두 번 나오지 않는 **연속한** 부분 문자열 중 가장 긴 것의 **길이**를 돌려주세요. (연속하지 않은 부분 수열이 아니에요.)\n\n## 제약\n- 0 ≤ len(s) ≤ 50,000 (원문 기준. 채점기의 큰 입력은 200,000이에요)\n- 영어 글자, 숫자, 기호, 공백으로 되어 있어요. 공백도 한 글자예요\n\n## 함수 시그니처\n```python\ndef length_of_longest_substring(s: str) -> int:\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요. 책에서 읽은 문제라도 **책을 덮고** 빈 함수에서 시작하세요.\n2. `python algo/judge.py 32/lc0003` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 시작점마다 다시 세면<\/summary>\n\n모든 시작점에서 오른쪽으로 가다가 중복을 만나면 멈추는 풀이를 떠올려 보세요. 시작점이 한 칸 오른쪽으로 가면, 방금 확인한 \"중복 없는 구간\"의 대부분을 **처음부터 다시** 확인하게 돼요. 이미 알아낸 걸 버리지 않으려면?\n<\/details>\n\n<details><summary>힌트 2: 윈도의 상태를 무엇으로 들고 있나<\/summary>\n\n오른쪽 끝을 늘리다가 새 글자가 윈도 안에 이미 있으면, 그 글자가 빠질 때까지 왼쪽을 줄여요. \"윈도 안에 이 글자가 있나?\"를 O(1)로 알려면 31장의 `set`이 필요해요. 이건 \"가장 **긴**\" 문제라서, 기록은 줄이기가 **끝난 뒤**에 해요(32장 4단계, 템플릿 C).\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 기록을 줄이기 전에 하면 중복이 있는 윈도의 길이를 세요(`\"pww\"`를 3으로).\n- `l`을 한 번에 점프시키는 `dict` 방식이라면, 마지막 위치가 **윈도 안에 있을 때만**(`last[ch] >= l`) 점프하세요. 안 그러면 `\"abba\"`에서 `l`이 뒤로 가요.\n- 윈도 상태를 리스트로 들면 `in`이 O(윈도 길이)라서 느려져요.\n- 빈 문자열은 0이에요.\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 3 Longest Substring Without Repeating Characters\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요. 32장 4단계에서 같이 본 문제라서, 여기서는 책의 `set` 풀이와 한 번에 점프하는 `dict` 풀이를 둘 다 정리해요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"중복 글자가 없는 연속 토막 중 최대 길이.\" 확인 질문은 이래요.\n- 부분 문자열(연속)인가요, 부분 수열인가요? → **연속**이에요.\n- 대소문자는 다른 글자인가요? 공백은요? → 다른 글자예요. 공백도 한 글자예요.\n- 빈 문자열이면? → 0.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`\"pwwkew\"` → `\"wke\"`(또는 `\"kew\"`)가 3글자. 답 **3**. `\"pwke\"`는 연속이 아니라서 안 돼요.\n경계: 빈 문자열(0), 같은 글자만(`\"bbbbb\"` → 1), 공백 한 글자(`\" \"` → 1), 끝에서 최대(`\"aab\"` → 2), **윈도 밖의 옛 기록**(`\"abba\"` → 2).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n모든 시작점 i에서 `set`에 담으며 오른쪽으로 가다 중복을 만나면 멈춰요. O(N × 윈도 길이)이고, 윈도 길이는 글자 종류 수(Σ)를 못 넘으니 O(N·Σ)예요. 글자 종류가 많고 중복 없는 구간이 길면 느려요. 32장 훅에서 서로 다른 글자 1,000개짜리 입력으로 잰 360배 차이가 이거예요. 채점기의 큰 입력도 95종 글자를 섞어 이어 붙여서 이 풀이가 시간 제한에 걸리게 했어요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n`[i, j]`가 중복이 없으면 그 안의 `[i+1, j]`도 중복이 없어요. 그러니 시작점이 한 칸 오른쪽으로 갈 때 끝점을 되돌릴 필요가 없어요. 두 포인터가 모두 한 방향으로만 가는 가변 윈도예요.\n윈도의 상태는 \"합\" 같은 숫자 하나가 아니라 \"들어 있는 글자들\"이라서 `set`으로 들어요(31장 기법 ① 본 적 있는 집합). 새 글자가 이미 있으면, 빠질 때까지 왼쪽을 줄여요. \"가장 긴\" 문제라서 **줄이기가 끝난 뒤** 기록해요. 이 시점이 유효한 윈도를 손에 든 순간이에요(32장 4단계 표).\n**변형**: 글자마다 마지막 위치를 `dict`에 적어 두면, 한 칸씩 당기지 않고 `l = last[ch] + 1`로 한 번에 점프할 수 있어요. 단 그 위치가 윈도 안(`>= l`)일 때만이요.\n\n트리거 단어: \"연속(부분 문자열)\", \"중복 없는\", \"가장 긴\" → 가변 윈도 + set/dict (32장 템플릿 C).\n\n## 5. 코드\n책의 `set` 풀이 (한 칸씩 줄이기):\n```python\nwindow = set()\nl = best = 0\nfor r, ch in enumerate(s):\n    while ch in window:            # 유효하지 않은 동안 줄이기\n        window.remove(s[l])\n        l += 1\n    window.add(ch)\n    best = max(best, r - l + 1)    # 줄이기가 끝난 뒤 기록\nreturn best\n```\n`solution/ref.py`의 `dict` 풀이 (한 번에 점프):\n```python\nlast = {}\nl = best = 0\nfor r, ch in enumerate(s):\n    if ch in last and last[ch] >= l:   # 윈도 안에서 겹칠 때만\n        l = last[ch] + 1\n    last[ch] = r\n    best = max(best, r - l + 1)\nreturn best\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: 각 `r`의 처리가 끝나면 `s[l..r]`에는 중복 글자가 없어요. `set` 풀이에서는 `window`가 정확히 그 글자들이고, `dict` 풀이에서는 `last[c]`가 c가 마지막으로 나온 위치예요.\n- **빠뜨리지 않는 이유**: `l`은 끝이 r인 중복 없는 구간 중 가장 왼쪽 시작점이에요. `[i, j]`에 중복이 있으면 그걸 품는 더 긴 구간도 중복이 있으니, 버린 시작점은 이후 끝점에서도 쓸모가 없어요. 그래서 끝점마다 가장 긴 후보를 기록하면 최댓값을 놓치지 않아요.\n- **끝나는 이유**: `set` 풀이는 `l`과 `r`이 각각 최대 n번 앞으로만 가요. `dict` 풀이는 `l`이 점프만 해서 한 번 훑기예요. 둘 다 O(n)이에요.\n- **깨지는 가정**: `dict` 풀이에서 `last[ch] >= l` 검사를 빼면 윈도 밖의 오래된 위치로 `l`이 **뒤로** 가요. `\"abba\"`에서 마지막 a가 `l`을 1로 되돌려 답이 3이 돼요(정답 2).\n\n## 6. 예제로 추적 (확인)\n`dict` 풀이로 `\"pwwkew\"`\n| r | 글자 | 점프? | l | 윈도 | best |\n|---|---|---|---|---|---|\n| 0 | p | — | 0 | p | 1 |\n| 1 | w | — | 0 | pw | 2 |\n| 2 | w | last[w] = 1 ≥ 0 → l = 2 | 2 | w | 2 |\n| 3 | k | — | 2 | wk | 2 |\n| 4 | e | — | 2 | wke | 3 |\n| 5 | w | last[w] = 2 ≥ 2 → l = 3 | 3 | kew | 3 |\n답 3 ✓\n\n`\"abba\"`에서 `>= l` 검사가 하는 일\n| r | 글자 | last[글자] | l | 윈도 | best |\n|---|---|---|---|---|---|\n| 0 | a | 없음 | 0 | a | 1 |\n| 1 | b | 없음 | 0 | ab | 2 |\n| 2 | b | 1 ≥ 0 → 점프 | 2 | b | 2 |\n| 3 | a | 0 < 2 → **무시** | 2 | ba | 2 |\n검사를 빼면 r = 3에서 `l = 0 + 1 = 1`로 **뒤로** 가서 윈도가 `\"bba\"`(길이 3)가 돼요. 중복이 있는데요.\n\n## 7. 복잡도\n`set` 풀이: `l`이 전체에서 N번 이하로 증가하니 **O(N)**. `dict` 풀이: 글자마다 O(1)이라 **O(N)**. 공간은 둘 다 O(min(N, Σ))예요. 윈도 안에는 서로 다른 글자만 있으니까요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `dict` 풀이에서 `last[ch] >= l` 검사를 뺌 | `l`이 뒤로 가서 3 | 손 케이스 「abba」 |\n| 줄이기 **전에** 기록 | 중복이 있는 윈도를 셈 (`\"abcabcbb\"`에서 4) | 손 케이스 「예제 1」 |\n| 윈도를 리스트로 들고 `in`·`pop(0)` | 답은 맞지만 한 걸음이 O(윈도 길이) | 글자 종류가 95개뿐이라 큰 입력을 아슬아슬하게 통과할 수 있어요. 시간이 제한에 가까우면 의심하세요 |\n| 시작점마다 `set`으로 다시 훑기 | 정답이지만 O(N·Σ) | 큰 입력 |\n\n## 9. 면접에서 30초로 설명하기\n\"중복 없는 구간 안의 작은 구간도 중복이 없어서, 오른쪽 끝을 늘리는 동안 왼쪽 끝은 되돌아갈 필요가 없습니다. 윈도 안의 글자를 set으로 들고, 새 글자가 이미 있으면 빠질 때까지 왼쪽을 줄인 다음 길이를 기록합니다. 각 글자가 한 번 들어오고 한 번 나가 O(N)이고, 공간은 글자 종류 수만큼입니다. 마지막 위치를 dict에 두면 한 번에 점프할 수도 있는데, 그 위치가 윈도 안일 때만 점프해야 합니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **\"서로 다른 글자가 최대 k개\"인 가장 긴 부분 문자열이면?** (LeetCode 340) 상태를 `set` 대신 `Counter`로 들고, `len(counter) > k`인 동안 줄여요. 빈도가 0이 된 글자는 `del`해야 `len`이 맞아요. 다음 문제 LeetCode 424와 같은 틀이에요.\n2. **글자가 ASCII뿐이라면 더 빠르게?** `dict` 대신 길이 128짜리 리스트에 마지막 위치를 담아요. 해시 계산이 없어져 상수가 줄어요. 복잡도는 같아요.\n3. **set 풀이와 dict 풀이 중 무엇이 나은가요?** 둘 다 O(N)이에요. dict 풀이는 `l`을 한 번에 옮겨 연산 수가 적지만 `>= l` 검사라는 함정이 있어요. 면접에서는 실수가 적은 set 풀이를 먼저 쓰고, 개선으로 dict를 말하는 게 안전해요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 340 Longest Substring with At Most K Distinct Characters, LeetCode 1695 Maximum Erasure Value.\n", "starter": "# LeetCode 3 — 함수 몸통을 채우세요.  채점: python algo/judge.py 32/lc0003\n\n\ndef length_of_longest_substring(s: str) -> int:\n    pass\n"}, {"id": "32/lc0076", "chapter": "32", "slug": "lc0076", "title": "LeetCode 76 Minimum Window Substring", "kind": "func", "ext": ".py", "tier": "Hard (LeetCode)", "role": "도전", "target": "50분", "url": "https://leetcode.com/problems/minimum-window-substring/", "time_limit": 0.3, "ref_time": 0.003452957986155525, "problem": "# LeetCode 76 Minimum Window Substring\n\n- 원문: https://leetcode.com/problems/minimum-window-substring/\n- 난이도: Hard (LeetCode) · 역할: 도전 · 목표 시간: 50분\n- 짝이 되는 장: 32. 투 포인터와 슬라이딩 윈도우\n\n## 문제 (요약)\n문자열 `s`와 `t`가 주어져요. `t`의 글자를 **개수까지 모두** 포함하는 `s`의 **연속한** 부분 문자열 중 가장 짧은 것을 돌려주세요. `t`에 같은 글자가 두 번 있으면 윈도에도 두 번 이상 있어야 해요. 그런 부분 문자열이 없으면 빈 문자열 `\"\"`을 돌려줘요.\n\n## 제약\n- 1 ≤ len(s), len(t) ≤ 100,000 (채점기의 큰 입력은 len(s) = 10,000이에요. 제한 시간을 짧게 잡았어요)\n- 영어 대문자와 소문자로만 되어 있어요. 대소문자는 다른 글자예요\n- 원문은 정답이 하나뿐인 입력만 줘요. 채점기는 길이가 같은 최소 윈도가 여럿이면 아무거나 받아요\n\n## 함수 시그니처\n```python\ndef min_window(s: str, t: str) -> str:\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 32/lc0076` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요. 채점기는 함수를 강제로 끊지 않아서, 느린 풀이는 큰 입력에서 몇 초 기다린 뒤 실패로 나와요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 어떤 모양의 문제인가<\/summary>\n\n\"연속\", \"가장 짧은\", \"조건을 만족하는\". 32장에서 이 세 단어가 같이 나온 문제가 있었어요. 백준 1806 「부분합」과 비교해 보세요. 그 문제의 \"합 ≥ S\"가 여기서는 무엇으로 바뀌었나요? 그리고 윈도를 늘리면 그 조건은 깨질 수 있나요?\n<\/details>\n\n<details><summary>힌트 2: 조건을 O(1)로 확인하기<\/summary>\n\n32장 3단계 템플릿 B예요. 오른쪽을 늘리다가 윈도가 `t`를 다 품으면, 품는 **동안** 기록하면서 왼쪽을 줄여요. 남은 문제는 \"다 품었나?\"를 매번 52글자를 비교하지 않고 아는 법이에요. `need = Counter(t)`(31장 기법 ③)로 \"글자별로 아직 더 필요한 개수\"를 들고, 그와 별도로 **아직 못 채운 글자 수** `missing` 하나를 들어 보세요. `missing == 0`이면 다 품은 거예요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- `missing`은 들어온 글자가 **아직 필요했을 때만**(`need[ch] > 0`) 줄여요. 이미 충분한 글자가 또 들어오면 줄이면 안 돼요. 그리고 `need[ch] -= 1`은 항상 해요(음수 = 남는 개수).\n- 뺄 때는 반대로 `need[s[l]] += 1` 한 뒤 **0보다 커지면** 다시 모자란 거라 `missing += 1`.\n- 기록은 줄이기 반복문 **안에서** 해요(\"가장 짧은\" 쪽이에요).\n- 매번 `s[l:r+1]`을 잘라 저장하면 복사가 생겨요. 시작 위치와 길이만 기억했다가 마지막에 한 번 자르세요.\n- `t`의 중복 글자를 `set`으로 다루면 틀려요.\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 76 Minimum Window Substring\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요. 도전 문제라서 중간 풀이를 거쳐 가요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"t의 글자를 개수까지 다 품는 s의 가장 짧은 연속 구간. 없으면 빈 문자열.\" 확인 질문은 이래요.\n- `t`에 같은 글자가 여럿이면? → **개수만큼** 있어야 해요. `t = \"aa\"`면 a가 두 개 필요해요.\n- 대소문자는 같은 글자인가요? → 달라요.\n- 순서도 맞아야 하나요? → 아니요, 품기만 하면 돼요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`s = \"XBQAYZCBA\"`, `t = \"ABC\"` → 끝의 `\"CBA\"`가 길이 3으로 가장 짧아요.\n경계: 답 없음(`\"ab\"`에서 `\"aa\"`, 또는 t가 s보다 김), t에 중복 글자, s와 t가 같음, 답이 s 전체, 앞쪽의 남는 글자를 버려야 짧아지는 경우(`\"aaaabc\"` → `\"abc\"`), 대소문자 구분.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n모든 시작점에서 오른쪽으로 가며 개수를 세다가 다 품으면 멈춰요. O(n²)이에요. n = 10만이면 100억 번. 채점기의 큰 입력처럼 t의 글자 하나가 s에 드물게만 있으면 시작점마다 수천 칸을 가야 해서 몇 초가 걸려요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n1806 「부분합」과 구조가 같아요. 조건 \"t를 다 품는다\"는 단조예요. 품는 윈도를 늘려도 계속 품고, 줄이면 언젠가 깨져요. 그래서 32장 템플릿 B(가장 짧은 유효 구간)가 그대로 맞아요. 오른쪽을 늘리다 유효해지면, 유효한 **동안** 기록하며 왼쪽을 줄여요.\n\n**중간 풀이: 매 단계 두 Counter를 비교 (O(Σ·n))**\n```python\nwant, have = Counter(t), Counter()\nl, best = 0, \"\"\nfor r, ch in enumerate(s):\n    have[ch] += 1\n    while all(have[c] >= k for c, k in want.items()):   # 매번 t의 글자 종류만큼 비교\n        if not best or r - l + 1 < len(best):\n            best = s[l:r + 1]                            # 매번 복사\n        have[s[l]] -= 1\n        l += 1\nreturn best\n```\n포인터 움직임은 이미 O(n)이에요. 그런데 \"다 품었나?\"를 확인할 때마다 t의 글자 종류(최대 52)만큼 비교하고, 기록할 때마다 문자열을 복사해요. 그래서 O(52·n)에 복사 비용이 더해져요. 이 채점기의 입력에서는 통과하지만, 글자 종류가 크면(유니코드) 병목이 되고, 면접관은 \"확인을 O(1)로 할 수 있나요?\"라고 물어요.\n\n**개선: 모자란 개수 하나만 들기**\n\"다 품었나?\"를 매번 다시 계산하지 말고, **변할 때만** 갱신하면 돼요. `need[c]`는 \"글자 c가 아직 더 필요한 개수\"(음수면 남는 개수), `missing`은 \"아직 못 채운 글자 수\"(중복 포함)예요. 글자가 들어올 때 그 글자가 아직 필요했으면 `missing`이 1 줄고, 나갈 때 그 글자가 모자라지면 1 늘어요. 그러면 확인은 `missing == 0` 한 번이에요.\n\n트리거 단어: \"연속\", \"가장 짧은\", \"모두 포함\" → 최소 윈도 + need/missing 카운터 (32장 템플릿 B).\n\n## 5. 코드\n```python\ndef min_window(s, t):\n    need = Counter(t)\n    missing = len(t)\n    l = 0\n    best_l, best_len = 0, len(s) + 1\n    for r, ch in enumerate(s):\n        if need[ch] > 0:\n            missing -= 1\n        need[ch] -= 1\n        while missing == 0:                 # 다 품은 동안\n            if r - l + 1 < best_len:        # 기록하고\n                best_l, best_len = l, r - l + 1\n            need[s[l]] += 1                 # 왼쪽을 내보내고\n            if need[s[l]] > 0:\n                missing += 1\n            l += 1\n    return s[best_l:best_l + best_len] if best_len <= len(s) else \"\"\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: 매 순간 `need[c]`는 \"t에 필요한 c의 수 − 윈도 `s[l..r]` 안 c의 수\"이고, `missing`은 양수인 `need[c]`들의 합, 즉 아직 못 채운 글자 수(중복 포함)예요. `missing == 0`이면 윈도가 t를 다 품어요.\n- **빠뜨리지 않는 이유**: \"t를 품는다\"는 윈도를 넓히면 유지되고 좁히면 언젠가 깨지는 단조 조건이에요. 끝이 r일 때 품는 가장 짧은 윈도는 `while`에서 `l`을 당기며 기록한 마지막 길이라서, 끝점마다 최소 후보를 다 봐요.\n- **끝나는 이유**: `r`과 `l`이 각각 최대 len(s)번 앞으로만 가고, 갱신은 한 번에 O(1)이라 O(len(s) + len(t))예요.\n- **깨지는 가정**: `need[ch] > 0`일 때만 `missing`을 줄여야 해요. 남는 글자(이미 충분한 글자)가 들어올 때도 줄이면 `missing`이 실제보다 빨리 0이 돼요. 답이 없으면 `best_len`이 `len(s) + 1`로 남아 빈 문자열을 돌려줘요.\n\n## 6. 예제로 추적 (확인)\n`s = \"XBQAYZCBA\"`, `t = \"ABC\"`, 처음 `missing = 3`\n| r | 글자 | missing (들어온 뒤) | while 안에서 (기록 → 내보내기) | l | 최선 |\n|---|---|---|---|---|---|\n| 0 | X | 3 | — | 0 | 없음 |\n| 1 | B | 2 | — | 0 | 없음 |\n| 2 | Q | 2 | — | 0 | 없음 |\n| 3 | A | 1 | — | 0 | 없음 |\n| 4–5 | Y, Z | 1 | — | 0 | 없음 |\n| 6 | C | 0 | `XBQAYZC` 기록 → X 내보냄(남는 글자라 missing 그대로) → `BQAYZC` 기록 → B 내보냄(missing 1) | 2 | BQAYZC |\n| 7 | B | 0 | `QAYZCB` → Q 내보냄 → `AYZCB` 기록 → A 내보냄(missing 1) | 4 | AYZCB |\n| 8 | A | 0 | `YZCBA` → `ZCBA` → `CBA` 기록 → C 내보냄(missing 1) | 7 | CBA |\n답 `\"CBA\"` ✓. r = 6에서 X를 내보낼 때 `need[X]`가 −1 → 0이라 \"0보다 커지지 않아서\" missing이 그대로인 걸 보세요.\n\n## 7. 복잡도\n`l`과 `r`이 각각 n번 이하로 움직이고, 한 걸음이 O(1)이라 **O(n + m)**(m = len(t), Counter 만들기). 공간은 글자 종류 수만큼 O(Σ). 중간 풀이는 O(Σ·n)에 복사 비용이 붙어요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| t를 `set`으로 다룸 (중복 무시) | `\"aab\"`, `\"aa\"`에서 `\"a\"`를 돌려줌 | 손 케이스 「t에 같은 글자 두 개」 |\n| `missing`을 \"t에 있는 글자\"면 무조건 줄임 | 남는 글자에도 줄어 missing이 음수, 엉뚱한 답이나 IndexError | 손 케이스 「답이 문자열 전체」 |\n| 기록을 줄이기 반복문 **뒤**에 함 | 이미 깨진 윈도를 기록 | 손 케이스 「기본」 |\n| 답 없을 때 처리 안 함 | `s` 전체나 이상한 조각을 돌려줌 | 손 케이스 「s에 글자가 모자람」 |\n| 시작점마다 다시 훑기 | 정답이지만 O(n²) | 큰 입력 (5초쯤) |\n\n## 9. 면접에서 30초로 설명하기\n\"t를 다 품는다는 조건은 윈도를 늘리면 유지되고 줄이면 깨지는 단조 조건이라 가변 윈도를 씁니다. 오른쪽을 늘리다 다 품으면, 품는 동안 길이를 기록하며 왼쪽을 줄입니다. 다 품었는지를 매번 비교하지 않으려고, 글자별로 더 필요한 개수와 전체 모자란 개수 하나를 들고, 글자가 들고 날 때만 갱신합니다. 그래서 확인이 O(1)이고 전체 O(n + m)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **순서까지 맞아야 한다면?** (LeetCode 727 Minimum Window Subsequence) 윈도의 단조성이 달라져서 이 풀이는 안 맞아요. 앞으로 t를 맞춰 가다 끝을 찾고, 거기서 뒤로 거슬러 시작을 좁히는 두 단계 탐색이나 DP로 가요.\n2. **t의 애너그램이 s에 있나?** (LeetCode 567) 길이가 len(t)로 **고정**이라 32장 5단계의 고정 윈도예요. `while`이 필요 없고, 같은 need/missing 아이디어로 O(n)이에요.\n3. **s가 스트림으로 들어온다면?** 윈도 방식은 앞에서부터 한 번만 읽어서 온라인으로 돌아요. 다만 지금 윈도 안의 글자를 다시 내보내야 하니 윈도 크기만큼은 덱에 들고 있어야 해요.\n\n## 11. 다시 풀기\n3일 뒤, 1주 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 25분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 567 Permutation in String, LeetCode 438 Find All Anagrams in a String, 백준 1644 「소수의 연속합」(같은 템플릿, 쉬운 쪽).\n", "starter": "# LeetCode 76 — 함수 몸통을 채우세요.  채점: python algo/judge.py 32/lc0076\n\n\ndef min_window(s: str, t: str) -> str:\n    pass\n"}, {"id": "32/lc0424", "chapter": "32", "slug": "lc0424", "title": "LeetCode 424 Longest Repeating Character Replacement", "kind": "func", "ext": ".py", "tier": "Medium (LeetCode)", "role": "핵심", "target": "30분", "url": "https://leetcode.com/problems/longest-repeating-character-replacement/", "time_limit": 0.15, "ref_time": 0.0027114579861517996, "problem": "# LeetCode 424 Longest Repeating Character Replacement\n\n- 원문: https://leetcode.com/problems/longest-repeating-character-replacement/\n- 난이도: Medium (LeetCode) · 역할: 핵심 · 목표 시간: 30분\n- 짝이 되는 장: 32. 투 포인터와 슬라이딩 윈도우\n\n## 문제 (요약)\n대문자로만 된 문자열 `s`와 정수 `k`가 주어져요. 아무 위치의 글자를 다른 대문자로 바꾸는 일을 **최대 k번** 할 수 있어요. 바꾼 뒤에 **같은 글자만 연속한** 부분 문자열을 가장 길게 만들면 그 길이는 얼마인가요?\n\n## 제약\n- 1 ≤ len(s) ≤ 100,000 (채점기의 큰 입력은 10,000이에요. 제한 시간을 짧게 잡았어요)\n- `s`는 영어 대문자로만 되어 있어요\n- 0 ≤ k ≤ len(s)\n\n## 함수 시그니처\n```python\ndef character_replacement(s: str, k: int) -> int:\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 32/lc0424` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요. 채점기는 함수를 강제로 끊지 않아서, 느린 풀이는 큰 입력에서 몇 초 기다린 뒤 실패로 나와요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 구간 하나가 되는지 판단하기<\/summary>\n\n연속 구간 하나를 정해 놓고 생각해 보세요. 이 구간을 전부 같은 글자로 만드는 데 필요한 최소 교체 횟수는 몇 번인가요? 어떤 글자로 통일하는 게 가장 싸죠? 이 판단을 O(1)에 할 수 있으면, 구간을 어떻게 움직일지만 남아요.\n<\/details>\n\n<details><summary>힌트 2: 윈도가 유효하다는 조건<\/summary>\n\n구간에서 **가장 많은 글자**만 남기고 나머지를 바꾸는 게 가장 싸요. 그래서 윈도가 유효하다는 조건은 `윈도 길이 − 최빈 글자 수 ≤ k`예요. 윈도 안 글자별 개수는 길이 26짜리 배열(31장 기법 ③ 빈도 세기)로 들어요. 이 조건이 깨지는 동안 왼쪽을 줄이고, 줄이기가 끝난 뒤 기록해요. \"가장 긴\" 문제니까 32장 4단계, 템플릿 C 모양이에요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 최빈 글자 수는 \"방금 들어온 글자의 개수\"가 아니라 **윈도 안 모든 글자 중 최대**예요.\n- 기록은 줄이기가 끝난 **뒤**에 해요.\n- 줄일 때 최빈 글자 수를 매번 `max(count)`로 다시 구해도 26칸이라 O(26n)으로 통과해요. 더 빠른 \"최빈 수를 줄이지 않는\" 기법은 walkthrough에서 다뤄요.\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 424 Longest Repeating Character Replacement\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"글자를 최대 k개 바꿔서 만들 수 있는 같은 글자 연속 구간의 최대 길이.\" 확인 질문은 이래요.\n- 바꿀 글자를 구간마다 다르게 골라도 되나요? → 네, 아무 대문자로나 바꿔요.\n- k = 0이면? → 원래 문자열에서 같은 글자가 가장 길게 이어지는 길이예요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`\"CABBBBAB\"`, k = 1 → `\"BBBBAB\"`에서 A 하나를 B로 바꾸면 B가 6개 연속. 답 **6**.\n경계: k = 0(`\"ABBBCCDDDDA\"` → 4), k가 길이 이상(전체 길이), 한 글자, 같은 글자만, 최빈 글자가 구간마다 바뀌는 경우(`\"ABAB\"`, k = 2 → 4).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n모든 구간 `(i, j)`에 대해 `길이 − 최빈 글자 수 ≤ k`인지 봐요. 시작점마다 개수 배열을 늘려 가면 O(n²) = 100억(n = 10만) → 시간 초과예요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n핵심은 **유효 조건을 스스로 세우는 것**이에요. 구간을 같은 글자로 통일하는 최소 비용은 \"최빈 글자를 남기고 나머지를 다 바꾸기\"라서, 유효 조건은 `(r − l + 1) − maxf ≤ k`예요.\n이 조건은 단조예요. 유효한 구간 안의 작은 구간도 유효해요(길이가 1 줄면 비용이 늘지 않아요). 그래서 오른쪽 끝을 늘리는 동안 왼쪽 끝은 되돌아갈 필요가 없어요. 가변 윈도예요.\n\n**중간 풀이: 매번 최빈 수를 다시 구하기 (O(26n))**\n```python\ncount = [0] * 26\nl = best = 0\nfor r, ch in enumerate(s):\n    count[ord(ch) - 65] += 1\n    while (r - l + 1) - max(count) > k:\n        count[ord(s[l]) - 65] -= 1\n        l += 1\n    best = max(best, r - l + 1)\n```\n이것도 통과해요. 글자 종류가 26개로 고정이라 `max(count)`가 상수 시간이거든요. 그런데 글자 종류가 크면(유니코드라면) 이 `max`가 병목이 돼요.\n\n**개선: 최빈 수를 줄이지 않기**\n`maxf`를 \"지금까지 본 최빈 수의 최댓값\"으로 두고 왼쪽을 줄여도 **낮추지 않아요.** 그래도 답이 맞는 이유는 이래요. 답이 커지려면 `r − l + 1 − maxf ≤ k`에서 길이가 지금 best보다 커져야 하고, 그러려면 maxf가 **이전 최고 기록보다 커져야** 해요. 낡은 maxf 때문에 윈도가 잠시 \"유효하지 않은데 유효하다고\" 여겨져도, 그 윈도 길이는 이미 기록된 best를 넘지 못해서 답을 망치지 않아요. 이 덕분에 줄이기도 한 번에 최대 한 칸이라 `while`이 `if`처럼 동작해요.\n\n트리거 단어: \"최대 k번 바꿔서\", \"연속\", \"가장 긴\" → 가변 윈도 + 빈도 배열, 유효 조건 `길이 − 최빈 수 ≤ k` (32장 템플릿 C).\n\n## 5. 코드\n```python\ndef character_replacement(s, k):\n    count = [0] * 26\n    l = best = maxf = 0\n    for r, ch in enumerate(s):\n        i = ord(ch) - 65\n        count[i] += 1\n        maxf = max(maxf, count[i])\n        while (r - l + 1) - maxf > k:\n            count[ord(s[l]) - 65] -= 1\n            l += 1\n        best = max(best, r - l + 1)\n    return best\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `count[c]`는 윈도 `s[l..r]` 안 글자 c의 수예요. `maxf`는 지금까지 어떤 윈도에서든 본 최빈 수의 최댓값이고, 윈도 길이는 줄지 않고, 매 반복이 끝나면 `best`와 같아요.\n- **빠뜨리지 않는 이유**: 답이 `best`보다 커지려면 길이 − `maxf` ≤ k에서 `maxf`가 이전 기록보다 커져야 해요. 그 순간 `count[i]`가 새 기록을 세우며 `maxf`가 실제로 오르니 놓치지 않아요. 낡은 `maxf`로 유효하다고 착각한 윈도도 길이가 기존 `best`를 넘지 않아 답을 망치지 않아요.\n- **끝나는 이유**: `r`과 `l`이 각각 최대 n번 앞으로만 가서 O(n)이에요(글자 종류 26개 고정).\n- **깨지는 가정**: 글자가 대문자만이라 `ord(ch) - 65`가 0~25예요. 소문자가 섞이면 인덱스가 범위를 넘어요. 왼쪽을 줄일 때 `maxf`를 `max(count)`로 다시 낮추지 않아도 되는 건 위의 \"답은 `maxf`가 오를 때만 커진다\"는 논리 덕분이에요.\n\n## 6. 예제로 추적 (확인)\n`\"CABBBBAB\"`, k = 1\n| r | 글자 | maxf | 줄이기 | 윈도 | 길이 − maxf | best |\n|---|---|---|---|---|---|---|\n| 0 | C | 1 | — | C | 0 | 1 |\n| 1 | A | 1 | — | CA | 1 | 2 |\n| 2 | B | 1 | C를 뺌 | AB | 1 | 2 |\n| 3 | B | 2 | — | ABB | 1 | 3 |\n| 4 | B | 3 | — | ABBB | 1 | 4 |\n| 5 | B | 4 | — | ABBBB | 1 | 5 |\n| 6 | A | 4 | A를 뺌 | BBBBA | 1 | 5 |\n| 7 | B | 5 | — | BBBBAB | 1 | 6 |\n답 6 ✓\n\n## 7. 복잡도\n`l`은 전체에서 n번 이하로 증가하고, 단계마다 O(1)이라 **O(n)**. 중간 풀이는 O(26n). 공간은 개수 배열 O(26) = **O(1)**.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `maxf`를 방금 들어온 글자의 개수로 덮어씀 | 최빈 수가 작아져 윈도를 너무 줄임 (5) | 손 케이스 「끝쪽에서 최대」 |\n| 줄이기 **전에** 기록 | 유효하지 않은 윈도를 셈 (4) | 손 케이스 「하나만 바꿀 수 있음」 |\n| 유효 조건을 \"서로 다른 글자 수 ≤ k + 1\"로 세움 | 개수를 무시해서 틀림 | 손 케이스 「끝쪽에서 최대」 |\n| 시작점마다 개수 배열을 다시 셈 | 정답이지만 O(n²) | 큰 입력 (10초쯤) |\n\n## 9. 면접에서 30초로 설명하기\n\"구간을 같은 글자로 만드는 최소 교체 수는 길이에서 최빈 글자 수를 뺀 값이라, 유효 조건은 '길이 − 최빈 수 ≤ k'입니다. 이 조건은 구간을 줄이면 계속 성립하니 가변 윈도를 씁니다. 글자별 개수를 26칸 배열로 들고, 조건이 깨지는 동안 왼쪽을 줄인 뒤 길이를 기록합니다. O(n) 시간, O(1) 공간입니다. 최빈 수를 줄이지 않고 최고 기록으로 두어도 답이 커지는 순간에는 정확하다는 점을 이용하면 max 재계산도 필요 없습니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **`maxf`를 줄이지 않아도 되는 이유를 한 문장으로?** \"답이 커지려면 최빈 수가 이전 최고보다 커져야 하므로, 낡은 최빈 수로 잘못 판단한 윈도는 기존 답보다 길 수 없습니다.\"\n2. **글자 종류가 아주 많다면?** 개수는 `dict`(Counter)로 들고, `maxf` 기법을 쓰면 여전히 O(n)이에요. 중간 풀이의 `max(count.values())`는 O(Σ)가 돼서 느려져요.\n3. **0과 1로 된 배열에서 0을 최대 k개 1로 바꿔 만든 가장 긴 1의 연속은?** (LeetCode 1004) 같은 틀이에요. 유효 조건이 \"윈도 안 0의 개수 ≤ k\"로 더 단순해져요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 15분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 1004 Max Consecutive Ones III, LeetCode 340 Longest Substring with At Most K Distinct Characters.\n", "starter": "# LeetCode 424 — 함수 몸통을 채우세요.  채점: python algo/judge.py 32/lc0424\n\n\ndef character_replacement(s: str, k: int) -> int:\n    pass\n"}, {"id": "33/boj11003", "chapter": "33", "slug": "boj11003", "title": "백준 11003 최솟값 찾기", "kind": "stdio", "ext": ".py", "tier": "Gold I (solved.ac)", "role": "도전", "target": "50분", "url": "https://solved.ac/problems/id/11003", "time_limit": 2.5, "ref_time": 1.192693999997573, "problem": "# 백준 11003 최솟값 찾기\n\n- 원문: https://solved.ac/problems/id/11003\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold I (solved.ac) · 역할: 도전 · 목표 시간: 50분\n- 짝이 되는 장: 33. 스택과 큐\n\n## 문제 (요약)\n수 N개와 길이 L이 주어져요. 각 위치 i(1부터)마다 **i에서 끝나는 길이 L짜리 구간**, 즉 i-L+1번부터 i번까지의 최솟값을 구해서 순서대로 출력하세요. 구간이 1번보다 앞으로 넘어가면 넘어간 부분은 빼고 생각해요(처음 L-1개는 앞쪽 일부만 봐요).\n\n## 제약\n- 1 ≤ L ≤ N ≤ 5,000,000\n- 각 값은 -10⁹ 이상 10⁹ 이하\n- 입력: 첫 줄 `N L`, 둘째 줄 수 N개 / 출력: N개의 최솟값을 공백으로 구분해 한 줄\n- 채점기의 큰 입력은 N = 3,000,000이에요(파이썬으로 로컬에서 시간 차이를 보기 좋은 크기). 백준에서 Python 3로 시간이 빠듯하면 PyPy3로 내 보세요.\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 33/boj11003` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 합은 빼면 되는데, 최솟값은?<\/summary>\n\n32장의 고정 윈도에서는 들어온 값을 더하고 나간 값을 빼서 합을 O(1)에 유지했어요. 최솟값은 \"빼기\"가 안 돼요. 나간 값이 최솟값이었다면 다음 최솟값이 누구인지 모르니까요. 그럼 **다음 최솟값이 될 수 있는 후보**만 들고 있으면 어떨까요? 새 값 `x`가 들어왔을 때, 윈도 안에서 `x`보다 왼쪽에 있고 `x` 이상인 값은 앞으로 최솟값이 될 수 있나요?\n<\/details>\n\n<details><summary>힌트 2: 가려진 후보는 영원히 쓸모없어요<\/summary>\n\n`x`보다 왼쪽에 있고 `x` 이상인 값은 `x`보다 **먼저** 윈도를 떠나고, 떠나기 전까지는 늘 `x`가 더 작아요. 그러니 버려도 돼요. 남은 후보들은 왼쪽→오른쪽으로 값이 커지는 줄이 되고, 맨 앞이 최솟값이에요. 버리기는 **뒤**에서(새 값에게 가려진 후보), 또 **앞**에서(윈도를 벗어난 후보) 일어나요. 양쪽 끝을 다 쓰는 그릇, 33장 7단계의 모노토닉 덱이에요. 거기서는 최댓값이었고 여기서는 부등호만 뒤집혀요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 덱에는 **인덱스**를 넣어요. 값만 넣으면 \"이 후보가 윈도를 벗어났는지\"를 알기 어려워요(같은 값이 여러 개일 때 특히).\n- 벗어남 조건은 `dq[0] <= i - L`이에요. 윈도는 `[i-L+1, i]`라서 `i-L`은 이미 밖이에요. `<`로 쓰면 한 칸 늦게 버려요.\n- 처음 L-1개도 출력해야 해요. `i >= L-1`일 때만 출력하면 안 돼요(LeetCode 239와 다른 점).\n- 입출력이 수백만 개예요. `sys.stdin.buffer.read().split()`로 읽고, 답은 리스트에 모아 `' '.join`으로 한 번에 써요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 11003 최솟값 찾기\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요. 도전 문제라서 중간 단계 풀이(힙)도 같이 적었어요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"길이 L인 고정 윈도를 오른쪽으로 밀면서 매번 최솟값. 앞쪽 L-1개는 잘린 윈도.\" 확인 질문:\n- 처음 L-1개도 출력하나요? → **예** (LeetCode 239는 안 해요. 여기가 다른 점)\n- 값 범위는요? → 음수 포함 ±10⁹\n- N은요? → **500만**. O(N log N)도 파이썬에선 위험해요\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`N=8, L=3`, `4 2 7 1 5 6 3 8` → `4 2 2 1 1 1 3 3`. 6번째(값 3)에서 윈도는 `5 6 3`이라 1이 빠지고 답이 3으로 바뀌어요.\n경계: L = 1(입력 그대로), L > 실제로 볼 수 있는 길이(앞부분 누적 최솟값), 같은 값 연속, 증가 수열(최솟값이 매번 윈도 밖으로 나감), 감소 수열(새 값이 매번 최솟값).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n매 i마다 `min(a[i-L+1 : i+1])` → **O(NL)**. N = 300만, L = 1,000이면 30억 번이라 채점기 큰 입력에서 강제 종료돼요.\n**면접 팁**: 브루트포스를 먼저 말하고 복잡도를 붙이면, 최적화를 못 해도 기본 점수를 받아요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n### 중간 단계: 힙 (O(N log N), 맞지만 충분하지 않아요)\n\"최솟값을 빨리\"라는 말에 먼저 떠오르는 건 최소 힙이에요. `(값, 인덱스)`를 넣고, 맨 위가 윈도 밖이면 그때 버려요(지연 삭제).\n```python\nimport heapq\nh = []\nfor i, x in enumerate(a):\n    heapq.heappush(h, (x, i))\n    while h[0][1] <= i - l:        # 맨 위가 윈도 밖이면 버려요\n        heapq.heappop(h)\n    out.append(h[0][0])\n```\n정답은 맞아요. 그런데 **윈도 밖의 오래된 값이 힙에 계속 남아요**. 대체로 줄어드는 입력에서는 새 값이 거의 매번 최솟값이라 뿌리까지 올라가고, 오래된 큰 값들은 맨 위로 올라올 일이 없어서 힙이 N 크기로 불어나요. 채점기 큰 입력에서 약 4.9초(제한 2.5초)로 걸려요. 30장 도구 상자 표 기준으로도 O(N log N)에 튜플 비교 상수가 붙어요.\n\n### 최적: 버릴 수 있는 걸 일찍 버리기\n힙은 \"언젠가 쓸모없어질 값\"을 들고 다녀요. 언제 쓸모없어지는지 정확히 말해 보면,\n- 새 값 `x`가 들어오면, 윈도 안에서 `x`보다 왼쪽에 있고 `x` **이상**인 값은 `x`보다 먼저 떠나고, 떠나기 전까지 늘 `x`가 더 작아요. **앞으로 어떤 윈도에서도 최솟값이 될 수 없어요.** 지금 버려요.\n- 그렇게 버리고 나면 남은 후보는 앞→뒤로 값이 커지고(오름차순), 맨 앞이 현재 최솟값이에요.\n- 맨 앞이 윈도를 벗어나면 앞에서 버려요.\n버리기가 뒤에서도, 앞에서도 일어나니 스택이 아니라 덱이에요.\n\n트리거 단어: \"고정 길이 윈도\", \"각 위치마다 최솟값/최댓값\" → 모노토닉 덱 (33장 7단계, 템플릿 4. 거기서는 최댓값).\n\n## 5. 코드\n```python\nimport sys\nfrom collections import deque\ndata = sys.stdin.buffer.read().split()\nn, l = int(data[0]), int(data[1])\na = list(map(int, data[2:2 + n]))\ndq, out = deque(), []                  # dq: 인덱스, 값은 앞→뒤로 커져요\nfor i, x in enumerate(a):\n    while dq and a[dq[-1]] >= x:       # 뒤: x에게 가려진 후보 버리기\n        dq.pop()\n    dq.append(i)\n    if dq[0] <= i - l:                 # 앞: 윈도 [i-L+1, i] 밖이면 버리기\n        dq.popleft()\n    out.append(a[dq[0]])               # 앞이 최솟값\nsys.stdout.write(' '.join(map(str, out)) + '\\n')\n```\n앞에서는 한 번에 많아야 하나만 벗어나요(매 칸 윈도가 한 칸씩 밀리니까요). 그래서 `while`이 아니라 `if`로 충분해요.\n\n## 왜 이 코드가 정답인가\n- **불변식**: 매 반복이 끝나면 `dq`에는 윈도 `[i-L+1, i]` 안의 인덱스만 있고, 그 값 `a[dq[...]]`는 앞→뒤로 엄격히 커져요. 맨 앞 `a[dq[0]]`이 윈도의 최솟값이에요.\n- **빠뜨리지 않는 이유**: 뒤에서 버리는 값은 `x` 이상이면서 `x`보다 먼저 윈도를 떠나요. 남아 있는 동안 늘 `x`가 더 작거나 같으니 어떤 윈도에서도 답이 될 수 없어요. 그래서 버려도 최솟값 후보를 놓치지 않아요.\n- **끝나는 이유**: 인덱스마다 덱에 한 번 들어가고 많아야 한 번 나와서 전체 O(N)이에요. 윈도가 한 칸씩 밀리니 앞에서는 한 번에 하나만 벗어나 `if`로 충분해요.\n- **깨지는 가정**: 덱에 값이 아니라 인덱스를 넣어야 윈도 밖인지 `dq[0] <= i - l`로 알 수 있어요. 값을 넣으면 같은 값이 여러 개일 때 언제 빼야 할지 몰라요. 처음 L−1칸은 `dq[0] <= i - l`이 거짓이라 잘린 윈도의 최솟값을 그대로 내요.\n\n## 6. 예제로 추적 (확인)\n`N=8, L=3`, `4 2 7 1 5 6 3 8` (덱은 `인덱스(값)`, 앞→뒤)\n| i | x | 뒤에서 버림 | 앞에서 버림 | 덱 | 출력 |\n|---|---|---|---|---|---|\n| 0 | 4 | — | — | `0(4)` | 4 |\n| 1 | 2 | `0(4)` | — | `1(2)` | 2 |\n| 2 | 7 | — | — | `1(2) 2(7)` | 2 |\n| 3 | 1 | `2(7)`, `1(2)` | — | `3(1)` | 1 |\n| 4 | 5 | — | — | `3(1) 4(5)` | 1 |\n| 5 | 6 | — | — | `3(1) 4(5) 5(6)` | 1 |\n| 6 | 3 | `5(6)`, `4(5)` | `3(1)` (3 ≤ 6-3) | `6(3)` | 3 |\n| 7 | 8 | — | — | `6(3) 7(8)` | 3 |\n출력 `4 2 2 1 1 1 3 3` ✓\n\n## 7. 복잡도\n각 인덱스는 덱에 한 번 들어가고 많아야 한 번 나가요(뒤로든 앞으로든) → **O(N)**. 덱 크기는 많아야 L → 추가 메모리 **O(L)** (입출력 배열은 O(N)). 로컬에서 300만 개에 약 1.5초예요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 벗어남을 `dq[0] < i - L`로 | 윈도 밖 값을 한 칸 더 들고 있음 | 손 케이스 01 |\n| 덱에 값만 넣고 `a[i-L]`과 같으면 앞을 뺌 (+ `>=`로 버림) | 같은 값이 있을 때 엉뚱한 후보를 뺌 | 손 케이스 05 |\n| `i >= L-1`일 때만 출력 | 출력 개수가 모자람 | 손 케이스 01 |\n| 힙 + 지연 삭제 | 정답이지만 O(N log N) | 큰 입력 |\n| 매번 `min(슬라이스)` | 정답이지만 O(NL) | 큰 입력 (강제 종료) |\n\n## 9. 면접에서 30초로 설명하기\n\"덱에 인덱스를 담고 값이 앞에서 뒤로 커지도록 유지합니다. 새 값이 들어오면 뒤에서 그보다 크거나 같은 후보를 모두 버립니다. 그 후보들은 새 값보다 먼저 윈도를 떠나고 그동안 늘 새 값보다 크니 다시는 최솟값이 될 수 없기 때문입니다. 그다음 앞이 윈도를 벗어났으면 버리고, 덱의 앞을 답으로 씁니다. 각 인덱스가 한 번 들어가고 한 번 나가서 O(N)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **힙으로도 되지 않나요?** 돼요. `(값, 인덱스)`를 넣고 맨 위가 윈도 밖이면 버리는 지연 삭제로 O(N log N)이에요. 덱은 쓸모없어진 후보를 바로 버려서 O(N)이고, 이 문제처럼 N이 크면 그 차이가 통과와 시간 초과를 가르기도 해요.\n2. **뒤에서 버릴 때 `>=` 대신 `>`를 쓰면 틀리나요?** 틀리진 않아요. 같은 값이 덱에 여러 개 남을 뿐이고, 인덱스로 벗어남을 판단하니 답은 같아요. 덱이 조금 길어질 뿐이에요. 다만 값으로 벗어남을 판단하는 변형에서는 `>`로 같은 값을 남겨야만 맞아요.\n3. **윈도 길이가 고정이 아니라 조건으로 늘었다 줄었다 하면요?** 32장의 가변 윈도와 합쳐요. 오른쪽 끝을 늘릴 때 덱 뒤에서 버리고, 왼쪽 끝을 당길 때 덱 앞이 그 인덱스면 버려요. 예: LeetCode 1438 (최댓값 덱과 최솟값 덱을 둘 다 써서 \"최대 - 최소 ≤ limit\"인 가장 긴 구간).\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 25분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 239 Sliding Window Maximum(최댓값 버전, 처음 L-1개는 출력 안 함), LeetCode 1438, 백준 6549 「히스토그램에서 가장 큰 직사각형」(모노토닉 스택으로 이어지는 도전).\n", "starter": "# 백준 11003 최솟값 찾기 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 33/boj11003\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "33/boj17298", "chapter": "33", "slug": "boj17298", "title": "백준 17298 오큰수", "kind": "stdio", "ext": ".py", "tier": "Gold IV (solved.ac)", "role": "핵심", "target": "25분", "url": "https://solved.ac/problems/id/17298", "time_limit": 1.5, "ref_time": 0.32587987498845905, "problem": "# 백준 17298 오큰수\n\n- 원문: https://solved.ac/problems/id/17298\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold IV (solved.ac) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 33. 스택과 큐\n\n## 문제 (요약)\n길이 N인 수열이 있어요. 각 원소마다 **자기보다 오른쪽에 있으면서 자기보다 큰 수 중 가장 왼쪽에 있는 수**를 구해서 한 줄에 출력하세요. 그런 수가 없으면 -1을 출력해요. 같은 값은 \"큰 수\"가 아니에요.\n\n## 제약\n- 1 ≤ N ≤ 1,000,000\n- 각 원소는 1 이상 1,000,000 이하\n- 입력: 첫 줄 `N`, 둘째 줄 수열 / 출력: N개의 답을 공백으로 구분해 한 줄\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 33/boj17298` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 오른쪽을 매번 다시 훑으면<\/summary>\n\n각 원소에서 오른쪽으로 훑으면 `9 8 7 … 1 10` 같은 입력에서 거의 모든 원소가 끝까지 훑어요. N = 100만이면 O(N²)은 절대 안 돼요. 거꾸로 생각해 보세요. 새 원소 `x`를 읽었을 때, **`x`가 답이 되어 주는 원소**는 누구인가요?\n<\/details>\n\n<details><summary>힌트 2: 아직 답을 못 찾은 원소만 쌓아 두기<\/summary>\n\n아직 오큰수를 못 찾은 원소들을 모아 두면, 그 값들은 왼쪽에서 오른쪽으로 갈수록 **작아지는(같을 수도 있는) 모양**이에요. 더 큰 값이 그 사이에 있었다면 이미 답을 찾았을 테니까요. 그래서 새 값 `x`와 비교할 건 **가장 최근에 넣은 것**부터예요. 33장 6단계 Daily Temperatures와 같은 구조예요. 답이 \"거리\"가 아니라 \"값\"이라는 것만 달라요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 꺼내는 조건은 `a[top] < x`예요. `<=`로 쓰면 같은 값을 오큰수로 잡아요 (`5 5 5 5`는 전부 -1).\n- 스택에는 **인덱스**를 넣어야 `ans[j] = x`로 답을 제자리에 적을 수 있어요. 답에는 인덱스가 아니라 값 `x`를 적어요.\n- 끝까지 스택에 남은 원소의 답은 -1이에요. `ans = [-1] * n`으로 시작하면 따로 처리할 필요가 없어요.\n- 입출력이 100만 개예요. `sys.stdin.buffer.read().split()`로 읽고 `' '.join(map(str, ans))`로 한 번에 써요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 17298 오큰수\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"각 원소마다 오른쪽에서 처음 만나는 더 큰 값. 없으면 -1.\" 확인 질문:\n- 같은 값은 더 큰 값인가요? → **아니요, 엄격하게 큰 값만**\n- 답이 인덱스인가요, 값인가요? → **값**\n- N이 얼마나 큰가요? → **100만**. O(N log N)도 파이썬에선 빠듯하니 O(N)을 노려요\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`2 9 4 4 6 1` → `9 -1 6 6 -1 -1`. 두 4는 둘 다 6을 기다렸다가 같이 답을 받아요.\n경계: 원소 하나(-1), 전부 같은 값(전부 -1), 증가 수열(바로 옆이 답), 감소하다 마지막에 큰 값(전부 그 값).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n각 i에서 j = i+1부터 오른쪽으로 훑다가 처음으로 더 큰 값을 만나면 멈춰요. 무작위 입력에선 금방 멈추지만, 줄어드는 수열이 길면 최악 **O(N²)** = 5천억 번이에요. 채점기 큰 입력(앞 절반이 줄어드는 수열)에서 시간 초과로 강제 종료돼요.\n**면접 팁**: 무작위 입력이 빠르다고 안심하지 말고, 최악 입력을 먼저 찾아 말해요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n브루트포스는 \"i의 답 찾기\"를 i마다 따로 해서, 같은 구간을 몇 번이고 다시 훑어요. 시점을 뒤집어 보면,\n- 새 값 `x`가 들어올 때, 아직 답이 없는 원소 중 `x`보다 작은 것들은 **지금 답이 `x`로 확정**돼요.\n- 아직 답이 없는 원소들은 값이 아래로 갈수록 크거나 같아요(감소 스택). 그러니 맨 위부터 `x`보다 작은 동안만 꺼내면 되고, 처음으로 `x` 이상인 원소에서 멈춰도 그 아래는 볼 필요가 없어요.\n- 꺼내진 원소는 답을 찾았으니 다시 볼 일이 없어요. 이게 \"정보를 버리지 않는다\"예요.\n\n트리거 단어: \"각 원소마다\", \"오른쪽에서 처음으로 더 큰\" → 모노토닉 스택 (33장 6단계, 템플릿 3).\n\n## 5. 코드\n```python\nimport sys\ndata = sys.stdin.buffer.read().split()\nn = int(data[0])\na = list(map(int, data[1:1 + n]))\nans = [-1] * n\nst = []                               # 답을 못 찾은 인덱스\nfor i, x in enumerate(a):\n    while st and a[st[-1]] < x:       # x가 톱보다 크면\n        ans[st.pop()] = x             # 톱의 오큰수는 x로 확정\n    st.append(i)\nsys.stdout.write(' '.join(map(str, ans)) + '\\n')\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `x`를 보기 직전 `st`에는 아직 오큰수를 못 찾은 인덱스가 들어 있고, 그 값은 아래일수록 크거나 같아요.\n- **빠뜨리지 않는 이유**: 스택 원소 j의 오큰수는 j보다 오른쪽에서 처음 나오는 더 큰 값이에요. j가 아직 스택에 있다는 건 그 사이에 `a[j]`보다 큰 값이 없었다는 뜻이라, 처음으로 `a[st[-1]] < x`가 되는 순간의 `x`가 바로 답이에요. 위가 `x` 이상이면 그 아래는 더 크거나 같으니 볼 필요가 없어요.\n- **끝나는 이유**: 인덱스마다 한 번 push, 많아야 한 번 pop이라 O(N)이에요. 끝까지 남은 인덱스는 `ans`의 초깃값 -1이 답이에요.\n- **깨지는 가정**: 비교가 `<`라서 같은 값은 오큰수가 아니에요. `<=`로 바꾸면 같은 값이 서로의 답이 돼서 틀려요.\n\n## 6. 예제로 추적 (확인)\n`2 9 4 4 6 1` (스택은 `인덱스(값)`, 아래→위)\n| i | x | 꺼낸 것 (답 확정) | 넣은 뒤 스택 | ans |\n|---|---|---|---|---|\n| 0 | 2 | — | `0(2)` | -1 -1 -1 -1 -1 -1 |\n| 1 | 9 | `0(2)` → 9 | `1(9)` | 9 -1 -1 -1 -1 -1 |\n| 2 | 4 | — | `1(9) 2(4)` | 9 -1 -1 -1 -1 -1 |\n| 3 | 4 | — (4 < 4는 거짓) | `1(9) 2(4) 3(4)` | 9 -1 -1 -1 -1 -1 |\n| 4 | 6 | `3(4)` → 6, `2(4)` → 6 | `1(9) 4(6)` | 9 -1 6 6 -1 -1 |\n| 5 | 1 | — | `1(9) 4(6) 5(1)` | 9 -1 6 6 -1 -1 |\n남은 1, 4, 5번은 -1. 답 `9 -1 6 6 -1 -1` ✓\n\n## 7. 복잡도\n`for` 안에 `while`이 있어도 각 인덱스는 정확히 한 번 push, 많아야 한 번 pop돼요 → **O(N)**. 스택과 답 배열 **O(N)**. 100만 개에서 파이썬으로 약 0.6초예요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `<=`로 꺼냄 | 같은 값을 오큰수로 잡음 (01에서 첫 4의 답이 4) | 손 케이스 01, 03 |\n| 답에 인덱스 `i`를 적음 | 값 대신 위치가 나옴 | 손 케이스 01 |\n| 오른쪽을 매번 훑음 | 정답이지만 최악 O(N²) | 큰 입력 (강제 종료) |\n| `print`를 100만 번 | 정답이지만 출력이 두 배쯤 느려짐 (로컬 약 1.3초) | 큰 입력에서 아슬아슬, 백준에선 위험 |\n\n## 9. 면접에서 30초로 설명하기\n\"아직 오큰수를 못 찾은 인덱스를 스택에 쌓습니다. 새 값이 들어오면 스택 톱의 값이 새 값보다 작은 동안 꺼내면서 그 원소의 답을 새 값으로 확정합니다. 그래서 스택은 아래로 갈수록 크거나 같은 값이 유지되고, 끝까지 남은 원소는 -1입니다. 각 인덱스가 한 번 들어가고 많아야 한 번 나가서 O(N)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **\"오른쪽에서 처음으로 더 작은 수\"라면요?** 부등호만 뒤집어요. `a[top] > x`일 때 꺼내고, 스택은 아래로 갈수록 작아져요(증가 스택). 외우지 말고 \"꺼내고 남는 쪽이 어느 쪽인가\"로 유도해요.\n2. **\"왼쪽에서 가장 가까운 더 큰 수\"라면요?** 같은 스택을 쓰되, 꺼내기를 마친 **뒤에** 남은 톱이 답이에요 (백준 2493 「탑」). 오른쪽 방향은 \"꺼낼 때 답 확정\", 왼쪽 방향은 \"꺼낸 뒤 톱이 답\"이에요.\n3. **배열이 원형이면요?** 인덱스를 `0..2N-1`로 두 바퀴 돌고 `i % N`으로 읽어요. 두 번째 바퀴에서는 push하지 않아도 돼요 (LeetCode 503 Next Greater Element II).\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 12분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 739 Daily Temperatures(33장 끝까지 따라가기 ①), 프로그래머스 「주식가격」, 백준 17299 「오등큰수」, 백준 2493 「탑」.\n", "starter": "# 백준 17298 오큰수 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 33/boj17298\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "33/lc0020", "chapter": "33", "slug": "lc0020", "title": "LeetCode 20 Valid Parentheses", "kind": "func", "ext": ".py", "tier": "Easy (LeetCode)", "role": "워밍업", "target": "15분", "url": "https://leetcode.com/problems/valid-parentheses/", "time_limit": 1.0, "ref_time": 0.0040220830123871565, "problem": "# LeetCode 20 Valid Parentheses\n\n- 원문: https://leetcode.com/problems/valid-parentheses/\n- 난이도: Easy (LeetCode) · 역할: 워밍업 · 목표 시간: 15분\n- 짝이 되는 장: 33. 스택과 큐\n\n## 문제 (요약)\n`(`, `)`, `[`, `]`, `{`, `}` 여섯 글자로만 된 문자열이 주어져요. 모든 여는 괄호가 **같은 종류의** 닫는 괄호로, **올바른 순서로** 닫히면 `True`, 아니면 `False`를 돌려주세요. 닫는 괄호는 반드시 짝이 되는 여는 괄호가 먼저 있어야 해요.\n\n## 제약\n- 1 ≤ `len(s)` ≤ 10⁴ (채점기의 큰 입력은 시간 차이를 보려고 80,000으로 늘렸어요)\n- `s`에는 위 여섯 글자만 있어요\n\n## 함수\n```python\ndef is_valid(s: str) -> bool\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 33/lc0020` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 개수만 세면 왜 안 되나<\/summary>\n\n`([)]`는 `(`와 `)`가 하나씩, `[`와 `]`가 하나씩이에요. 개수는 맞는데 틀린 문자열이에요. 닫는 괄호를 만났을 때 **어느 여는 괄호와 짝이 되어야 하는지** 생각해 보세요. 가장 먼저 열린 것인가요, 가장 최근에 열린 것인가요?\n<\/details>\n\n<details><summary>힌트 2: \"지금 열려 있는 것 중 가장 최근 것\"<\/summary>\n\n닫는 괄호는 항상 **가장 최근에 열린** 괄호와 짝이 돼요. 마지막에 넣은 것을 먼저 꺼내는 그릇이 필요해요. 33장 1단계에서 `\"([{}])\"`를 따라간 방식 그대로예요. 여는 괄호는 쌓고, 닫는 괄호가 나오면 맨 위와 비교해요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 닫는 괄호가 나왔는데 쌓인 게 **없으면** 바로 `False`예요. 확인 없이 `pop()`하면 `IndexError`가 나요 (`\"]\"`, `\"()]\"`).\n- 문자열을 다 읽은 뒤에도 쌓인 게 남아 있으면 `False`예요 (`\"((\"`). 마지막 줄은 `return True`가 아니라 `return not st`예요.\n- 닫는 괄호 → 여는 괄호 딕셔너리를 하나 두면 `if`를 여섯 번 쓰지 않아도 돼요.\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 20 Valid Parentheses\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"괄호 세 종류가 섞인 문자열. 같은 종류끼리, 안쪽부터 바깥쪽 순서로 다 닫히면 참.\" 면접이라면 여기서 확인 질문을 해요.\n- 괄호 말고 다른 글자가 섞이나요? → **없음**\n- 빈 문자열은요? → 제약상 길이 1 이상이지만, 들어온다면 참으로 처리하는 게 자연스러워요\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`{[()]}` → 안쪽 `()`부터 닫히고, `[]`, `{}` 순서로 닫혀요. 참.\n`([)]` → `)`가 나왔을 때 가장 최근에 열린 건 `[`예요. 짝이 아니니 거짓.\n경계: 닫는 괄호로 시작(`]`), 다 닫힌 뒤 또 닫음(`()]`), 열린 채로 끝남(`((`), 거꾸로(`)(`).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n붙어 있는 짝 `()`, `[]`, `{}`를 지우고, 더 이상 안 지워질 때까지 반복해요. 다 지워지면 참이에요. 한 번 지울 때 O(N)인데, `((((…))))`처럼 깊게 중첩되면 한 바퀴에 한 쌍씩만 지워져서 N/2바퀴 → **O(N²)**. 채점기의 큰 입력(길이 80,000)에서 약 7초 걸려요.\n**면접 팁**: 브루트포스를 먼저 말하고 복잡도를 붙이면, 최적화를 못 해도 기본 점수를 받아요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n브루트포스는 매 바퀴 문자열 전체를 다시 훑어요. 그런데 닫는 괄호를 만난 순간 확인할 것은 하나뿐이에요. **지금 열려 있는 것 중 가장 최근 것**이 내 짝인가?\n- \"가장 최근 것\"을 꺼내는 그릇 = 마지막에 넣은 것이 먼저 나오는 그릇(LIFO) = 스택.\n- 짝이 맞으면 그 괄호는 닫혔으니 꺼내 버려요. 그러면 그 아래가 다시 \"가장 최근에 열린 것\"이 돼요.\n\n트리거 단어: \"짝 맞추기\", \"중첩\", \"올바른 괄호\", \"가장 최근 것\" → 스택 (33장 1단계, 템플릿 1).\n\n## 5. 코드\n```python\ndef is_valid(s):\n    pairs = {')': '(', ']': '[', '}': '{'}\n    st = []\n    for ch in s:\n        if ch in pairs:                              # 닫는 괄호\n            if not st or st.pop() != pairs[ch]:      # 빈 스택이거나 짝이 아니면\n                return False\n        else:                                        # 여는 괄호\n            st.append(ch)\n    return not st                                    # 남은 게 없어야 참\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: 매 글자를 처리한 뒤 `st`에는 아직 닫히지 않은 여는 괄호가 연 순서대로 쌓여 있어요. 맨 위가 가장 최근에 연 괄호예요.\n- **빠뜨리지 않는 이유**: 올바른 괄호열에서 닫는 괄호의 짝은 항상 가장 최근에 열려 아직 안 닫힌 괄호예요. 그래서 `st.pop() != pairs[ch]`이면 그 자리에서 거짓이 확정이고, 모든 닫는 괄호가 짝을 찾고 `not st`이면 참이에요.\n- **끝나는 이유**: 글자마다 push나 pop 한 번이라 O(n)이에요.\n- **깨지는 가정**: 빈 스택에서 닫는 괄호가 오는 경우를 `not st`로 먼저 걸러야 해요. 빼면 `\")\"`에서 빈 리스트 `pop`으로 예외가 나요. 마지막 `return not st`를 `True`로 바꾸면 `\"((\"` 같은 안 닫힌 문자열이 참이 돼요.\n\n## 6. 예제로 추적 (확인)\n`{[()]}`\n| i | 글자 | 동작 | 스택 (아래→위) |\n|---|---|---|---|\n| 0 | `{` | push | `{` |\n| 1 | `[` | push | `{ [` |\n| 2 | `(` | push | `{ [ (` |\n| 3 | `)` | 톱 `(` = 짝 → pop | `{ [` |\n| 4 | `]` | 톱 `[` = 짝 → pop | `{` |\n| 5 | `}` | 톱 `{` = 짝 → pop | (빈) |\n끝에서 스택이 비었으니 참 ✓\n\n`([)]`\n| i | 글자 | 동작 | 스택 (아래→위) |\n|---|---|---|---|\n| 0 | `(` | push | `(` |\n| 1 | `[` | push | `( [` |\n| 2 | `)` | 톱 `[` ≠ `(` → 거짓 | — |\n\n## 7. 복잡도\n각 글자를 한 번 보고, 스택에는 많아야 한 번 넣고 한 번 빼요 → **O(N)**. 스택은 최악(`((((…`) N개 → 메모리 **O(N)**.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 종류별 개수만 비교 | `([)]`를 참이라고 함 | 손 케이스 \"개수는 맞지만 엇갈림\" |\n| 빈 스택 확인 없이 `pop()` | `IndexError` | 손 케이스 \"닫는 괄호로 시작\" |\n| 마지막에 `return True` | `((`를 참이라고 함 | 손 케이스 \"열린 채로 끝남\" |\n| 짝 지우기 반복 (`replace`) | 정답이지만 느림 | 큰 입력 |\n\n## 9. 면접에서 30초로 설명하기\n\"닫는 괄호는 항상 가장 최근에 열린 괄호와 짝이 되어야 해서 스택을 씁니다. 여는 괄호는 push하고, 닫는 괄호가 나오면 스택이 비었거나 톱이 짝이 아니면 바로 거짓, 맞으면 pop합니다. 끝까지 읽은 뒤 스택이 비어 있어야 참입니다. 각 글자를 한 번씩만 처리하니 O(N)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **괄호가 한 종류뿐이면 스택 없이 되나요?** 네. 카운터 하나로 `(`면 +1, `)`면 −1. 중간에 음수가 되면 거짓, 끝에 0이 아니면 거짓이에요. 종류가 둘 이상이면 \"어느 종류가 가장 최근인지\"를 알아야 해서 스택이 필요해요 (33장 면접에서는 7번).\n2. **올바르게 만들려면 최소 몇 글자를 지워야 하나요?** 스택으로 짝이 안 맞는 인덱스를 모으면 그 개수가 답이에요 (LeetCode 1249 Minimum Remove to Make Valid Parentheses).\n3. **가장 긴 올바른 괄호 부분 문자열은요?** 스택에 \"마지막으로 짝이 깨진 위치\"를 깔아 두고 인덱스를 쌓으면 O(N)이에요 (LeetCode 32, Hard).\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 8분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 9012 「괄호」(한 종류), 백준 4949 「균형잡힌 세상」, 프로그래머스 「올바른 괄호」.\n", "starter": "# LeetCode 20 — 함수 몸통을 채우세요.  채점: python algo/judge.py 33/lc0020\n\n\ndef is_valid(s: str) -> bool:\n    pass\n"}, {"id": "33/lc0155", "chapter": "33", "slug": "lc0155", "title": "LeetCode 155 Min Stack", "kind": "func", "ext": ".py", "tier": "Medium (LeetCode)", "role": "핵심", "target": "25분", "url": "https://leetcode.com/problems/min-stack/", "time_limit": 1.0, "ref_time": 0.014295917004346848, "problem": "# LeetCode 155 Min Stack\n\n- 원문: https://leetcode.com/problems/min-stack/\n- 난이도: Medium (LeetCode) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 33. 스택과 큐\n\n## 문제 (요약)\n스택 클래스 `MinStack`을 직접 만들어요. 아래 네 연산이 **모두 O(1)** 이어야 해요.\n- `push(val)`: 값을 넣어요\n- `pop()`: 맨 위 값을 버려요 (돌려주지 않아요)\n- `top()`: 맨 위 값을 돌려줘요\n- `getMin()`: 지금 스택에 있는 값 중 가장 작은 값을 돌려줘요\n\n`pop`, `top`, `getMin`은 스택이 비어 있지 않을 때만 불려요.\n\n## 제약\n- 값은 -2³¹ 이상 2³¹ - 1 이하\n- 연산은 최대 3×10⁴번 (채점기의 큰 입력은 시간 차이를 보려고 55,000번으로 늘렸어요)\n\n## 채점 방식 (클래스 문제라서 조금 달라요)\nLeetCode는 연산 이름 목록과 인자 목록을 주고, 차례대로 메서드를 불러 결과를 모아요. 예를 들어\n```\nops  = [\"MinStack\", \"push\", \"push\", \"getMin\", \"pop\", \"getMin\"]\nargs = [[],         [4],    [2],    [],       [],    []]\n결과 = [null,       null,   null,   2,        null,  4]\n```\n`my.py`에는 이 일을 하는 `run_ops(ops, args)`가 이미 들어 있어요. 채점기는 `run_ops`를 불러 결과 목록을 비교해요. **여러분은 `MinStack` 클래스의 메서드만 채우면 돼요.** `run_ops`는 고치지 마세요. 반환값이 없는 연산(`MinStack`, `push`, `pop`)의 자리는 `None`이에요.\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`의 `MinStack`을 채워요. 타이머를 켜세요.\n2. `python algo/judge.py 33/lc0155` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고(클래스 부분만 붙여 넣어요), `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 최솟값 변수 하나로는 왜 부족한가<\/summary>\n\n`min_val` 변수 하나를 두고 push할 때마다 갱신하면 push와 getMin은 O(1)이에요. 그런데 최솟값을 pop하면 **그 전의 최솟값**이 무엇이었는지 알 방법이 없어요. `push 3, push 1, pop` 다음에 `getMin`은 3이어야 해요. 이전 최솟값을 어디에 기억해 둘 수 있을까요?\n<\/details>\n\n<details><summary>힌트 2: 값마다 \"그때의 최솟값\"을 붙여 두기<\/summary>\n\n스택은 pop하면 정확히 **직전 상태**로 돌아가요. 그러니 각 칸에 \"이 값을 넣은 시점까지의 최솟값\"을 같이 적어 두면, 맨 위 칸의 기록이 곧 현재 최솟값이에요. pop하면 그 아래 칸의 기록, 즉 이전 최솟값이 저절로 드러나요. `(값, 그때까지의 최솟값)` 쌍을 쌓거나 최솟값 전용 스택을 따로 둬요 (33장 면접에서는 7번 꼬리 질문).\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 최솟값 전용 스택을 \"새 값이 **더 작을 때만**\" 쌓으면, 같은 최솟값이 두 번 들어왔을 때 하나를 pop하는 순간 최솟값 기록까지 사라져요. `<`가 아니라 `<=`로 쌓거나, 아예 매번 쌓으세요.\n- 첫 push에서는 비교할 이전 최솟값이 없어요. 빈 스택일 때를 따로 처리해요.\n- `getMin`에서 `min(self.a)`를 부르면 O(N)이에요. 손 케이스는 통과해도 큰 입력에서 걸려요.\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 155 Min Stack\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"보통 스택 + 지금 최솟값을 O(1)에 답하기. pop 뒤에도 맞아야 함.\" 설계형 문제라 확인 질문이 중요해요.\n- 빈 스택에서 pop/top/getMin이 불릴 수 있나요? → **없음**\n- 같은 값이 여러 번 들어오나요? → **들어와요** (이게 함정이에요)\n- 메모리 제한은요? → 따로 없음. O(N) 추가 공간이면 충분해요\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`push 3, push 5, push 1, getMin → 1, pop, getMin → 3, top → 5`. pop으로 1이 빠지면 최솟값이 3으로 **돌아와야** 해요.\n경계: 같은 최솟값 두 번(`push 0, push 1, push 0`, pop 하나 뒤에도 0), 원소 하나, 전부 비웠다가 다시 채우기, 32비트 끝 값.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n리스트 하나에 넣고 `getMin`에서 `min(리스트)`. push/pop/top은 O(1)이지만 getMin이 **O(N)**. 스택에 4만 개가 쌓인 채로 getMin을 수천 번 부르는 채점기 큰 입력에서 7초 넘게 걸려요.\n**면접 팁**: 설계형 문제에서도 \"가장 단순한 구현 + 어느 연산이 느린지\"부터 말해요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n최솟값을 변수 하나로 들면 push는 쉽지만, 최솟값이 pop되면 이전 최솟값을 다시 찾으려고 전체를 훑어야 해요. 버린 정보는 **\"그 시점의 최솟값\"** 이에요.\n- 스택은 pop하면 정확히 이전 상태로 돌아가는 구조예요. 그러니 \"그때의 최솟값\"도 **같은 스택에 같이 쌓아 두면** pop과 함께 저절로 되돌아가요.\n- 새 칸의 최솟값 = `min(새 값, 바로 아래 칸의 최솟값)`. 바로 아래 칸만 보면 되니 O(1)이에요.\n- 불변식: **각 칸의 최솟값 = 맨 아래부터 그 칸까지의 최솟값.** 이 한 줄을 지키면 getMin은 맨 위 칸을 읽기만 하면 돼요.\n\n트리거 단어: \"O(1)에 최솟값/최댓값\", \"되돌리기\" → 스택에 그 시점의 상태를 함께 쌓기 (33장 면접에서는 7번 꼬리 질문).\n\n## 5. 코드\n```python\nclass MinStack:\n    def __init__(self):\n        self.st = []                          # (값, 그때까지의 최솟값)\n\n    def push(self, val):\n        m = val if not self.st else min(val, self.st[-1][1])\n        self.st.append((val, m))\n\n    def pop(self):\n        self.st.pop()\n\n    def top(self):\n        return self.st[-1][0]\n\n    def getMin(self):\n        return self.st[-1][1]\n```\n최솟값 전용 스택을 따로 두는 방법도 같은 생각이에요. 그때는 새 값이 현재 최솟값 **이하**일 때 쌓고(`<=`), pop한 값이 최솟값 스택의 톱과 같으면 같이 pop해요. 메모리를 조금 아끼지만 `<`/`<=` 실수가 잦으니 쌍 방식이 안전해요.\n\n## 왜 이 코드가 정답인가\n(4단계의 불변식 한 줄을 코드와 이어 정리해요.)\n- **불변식**: `self.st`의 k번째 칸 `(값, m)`에서 m은 맨 아래부터 그 칸까지 값의 최솟값이에요. `push`는 `min(val, self.st[-1][1])`로 이걸 지키고, `pop`은 맨 위 칸만 지우니 아래 칸들은 그대로 맞아요.\n- **빠뜨리지 않는 이유**: 최솟값이 pop돼도 바로 아래 칸이 \"그 시점의 최솟값\"을 들고 있어서, 이전 최솟값을 다시 찾을 일이 없어요. 같은 값이 여러 번 들어와도 칸마다 따로 기록돼요.\n- **끝나는 이유**: 네 연산 모두 리스트 끝만 다뤄서 O(1)이에요.\n- **깨지는 가정**: 빈 스택에서 pop/top/getMin이 불리지 않는다는 제약에 기대요. 최솟값을 변수 하나로만 들면 pop 뒤에 이전 값으로 못 돌아가요.\n\n## 6. 예제로 추적 (확인)\n| 연산 | 스택 (아래→위, `(값, 최솟값)`) | 결과 |\n|---|---|---|\n| push 3 | `(3,3)` | — |\n| push 5 | `(3,3) (5,3)` | — |\n| push 1 | `(3,3) (5,3) (1,1)` | — |\n| getMin | 그대로 | 1 |\n| pop | `(3,3) (5,3)` | — |\n| getMin | 그대로 | 3 (아래 칸 기록이 드러남) |\n| top | 그대로 | 5 |\n✓\n\n## 7. 복잡도\n네 연산 모두 **O(1)**. 칸마다 값 하나를 더 들고 있으니 추가 메모리 **O(N)**.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 최솟값 변수 하나 | pop 뒤에도 옛 최솟값을 돌려줌 | 손 케이스 \"기본 흐름\", \"pop 뒤에 최솟값이 되돌아와야 함\" |\n| 최솟값 스택을 `<`일 때만 쌓음 | 같은 최솟값 하나를 pop하면 기록이 사라져 `IndexError`나 오답 | 손 케이스 \"같은 최솟값이 두 번\" |\n| `getMin`에서 `min(리스트)` | 정답이지만 O(N) | 큰 입력 |\n| 첫 push에서 `self.st[-1]`을 읽음 | `IndexError` | 손 케이스 전부 |\n\n## 9. 면접에서 30초로 설명하기\n\"push할 때 값과 함께 그 시점까지의 최솟값을 쌍으로 쌓습니다. 새 최솟값은 새 값과 바로 아래 칸의 최솟값 중 작은 것이라 O(1)에 구합니다. pop하면 그 쌍이 같이 빠지면서 이전 최솟값이 맨 위에 드러나니 getMin은 맨 위 칸을 읽기만 하면 됩니다. 모든 연산이 O(1)이고 추가 메모리는 O(N)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **추가 메모리를 O(1)로 할 수 있나요?** 가능해요. 최솟값 변수 하나만 두고, 새 최솟값이 들어올 때 스택에 `2*val - min`(인코딩된 값)을 넣어 이전 최솟값을 그 안에 숨겨요. pop할 때 톱이 현재 최솟값보다 작으면 인코딩된 칸이라 `2*min - 톱`으로 이전 최솟값을 되살려요. 파이썬은 정수 넘침이 없어 안전하지만, 다른 언어에선 오버플로를 조심해야 해요.\n2. **최솟값 대신 \"스택의 최댓값\"이나 \"큐의 최솟값\"이라면요?** 최댓값은 부등호만 바꾸면 돼요. 큐는 앞에서 빠지니 이 방법이 안 돼요. 스택 두 개로 큐를 만들고(33장 5단계) 각 스택을 Min Stack으로 쓰거나, 모노토닉 덱(33장 7단계)을 써요.\n3. **스레드 여러 개가 동시에 쓰면요?** push의 \"아래 칸 읽기 → 쌓기\"가 한 번에 일어나야 해요. 락으로 감싸지 않으면 두 스레드가 같은 아래 칸을 읽고 잘못된 최솟값을 쌓을 수 있어요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 232 Implement Queue using Stacks(33장 5단계), LeetCode 716 Max Stack, LeetCode 901 Online Stock Span.\n", "starter": "# LeetCode 155 Min Stack — MinStack 클래스의 메서드를 채우세요.  채점: python algo/judge.py 33/lc0155\n# run_ops는 LeetCode가 하는 일(연산 목록대로 메서드를 불러 결과를 모으기)을 흉내 내는 함수예요. 고치지 않아도 돼요.\n\n\nclass MinStack:\n    def __init__(self):\n        pass\n\n    def push(self, val: int) -> None:\n        pass\n\n    def pop(self) -> None:\n        pass\n\n    def top(self) -> int:\n        pass\n\n    def getMin(self) -> int:\n        pass\n\n\ndef run_ops(ops, args):\n    out, obj = [], None\n    for op, a in zip(ops, args):\n        if op == \"MinStack\":\n            obj = MinStack()\n            out.append(None)\n        else:\n            out.append(getattr(obj, op)(*a))\n    return out\n"}, {"id": "33/pg42583", "chapter": "33", "slug": "pg42583", "title": "프로그래머스 42583 다리를 지나는 트럭", "kind": "func", "ext": ".py", "tier": "Lv. 2 (프로그래머스)", "role": "핵심", "target": "30분", "url": "https://school.programmers.co.kr/learn/courses/30/lessons/42583", "time_limit": 1.0, "ref_time": 0.015388582978630438, "problem": "# 프로그래머스 42583 다리를 지나는 트럭\n\n- 원문: https://school.programmers.co.kr/learn/courses/30/lessons/42583\n- 난이도: Lv. 2 (프로그래머스) · 역할: 핵심 · 목표 시간: 30분\n- 짝이 되는 장: 33. 스택과 큐\n\n## 문제 (요약)\n트럭들이 정해진 순서대로 일차선 다리를 건너요. 다리에는 `bridge_length`대까지 올라갈 수 있고, 다리 위 트럭 무게의 합은 `weight`를 넘으면 안 돼요. 트럭은 1초에 한 칸씩 움직여서, 다리를 다 건너는 데 `bridge_length`초가 걸려요. 1초에 다리에 새로 올라갈 수 있는 트럭은 한 대예요. 모든 트럭이 다리를 다 건너는 데 걸리는 최소 시간(초)을 돌려주세요.\n\n시간 세는 법이 헷갈리기 쉬워요. 다리 길이 2, 무게 10, 트럭 `[7, 4, 5, 6]`이면 답은 8이에요. 1초에 7이 올라가고, 3초에 7이 내리는 그 순간 4가 올라가요.\n\n## 제약\n- 1 ≤ `bridge_length` ≤ 10,000, 1 ≤ `weight` ≤ 10,000\n- 1 ≤ 트럭 수 ≤ 10,000, 각 트럭 무게는 1 이상 `weight` 이하\n\n## 함수\n```python\ndef solution(bridge_length: int, weight: int, truck_weights: list[int]) -> int\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 33/pg42583` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 프로그래머스에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 다리를 무엇으로 볼까<\/summary>\n\n다리를 `bridge_length`칸짜리 줄로 보세요. 1초가 지날 때마다 모든 칸이 한 칸씩 앞으로 밀리고, 맨 앞 칸에 있던 트럭은 내려요. 빈칸은 무게 0인 트럭이라고 생각하면 \"한 칸씩 밀기\"가 아주 단순해져요.\n<\/details>\n\n<details><summary>힌트 2: 먼저 들어간 것이 먼저 나오는 그릇<\/summary>\n\n뒤로 넣고 앞에서 빼는 일이 매초 일어나요. 33장 3~4단계의 큐, 파이썬에서는 `collections.deque`예요(`list.pop(0)`은 O(N)). 매초 할 일은 두 가지예요. ① 맨 앞 칸을 빼서 내리기, ② 다음 트럭이 올라갈 수 있으면 넣고 아니면 0을 넣기. **순서가 중요해요.**\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 내리는 걸 **먼저** 처리하고 무게를 확인해요. 거꾸로 하면 \"내리는 그 초에 올라타기\"를 놓쳐요.\n- 매초 `sum(bridge)`를 하면 한 번에 O(다리 길이)라 느려요. 다리 위 무게 합을 변수 하나로 들고, 넣을 때 더하고 뺄 때 빼세요.\n- 마지막 트럭이 올라간 시각 `t`에서 다리 길이만큼 더 가야 다 건너요. 답은 `t + bridge_length`예요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 프로그래머스 42583 다리를 지나는 트럭\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"순서대로 다리에 올라가고, 다리 위 무게 합 ≤ weight, 건너는 데 bridge_length초. 마지막 트럭이 내리는 시각.\" 시뮬레이션 문제라 여기서 **시간 규칙**을 확인하는 게 제일 중요해요.\n- 트럭이 내리는 초에 다음 트럭이 올라갈 수 있나요? → **있음** (예제에서 3초에 7이 내리고 4가 올라가요)\n- 1초에 여러 대가 올라갈 수 있나요? → **없음**, 한 대씩\n- 순서를 바꿀 수 있나요? → **없음**\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n다리 2, 무게 10, `[7, 4, 5, 6]` → 8 (아래 6번 표). 손으로 시각을 하나씩 적어 보면 \"1초에 올라간 트럭은 1 + 2 = 3초에 내린다\"는 규칙이 보여요.\n경계: 트럭 한 대(`[10]`, 다리 100 → 101), 다리 길이 1, 전부 한꺼번에 올라감(`[10]*10`, 다리 100, 무게 100 → 110), 무거운 트럭이 뒤를 막음.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n다리 위 트럭을 `[무게, 내리는 시각]` 목록으로 들고, 1초마다 내릴 트럭을 지우고 `sum`으로 무게를 다시 더해 다음 트럭을 올려 봐요. 매초 O(다리 위 트럭 수)라서, 가벼운 트럭이 다리를 가득 채운 상태가 오래 가면 느려요. 채점기 큰 입력(약 16만 초)에서 매초 `sum(bridge)`를 하는 풀이는 6초 넘게 걸려요.\n**면접 팁**: 시뮬레이션은 \"1초에 무슨 일이 어떤 순서로 일어나는지\"를 먼저 말로 정하고 코드를 써요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n- 다리는 **먼저 올라간 트럭이 먼저 내리는** 줄이에요. 뒤로 넣고 앞으로 빼니 큐예요. 빈칸을 0으로 채운 `bridge_length`칸 큐로 두면 \"매초 한 칸 밀기\"가 `popleft` 한 번 + `append` 한 번이에요.\n- 매초 `sum`을 다시 하는 게 병목이에요. 32장 고정 윈도와 같은 생각으로, **들어온 값은 더하고 나간 값은 빼면** 합이 O(1)에 유지돼요. 다리 큐는 사실 길이가 `bridge_length`인 고정 윈도예요.\n\n트리거 단어: \"순서대로\", \"1초에 한 칸\", \"시간이 흐르며\" → 큐로 라운드(초) 단위 시뮬레이션 (33장 템플릿 2).\n\n## 5. 코드\n```python\nfrom collections import deque\n\ndef solution(bridge_length, weight, truck_weights):\n    bridge = deque([0] * bridge_length)\n    waiting = deque(truck_weights)\n    on = t = 0\n    while waiting:\n        t += 1\n        on -= bridge.popleft()             # 1) 먼저 내리고\n        if on + waiting[0] <= weight:      # 2) 올라갈 수 있으면 올려요\n            w = waiting.popleft()\n            bridge.append(w)\n            on += w\n        else:\n            bridge.append(0)               # 빈칸\n    return t + bridge_length               # 마지막 트럭이 다 건너는 시각\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: 매초가 끝나면 `bridge`의 길이는 항상 `bridge_length`이고, `on`은 `bridge` 안 값(트럭 무게와 빈칸 0)의 합이에요.\n- **빠뜨리지 않는 이유**: 매초 먼저 `popleft`로 내릴 트럭을 내리고 나서 올릴지 정해서, \"내리는 초에 다음 트럭이 올라간다\"는 규칙을 그대로 따라요. 트럭은 `waiting` 순서대로 1초에 한 대만 올라가요.\n- **끝나는 이유**: 각 트럭 무게 ≤ `weight`라서 다리가 비면 반드시 다음 트럭이 올라가요. 그래서 `waiting`은 결국 비고, 걸리는 시간은 많아야 (트럭 수 + 1) × `bridge_length`초예요.\n- **깨지는 가정**: 마지막 트럭이 올라간 시각 `t`에서 다 건너기까지 `bridge_length`초가 더 걸려 `t + bridge_length`를 돌려줘요. 트럭 무게가 `weight`보다 크면 영원히 못 올라가 무한 반복인데, 제약이 그걸 막아 줘요.\n\n## 6. 예제로 추적 (확인)\n다리 2, 무게 10, `[7, 4, 5, 6]`\n| t | 내린 값 | 올리기 | bridge (앞→뒤) | on | 대기 |\n|---|---|---|---|---|---|\n| 1 | 0 | 7 올라감 | `0 7` | 7 | 4 5 6 |\n| 2 | 0 | 4는 11 > 10, 못 올라감 | `7 0` | 7 | 4 5 6 |\n| 3 | 7 | 4 올라감 | `0 4` | 4 | 5 6 |\n| 4 | 0 | 5 올라감 | `4 5` | 9 | 6 |\n| 5 | 4 | 6은 11 > 10, 못 올라감 | `5 0` | 5 | 6 |\n| 6 | 5 | 6 올라감 | `0 6` | 6 | (빈) |\n마지막 트럭이 6초에 올라갔으니 6 + 2 = 8 ✓\n\n## 7. 복잡도\n반복은 마지막 트럭이 올라갈 때까지, 매번 O(1) → **O(T)** (T = 마지막 트럭이 올라가는 시각). 큐 메모리 **O(bridge_length + 트럭 수)**.\nT는 최악에 `bridge_length × 트럭 수` = 10⁸까지 갈 수 있어요(트럭이 전부 혼자만 건너야 할 때). 실제 채점 데이터는 그렇게 크지 않아서 이 풀이로 통과하지만, 꼬리 질문 1에 더 빠른 방법을 적었어요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 무게를 확인한 **뒤에** 내리기 | 내리는 초에 못 올라타서 답이 커짐 | 손 케이스 1 |\n| 답을 `t + bridge_length - 1`이나 `t`로 | 1 또는 다리 길이만큼 어긋남 | 손 케이스 1 |\n| 매초 `sum(bridge)` | 정답이지만 느림 | 큰 입력 |\n| `list.pop(0)`으로 큐 | 정답이지만 deque보다 수십 배 느림 (이 크기에선 0.4초쯤으로 통과해요) | 못 잡아요. 꼬리 질문 2를 보세요 |\n\n## 9. 면접에서 30초로 설명하기\n\"다리를 길이 bridge_length인 큐로 두고 빈칸은 0으로 채웁니다. 매초 맨 앞을 빼서 내리고, 다리 위 무게 합에 다음 트럭을 더해도 한도 이하면 넣고 아니면 0을 넣습니다. 무게 합은 변수로 유지해서 매초 O(1)입니다. 마지막 트럭이 올라간 시각에 다리 길이를 더하면 답입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **트럭이 전부 혼자만 건너야 하면 10⁸초를 다 돌아야 하나요?** 아니요. 아무 일도 안 일어나는 초를 건너뛰면 돼요. 다리 위 트럭을 `(무게, 내리는 시각)`으로 큐에 넣어 두고, 다음 트럭이 못 올라가면 시각을 **맨 앞 트럭이 내리는 시각으로 바로 점프**해요. 각 트럭이 한 번 들어가고 한 번 나오니 O(트럭 수)예요.\n2. **왜 `list`가 아니라 `deque`인가요?** `list.pop(0)`은 뒤의 원소를 전부 한 칸씩 당겨서 O(N)이에요. `deque.popleft()`는 O(1)이에요. 33장 시작에서 잰 차이가 179배였어요.\n3. **무게 합을 왜 변수로 따로 들고 있나요?** 큐에 들어오고 나가는 값만 반영하면 합이 바뀌는 양을 정확히 알 수 있어서예요. 32장의 고정 윈도 합과 같은 생각이고, 매초 O(다리 길이)를 O(1)로 줄여요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 20분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 프로그래머스 「기능개발」, 「프로세스」, 백준 2164 「카드2」, 백준 13335 「트럭」(같은 문제의 백준판).\n", "starter": "# 프로그래머스 42583 다리를 지나는 트럭 — 함수 몸통을 채우세요.  채점: python algo/judge.py 33/pg42583\n\n\ndef solution(bridge_length, weight, truck_weights):\n    answer = 0\n    return answer\n"}, {"id": "34/boj11650", "chapter": "34", "slug": "boj11650", "title": "백준 11650 좌표 정렬하기", "kind": "stdio", "ext": ".py", "tier": "Silver V (solved.ac)", "role": "워밍업", "target": "15분", "url": "https://solved.ac/problems/id/11650", "time_limit": 1.0, "ref_time": 0.11558554199291393, "problem": "# 백준 11650 좌표 정렬하기\n\n- 원문: https://solved.ac/problems/id/11650\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Silver V (solved.ac) · 역할: 워밍업 · 목표 시간: 15분\n- 짝이 되는 장: 34. 정렬\n\n## 문제 (요약)\n평면 위의 점 N개가 주어져요. x좌표가 작은 순서로, x좌표가 같으면 y좌표가 작은 순서로 줄을 세워 한 줄에 하나씩 출력하세요.\n\n## 제약\n- 1 ≤ N ≤ 100,000\n- -100,000 ≤ x, y ≤ 100,000, 좌표는 정수이고 같은 점이 여러 번 나올 수도 있어요\n- 입력: 첫 줄 `N`, 다음 N줄에 `x y` / 출력: 정렬한 점을 한 줄에 하나씩 `x y`\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 34/boj11650` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 정렬을 직접 짤 필요가 있나<\/summary>\n\nN = 10만이에요. 선택·삽입·버블 정렬은 O(N²) = 100억 번이라 안 돼요. 파이썬의 `sort`는 O(N log N)이에요. 문제는 **무엇을 기준으로** 줄을 세우느냐뿐이에요.\n<\/details>\n\n<details><summary>힌트 2: 기준이 두 개일 때<\/summary>\n\n파이썬 튜플은 첫 칸을 먼저 비교하고, 같으면 다음 칸을 비교해요. 그러니 점을 `(x, y)` 튜플로 들고 있으면 그냥 `sort()`가 \"x 먼저, 같으면 y\"예요. 34장 6단계 `key=`와 템플릿 1(다중 키)을 보세요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 줄을 **문자열 그대로** 정렬하면 사전순이 돼요. `\"10 0\"`이 `\"9 0\"`보다 앞에 오고 음수 순서도 엉망이에요. 반드시 정수로 바꿔요.\n- `key=lambda p: p[0]`처럼 x만 기준으로 하면, x가 같은 점들은 **입력 순서 그대로** 남아요(안정 정렬). y까지 넣어야 해요.\n- 입출력이 10만 줄이에요. `sys.stdin.readline`으로 읽고, 출력은 `'\\n'.join`으로 한 번에 써요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 11650 좌표 정렬하기\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"점을 x 오름차순, 같으면 y 오름차순으로.\" 확인 질문:\n- 좌표에 음수가 있나요? → **있음** (문자열 정렬 함정)\n- 같은 점이 여러 번 나오나요? → 나올 수 있고, 그대로 여러 번 출력해요\n- N은요? → 10만, O(N log N)이면 충분해요\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`(3,4) (1,1) (1,-1) (2,2) (3,3)` → `(1,-1) (1,1) (2,2) (3,3) (3,4)`. x가 1인 두 점은 y로, x가 3인 두 점도 y로 정해져요.\n경계: 점 하나, x가 전부 같고 y가 거꾸로 들어옴, 음수·두 자리 이상 수(`10`과 `9`, `-10`과 `-5`), 같은 점 중복, 좌표 끝 값 ±100,000.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n삽입 정렬로 직접 정렬하면서 비교 기준을 손으로 적어요(`solution/brute.py`). 기준을 확인하기엔 좋지만 **O(N²)** 이라, 10만 개에서 채점기 큰 입력이 강제 종료돼요. 34장 1단계에서 잰 대로 N이 2배면 시간이 4배예요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n정렬 자체는 라이브러리(Timsort, O(N log N), 34장 5단계)에 맡기고, 내가 정할 건 **비교 기준**뿐이에요.\n- 기준이 \"x 먼저, 같으면 y\" → 사전식 순서 → 파이썬 튜플 비교가 정확히 이것이에요.\n- 그래서 `(x, y)` 튜플 리스트를 `sort()`하면 끝이에요. `key=lambda p: (p[0], p[1])`과 같은 뜻이에요.\n\n트리거 단어: \"~순으로, 같으면 ~순으로\" → 튜플 키 다중 기준 정렬 (34장 6단계, 템플릿 1).\n\n## 5. 코드\n```python\nimport sys\ndata = sys.stdin.buffer.read().split()\nn = int(data[0])\nnums = list(map(int, data[1:1 + 2 * n]))\npts = list(zip(nums[0::2], nums[1::2]))   # [(x, y), ...]\npts.sort()                                 # x 먼저, 같으면 y\nsys.stdout.write('\\n'.join(f\"{x} {y}\" for x, y in pts) + '\\n')\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `pts`는 입력 점 N개를 빠짐없이 `(x, y)` 튜플로 담아요. `sort()`가 끝나면 이웃한 두 점은 x가 작거나, x가 같으면 y가 작거나 같아요.\n- **빠뜨리지 않는 이유**: 튜플 비교는 첫 원소부터 보고, 같을 때만 다음 원소를 봐요. 문제의 \"x 먼저, 같으면 y\"와 정확히 같은 순서예요. 같은 점은 그대로 여러 번 남아요.\n- **끝나는 이유**: Timsort라 O(N log N)이에요.\n- **깨지는 가정**: 좌표를 `int`로 바꿨기 때문에 음수가 맞게 정렬돼요. 문자열 그대로 정렬하면 `\"-5\"`와 `\"-10\"`, `\"10\"`과 `\"9\"`의 순서가 뒤집혀요.\n\n## 6. 예제로 추적 (확인)\n| 방법 | 결과 | 맞나 |\n|---|---|---|\n| `sort()` (튜플 전체) | `(1,-1) (1,1) (2,2) (3,3) (3,4)` | ✓ |\n| `sort(key=lambda p: p[0])` (x만) | `(1,1) (1,-1) (2,2) (3,4) (3,3)` | ✗ x가 같은 점이 입력 순서대로 남음 |\n| 문자열 줄 그대로 `sort()` (손 케이스 03) | `-10 2`, `-5 3`, `10 0`, `9 0` | ✗ `\"10\"`이 `\"9\"`보다 앞 (글자 `'1'` < `'9'`) |\n위 표는 실제로 돌려서 얻은 결과예요.\n\n## 7. 복잡도\n정렬 **O(N log N)**, 메모리 **O(N)**. 10만 개에서 입출력 포함 약 0.2초예요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 줄을 문자열로 정렬 | `10`이 `9`보다 앞, 음수 순서 틀림 | 손 케이스 03 |\n| x만 기준 (`key=lambda p: p[0]`) | x가 같으면 입력 순서 그대로 | 손 케이스 01, 04 |\n| 직접 짠 O(N²) 정렬 | 정답이지만 느림 | 큰 입력 (강제 종료) |\n| `input()`과 `print` 10만 번 | 로컬은 0.4초쯤으로 통과, 백준에선 느릴 수 있음 | 못 잡아요. `sys.stdin`과 `'\\n'.join`을 습관으로 |\n\n## 9. 면접에서 30초로 설명하기\n\"점을 (x, y) 튜플로 읽고 파이썬 기본 정렬을 씁니다. 튜플은 첫 원소부터 차례로 비교하니 x가 같을 때만 y로 비교되어 문제의 기준과 정확히 같습니다. Timsort라서 O(N log N)이고, 문자열 그대로 정렬하면 사전순이 되므로 반드시 정수로 바꿔야 합니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **x는 오름차순, y는 내림차순이라면요?** 숫자라서 `key=lambda p: (p[0], -p[1])`이에요. 이름처럼 음수를 못 붙이는 키라면 안정 정렬을 두 번 해요. 보조 키(y 내림차순)로 먼저, 주 키(x)로 다시 (34장 6단계 해법 ②).\n2. **왜 x만 기준으로 정렬하면 입력 순서가 남나요?** 파이썬 `sort`가 **안정 정렬**이라서요. 키가 같은 원소의 원래 순서를 보장해요. 그 성질 덕분에 \"두 번 정렬\"이 성립해요 (34장 면접에서는 2번).\n3. **좌표 범위가 작으니 더 빠르게 할 수 있나요?** x, y가 각각 20만 1가지라 `(x + 100000) * 200001 + (y + 100000)`처럼 정수 하나로 합치면 비교가 빨라져요. 계수 정렬도 생각할 수 있지만 칸이 400억 개라 안 돼요. \"K가 N에 비해 작은가\"를 먼저 따져요 (34장 4단계).\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 7분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 11651 「좌표 정렬하기 2」(y 먼저), 백준 10814 「나이순 정렬」(안정 정렬), 백준 10825 「국영수」(기준 네 개, 오름·내림 섞임).\n", "starter": "# 백준 11650 좌표 정렬하기 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 34/boj11650\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "34/boj1517", "chapter": "34", "slug": "boj1517", "title": "백준 1517 버블 소트", "kind": "stdio", "ext": ".py", "tier": "Platinum V (solved.ac)", "role": "도전", "target": "60분", "url": "https://solved.ac/problems/id/1517", "time_limit": 4.0, "ref_time": 1.436956999998074, "problem": "# 백준 1517 버블 소트\n\n- 원문: https://solved.ac/problems/id/1517\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Platinum V (solved.ac) · 역할: 도전 · 목표 시간: 60분\n- 짝이 되는 장: 34. 정렬\n\n## 문제 (요약)\n길이 N인 수열을 버블 정렬로 오름차순 정렬한다고 해요. 버블 정렬은 바로 옆 두 수를 비교해서 앞이 **더 크면** 바꾸는 일을 반복해요(같으면 바꾸지 않아요). 정렬이 끝날 때까지 **바꾸기(swap)가 모두 몇 번** 일어나는지 출력하세요.\n\n## 제약\n- 1 ≤ N ≤ 500,000\n- 각 값은 -10⁹ 이상 10⁹ 이하 (같은 값이 여러 번 나올 수 있어요)\n- 답은 32비트 정수 범위를 넘을 수 있어요\n- 입력: 첫 줄 `N`, 둘째 줄 수열 / 출력: 바꾼 횟수 하나\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 34/boj1517` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 바꾸기 한 번이 없애는 것<\/summary>\n\n버블 정렬을 실제로 돌리면 O(N²)이라 N = 50만에서 안 돼요. 그러니 횟수를 **돌리지 않고 세는** 방법이 필요해요. 바로 옆 두 수 `x > y`를 바꾸면, \"앞에 있는데 더 큰\" 쌍이 정확히 몇 개 줄어드나요? 다른 쌍들의 앞뒤 관계는 바뀌나요? 정렬이 끝나면 그런 쌍은 몇 개 남나요?\n<\/details>\n\n<details
