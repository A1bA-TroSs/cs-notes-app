><summary>힌트 2: 역순 쌍을 빨리 세기<\/summary>\n\n바꾸기 한 번은 \"i < j인데 a[i] > a[j]\"인 쌍(역순 쌍, inversion)을 **정확히 하나** 없애고, 끝나면 0개가 돼요. 그러니 답 = 역순 쌍의 개수예요. 이제 이걸 O(N log N)에 세야 해요. 34장 2단계 병합 정렬의 \"합치기\"를 떠올려 보세요. 두 더미를 합칠 때 **오른쪽 더미의 원소가 먼저 내려가는 순간**, 왼쪽 더미에 남아 있는 원소들은 모두 그 원소보다 커요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 합칠 때 오른쪽 원소가 내려가면 `왼쪽에 남은 개수`(= `mid - i`)를 한꺼번에 더해요. 1만 더하면 틀려요.\n- 같은 값은 바꾸지 않아요. 합칠 때 `왼쪽 <= 오른쪽`이면 **왼쪽을 먼저** 내려요. `<`로 쓰면 같은 값 쌍까지 세요(`3 1 4 1 5`의 답은 3).\n- 재귀로 짜면 깊이는 log N이라 괜찮지만, 슬라이스 복사가 많으면 느려져요. 입력은 `sys.stdin.buffer.read().split()`으로 읽어요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 1517 버블 소트\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요. 도전 문제라서 중간 단계 풀이도 같이 적었어요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"버블 정렬의 swap 횟수. 같은 값은 안 바꿈. N = 50만.\" 확인 질문:\n- 같은 값은 바꾸나요? → **아니요**\n- 답이 얼마나 커질 수 있나요? → 역순 50만 개면 약 1,250억. 파이썬은 넘침이 없지만 C++/Java면 `long long`/`long`\n- 버블 정렬을 실제로 돌려야 하나요? → O(N²) = 2,500억 번이라 불가능. \"**돌리지 않고 세기**\"가 이 문제예요\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`3 1 4 1 5` → 앞에 있는데 더 큰 쌍: (3, 첫 1), (3, 둘째 1), (4, 둘째 1) → 3개. 실제로 버블 정렬을 손으로 돌려도 3번 바꿔요.\n경계: 원소 하나(0), 전부 같은 값(0), 이미 정렬됨(0), 완전 역순(N(N-1)/2, 6개면 15), ±10⁹ 끝 값.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n버블 정렬을 그대로 돌리며 센다(`solution/brute.py`), 또는 모든 쌍 `i < j`에서 `a[i] > a[j]`를 센다 → 둘 다 **O(N²)**. 채점기 큰 입력에서 강제 종료돼요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n### 관찰: 답 = 역순 쌍의 개수\n바로 옆 `x > y`를 바꾸면 그 두 수의 쌍만 순서가 뒤집히고, 다른 모든 쌍의 앞뒤 관계는 그대로예요. 즉 swap 한 번에 역순 쌍이 **정확히 1개** 줄어요. 정렬이 끝나면 역순 쌍은 0개예요. 그러니 swap 횟수 = 처음 역순 쌍의 개수예요. 문제가 \"정렬 흉내\"에서 \"쌍 세기\"로 바뀌었어요.\n\n### 중간 단계: 정렬된 목록에 하나씩 끼워 넣기 (맞지만 충분하지 않아요)\n왼쪽부터 보면서, 지금까지 본 값을 정렬된 리스트로 들고 있으면 `x`보다 큰 앞 원소의 개수를 이분 탐색으로 셀 수 있어요.\n```python\nfrom bisect import bisect_right, insort\nseen, inv = [], 0\nfor x in a:\n    inv += len(seen) - bisect_right(seen, x)   # 앞에 나온 것 중 x보다 큰 것\n    insort(seen, x)                            # 정렬 유지하며 끼워 넣기\n```\n세는 건 O(log N)인데, `insort`가 리스트 중간에 끼워 넣으면서 뒤 원소를 전부 한 칸씩 밀어요(33장 4단계의 `list.pop(0)`과 같은 이유). 전체 **O(N²)**(상수가 아주 작은 메모리 이동이지만). 50만 개에서 로컬로 약 36초 걸려요.\n\n### 최적: 병합 정렬이 \"합치면서\" 세어 준다\n34장 2단계 병합 정렬의 합치기를 다시 보면, 왼쪽 더미 L과 오른쪽 더미 R은 각각 정렬돼 있고, **원래 수열에서 L의 모든 원소가 R의 모든 원소보다 앞**이에요.\n- R의 원소 `r`이 L에 남은 원소보다 먼저 내려간다 = L에 남은 원소들(`mid - i`개)이 전부 `r`보다 크다 = 역순 쌍이 `mid - i`개.\n- 같으면 L을 먼저 내려요(`<=`). 같은 값은 역순이 아니고, 이게 34장 2단계 \"안정성은 코드 한 글자에 달려 있어요\"의 그 한 글자예요.\n- 쌍은 \"같은 더미 안\"(재귀로 이미 셈) 또는 \"L과 R에 걸침\"(합치며 셈) 둘 중 하나라 빠짐도 겹침도 없어요.\n\n트리거 단어: \"버블 정렬 횟수\", \"인접 교환 최소 횟수\", \"앞에 있는데 더 큰 것의 개수\" → 병합 정렬로 역순 쌍 세기 (34장 2단계).\n\n## 5. 코드\n이해하기 쉬운 재귀 버전이에요. `solution/ref.py`는 같은 생각을 재귀 없이 길이 1, 2, 4 … 토막을 합치는 방식으로 썼어요.\n```python\ndef sort_count(a):\n    if len(a) <= 1:\n        return a, 0\n    m = len(a) // 2\n    l, x = sort_count(a[:m])\n    r, y = sort_count(a[m:])\n    out, i, j, inv = [], 0, 0, x + y\n    while i < len(l) and j < len(r):\n        if l[i] <= r[j]:              # 같으면 왼쪽 먼저\n            out.append(l[i]); i += 1\n        else:\n            out.append(r[j]); j += 1\n            inv += len(l) - i         # 왼쪽에 남은 건 전부 r[j]보다 커요\n    out += l[i:]\n    out += r[j:]\n    return out, inv\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `sort_count(a)`는 `(a를 정렬한 리스트, a 안의 역순 쌍 수)`를 돌려줘요. 합치기 동안 `l[i:]`는 전부 `r[j]`보다 크거나 같아요.\n- **빠뜨리지 않는 이유**: 역순 쌍은 둘 다 왼쪽 반(`x`), 둘 다 오른쪽 반(`y`), 반씩 걸침 중 정확히 하나예요. 걸친 쌍은 `r[j]`가 먼저 내려가는 순간 `l`에 남은 `len(l) - i`개가 모두 `r[j]`보다 커서 한꺼번에 세요. 빠짐도 겹침도 없어요.\n- **끝나는 이유**: 재귀 깊이 log N, 단마다 합치기 O(N)이라 O(N log N)이에요.\n- **깨지는 가정**: `l[i] <= r[j]`의 `=`가 같은 값을 역순으로 세지 않게 해요. `<`로 바꾸면 같은 값끼리도 세서 답이 커져요. 답 = 역순 쌍 수인 건 인접 교환 한 번이 역순 쌍을 정확히 1개 줄이기 때문이에요.\n\n## 6. 예제로 추적 (확인)\n`3 1 4 1 5` (위 재귀 버전을 실제로 돌린 결과)\n| 합치기 | L | R | 결과 | 더한 값 | 이유 |\n|---|---|---|---|---|---|\n| ① | `[3]` | `[1]` | `[1, 3]` | 1 | 1이 먼저 내려갈 때 3이 남음 |\n| ② | `[1]` | `[5]` | `[1, 5]` | 0 | |\n| ③ | `[4]` | `[1, 5]` | `[1, 4, 5]` | 1 | 1이 먼저 내려갈 때 4가 남음 |\n| ④ | `[1, 3]` | `[1, 4, 5]` | `[1, 1, 3, 4, 5]` | 1 | 1 = 1이라 왼쪽 먼저, 다음 R의 1이 내려갈 때 3이 남음 |\n합계 3 ✓. ④에서 `<`로 썼다면 R의 1이 먼저 내려가 2를 더해서 답이 4가 돼요.\n\n## 7. 복잡도\n병합 정렬 그대로 **O(N log N)**, 추가 메모리 **O(N)**. 50만 개에서 로컬로 약 1.5초예요(백준 Python 3에서 빠듯하면 PyPy3로 내 보세요).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 합칠 때 `<`로 비교 | 같은 값 쌍까지 세서 답이 커짐 | 손 케이스 01 |\n| 오른쪽이 내려갈 때 1만 더함 | 답이 작게 나옴 | 손 케이스 04 |\n| `insort`로 끼워 넣기 | 정답이지만 O(N²) | 큰 입력 (강제 종료) |\n| 버블 정렬 그대로 | 정답이지만 O(N²) | 큰 입력 (강제 종료) |\n\n## 9. 면접에서 30초로 설명하기\n\"인접한 두 수를 바꾸면 역순 쌍이 정확히 하나 줄고 정렬이 끝나면 0이 되므로, 답은 역순 쌍의 개수입니다. 이를 병합 정렬로 셉니다. 정렬된 두 절반을 합칠 때 오른쪽 원소가 먼저 내려가면, 왼쪽에 남은 원소는 모두 그보다 크고 원래 위치도 앞이므로 남은 개수만큼 더합니다. 같은 값은 왼쪽을 먼저 내려 세지 않습니다. O(N log N)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **병합 정렬 말고 다른 방법은요?** 펜윅 트리(BIT)예요. 값을 좌표 압축(백준 18870)한 뒤, 왼쪽부터 보면서 \"지금까지 나온 것 중 나보다 큰 것의 개수\"를 BIT 구간 합으로 구하고 내 값을 1 더해요. 똑같이 O(N log N)이고, \"오른쪽에서 나보다 작은 것의 개수\"를 원소마다 따로 내야 할 때(LeetCode 315) 더 자연스러워요.\n2. **삽입 정렬의 이동 횟수는요?** 이것도 역순 쌍의 개수예요. 삽입 정렬이 한 칸 밀 때마다 역순 쌍이 하나 줄어서요. 그래서 거의 정렬된 입력(역순 쌍이 적음)에서 삽입 정렬이 빠르고, Timsort가 짧은 런에 삽입 정렬을 쓰는 이유이기도 해요 (34장 1단계, 5단계).\n3. **역순 쌍 개수가 실무에서 어디에 쓰이나요?** 두 순위가 얼마나 다른지 재는 데 써요. 두 사람의 영화 순위를 비교할 때 한 순위를 기준으로 다른 순위의 역순 쌍을 세면 \"켄달 타우 거리\"가 돼요. 추천 시스템의 순위 품질 평가에 쓰여요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 30분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 10090 「Counting Inversions」, LeetCode 493 Reverse Pairs(조건이 `a[i] > 2·a[j]`, 합치기 전에 따로 세기), LeetCode 315 Count of Smaller Numbers After Self.\n", "starter": "# 백준 1517 버블 소트 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 34/boj1517\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "34/boj18870", "chapter": "34", "slug": "boj18870", "title": "백준 18870 좌표 압축", "kind": "stdio", "ext": ".py", "tier": "Silver II (solved.ac)", "role": "핵심", "target": "25분", "url": "https://solved.ac/problems/id/18870", "time_limit": 3.0, "ref_time": 1.5860097500262782, "problem": "# 백준 18870 좌표 압축\n\n- 원문: https://solved.ac/problems/id/18870\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Silver II (solved.ac) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 34. 정렬\n\n## 문제 (요약)\n수직선 위의 좌표 N개가 주어져요. 각 좌표를 \"**나보다 작은 서로 다른 좌표가 몇 개인가**\"라는 수로 바꿔서, 입력 순서대로 출력하세요. 같은 좌표는 같은 수로 바뀌어요.\n\n## 제약\n- 1 ≤ N ≤ 1,000,000\n- -10⁹ ≤ 좌표 ≤ 10⁹\n- 입력: 첫 줄 `N`, 둘째 줄 좌표 N개 / 출력: 바뀐 수 N개를 공백으로 구분해 한 줄\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 34/boj18870` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: \"나보다 작은 것의 개수\"를 한 번에 읽으려면<\/summary>\n\n좌표마다 전체를 훑어 세면 O(N²)이에요. 그런데 값들을 **작은 순서로 줄 세워 두면**, 어떤 값의 \"나보다 작은 것의 개수\"는 그 줄에서의 **위치**예요. 단, \"서로 다른\" 값만 세야 한다는 걸 잊지 마세요. `30 -10 30 5`에서 30보다 작은 서로 다른 값은 `-10, 5` 두 개예요.\n<\/details>\n\n<details><summary>힌트 2: 중복을 지우고 정렬한 뒤 위치를 사전에<\/summary>\n\n`sorted(set(a))`로 중복 없는 정렬 목록을 만들면, 목록에서 `v`의 인덱스가 곧 답이에요. 이제 원래 순서대로 각 값의 인덱스를 **빨리** 찾아야 해요. 매번 목록에서 찾으면 다시 느려져요. 값 → 인덱스를 미리 딕셔너리에 담아 두면 한 번에 O(1)이에요(31장 해싱). 34장 7단계처럼 정렬이 \"숨은 첫 단계\"인 문제예요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- `list.index(x)`는 앞에서부터 훑어서 O(N)이에요. 100만 번 부르면 O(N²)이라 시간 초과예요.\n- `set` 없이 `sorted(a)`의 첫 위치를 쓰면 **중복까지 센** 개수가 나와요. `30 -10 30 5 -10 100`에서 5의 답은 1인데 2가 나와요.\n- 입출력이 100만 개예요. `sys.stdin.buffer.read().split()`과 `' '.join`을 쓰세요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 18870 좌표 압축\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"각 값을 '나보다 작은 서로 다른 값의 개수'로 바꾸기. 즉 중복 없이 줄 세웠을 때의 순위(0부터).\" 확인 질문:\n- 같은 값은 한 번만 세나요? → **예, 서로 다른 값만**\n- 출력 순서는요? → **입력 순서 그대로**\n- N은요? → 100만. O(N log N)까지\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`30 -10 30 5 -10 100` → 서로 다른 값을 줄 세우면 `-10 5 30 100` → 순위 `-10:0, 5:1, 30:2, 100:3` → 답 `2 0 2 1 0 3`.\n경계: 원소 하나(0), 전부 같은 값(전부 0), 거꾸로 정렬된 입력, ±10⁹ 끝 값.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n각 값마다 서로 다른 값 집합을 훑어 자기보다 작은 걸 세요 → **O(N × 서로 다른 값 수)**, 최악 O(N²) = 10¹². 조금 나아 보이는 `sorted(set(a)).index(x)`도 `index`가 앞에서부터 훑으니 똑같이 O(N²)이에요. 채점기 큰 입력에서 강제 종료돼요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n\"나보다 작은 것의 개수\"를 값마다 따로 세는 게 병목이에요. 한 번 **정렬해 두면** 개수가 위치로 바뀌어요.\n- 중복을 지우고 정렬: `s = sorted(set(a))` → O(N log N). 이제 `s`에서 `v`의 인덱스 = 답.\n- 인덱스를 빨리 찾기: `s`는 정렬돼 있으니 이분 탐색(`bisect_left`, O(log N))도 되지만, 딕셔너리 `{값: 인덱스}`를 한 번 만들면 조회가 O(1)이에요.\n- \"정렬 → 순위를 사전에\" 두 단계가 좌표 압축이에요. 값이 10⁹처럼 커도 순위는 0..N-1이라, 나중에 배열 인덱스로 쓸 수 있게 돼요(세그먼트 트리, 누적 합 등).\n\n트리거 단어: \"작은 것의 개수\", \"순위\", \"값이 크지만 개수는 적다\" → 정렬 + 중복 제거 + 딕셔너리 (34장 7단계 \"정렬이 숨은 첫 단계\").\n\n## 5. 코드\n```python\nimport sys\ndata = sys.stdin.buffer.read().split()\nn = int(data[0])\na = list(map(int, data[1:1 + n]))\nrank = {v: i for i, v in enumerate(sorted(set(a)))}   # 값 → 순위\nsys.stdout.write(' '.join(str(rank[x]) for x in a) + '\\n')\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `rank[v]`는 `sorted(set(a))`에서 v의 인덱스예요. 그 리스트는 서로 다른 값을 오름차순으로 한 번씩 담아서, 인덱스 = v보다 작은 서로 다른 값의 개수예요.\n- **빠뜨리지 않는 이유**: `set`이 중복을 지우니 같은 값은 한 번만 세고, 모든 입력값이 `rank`의 키에 있어요. 출력은 원래 `a` 순서대로 `rank[x]`를 꺼내요.\n- **끝나는 이유**: 중복 제거 O(N), 정렬 O(N log N), 조회 N번 평균 O(1)이에요.\n- **깨지는 가정**: `set`을 빼고 `sorted(a)`로 순위를 매기면 같은 값이 여러 개일 때 뒤쪽 인덱스로 덮어써져 \"서로 다른 값\"이 아니게 돼요.\n\n## 6. 예제로 추적 (확인)\n`30 -10 30 5 -10 100`\n| 단계 | 결과 |\n|---|---|\n| `set(a)` 뒤 `sorted` | `[-10, 5, 30, 100]` |\n| `rank` | `{-10: 0, 5: 1, 30: 2, 100: 3}` |\n| 입력 순서대로 `rank[x]` | `2 0 2 1 0 3` ✓ |\n| (오답) `sorted(a)`에서 첫 위치 | `[-10, -10, 5, 30, 30, 100]` → 5는 2, 30은 3, 100은 5 ✗ |\n\n## 7. 복잡도\n`set` O(N) + 정렬 O(U log U) (U = 서로 다른 값 수) + 사전 만들기 O(U) + 조회 N번 O(N) → **O(N log N)**. 메모리 **O(N)**. 100만 개에서 입출력 포함 약 1.7초예요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `s.index(x)`로 순위 찾기 | 정답이지만 O(N²) | 큰 입력 (강제 종료) |\n| `set` 없이 `sorted(a)`의 첫 위치 | 중복까지 세서 답이 커짐 | 손 케이스 01 |\n| `bisect_left(s, x)` | 정답, O(N log N). 사전보다 조금 느릴 뿐 통과해요 | 통과 (오답 아님) |\n| `print`를 100만 번 | 출력이 느림 | 큰 입력에서 위험 |\n\n## 9. 면접에서 30초로 설명하기\n\"'나보다 작은 서로 다른 값의 개수'는 중복을 없애고 정렬했을 때의 위치입니다. 그래서 set으로 중복을 지우고 정렬한 뒤, 값에서 인덱스로 가는 딕셔너리를 만들고 원래 순서대로 조회합니다. 정렬이 O(N log N)이고 조회는 각 O(1)이라 전체 O(N log N)입니다. list.index로 찾으면 매번 O(N)이라 O(N²)이 됩니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **좌표 압축은 어디에 쓰나요?** 값의 **크기 관계만** 중요하고 실제 값은 필요 없을 때, 큰 값을 0..N-1로 줄여 배열 인덱스로 쓰려고요. 값 범위가 10⁹인 세그먼트 트리·펜윅 트리·2차원 누적 합에서 거의 항상 첫 단계예요. 34장 도전 문제(백준 1517)를 펜윅 트리로 풀 때도 이게 먼저예요.\n2. **딕셔너리 대신 이분 탐색을 쓰면요?** `bisect_left(s, x)`도 답이 같고 O(log N)이에요. 메모리를 덜 쓰고, 질의 값이 원래 목록에 없어도 \"나보다 작은 것의 개수\"를 줄 수 있다는 장점이 있어요. 사전은 목록에 있는 값만 조회돼요.\n3. **\"나보다 작은 값의 개수(중복 포함)\"라면요?** `set` 없이 정렬한 뒤 각 값의 **첫 위치**예요. `bisect_left(sorted(a), x)`이고, 위 표의 \"오답\"이 그 문제의 정답이에요. 문제 문장의 \"서로 다른\" 한 단어가 답을 바꿔요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 1331 Rank Transform of an Array(순위가 1부터), 백준 10816 「숫자 카드 2」(30장, 정렬 + 이분 탐색), LeetCode 315 Count of Smaller Numbers After Self(압축 + 펜윅 트리, Hard).\n", "starter": "# 백준 18870 좌표 압축 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 34/boj18870\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "34/lc0075", "chapter": "34", "slug": "lc0075", "title": "LeetCode 75 Sort Colors", "kind": "func", "ext": ".py", "tier": "Medium (LeetCode)", "role": "핵심", "target": "30분", "url": "https://leetcode.com/problems/sort-colors/", "time_limit": 1.0, "ref_time": 0.0009098330046981573, "problem": "# LeetCode 75 Sort Colors\n\n- 원문: https://leetcode.com/problems/sort-colors/\n- 난이도: Medium (LeetCode) · 역할: 핵심 · 목표 시간: 30분\n- 짝이 되는 장: 34. 정렬\n\n## 문제 (요약)\n0, 1, 2(세 가지 색)로만 된 리스트 `nums`가 있어요. 같은 색끼리 붙도록 0 → 1 → 2 순서로 **제자리에서** 다시 배치하세요. 새 리스트를 만들어 돌려주는 게 아니라 `nums` 자체를 바꿔야 해요. 라이브러리 정렬 함수는 쓰지 않는 게 이 문제의 약속이에요. 덤 과제: 리스트를 **한 번만** 훑고, 추가 메모리는 변수 몇 개만 쓰기.\n\n## 제약\n- 1 ≤ n ≤ 300 (채점기의 큰 입력은 시간 차이를 보려고 10,000으로 늘렸어요)\n- 각 값은 0, 1, 2 중 하나\n\n## 함수\n```python\ndef sort_colors(nums: list[int]) -> None   # 반환값 없음, nums를 직접 바꿔요\n```\n채점기는 반환값 대신 함수가 끝난 뒤의 `nums`를 봐요. \"라이브러리 정렬 금지\"와 \"한 번만 훑기\"는 채점기가 확인하지 못하니 스스로 지켜요.\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 34/lc0075` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 값이 세 가지뿐이라는 조건<\/summary>\n\n값의 종류가 셋뿐이면 비교 정렬을 할 필요가 없어요. 0, 1, 2가 각각 몇 개인지 세고 그 개수만큼 앞에서부터 덮어쓰면 두 번 훑기로 끝나요(34장 4단계 계수 정렬). 이걸 먼저 통과시키고, 그다음 \"한 번만 훑기\"에 도전해 보세요.\n<\/details>\n\n<details><summary>힌트 2: 리스트를 네 구역으로 나누기<\/summary>\n\n포인터 세 개 `lo`, `i`, `hi`로 리스트를 이렇게 나눠요. `[0, lo)`는 0, `[lo, i)`는 1, `[i, hi]`는 아직 안 본 값, `(hi, 끝]`은 2. `i`가 보는 값이 0이면 0 구역 끝으로, 2면 2 구역 앞으로 보내요. 34장 3단계 퀵 정렬의 \"기준 하나로 좌우 가르기\"를 세 갈래로 늘린 거예요(3-way partition).\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 2를 `hi`와 바꾼 뒤에는 `i`를 **올리지 않아요**. 뒤에서 가져온 값은 아직 안 본 값이라 다시 확인해야 해요(`[2, 1, 2]`).\n- 0을 `lo`와 바꾼 뒤에는 `i`도 올려요. `lo` 자리에서 온 값은 이미 본 1(또는 `lo == i`면 자기 자신)이에요.\n- 반복 조건은 `i <= hi`예요. `<`로 쓰면 마지막 한 칸을 안 봐요(`[1, 0]`).\n- `nums = sorted(nums)`는 함수 안에서 이름만 새 리스트에 붙이는 거라 바깥 리스트는 그대로예요.\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 75 Sort Colors\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"0, 1, 2만 있는 리스트를 제자리에서 정렬. 라이브러리 정렬 없이, 가능하면 한 번 훑기.\" 확인 질문:\n- 새 리스트를 돌려줘도 되나요? → **아니요, 제자리 수정**\n- 값이 꼭 셋 다 나오나요? → 아니요, 한두 색이 없을 수도 있어요\n- 몇 번 훑어도 되나요? → 두 번이면 쉬운 답, 한 번이 덤 과제\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`[2, 0, 1, 2, 1, 0]` → `[0, 0, 1, 1, 2, 2]`.\n경계: 원소 하나, 한 색만(`[1, 1, 1]`), 0과 2만, 뒤에서 가져온 값이 또 2(`[2, 1, 2]`), 마지막 칸이 0(`[1, 0]`), 이미 정렬됨, 거꾸로.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n버블 정렬처럼 직접 짠 비교 정렬 → **O(n²)**. 채점기 큰 입력(n = 10,000)에서 약 3초예요. 조금 나은 답은 **계수**: 0, 1, 2의 개수를 세고 앞에서부터 덮어쓰기. O(n)이고 정답이지만 두 번 훑어요.\n**면접 팁**: 두 번 훑기 답을 먼저 말하면 \"한 번에 할 수 있나요?\"가 꼬리 질문으로 와요. 그게 이 문제의 본론이에요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n값이 셋뿐이니 \"줄 세우기\"가 아니라 **세 구역으로 가르기**예요. 34장 3단계 퀵 정렬의 분할은 피벗 기준으로 \"작은 쪽 / 큰 쪽\" 두 구역이었어요. 여기선 1을 피벗으로 두고 \"작은 쪽(0) / 같은 쪽(1) / 큰 쪽(2)\" 세 구역으로 가르면 돼요.\n- 불변식: `[0, lo)` = 0, `[lo, i)` = 1, `[i, hi]` = 미확인, `(hi, n)` = 2.\n- `nums[i]`가 0 → `lo`와 교환, `lo`, `i` 둘 다 +1. (`lo` 자리에 있던 건 1이었으니 `i` 쪽으로 와도 불변식 유지)\n- `nums[i]`가 1 → `i`만 +1.\n- `nums[i]`가 2 → `hi`와 교환, `hi`만 −1. (가져온 값은 미확인이라 `i`는 그대로)\n- 미확인 구역이 비면(`i > hi`) 끝.\n\n트리거 단어: \"라이브러리 정렬 쓰지 말고\", \"값의 종류가 몇 개뿐\" → 계수 정렬 또는 세 포인터(Dutch national flag) (34장 패턴 트리거 표).\n\n## 5. 코드\n```python\ndef sort_colors(nums):\n    lo, i, hi = 0, 0, len(nums) - 1\n    while i <= hi:\n        if nums[i] == 0:\n            nums[lo], nums[i] = nums[i], nums[lo]\n            lo += 1\n            i += 1\n        elif nums[i] == 2:\n            nums[i], nums[hi] = nums[hi], nums[i]\n            hi -= 1                 # i는 그대로: 가져온 값을 다시 봐요\n        else:\n            i += 1\n```\n\n## 왜 이 코드가 정답인가\n(4단계의 불변식을 코드와 이어 정리해요.)\n- **불변식**: 반복을 시작할 때 `nums[0:lo]`는 0, `nums[lo:i]`는 1, `nums[i:hi+1]`은 미확인, `nums[hi+1:]`은 2예요. 세 갈래 모두 한 칸을 정리하면서 이 모양을 지켜요.\n- **빠뜨리지 않는 이유**: 0과 바꾼 `nums[lo]`는 이미 본 1(또는 `lo == i`이면 자기 자신)이라 `i`를 올려도 돼요. 2와 바꿔 온 `nums[hi]`는 아직 안 본 값이라 `i`를 그대로 두고 다시 봐요. 그래서 미확인 칸은 하나도 건너뛰지 않아요.\n- **끝나는 이유**: 매 반복 `i`가 1 늘거나 `hi`가 1 줄어서, 미확인 구역 `hi - i + 1`이 매번 1씩 줄어요. n번 안에 끝나요.\n- **깨지는 가정**: 2와 바꾼 뒤에 `i`도 올리면, 가져온 값이 0이나 2일 때 그대로 지나가서 틀려요(예: `[1, 2, 0]` → `[1, 0, 2]`).\n\n## 6. 예제로 추적 (확인)\n`[2, 0, 1, 2, 1, 0]` (처음 lo=0, i=0, hi=5)\n| 본 값 | 동작 | nums | lo | i | hi |\n|---|---|---|---|---|---|\n| 2 | hi(5)와 교환 | `0 0 1 2 1 2` | 0 | 0 | 4 |\n| 0 | lo(0)와 교환 (자기 자신) | `0 0 1 2 1 2` | 1 | 1 | 4 |\n| 0 | lo(1)와 교환 (자기 자신) | `0 0 1 2 1 2` | 2 | 2 | 4 |\n| 1 | 지나감 | `0 0 1 2 1 2` | 2 | 3 | 4 |\n| 2 | hi(4)와 교환 | `0 0 1 1 2 2` | 2 | 3 | 3 |\n| 1 | 지나감 | `0 0 1 1 2 2` | 2 | 4 | 3 |\ni > hi라서 끝 ✓. 첫 줄에서 뒤에서 가져온 0을 `i`를 올리지 않고 다시 본 게 핵심이에요.\n\n## 7. 복잡도\n매 반복마다 `i`가 늘거나 `hi`가 줄어서 미확인 구역이 한 칸씩 줄어요 → 많아야 n번, **O(n), 한 번 훑기**. 추가 메모리 **O(1)**.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `nums = sorted(nums)` | 바깥 리스트가 그대로 | 손 케이스 \"세 색 섞임\" |\n| 2와 교환한 뒤 `i += 1` | 뒤에서 온 2를 안 보고 지나침 | 손 케이스 \"끝에서 가져온 값도 2\" |\n| `while i < hi` | 마지막 한 칸을 안 봄 | 손 케이스 \"마지막 한 칸을 안 보면 틀림\" |\n| 직접 짠 O(n²) 정렬 | 정답이지만 느림 | 큰 입력 |\n| `nums.sort()`나 계수로 두 번 훑기 | 정답이고 통과해요 | 못 잡아요. 문제의 약속(라이브러리 금지, 한 번 훑기)은 스스로 확인 |\n\n## 9. 면접에서 30초로 설명하기\n\"포인터 세 개로 리스트를 0 구역, 1 구역, 미확인 구역, 2 구역으로 나눕니다. i가 0을 보면 0 구역 끝과 바꾸고 둘 다 전진, 1이면 i만 전진, 2면 2 구역 앞과 바꾸고 hi만 줄입니다. 2를 바꿔 온 값은 아직 확인하지 않았으니 i를 그대로 둡니다. 미확인 구역이 매번 한 칸씩 줄어서 한 번 훑기 O(n), 추가 공간 O(1)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **이게 퀵 정렬과 무슨 관계인가요?** 퀵 정렬의 분할을 \"작다 / 같다 / 크다\" 세 갈래로 한 것이에요(3-way partition). 같은 값이 많은 입력에서 퀵 정렬이 O(n²)으로 무너지는 걸 막는 방법으로 실제로 쓰여요. 같은 값을 가운데 모아 두고 양쪽만 재귀하니까요 (34장 3단계).\n2. **색이 k가지라면요?** 계수 정렬이 O(n + k)로 가장 단순해요. 제자리를 고집하면 k가 작을 때 이 분할을 반복하거나, 퀵 정렬처럼 색 범위를 반으로 나눠 재귀하는 O(n log k) 방법이 있어요 (LintCode Sort Colors II).\n3. **이 방법은 안정적인가요?** 아니요. 멀리 있는 원소와 통째로 교환해서, 값에 붙은 다른 정보가 있었다면 순서가 섞여요. 안정성이 필요하면 계수 정렬의 누적 합 방식을 써요 (34장 4단계 \"계수 정렬도 안정적으로\").\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 12분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 283 Move Zeroes(두 구역), LeetCode 905 Sort Array By Parity, LeetCode 2161 Partition Array According to Given Pivot.\n", "starter": "# LeetCode 75 Sort Colors — 함수 몸통을 채우세요.  채점: python algo/judge.py 34/lc0075\n# 반환값은 보지 않아요. 채점기는 함수가 끝난 뒤 nums 리스트 자체가 정렬됐는지 봐요(제자리 수정).\n\n\ndef sort_colors(nums: list[int]) -> None:\n    pass\n"}, {"id": "34/pg42747", "chapter": "34", "slug": "pg42747", "title": "프로그래머스 42747 H-Index", "kind": "func", "ext": ".py", "tier": "Lv. 2 (프로그래머스)", "role": "핵심", "target": "25분", "url": "https://school.programmers.co.kr/learn/courses/30/lessons/42747", "time_limit": 1.0, "ref_time": 0.0033227500098291785, "problem": "# 프로그래머스 42747 H-Index\n\n- 원문: https://school.programmers.co.kr/learn/courses/30/lessons/42747\n- 난이도: Lv. 2 (프로그래머스) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 34. 정렬\n\n## 문제 (요약)\n어떤 연구자가 쓴 논문 n편의 인용 횟수 목록이 주어져요. \"**h번 이상 인용된 논문이 h편 이상**\"이 되는 가장 큰 h를 돌려주세요. 이 h를 그 연구자의 H-Index라고 해요. h는 목록에 들어 있는 값이 아닐 수도 있어요.\n\n## 제약\n- 1 ≤ n ≤ 1,000 (채점기의 큰 입력은 시간 차이를 보려고 20,000으로 늘렸어요)\n- 각 인용 횟수는 0 이상 10,000 이하\n\n## 함수\n```python\ndef solution(citations: list[int]) -> int\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 34/pg42747` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 프로그래머스에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 줄을 세우면 무엇이 보이나<\/summary>\n\n인용 횟수를 **많은 순서로** 줄 세워 보세요. `[4, 4, 0, 7, 2]` → `7 4 4 2 0`. 위에서 k번째 논문의 인용 수가 k 이상이면, 위의 k편이 **모두** k번 이상 인용된 거예요. 왜 그런지(내림차순이니까) 한 줄로 말해 보세요.\n<\/details>\n\n<details><summary>힌트 2: 정렬 뒤 인덱스의 뜻<\/summary>\n\n내림차순 정렬 뒤 0부터 세는 인덱스 `i`에서 `c[i] >= i + 1`이면 \"h = i + 1이 가능\"이에요. 이 조건은 위에서부터 참이다가 한 번 거짓이 되면 그 뒤로는 계속 거짓이에요(c는 줄고 i + 1은 느니까요). 그러니 처음 거짓이 되기 직전의 `i + 1`이 답이에요. 34장 7단계처럼 정렬이 숨은 첫 단계예요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 답 후보를 **목록에 있는 값**에서만 고르면 틀려요. `[10, 10, 10]`의 답은 10이 아니라 3이에요.\n- `i`와 `i + 1`을 헷갈리기 쉬워요. \"위에서 몇 편째인가\"는 `i + 1`이에요.\n- 오름차순으로 정렬했다면 인덱스의 뜻이 달라져요. 위에서 `i`번째 대신 \"나 이상인 논문은 `n - i`편\"으로 바꿔 생각해야 해요.\n- 전부 0이면 답은 0이에요. `h = 0`으로 시작하세요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 프로그래머스 42747 H-Index\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"h번 이상 인용된 논문이 h편 이상인 가장 큰 h.\" 확인 질문:\n- h가 목록에 있는 값이어야 하나요? → **아니요** (`[10, 10, 10]` → 3)\n- 인용 0번인 논문만 있으면요? → 0\n- 원문의 \"나머지 논문은 h번 이하 인용\"이라는 조건은 따로 확인해야 하나요? → 가장 큰 h를 고르면 저절로 성립해요. h + 1번 이상 인용된 논문이 h + 1편 이상이었다면 h + 1이 답이었을 테니까요\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`[4, 4, 0, 7, 2]` → h = 3이면 3번 이상 인용된 논문이 7, 4, 4로 3편 ✓. h = 4면 4번 이상이 7, 4, 4로 3편 ✗. 답 3.\n경계: 전부 0(0), 전부 같은 큰 값(논문 수가 답), 논문 하나(인용 0이면 0, 1 이상이면 1), h와 인용 수가 딱 같음(`[2, 2, 2, 2]` → 2).\n\n## 3. 브루트포스와 그 복잡도 (2분)\nh를 n부터 0까지 내려가며 \"h 이상인 논문 수\"를 매번 세요 → **O(n²)**. 원래 제약(n ≤ 1,000)이면 100만 번이라 통과하지만, 채점기 큰 입력(n = 20,000)에서는 약 7초 걸려요.\n**면접 팁**: 제약이 작아 브루트포스가 통과하더라도, 더 나은 복잡도를 말할 수 있으면 점수가 올라가요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\nh마다 \"몇 편이 h 이상인가\"를 처음부터 다시 세는 게 병목이에요. **내림차순으로 정렬해 두면** 그 개수가 위치로 바뀌어요.\n- 내림차순 `c`에서 위에서 `i + 1`번째 논문 `c[i]`가 `i + 1` 이상이면, 그 위의 논문은 모두 `c[i]` 이상이니 \"`i + 1`번 이상 인용된 논문이 `i + 1`편 이상\" ✓.\n- `c[i]`는 줄고 `i + 1`은 늘어서, 조건은 참 … 참, 거짓 … 거짓 모양이에요. 처음 거짓이 나오면 멈춰요.\n- 답 = 조건이 참인 마지막 `i + 1`. 같은 뜻으로 `max(min(c[i], i + 1))`라고 써도 돼요.\n\n트리거 단어: \"~ 이상인 것이 ~개 이상\", \"가장 큰 h\" → 내림차순 정렬 뒤 인덱스와 값을 비교 (34장 7단계 \"정렬이 숨은 첫 단계\").\n\n## 5. 코드\n```python\ndef solution(citations):\n    c = sorted(citations, reverse=True)\n    h = 0\n    for i, x in enumerate(c):\n        if x >= i + 1:        # 위의 i+1편이 모두 i+1번 이상\n            h = i + 1\n        else:\n            break\n    return h\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `c`는 내림차순이라, `x = c[i] >= i + 1`이면 위의 `i + 1`편이 모두 `i + 1`번 이상 인용됐어요. 그때 `h = i + 1`로 기록해요.\n- **빠뜨리지 않는 이유**: `c[i]`는 줄고 `i + 1`은 늘어서 조건은 참 … 참, 거짓 … 거짓 모양이에요. 처음 거짓에서 `break`해도 그 뒤에 참이 다시 나올 수 없으니 마지막 참이 가장 큰 h예요.\n- **h가 목록에 없어도 되는 이유**: h를 인용 값이 아니라 위치 `i + 1`로 세서, `[10, 10, 10]`에서 3이 나와요.\n- **끝나는 이유**: 정렬 O(n log n), 훑기 O(n)이에요.\n- **깨지는 가정**: 오름차순으로 정렬한 채 같은 비교를 하면 위치와 개수의 관계가 깨져 틀려요. 전부 0이면 첫 비교에서 거짓이라 `h = 0`이 맞게 나와요.\n\n## 6. 예제로 추적 (확인)\n`[4, 4, 0, 7, 2]` → 내림차순 `7 4 4 2 0`\n| i | c[i] | i + 1 | c[i] ≥ i + 1 | h |\n|---|---|---|---|---|\n| 0 | 7 | 1 | 참 | 1 |\n| 1 | 4 | 2 | 참 | 2 |\n| 2 | 4 | 3 | 참 | 3 |\n| 3 | 2 | 4 | 거짓 → 멈춤 | 3 |\n답 3 ✓\n\n## 7. 복잡도\n정렬 **O(n log n)**, 훑기 O(n), 메모리 O(n). 값이 0..10,000으로 좁으니 계수 정렬처럼 \"인용 수별 개수\"를 세어 뒤에서부터 누적하면 **O(n + K)**(K = 10,000)도 가능해요(34장 4단계).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 답 후보를 목록의 값에서만 고름 | `[4,4,0,7,2]`에서 2, `[10,10,10]`에서 0 | 손 케이스 \"중간에서 끊김\", \"답이 배열에 없는 값\" |\n| 조건을 `c[i] >= i`로 (0부터 센 인덱스를 그대로 h로) | 1 작게 나옴 (`[4,4,0,7,2]`에서 2) | 손 케이스 \"중간에서 끊김\" |\n| 오름차순 정렬 뒤 내림차순처럼 해석 | 엉뚱한 값 (`[4,4,0,7,2]`에서 2) | 손 케이스 \"중간에서 끊김\" |\n| h마다 다시 세기 | 정답이지만 O(n²) | 큰 입력 |\n\n## 9. 면접에서 30초로 설명하기\n\"인용 수를 내림차순으로 정렬하면, 위에서 i+1번째 논문의 인용 수가 i+1 이상일 때 위의 i+1편이 모두 i+1번 이상 인용된 것입니다. 이 조건은 앞에서부터 참이다가 한 번 거짓이 되면 계속 거짓이니, 참인 마지막 i+1이 H-Index입니다. 정렬 O(n log n)에 한 번 훑기입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **정렬 없이 O(n)으로 할 수 있나요?** 네. h는 n을 넘을 수 없으니, 인용 수를 `min(인용, n)`으로 잘라 0..n 칸에 개수를 세요. 뒤에서부터 누적하면서 \"누적 ≥ 칸 번호\"가 처음 되는 칸이 답이에요. 계수 정렬의 생각이에요 (LeetCode 274의 O(n) 풀이).\n2. **이미 오름차순으로 정렬돼 들어오면요?** 이분 탐색으로 O(log n)이에요. 오름차순에서 `c[i] >= n - i`가 처음 참이 되는 `i`를 찾으면 답은 `n - i`예요 (LeetCode 275 H-Index II, 35장).\n3. **조건이 왜 \"참 … 거짓\"으로 한 번만 바뀌나요?** 내림차순이라 `c[i]`는 늘지 않고 `i + 1`은 1씩 늘어요. 한 번 `c[i] < i + 1`이 되면 다음 칸에서도 `c[i+1] ≤ c[i] < i + 1 < i + 2`예요. 이 **단조성**이 \"멈춰도 된다\"와 \"이분 탐색이 된다\"의 근거예요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 274 H-Index(같은 문제), LeetCode 275 H-Index II, 프로그래머스 「K번째수」, 「가장 큰 수」(34장 끝까지 따라가기 ①).\n", "starter": "# 프로그래머스 42747 H-Index — 함수 몸통을 채우세요.  채점: python algo/judge.py 34/pg42747\n\n\ndef solution(citations):\n    answer = 0\n    return answer\n"}, {"id": "35/boj1300", "chapter": "35", "slug": "boj1300", "title": "백준 1300 K번째 수", "kind": "stdio", "ext": ".py", "tier": "Gold I (solved.ac)", "role": "도전", "target": "50분", "url": "https://solved.ac/problems/id/1300", "time_limit": 1.5, "ref_time": 0.2139761250000447, "problem": "# 백준 1300 K번째 수\n\n- 원문: https://solved.ac/problems/id/1300\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold I (solved.ac) · 역할: 도전 · 목표 시간: 50분\n- 짝이 되는 장: 35. 이진 탐색\n\n## 문제 (요약)\nN×N 표가 있고, i행 j열(1부터 셈)에는 `i × j`가 적혀 있어요. 이 N²개 수를 한 줄로 늘어놓고 오름차순으로 정렬했을 때, 앞에서 **k번째**(1부터 셈) 수를 출력하세요. 같은 수가 여러 번 나오면 나온 만큼 따로 세요.\n\n## 제약\n- 1 ≤ N ≤ 100,000\n- 1 ≤ k ≤ min(10⁹, N²)\n- 입력: 첫 줄 N, 둘째 줄 k / 출력: 수 하나\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 35/boj1300` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 표를 만들 수는 없어요<\/summary>\n\nN²은 최대 100억 개라서 만들 수도 정렬할 수도 없어요. 그런데 \"k번째 수가 x다\"는 말을 다르게 바꿀 수 있어요. **\"x 이하인 수가 몇 개인가?\"**를 빨리 셀 수 있다면 어떨까요? i행만 보면 `i, 2i, 3i, …, Ni`예요. 이 중 x 이하는 몇 개인가요?\n<\/details>\n\n<details><summary>힌트 2: 답을 탐색하기<\/summary>\n\n`count(x)` = x 이하인 칸의 개수 = `sum(min(x // i, N) for i in 1..N)`. O(N)이에요. x가 커지면 `count(x)`는 줄지 않아요. 그러면 k번째 수는 **`count(x) >= k`가 되는 가장 작은 x**예요. 35장 4단계의 파라메트릭 서치, 첫 번째 True(템플릿 B)예요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- `x // i`에 `min(…, N)`을 빼먹으면 한 행에 N개보다 많이 세요. N이 작고 k가 클 때 틀려요.\n- 상한은 `k`면 충분해요(k번째 수는 k를 넘지 않아요. 1행에 `1, 2, …`가 있으니까요). `N`으로 잡으면 모자라요.\n- `count(mid) > k`(등호 없음)로 쓰면 같은 수가 여러 칸에 있을 때 틀려요. \"k개 **이상**\"이에요.\n- 왜 \"첫 번째 True\"가 실제로 표에 있는 수일까요? 그보다 1 작은 수에서는 개수가 k 미만이었으니, 정확히 그 수에서 개수가 늘어난 거예요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 1300 K번째 수\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"곱셈표 N×N을 정렬했을 때 k번째 값.\" 확인할 것:\n- 같은 값은 따로 세나요? → 네 (2 = 1×2 = 2×1 이 두 칸)\n- 인덱스는 1부터인가요? → 네, k번째는 `B[k-1]`이 아니라 문제의 `B[k]`\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\nN = 4: `1 2 3 4 / 2 4 6 8 / 3 6 9 12 / 4 8 12 16` → 정렬 `1 2 2 3 3 4 4 4 6 6 8 8 9 12 12 16`. k = 10 → **6**.\n경계:\n- N = 1 (손 케이스 02), k = 1 (04), k = N² → N² (03)\n- N이 크고 k가 작음 (05: N = 100,000, k = 5 → 3)\n\n## 3. 브루트포스와 그 복잡도 (2분)\nN²개를 만들어 정렬 → O(N² log N). N = 10⁵이면 100억 개라 메모리부터 불가능해요. 채점기의 `brute.py`가 이 방법이고 N ≤ 30에서만 써요.\n\n## 3½. 중간 풀이와 왜 부족한가 (도전 문제라서)\n각 행이 이미 정렬돼 있으니 **행 N개를 힙으로 병합**하면서 k번 꺼내요(30장 `heapq`). 표를 만들 필요가 없어서 메모리는 O(N)이에요. 하지만 시간은 O(k log N)이고 k가 10⁹이에요. 30 × 10⁹ → 안 돼요. 실제로 채점기 큰 입력에서 강제 종료됐어요.\n교훈: \"k번째\"를 **하나씩 세어 가면** k에 비례해요. k에 로그로 가려면 **값 쪽을 반씩 버려야** 해요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n\"k번째 값이 무엇인가?\"를 \"값 x 이하가 몇 개인가?\"로 뒤집어요.\n- `count(x)`: i행은 `i, 2i, …, Ni`이니 x 이하인 칸은 `min(x // i, N)`개. 모든 행을 더하면 O(N).\n- x가 커지면 `count(x)`는 줄지 않아요 → `count(x) >= k`는 `F…F T…T`.\n- 답은 **첫 번째 True**. 범위는 `[1, k]`.\n\n트리거 단어: \"k번째\", 원소가 너무 많아 만들 수 없음, \"x 이하 개수\"를 셀 수 있음 → 답에 대한 이진 탐색 + 개수 세기(35장 4단계, 템플릿 B). 35장 3단계에서 `bisect_left`가 \"x 이상인 첫 자리\"를 준 것과 같은 질문을, 배열 없이 하는 거예요.\n\n## 5. 코드\n```python\nimport sys\n\nn = int(sys.stdin.readline())\nk = int(sys.stdin.readline())\n\ndef count(x):\n    total = 0\n    for i in range(1, min(n, x) + 1):     # i > x인 행은 0개라 생략\n        total += min(x // i, n)\n    return total\n\nlo, hi = 1, k\nwhile lo < hi:\n    mid = (lo + hi) // 2                  # 첫 번째 True → 내림, hi = mid\n    if count(mid) >= k:\n        hi = mid\n    else:\n        lo = mid + 1\nprint(lo)\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: 답은 늘 `[lo, hi]` 안에 있고 `count(hi) >= k`예요. 처음 `hi = k`도 표에서 k 이하인 수가 k개 이상이라 성립해요.\n- **빠뜨리지 않는 이유**: `count(x)`는 x가 커질수록 줄지 않아요. 그래서 `count(x) >= k`인 첫 x가 k번째 수이고, `count(x-1) < k`이니 x는 표에 실제로 있는 수예요.\n- **끝나는 이유**: `mid`를 내림으로 잡아 `hi = mid`든 `lo = mid + 1`이든 구간이 매번 줄어요. log₂k ≈ 30번 × `count` O(N)이에요.\n- **깨지는 가정**: 답이 k 이하라는 점에 기대요. `hi = n`으로 잡으면 N = 3, k = 9에서 9가 아니라 3이 나와요.\n\n## 6. 예제로 추적 (확인)\nN = 4, k = 10, `lo = 1, hi = 10` (실행해서 기록했어요)\n| lo, hi | mid | 행별 개수 | count | 10 이상? → 다음 |\n|---|---|---|---|---|\n| 1, 10 | 5 | 4, 2, 1, 1 | 8 | 아니요 → lo = 6 |\n| 6, 10 | 8 | 4, 4, 2, 2 | 12 | 네 → hi = 8 |\n| 6, 8 | 7 | 4, 3, 2, 1 | 10 | 네 → hi = 7 |\n| 6, 7 | 6 | 4, 3, 2, 1 | 10 | 네 → hi = 6 |\n| 6, 6 | — | — | — | 답 **6** |\n\n3번째 줄을 보세요. `count(7) = 10`도 True예요. 7은 표에 없는 수인데도요. 그래서 \"True인 아무 값\"이 아니라 **첫 번째** True를 찾아야 해요. `count(5) = 8 < 10`이고 `count(6) = 10`이니, 6에서 개수가 늘었고 6은 표에 있는 수예요.\n\n## 7. 복잡도\n이진 탐색 log₂(10⁹) ≈ 30번 × `count` O(N) → **O(N log k)**, 약 300만 번. 메모리 O(1). 채점기 큰 입력에서 0.4초 안팎이에요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `min(x // i, N)`에서 min 빠짐 | 한 행을 N개 넘게 세서 답이 작게 나옴 | 손 케이스 03 (직접 돌려 확인했어요) |\n| 상한을 `N`으로 | 답이 N보다 크면 못 찾음 | 손 케이스 01 (확인) |\n| `count(mid) > k` | 같은 값이 여러 칸일 때 한 칸 뒤 값이 나옴 | 손 케이스 01 (확인) |\n| 행 병합 힙으로 k번 꺼내기 | 정답이지만 O(k log N) | 큰 입력에서 강제 종료 (확인) |\n| 마지막 True 틀 (`lo = mid`) | 표에 없는 큰 값이 나옴 | 손 케이스 01 |\n\n## 9. 면접에서 30초로 설명하기\n\"표를 만들면 N²개라 불가능하니, k번째 값을 직접 찾지 않고 'x 이하인 칸이 몇 개인가'를 셉니다. i행은 i의 배수라서 min(x/i, N)개이고, 모든 행을 더하면 O(N)입니다. 이 개수는 x에 대해 단조 증가하니, 개수가 k 이상이 되는 가장 작은 x를 1부터 k까지 이진 탐색합니다. O(N log k)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **정렬된 행렬(LeetCode 378 Kth Smallest Element in a Sorted Matrix)이라면?** 같은 틀이에요. 값이 `i × j`가 아니라 임의라서 `count(x)`를 계단식으로 세요. 왼쪽 아래에서 출발해 x보다 크면 위로, 아니면 오른쪽으로 가면서 세면 O(N)이에요. 힙 방식 O(k log N)도 정답이고, k가 작으면 그쪽이 빨라요.\n2. **이 방식으로 찾은 값이 표에 실제로 있다는 걸 어떻게 보장하나요?** 첫 번째 True x에서 `count(x-1) < k ≤ count(x)`예요. 개수가 x-1에서 x로 넘어갈 때 늘었다는 건 x와 같은 칸이 있다는 뜻이에요.\n3. **`count`를 더 빠르게 할 수 있나요?** `x // i`가 같은 값을 갖는 i 구간을 묶으면 O(√x)로 줄어요. 이 문제에서는 O(N)으로 충분해요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 30분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 668 Kth Smallest Number in Multiplication Table(같은 문제), LeetCode 378, LeetCode 410 Split Array Largest Sum.\n", "starter": "# 백준 1300 K번째 수 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 35/boj1300\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "35/boj1654", "chapter": "35", "slug": "boj1654", "title": "백준 1654 랜선 자르기", "kind": "stdio", "ext": ".py", "tier": "Silver II (solved.ac)", "role": "핵심", "target": "25분", "url": "https://solved.ac/problems/id/1654", "time_limit": 1.0, "ref_time": 0.018177124991780147, "problem": "# 백준 1654 랜선 자르기\n\n- 원문: https://solved.ac/problems/id/1654\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Silver II (solved.ac) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 35. 이진 탐색\n\n## 문제 (요약)\n길이가 제각각인 랜선 K개를 가지고 있어요. 모두 **같은 길이**(정수, 센티미터)로 잘라서 랜선을 N개 이상 만들고 싶어요. 자르고 남은 자투리는 버려요. 이어 붙일 수는 없어요. N개 이상을 만들 수 있는 길이 중 **가장 긴** 길이를 출력하세요. N개를 만드는 것은 항상 가능해요.\n\n## 제약\n- 1 ≤ K ≤ 10,000, 1 ≤ N ≤ 1,000,000, K ≤ N\n- 각 랜선의 길이는 2³¹−1 이하의 자연수\n- 입력: 첫 줄 `K N`, 다음 K줄에 랜선 길이 하나씩 / 출력: 최대 길이 하나\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 35/boj1654` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 길이를 내가 정해 준다면<\/summary>\n\n\"가장 긴 길이는?\"이라고 물으면 막막해요. 질문을 바꿔 보세요. **\"길이를 L로 정하면 N개 이상 나오나?\"** 이건 랜선을 한 번 훑어서 `x // L`을 더하면 바로 답할 수 있어요. 그리고 L을 키우면 나오는 개수는 어떻게 변하나요?\n<\/details>\n\n<details><summary>힌트 2: 답 자체를 탐색하기<\/summary>\n\nL이 커질수록 개수는 줄기만 해요. 그래서 판정은 `T T … T F F … F` 모양이에요. 우리가 찾는 건 **마지막 True**예요. 35장 4단계의 파라메트릭 서치, 템플릿 C예요. 바로 앞의 \"끝까지 따라가기 ① 나무 자르기\"와 같은 모양이에요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- **하한을 0으로 잡으면** `x // 0`에서 `ZeroDivisionError`가 나요. 답은 항상 1 이상이니 `lo = 1`이에요.\n- 상한은 `max(길이)`예요. `min(길이)`로 잡으면 답이 가장 짧은 랜선보다 길 수 있는 경우를 놓쳐요(짧은 건 버리고 긴 것만 잘라도 되니까요).\n- `lo = mid`를 쓰면 `mid = (lo + hi + 1) // 2`로 올림해야 무한 루프가 안 나요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 1654 랜선 자르기\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"모든 랜선을 같은 정수 길이 L로 잘라 N개 이상. 가능한 L의 최댓값.\" 확인할 것:\n- 랜선 하나를 통째로 안 써도 되나요? → 네, 자투리는 버려요. 그래서 짧은 랜선은 0개를 낼 수도 있어요.\n- 답이 없을 수 있나요? → 없음. 항상 가능하다고 했으니 **답은 1 이상**이에요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`[10, 15, 20]`, N = 7. L = 5면 2 + 3 + 4 = 9개, L = 6이면 1 + 2 + 3 = 6개. 답 5.\n경계:\n- 답이 가장 짧은 랜선보다 긴 경우: `[5, 9, 3]`, N = 3 → L = 4면 1 + 2 + 0 = 3개라서 답 4 (손 케이스 03)\n- 랜선 하나에 길이 1 → 답 1 (손 케이스 02)\n- 길이가 2³¹−1이고 그대로 답 (손 케이스 04)\n\n## 3. 브루트포스와 그 복잡도 (2분)\nL을 `max`에서 1까지 하나씩 내려가며 처음으로 N개가 되는 L을 출력해요. 시험 한 번이 O(K)이고, 시험 횟수가 최대 2³¹ → 불가능해요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n브루트포스는 L 후보를 하나씩 다 봐요. 그런데\n- `ok(L)` = \"L로 자르면 N개 이상\" 은 **L이 작을수록 쉬워요**. L에서 되면 L − 1에서도 반드시 돼요(단조성).\n- 그러면 L 후보 전체에 이진 탐색을 걸 수 있어요. 시험이 31번이면 끝나요.\n\n트리거 단어: \"조건을 만족하는 **최댓값**\", 답의 범위가 거대(2³¹) → 파라메트릭 서치 + 템플릿 C(35장 4단계). 설정 다섯 단계로 정리하면 이래요.\n1. 답 변수: 자를 길이 L\n2. `ok(L)`: `sum(x // L) >= N`\n3. 단조성: L이 커지면 개수가 줄어요 → `T…T F…F`\n4. 범위: `lo = 1`(답이 1 이상 보장, 0이면 나누기 에러), `hi = max(길이)`\n5. 최댓값 → 마지막 True, `mid` 올림\n\n## 5. 코드\n```python\nimport sys\n\ndata = sys.stdin.buffer.read().split()\nk, n = int(data[0]), int(data[1])\nlines = list(map(int, data[2:2 + k]))\n\nlo, hi = 1, max(lines)\nwhile lo < hi:\n    mid = (lo + hi + 1) // 2                     # 마지막 True → 올림\n    if sum(x // mid for x in lines) >= n:\n        lo = mid\n    else:\n        hi = mid - 1\nprint(lo)\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `lo`는 늘 N개 이상을 만들 수 있는 길이이고, 답은 `hi` 이하예요.\n- **빠뜨리지 않는 이유**: 각 랜선에서 `x // (L-1) >= x // L`이라 L로 되면 더 짧은 길이로도 돼요. 그래서 True 구간의 마지막 값이 최대 길이예요.\n- **끝나는 이유**: `mid`를 올림으로 잡아 `lo = mid`가 `lo`를 최소 1 늘려요. 31번 × O(K)예요.\n- **깨지는 가정**: \"N개를 만드는 것은 항상 가능\"해서 `lo = 1`이 참이에요. 이 보장이 없으면 K = 1, N = 2, 길이 1에서 불가능한데도 1을 출력해요.\n\n## 6. 예제로 추적 (확인)\n`[10, 15, 20]`, N = 7 (실행해서 기록한 값이에요)\n| lo, hi | mid | 조각 수 | 7 이상? → 다음 |\n|---|---|---|---|\n| 1, 20 | 11 | 0+1+1 = 2 | 아니요 → hi = 10 |\n| 1, 10 | 6 | 1+2+3 = 6 | 아니요 → hi = 5 |\n| 1, 5 | 3 | 3+5+6 = 14 | 네 → lo = 3 |\n| 3, 5 | 4 | 2+3+5 = 10 | 네 → lo = 4 |\n| 4, 5 | 5 | 2+3+4 = 9 | 네 → lo = 5 |\n| 5, 5 | — | — | 끝, 답 **5** |\n\n마지막에서 두 번째 줄을 보세요. `lo = 4, hi = 5`에서 내림으로 `mid = 4`를 잡았다면 `lo = 4`가 그대로라 영원히 돌아요. 올림이라 5를 잡았어요.\n\n## 7. 복잡도\n이진 탐색 log₂(2³¹) = 31번 × 한 번에 O(K) → **O(K log(max))**, 약 31만 번. 메모리 O(K).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `lo = 0`으로 시작 | `x // 0`에서 ZeroDivisionError | 손 케이스 02 (직접 돌려 확인했어요) |\n| `hi = min(길이)` | 짧은 랜선을 버리는 답을 놓쳐서 3이 나옴 | 손 케이스 03 (확인) |\n| `lo = mid`인데 `mid` 내림 | 무한 루프 → 강제 종료 | 손 케이스 01 |\n| L을 max에서 1씩 줄이기 | 정답이지만 끝나지 않음 | 손 케이스 06에서 시간 초과 (확인) |\n\n## 9. 면접에서 30초로 설명하기\n\"최대 길이를 직접 구하는 대신, 길이 L로 잘랐을 때 N개 이상 나오는지를 판정합니다. 판정은 랜선을 한 번 훑으면 O(K)이고, L이 커질수록 개수가 줄어들어 단조롭습니다. 그래서 1부터 최대 길이까지 이진 탐색으로 마지막 True를 찾습니다. 31번 반복이라 O(K log max)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **길이를 실수로 잘라도 된다면?** `while` 대신 반복 횟수를 100번쯤 고정해요(35장 5단계, 템플릿 E). 오차 기준으로 멈추면 부동소수점 때문에 끝나지 않을 수 있어요.\n2. **K가 10⁶이고 N이 매우 크면 무엇이 병목인가요?** `ok` 한 번이 O(K)라서 31 × 10⁶ = 3,100만 번이에요. 파이썬에서는 아슬아슬해서, 나무 자르기처럼 PyPy3나 루프 미세 최적화를 생각해요.\n3. **왜 이분 탐색이 맞다고 확신하나요?** \"L로 되면 L − 1로도 반드시 된다\"를 한 문장으로 말할 수 있어서요. 각 랜선에서 `x // (L−1) >= x // L`이니까요. 작은 입력에서 완전 탐색과 비교하는 것도 확인 방법이에요(채점기의 스트레스 단계가 그거예요).\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 15분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 2805 「나무 자르기」(35장 끝까지 따라가기 ①), LeetCode 875 Koko Eating Bananas.\n", "starter": "# 백준 1654 랜선 자르기 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 35/boj1654\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "35/boj2110", "chapter": "35", "slug": "boj2110", "title": "백준 2110 공유기 설치", "kind": "stdio", "ext": ".py", "tier": "Gold IV (solved.ac)", "role": "핵심", "target": "35분", "url": "https://solved.ac/problems/id/2110", "time_limit": 1.5, "ref_time": 0.14547837499412708, "problem": "# 백준 2110 공유기 설치\n\n- 원문: https://solved.ac/problems/id/2110\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold IV (solved.ac) · 역할: 핵심 · 목표 시간: 35분\n- 짝이 되는 장: 35. 이진 탐색\n\n## 문제 (요약)\n수직선 위에 집 N채가 있어요. 그중 C채에 공유기를 하나씩 놓으려고 해요. 공유기끼리 너무 붙어 있으면 안 좋아서, **가장 가까운 두 공유기 사이의 거리**가 가능한 한 크게 되도록 놓고 싶어요. 그 거리의 최댓값을 출력하세요.\n\n## 제약\n- 2 ≤ N ≤ 200,000, 2 ≤ C ≤ N\n- 집 좌표는 0 이상 1,000,000,000 이하의 정수이고, 서로 달라요. **정렬돼 있지 않아요.**\n- 입력: 첫 줄 `N C`, 다음 N줄에 좌표 하나씩 / 출력: 거리 하나\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 35/boj2110` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 거리를 내가 정해 준다면<\/summary>\n\n\"가장 가까운 거리의 최댓값\"은 직접 구하기 어려워요. 거꾸로 물어보세요. **\"모든 공유기 사이를 d 이상 벌려서 C대를 놓을 수 있나?\"** d가 커지면 이 질문의 답은 어떻게 변하나요?\n<\/details>\n\n<details><summary>힌트 2: 판정은 그리디, 바깥은 이진 탐색<\/summary>\n\nd에서 되면 d − 1에서도 돼요. 그래서 \"되는 d 중 최댓값\"은 **마지막 True**예요(35장 4단계, 템플릿 C). \"최소를 최대로\"라는 말이 보이면 파라메트릭 서치를 먼저 의심하라고 했죠(35장 끝까지 따라가기 ② 징검다리).\n\n판정은 이렇게 해요. 좌표를 정렬하고 **첫 집에는 무조건** 놓아요. 그다음부터 왼쪽에서 오른쪽으로 가면서, 마지막으로 놓은 집과의 거리가 d 이상인 집을 만나면 바로 놓아요. 이렇게 놓은 수가 C 이상이면 가능해요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 입력 좌표가 **정렬돼 있지 않아요.** 정렬을 빼먹으면 그리디가 엉망이 돼요.\n- 범위는 `lo = 1`(좌표가 서로 달라서 1은 항상 가능), `hi = (맨 끝 − 맨 앞) // (C − 1)` 또는 그냥 `맨 끝 − 맨 앞`.\n- 최댓값을 찾는데 `hi = mid`, `lo = mid + 1` 형태(첫 번째 True)를 쓰면 답보다 1 큰 값이 나와요.\n- 그리디에서 \"첫 집에 놓기\"를 빼고 시작하면 개수가 하나 모자라요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 2110 공유기 설치\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"N개 점 중 C개를 골라서, 고른 점들 사이의 최소 간격을 최대로.\" 확인할 것:\n- 좌표가 정렬돼 있나요? → **아니요**\n- 같은 좌표에 집이 두 채 있을 수 있나요? → 없음. 그래서 답은 항상 1 이상이에요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n좌표 `[10, 1, 21, 6, 15, 3]`, C = 3. 정렬하면 `[1, 3, 6, 10, 15, 21]`. `1, 10, 21`을 고르면 간격이 9, 11이라 최소 9. 10 이상으로는 세 대를 못 놓아요(1 다음이 15, 그다음 21은 6 차이). 답 9.\n경계:\n- C = 2 → 양 끝 거리 (손 케이스 02)\n- C = N → 이웃 간격 중 최솟값 (손 케이스 03)\n- 입력 순서가 뒤섞임 (모든 손 케이스)\n- 좌표 10⁹ 근처 (손 케이스 06)\n\n## 3. 브루트포스와 그 복잡도 (2분)\nC개를 고르는 모든 조합을 보고 최소 간격의 최댓값을 구해요. C(N, C)개라서 N = 20만이면 불가능해요. 채점기의 `brute.py`가 이 방법이고, N ≤ 8에서만 써요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n\"최솟값을 최대로\" → 최적화를 결정 문제로 바꿔요.\n- `ok(d)` = \"간격을 d 이상으로 C대를 놓을 수 있나?\"\n- d에서 되면 d − 1에서도 돼요(같은 배치가 그대로 통하니까요) → `T…T F…F`, **마지막 True**.\n- `ok(d)`는 그리디로 O(N)이에요. 왼쪽부터 가면서 \"놓을 수 있으면 바로 놓기\"가 왜 최선일까요? 어떤 최적 배치든 첫 공유기를 맨 왼쪽 집으로 옮겨도 간격이 줄지 않아요. 그다음도 \"가장 왼쪽에 놓을 수 있는 집\"으로 당겨도 뒤쪽 여유만 늘어요. 그래서 그리디가 놓는 개수가 최대예요.\n\n트리거 단어: \"최소 거리를 최대로\", 답의 범위 10⁹ → 파라메트릭 서치 + 템플릿 C + 그리디 판정. 프로그래머스 「징검다리」(35장 끝까지 따라가기 ②)와 같은 뼈대예요. 거기서는 \"치울 돌 개수 ≤ n\"을, 여기서는 \"놓은 개수 ≥ C\"를 세요.\n\n## 5. 코드\n```python\nimport sys\n\ndata = sys.stdin.buffer.read().split()\nn, c = int(data[0]), int(data[1])\nxs = sorted(map(int, data[2:2 + n]))\n\ndef ok(d):\n    cnt, last = 1, xs[0]          # 첫 집에는 무조건\n    for x in xs:\n        if x - last >= d:\n            cnt += 1\n            last = x\n            if cnt >= c:\n                return True\n    return False\n\nlo, hi = 1, (xs[-1] - xs[0]) // (c - 1)\nwhile lo < hi:\n    mid = (lo + hi + 1) // 2      # 마지막 True → 올림\n    if ok(mid):\n        lo = mid\n    else:\n        hi = mid - 1\nprint(lo)\n```\n`hi`를 `(끝 − 앞) // (C − 1)`로 잡은 이유: C대가 C − 1개 간격을 나눠 가지니 최소 간격은 평균보다 클 수 없어요. 그냥 `끝 − 앞`으로 잡아도 반복이 한두 번 늘 뿐이에요.\n\n## 왜 이 코드가 정답인가\n- **불변식**: `lo`는 늘 가능한 간격이고 답은 `hi` 이하예요. `ok(d)`는 정렬된 `xs`에서 `last`와 `d` 이상 떨어진 첫 집에 바로 설치해요.\n- **빠뜨리지 않는 이유**: 탐욕으로 놓은 i번째 공유기는 어떤 올바른 배치의 i번째보다 왼쪽이거나 같아요(교환 논증). 그래서 탐욕이 실패하면 그 d는 정말 불가능하고, d가 줄면 가능성은 그대로라 단조예요.\n- **끝나는 이유**: 올림 `mid`로 구간이 매번 줄어요. log₂(10⁹) ≈ 30번 × O(N), 정렬 O(N log N)이에요.\n- **깨지는 가정**: 좌표가 서로 달라서 `lo = 1`이 늘 가능해요. 같은 좌표 `[1, 1]`, C = 2가 오면 답은 0인데 1이 나와요.\n\n## 6. 예제로 추적 (확인)\n정렬된 `[1, 3, 6, 10, 15, 21]`, C = 3, `lo = 1`, `hi = 20 // 2 = 10` (실행해서 기록했어요)\n| lo, hi | mid | 그리디로 놓인 집 | 3대 이상? → 다음 |\n|---|---|---|---|\n| 1, 10 | 6 | 1, 10, 21 | 네 → lo = 6 |\n| 6, 10 | 8 | 1, 10, 21 | 네 → lo = 8 |\n| 8, 10 | 9 | 1, 10, 21 | 네 → lo = 9 |\n| 9, 10 | 10 | 1, 15 | 아니요 → hi = 9 |\n| 9, 9 | — | — | 답 **9** |\n\n## 7. 복잡도\n정렬 O(N log N) + 이진 탐색 약 30번 × 그리디 O(N) → **O(N log N + N log(범위))**. 메모리 O(N). 채점기 큰 입력에서 0.2초 안쪽이에요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 정렬 안 함 | 그리디가 엉뚱한 개수를 셈 | 손 케이스 01 (직접 돌려 확인했어요) |\n| 첫 번째 True 틀(`hi = mid`, `lo = mid + 1`)로 최댓값을 찾음 | 답 + 1이 나옴 | 손 케이스 01 (확인) |\n| `cnt = 0`으로 시작 (첫 집을 안 셈) | 개수가 1 모자라 답이 작게 나옴 | 손 케이스 01 (확인) |\n| d를 1부터 하나씩 늘림 | 정답이지만 범위가 10⁹라 안 끝남 | 손 케이스 02에서 시간 초과 (확인) |\n\n## 9. 면접에서 30초로 설명하기\n\"최소 간격의 최댓값을 직접 구하는 대신 '간격 d 이상으로 C대를 놓을 수 있나'를 판정합니다. 좌표를 정렬하고 왼쪽부터 놓을 수 있으면 바로 놓는 그리디로 O(N)에 판정됩니다. d에서 가능하면 더 작은 d에서도 가능하니 단조롭고, 마지막 True를 이진 탐색합니다. 전체 O(N log N + N log 범위)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **그리디가 최적이라는 걸 어떻게 보이나요?** 교환 논법이에요. 최적 배치의 첫 공유기를 맨 왼쪽 집으로 옮겨도 이웃 간격은 늘기만 해요. 그다음 공유기도 \"직전 공유기에서 d 이상 떨어진 가장 왼쪽 집\"으로 당기면 뒤 간격이 늘기만 해요. 끝까지 반복하면 그리디 배치가 돼요. 그러니 그리디가 놓는 수가 최대예요.\n2. **반대로 \"가장 먼 간격을 최소로\"라면?** 최대를 최소로(minimax) → 첫 번째 True, 템플릿 B예요. LeetCode 410 Split Array Largest Sum이 그 예예요.\n3. **2차원 평면이라면?** 판정을 그리디로 못 해서 이 틀이 그대로 안 돼요. 결정 문제가 O(N) 근처로 풀리는지가 파라메트릭 서치의 첫 관문이에요(35장 \"그림으로 보기\"의 첫 분기).\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 20분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 프로그래머스 「징검다리」, LeetCode 1552 Magnetic Force Between Two Balls.\n", "starter": "# 백준 2110 공유기 설치 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 35/boj2110\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "35/lc0033", "chapter": "35", "slug": "lc0033", "title": "LeetCode 33 Search in Rotated Sorted Array", "kind": "func", "ext": ".py", "tier": "Medium (LeetCode)", "role": "핵심", "target": "30분", "url": "https://leetcode.com/problems/search-in-rotated-sorted-array/", "time_limit": 0.005, "ref_time": 0.0001026670215651393, "problem": "# LeetCode 33 Search in Rotated Sorted Array\n\n- 원문: https://leetcode.com/problems/search-in-rotated-sorted-array/\n- 난이도: Medium (LeetCode) · 역할: 핵심 · 목표 시간: 30분\n- 짝이 되는 장: 35. 이진 탐색\n\n## 문제 (요약)\n서로 다른 정수를 오름차순으로 정렬한 배열을, 어떤 위치에서 잘라 앞부분과 뒷부분의 순서를 바꿨어요. 예를 들어 `[1, 2, 3, 4, 5]`가 `[4, 5, 1, 2, 3]`이 될 수 있어요(안 바꿨을 수도 있어요). 이 배열에서 `target`의 인덱스를 찾고, 없으면 `-1`을 돌려주세요. **O(log n)**이어야 해요.\n\n## 제약\n- 1 ≤ len(nums) ≤ 5,000, -10⁴ ≤ nums[i], target ≤ 10⁴\n- 값은 모두 서로 달라요. 자른 위치는 알려 주지 않아요.\n- 채점기의 큰 입력은 원래 제약보다 큰 200만 개예요. O(n)으로 훑으면 시간 제한에 걸려요.\n\n## 함수\n```python\ndef search(nums: list[int], target: int) -> int\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 35/lc0033` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 가운데를 잡고 양쪽을 보면<\/summary>\n\n`[15, 18, 22, 3, 7, 11]`에서 가운데 22를 잡아 보세요. 왼쪽 `[15, 18, 22]`와 오른쪽 `[22, 3, 7, 11]` 중 정렬된 쪽이 있나요? 아무 데나 잡아도 그런가요?\n<\/details>\n\n<details><summary>힌트 2: 정렬된 쪽만 믿기<\/summary>\n\n어느 `mid`를 잡아도 두 절반 중 **적어도 한쪽은 정렬돼 있어요**(35장 6단계 경우 ①). `nums[lo] <= nums[mid]`면 왼쪽이 정렬된 거예요. 정렬된 쪽은 양 끝 값만 보고 \"target이 이 안에 있나?\"를 판단할 수 있어요. 있으면 그쪽으로, 없으면 반대쪽으로 가요. 매번 절반을 버리니 O(log n)이에요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 왼쪽이 정렬됐는지 볼 때 `nums[lo] < nums[mid]`(등호 없음)로 쓰면, `lo == mid`인 두 칸짜리 구간에서 틀려요. `[3, 1]`에서 1을 찾아 보세요.\n- 범위 판단은 `nums[lo] <= target < nums[mid]`처럼 **한쪽 끝을 포함**해야 해요. 양쪽 다 `<`로 쓰면 `target`이 `nums[lo]`와 같을 때 놓쳐요.\n- 회전이 없는 배열, 원소가 하나인 배열도 같은 코드로 돌아야 해요.\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 33 Search in Rotated Sorted Array\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"정렬된 배열을 한 번 잘라 앞뒤를 바꾼 것에서 값 찾기, O(log n).\" 확인할 것:\n- 중복이 있나요? → **없음**. (있으면 최악 O(n)이 돼요. 꼬리 질문 1)\n- 회전을 안 했을 수도 있나요? → 네\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`[15, 18, 22, 3, 7, 11]`에서 7 → 인덱스 4. 9 → -1.\n경계: 회전 없음(손 케이스 \"회전 없음\"), 원소 하나, 두 칸이라 `lo == mid`가 되는 경우(`[3, 1]`), target이 구간의 왼쪽 끝 값과 같은 경우(`[4, 5, 6, 7, 0, 1, 2]`에서 4).\n\n## 3. 브루트포스와 그 복잡도 (1분)\n처음부터 훑기 O(n). 문제가 O(log n)을 요구해요.\n중간 단계 풀이도 있어요. **① 가장 작은 값의 위치(회전 지점)를 이진 탐색으로 찾고 ② 그 지점으로 나뉜 두 정렬 구간 중 맞는 쪽에서 다시 이진 탐색.** 이것도 O(log n)이라 정답이에요. 다만 이진 탐색을 두 번 짜야 해서 경계 실수가 날 자리가 두 배예요. 아래는 한 번에 끝내는 방법이에요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n보통 이진 탐색은 \"가운데가 target보다 작으면 오른쪽\"이라고 판단해요. 회전된 배열에서는 이 판단이 틀려요. `[15, 18, 22, 3, 7, 11]`에서 22 > 7이라고 왼쪽으로 가면 7을 놓쳐요.\n\n35장 6단계에서 전제를 다시 읽었죠. 필요한 건 \"정렬\"이 아니라 **\"가운데를 보면 답이 어느 쪽인지 정해진다\"**예요.\n- 어떤 `mid`든 `[lo, mid]`와 `[mid, hi]` 중 하나는 정렬돼 있어요(잘린 지점은 하나뿐이니 둘 다에 걸칠 수 없어요).\n- 정렬된 쪽은 양 끝 값으로 target 포함 여부를 O(1)에 알아요.\n- 포함하면 그쪽, 아니면 반대쪽. 어느 경우든 절반을 버려요.\n\n트리거 단어: \"회전된 정렬 배열\", \"O(log n)\" → 불변식을 다시 세운 템플릿 A 변형.\n\n## 5. 코드\n```python\ndef search(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[lo] <= nums[mid]:                 # 왼쪽이 정렬됨\n            if nums[lo] <= target < nums[mid]:\n                hi = mid - 1\n            else:\n                lo = mid + 1\n        else:                                     # 오른쪽이 정렬됨\n            if nums[mid] < target <= nums[hi]:\n                lo = mid + 1\n            else:\n                hi = mid - 1\n    return -1\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `target`이 있다면 그 위치는 늘 `[lo, hi]` 안이에요. `[lo, mid]`와 `[mid, hi]` 중 하나는 반드시 정렬돼 있어요.\n- **빠뜨리지 않는 이유**: 정렬된 쪽은 양 끝 값만 보고 `target`이 들어 있는지 확실히 판단해요. 아니면 나머지 쪽에만 있을 수 있어요. `nums[lo] <= nums[mid]`의 `=`는 `lo == mid`일 때를 처리해요.\n- **끝나는 이유**: 매번 `mid`를 빼고 반을 버리니 O(log n)이에요.\n- **깨지는 가정**: 값이 모두 다르다는 점에 기대요. 중복이 있으면 `[1, 0, 1, 1, 1]`, target 0에서 왼쪽이 정렬됐다고 잘못 판단해 -1을 돌려줘요.\n\n## 6. 예제로 추적 (확인)\n`nums = [15, 18, 22, 3, 7, 11]` (실행해서 기록했어요)\n\ntarget = 7\n| lo, hi | mid | nums[mid] | 정렬된 쪽 | 판단 → 다음 |\n|---|---|---|---|---|\n| 0, 5 | 2 | 22 | 왼쪽 [15, 22] | 7은 15~22 밖 → lo = 3 |\n| 3, 5 | 4 | 7 | — | 찾음, 4 반환 |\n\ntarget = 9\n| lo, hi | mid | nums[mid] | 정렬된 쪽 | 판단 → 다음 |\n|---|---|---|---|---|\n| 0, 5 | 2 | 22 | 왼쪽 [15, 22] | 밖 → lo = 3 |\n| 3, 5 | 4 | 7 | 왼쪽 [3, 7] | 9는 3~7 밖 → lo = 5 |\n| 5, 5 | 5 | 11 | 왼쪽 [11, 11] | 밖 → lo = 6 |\n| 6, 5 | — | — | — | 구간이 빔 → -1 |\n\n`[3, 1]`에서 1: `lo = 0, hi = 1, mid = 0`. `nums[0] <= nums[0]`이 참이라 왼쪽 `[3]`이 정렬된 것으로 보고, 1은 그 안에 없으니 `lo = 1` → 다음 반복에서 찾아요. 등호가 없으면 오른쪽으로 판단하고 `3 < 1 <= 1`이 거짓이라 `hi = -1`로 끝나 버려요.\n\n## 7. 복잡도\n반복마다 절반을 버려요 → **O(log n)**, 메모리 O(1).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `nums[lo] < nums[mid]` (등호 없음) | `lo == mid`일 때 반대쪽을 정렬됐다고 봄 | 손 케이스 \"두 칸, lo == mid\" (직접 돌려 확인했어요) |\n| 범위를 `nums[lo] < target < nums[mid]`로 | 구간 끝 값과 같은 target을 놓침 | 손 케이스 \"왼쪽 끝 값\" (확인) |\n| 회전을 무시한 보통 이진 탐색 | 잘린 쪽에 있는 값을 못 찾음 | 손 케이스 첫 번째 (확인) |\n| `target in nums` | 정답이지만 O(n) | 큰 입력 |\n\n## 9. 면접에서 30초로 설명하기\n\"회전된 배열에서도 가운데를 잡으면 두 절반 중 하나는 반드시 정렬돼 있습니다. nums[lo] <= nums[mid]면 왼쪽이 정렬된 것입니다. 정렬된 쪽은 양 끝 값으로 target이 그 안에 있는지 알 수 있으니, 있으면 그쪽으로, 없으면 반대쪽으로 갑니다. 매번 절반을 버려서 O(log n)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **중복 값이 있으면요?** `nums[lo] == nums[mid] == nums[hi]`이면 어느 쪽이 정렬됐는지 알 수 없어서 `lo += 1; hi -= 1`로 한 칸씩 좁혀요. 최악 O(n)이에요(LeetCode 81). \"중복이 있어도 O(log n)인가요?\"의 답은 \"아니요\"예요.\n2. **가장 작은 값(회전 지점)만 찾으라면?** `nums[mid] > nums[hi]`면 최솟값은 mid 오른쪽, 아니면 mid 포함 왼쪽이에요. 첫 번째 True 틀(`lo < hi`, `hi = mid`)로 써요(LeetCode 153).\n3. **회전 지점을 먼저 찾고 두 번 탐색하는 것과 비교하면?** 둘 다 O(log n)이에요. 두 번 방식은 함수를 나눠 각자 테스트하기 좋고, 한 번 방식은 코드가 짧아요. 면접에서는 실수 안 할 쪽을 고른다고 말하면 돼요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 15분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 153 Find Minimum in Rotated Sorted Array, LeetCode 81 Search in Rotated Sorted Array II.\n", "starter": "# LeetCode 33 — 함수 몸통을 채우세요.  채점: python algo/judge.py 35/lc0033\n\n\ndef search(nums: list[int], target: int) -> int:\n    pass\n"}, {"id": "35/lc0704", "chapter": "35", "slug": "lc0704", "title": "LeetCode 704 Binary Search", "kind": "func", "ext": ".py", "tier": "Easy (LeetCode)", "role": "워밍업", "target": "15분", "url": "https://leetcode.com/problems/binary-search/", "time_limit": 0.005, "ref_time": 1.6959005733951926e-05, "problem": "# LeetCode 704 Binary Search\n\n- 원문: https://leetcode.com/problems/binary-search/\n- 난이도: Easy (LeetCode) · 역할: 워밍업 · 목표 시간: 15분\n- 짝이 되는 장: 35. 이진 탐색\n\n## 문제 (요약)\n오름차순으로 정렬된 정수 배열 `nums`와 값 `target`이 주어져요. `target`이 배열에 있으면 그 인덱스를, 없으면 `-1`을 돌려주세요. 배열 안의 값은 모두 서로 달라요. **O(log n)**으로 풀어야 해요.\n\n## 제약\n- 1 ≤ len(nums) ≤ 10⁴, -10⁴ < nums[i], target < 10⁴\n- `nums`는 오름차순이고 중복이 없어요\n- 채점기의 큰 입력은 원래 제약보다 큰 200만 개예요. O(n)으로 훑으면 시간 제한에 걸려요.\n\n## 함수\n```python\ndef search(nums: list[int], target: int) -> int\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 35/lc0704` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 가운데 하나를 보면 무엇을 알 수 있나<\/summary>\n\n가운데 값 하나를 `target`과 비교해 보세요. 가운데 값이 `target`보다 작으면, 그 왼쪽에 있는 값들은 볼 필요가 있을까요? 한 번 비교할 때마다 후보가 몇 개 남는지 세어 보세요.\n<\/details>\n\n<details><summary>힌트 2: 후보 구간을 두 변수로 들고 다니기<\/summary>\n\n\"답이 있다면 반드시 `[lo, hi]` 안에 있다\"는 문장을 정하고 끝까지 지켜요(35장 2단계의 불변식). 이걸 지키려면 `mid`를 이미 본 뒤에는 `lo = mid + 1` 또는 `hi = mid - 1`로 `mid`를 구간에서 빼야 해요. 35장 템플릿 A 그대로예요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- `hi`를 `len(nums) - 1`로 시작했으면 반복 조건은 `lo <= hi`예요. `lo < hi`로 쓰면 마지막 한 칸을 확인하지 않고 나와요.\n- 닫힌 구간인데 `hi = mid`로 줄이면 구간이 안 줄어서 무한 루프가 돼요. (채점기가 멈춘 것처럼 보이면 Ctrl+C로 끊고 이걸 의심하세요.)\n- 원소가 하나인 배열, 모든 값보다 작거나 큰 `target`을 직접 넣어 보세요.\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 704 Binary Search\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"정렬된 배열에서 값 하나의 위치를 찾고, 없으면 -1.\" 면접이라면 여기서 확인 질문을 해요.\n- 중복이 있나요? → **없음** (있으면 \"어느 인덱스를 돌려줄지\"부터 정해야 해요)\n- 빈 배열이 올 수 있나요? → 아니요, 길이 1 이상\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`[-3, 0, 4, 8, 15, 23]`에서 8 → 인덱스 3. 5 → 없어서 -1.\n경계: 원소 하나(있음/없음), 맨 앞·맨 뒤, 모든 값보다 작은 값·큰 값. 손 케이스에 전부 넣어 뒀어요.\n\n## 3. 브루트포스와 그 복잡도 (1분)\n처음부터 하나씩 비교해요. O(n). 원래 제약(10⁴)이면 이것도 통과하지만 문제가 O(log n)을 요구해요. 채점기의 큰 입력(200만 개)에서는 `target in nums`도 시간 제한에 걸려요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n브루트포스는 정렬돼 있다는 정보를 하나도 안 써요. 가운데 값 `nums[mid]`가 `target`보다 작으면, 정렬돼 있으니 `mid`와 그 왼쪽은 **전부** `target`보다 작아요. 비교 한 번에 후보가 절반이 돼요(35장 1단계). 200만 개도 21번이면 끝나요.\n\n트리거 단어: \"정렬된 배열\", \"O(log n)\", \"찾기\" → 이진 탐색 템플릿 A(닫힌 구간).\n\n## 5. 코드\n```python\ndef search(nums, target):\n    lo, hi = 0, len(nums) - 1        # 닫힌 구간 [lo, hi]\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `target`이 있다면 그 위치는 늘 닫힌 구간 `[lo, hi]` 안이에요.\n- **빠뜨리지 않는 이유**: 정렬돼 있으니 `nums[mid] < target`이면 `mid` 이하에는 없고, 반대면 `mid` 이상에는 없어요. 버리는 쪽에 답이 있을 수 없어요.\n- **끝나는 이유**: `lo = mid + 1`, `hi = mid - 1`로 구간이 매번 절반 이하로 줄어 `lo > hi`가 돼요. O(log n)이에요.\n- **깨지는 가정**: 오름차순 정렬에 기대요. `[2, 3, 1]`에서 1을 찾으면 있는데도 -1이 나와요.\n\n## 6. 예제로 추적 (확인)\n`nums = [-3, 0, 4, 8, 15, 23]`\n\ntarget = 8 (있음)\n| lo | hi | mid | nums[mid] | 다음 |\n|---|---|---|---|---|\n| 0 | 5 | 2 | 4 | 4 < 8 → lo = 3 |\n| 3 | 5 | 4 | 15 | 15 > 8 → hi = 3 |\n| 3 | 3 | 3 | 8 | 찾음, 3 반환 |\n\ntarget = 5 (없음)\n| lo | hi | mid | nums[mid] | 다음 |\n|---|---|---|---|---|\n| 0 | 5 | 2 | 4 | lo = 3 |\n| 3 | 5 | 4 | 15 | hi = 3 |\n| 3 | 3 | 3 | 8 | hi = 2 |\n| 3 | 2 | — | — | lo > hi → -1 |\n\n세 번째 줄을 보세요. `lo == hi`인 한 칸을 확인해야 8을 찾아요. `lo < hi`로 쓰면 이 줄이 실행되지 않아요.\n\n## 7. 복잡도\n반복마다 구간이 절반 이하가 돼요 → **O(log n)**, 메모리 O(1).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `while lo < hi` (hi = len-1 그대로) | 마지막 한 칸을 안 봐서 있는 값을 -1로 | 손 케이스 \"가운데쯤에 있음\" (직접 돌려 확인했어요) |\n| `hi = mid` + `lo <= hi` | 구간이 안 줄어 무한 루프 | 손 케이스에서 채점기가 멈춤 (Ctrl+C) |\n| `target in nums` / `nums.index` | 정답이지만 O(n) | 큰 입력 (0.02초 > 제한 0.005초) |\n| `hi = len(nums)`로 시작 + `lo <= hi` | `nums[len]`에서 IndexError | 손 케이스 \"모든 값보다 큼\" |\n\n## 9. 면접에서 30초로 설명하기\n\"정렬돼 있으니 가운데 값과 비교하면 답이 어느 절반에 있는지 정해집니다. 답이 있다면 [lo, hi] 안에 있다는 불변식을 두고, 가운데가 작으면 lo를 mid+1로, 크면 hi를 mid-1로 줄입니다. 구간이 비면 없는 것입니다. 매번 절반이 되니 O(log n), 공간 O(1)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **중복이 있고 첫 번째 위치를 원하면?** 템플릿 B(첫 번째 True, `nums[mid] >= target`)로 바꿔서 `lo < hi`, `hi = mid`로 가요. 끝난 뒤 `nums[lo] == target`인지 확인해요. 파이썬이면 `bisect_left`예요(35장 3단계).\n2. **`(lo + hi) // 2`에 문제는 없나요?** 자바·C에서는 `lo + hi`가 오버플로할 수 있어서 `lo + (hi - lo) // 2`로 써요. 파이썬은 정수 크기 제한이 없어 괜찮아요.\n3. **연결 리스트에서도 되나요?** 아니요. 가운데로 바로 갈 수 없어서 가운데 찾기에만 O(n)이에요. 36장에서 이어져요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 5분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 1920 「수 찾기」, LeetCode 35 Search Insert Position.\n", "starter": "# LeetCode 704 — 함수 몸통을 채우세요.  채점: python algo/judge.py 35/lc0704\n\n\ndef search(nums: list[int], target: int) -> int:\n    pass\n"}, {"id": "36/boj1406", "chapter": "36", "slug": "boj1406", "title": "백준 1406 에디터", "kind": "stdio", "ext": ".py", "tier": "Silver II (solved.ac)", "role": "핵심", "target": "25분", "url": "https://solved.ac/problems/id/1406", "time_limit": 1.5, "ref_time": 0.10175183400860988, "problem": "# 백준 1406 에디터\n\n- 원문: https://solved.ac/problems/id/1406\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Silver II (solved.ac) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 36. 연결 리스트 (1단계 장면의 그 문제예요. 책을 덮고 풀어요.)\n\n## 문제 (요약)\n영어 소문자로 된 문자열이 편집기에 들어 있고, 커서는 맨 뒤에 있어요. 명령을 차례로 실행한 뒤 최종 문자열을 출력하세요.\n- `L`: 커서를 왼쪽으로 한 칸 (맨 앞이면 무시)\n- `D`: 커서를 오른쪽으로 한 칸 (맨 뒤면 무시)\n- `B`: 커서 왼쪽 글자를 지움 (맨 앞이면 무시)\n- `P x`: 커서 왼쪽에 글자 `x`를 넣음 (커서는 넣은 글자 오른쪽에 그대로)\n\n## 제약\n- 처음 문자열 길이 ≤ 100,000, 명령 수 M ≤ 500,000\n- 입력: 첫 줄 문자열, 둘째 줄 M, 다음 M줄에 명령 / 출력: 최종 문자열\n- 백준 제한 시간은 0.3초로 아주 짧아요.\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 36/boj1406` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 리스트에 그대로 넣으면<\/summary>\n\n문자열을 리스트로 두고 커서 위치를 숫자로 들면 `a.insert(cur, x)`, `a.pop(cur - 1)`이에요. 커서가 맨 앞에 있을 때 이 두 연산은 몇 칸을 밀어야 하나요? 명령이 50만 개면요? 그런데 이 문제에서 글자를 넣고 지우는 곳은 **언제나 어디**인가요?\n<\/details>\n\n<details><summary>힌트 2: 커서를 경계로 쪼개기<\/summary>\n\n만지는 곳은 언제나 커서 바로 옆이에요. 커서를 기준으로 문서를 **두 리스트**로 나눠 보세요. 왼쪽은 그대로, 오른쪽은 **거꾸로** 담으면 커서 바로 옆 글자가 두 리스트의 **끝**에 와요. 그러면 네 명령이 모두 `append`/`pop()`만으로 끝나요(36장 3단계 길 3).\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- `L`, `D`, `B`는 비어 있으면 **무시**예요. 빈 리스트에서 `pop()`하면 `IndexError`가 나요.\n- 출력할 때 오른쪽 리스트는 거꾸로 담겨 있으니 **다시 뒤집어서** 붙여요.\n- 입력이 50만 줄이에요. `input()` 대신 `sys.stdin.readline`을 쓰세요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 1406 에디터\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"커서가 있는 문자열에 이동·삭제·삽입 명령 최대 50만 개를 적용.\" 확인할 것:\n- 커서는 어디서 시작하나요? → **맨 뒤**\n- 불가능한 명령(맨 앞에서 `L`, `B`)은요? → 무시\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`abc`에 `L L B P x D D P y L P z` → `xbczy` (6절 표).\n경계: 맨 앞에서 `L`·`B`(손 케이스 02), 맨 뒤에서 `D`(03), 전부 지워서 빈 문자열(04), 맨 앞에 삽입(05).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n리스트 + 커서 숫자 + `insert`/`pop(i)`. 명령 하나가 최악 O(N)이라 전체 O(N·M). 36장 1단계에서 최악 입력(커서를 맨 앞으로 옮긴 뒤 40만 번 삽입)으로 재 보니 **14.5초**였어요. 채점기의 큰 입력이 바로 그 입력이에요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n느린 이유는 리스트의 **가운데**를 만져서 뒤를 다 미는 거예요. 연결 리스트라면 커서 위치의 노드를 쥐고 O(1)에 넣고 뺄 수 있어요. 그런데 파이썬에서 노드 객체를 50만 개 만드는 것도 느려요(36장 3단계).\n\n다시 보면 만지는 곳이 **언제나 커서 바로 옆**이에요. 커서를 경계로 둘로 쪼개고 오른쪽을 거꾸로 담으면 커서 옆이 두 리스트의 **끝**이 돼요. 리스트의 끝 연산은 O(1)이에요.\n\n| 명령 | 두 스택으로 |\n|---|---|\n| `L` | `right.append(left.pop())` |\n| `D` | `left.append(right.pop())` |\n| `B` | `left.pop()` |\n| `P x` | `left.append(x)` |\n\n트리거 단어: \"커서 위치에서 많이 넣고 지운다\" → 파이썬에서는 스택 두 개(36장 \"패턴 트리거\" 5번).\n\n## 5. 코드\n```python\nimport sys\ninput = sys.stdin.readline\n\nleft = list(input().rstrip())\nright = []\nfor _ in range(int(input())):\n    cmd = input().split()\n    if cmd[0] == 'L':\n        if left: right.append(left.pop())\n    elif cmd[0] == 'D':\n        if right: left.append(right.pop())\n    elif cmd[0] == 'B':\n        if left: left.pop()\n    else:\n        left.append(cmd[1])\nprint(''.join(left) + ''.join(reversed(right)))\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `left + reversed(right)`가 늘 지금 문자열이고, 커서는 `left`와 `right` 사이에 있어요.\n- **빠뜨리지 않는 이유**: 네 명령 모두 커서 바로 옆 한 글자만 바꾸고, 그 글자는 늘 두 스택의 맨 위예요. 그래서 스택 맨 위만 고쳐도 문자열 전체가 맞게 유지돼요.\n- **끝나는 이유**: 명령마다 `append`/`pop` 한 번이라 O(1), 전체 O(길이 + M)이에요.\n- **깨지는 가정**: 커서가 맨 앞/맨 뒤일 때 명령을 무시하는 `if left`/`if right` 검사에 기대요. 빼면 `abc`에서 `L` 세 번 뒤 `B`가 빈 리스트에서 `pop`해 IndexError가 나요.\n\n## 6. 예제로 추적 (확인)\n`abc`, 명령 9개 (실행해서 기록했어요. `|`는 커서)\n| 명령 | left | right (거꾸로) | 문서 |\n|---|---|---|---|\n| 시작 | a b c | — | abc\\| |\n| L | a b | c | ab\\|c |\n| L | a | c b | a\\|bc |\n| B | — | c b | \\|bc |\n| P x | x | c b | x\\|bc |\n| D | x b | c | xb\\|c |\n| D | x b c | — | xbc\\| |\n| P y | x b c y | — | xbcy\\| |\n| L | x b c | y | xbc\\|y |\n| P z | x b c z | y | xbcz\\|y |\n출력: `xbcz` + `y` = **xbczy**\n\n## 7. 복잡도\n명령 하나 O(1) → 전체 **O(N + M)**, 메모리 O(N + M). 채점기 큰 입력에서 0.2초 안쪽이에요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 리스트 + `insert`/`pop(i)` | 정답이지만 O(N·M) | 큰 입력에서 강제 종료 (직접 돌려 확인했어요) |\n| 출력할 때 `right`를 안 뒤집음 | 커서 오른쪽 글자 순서가 거꾸로 | 손 케이스 02 (확인) |\n| 빈 스택 검사 빠짐 | `IndexError: pop from empty list` | 손 케이스 02 (확인) |\n| 문자열을 매번 잘라 붙이기 (`s[:cur] + x + s[cur:]`) | 정답이지만 O(N·M) | 큰 입력 |\n\n## 9. 면접에서 30초로 설명하기\n\"커서 위치에서 O(1) 삽입·삭제가 필요한 문제이고, 그건 연결 리스트가 주는 성질입니다. 파이썬에서는 커서를 경계로 왼쪽 스택과 거꾸로 담은 오른쪽 스택으로 쪼개면, 모든 명령이 두 스택의 끝에서만 일어나 O(1)이 됩니다. 전체 O(N + M)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **커서가 한 번에 k칸씩 점프하면요?** 스택 두 개는 점프 한 번에 O(k)예요. 점프가 잦고 크면 문자열을 블록으로 나누는 rope나 블록 연결 리스트를 생각해요. 이 문제는 한 칸씩이라 스택이 딱 맞아요.\n2. **지운 글자를 되돌리는(undo) 기능이 필요하면?** 스택 두 개로는 어려워요. 배열 `prv[]`/`nxt[]`로 만든 연결 리스트에서 지운 노드의 앞뒤 정보를 남겨 두고 되돌려요(36장 3단계 \"길 3의 변형\", 그리고 다음 문제인 프로그래머스 「표 편집」).\n3. **`collections.deque`로는 안 되나요?** 덱은 **양 끝**이 O(1)이에요. 커서가 가운데 있으면 `insert`가 O(N)이라 같은 문제가 생겨요. `deque.rotate`로 커서를 끝에 맞추는 방법은 있지만 회전 비용이 이동 거리만큼 들어요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 5397 「키로거」, 백준 1158 「요세푸스 문제」.\n", "starter": "# 백준 1406 에디터 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 36/boj1406\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "36/lc0143", "chapter": "36", "slug": "lc0143", "title": "LeetCode 143 Reorder List", "kind": "func", "ext": ".py", "tier": "Medium (LeetCode)", "role": "핵심", "target": "30분", "url": "https://leetcode.com/problems/reorder-list/", "time_limit": 0.2, "ref_time": 0.002347750007174909, "problem": "# LeetCode 143 Reorder List\n\n- 원문: https://leetcode.com/problems/reorder-list/\n- 난이도: Medium (LeetCode) · 역할: 핵심 · 목표 시간: 30분\n- 짝이 되는 장: 36. 연결 리스트\n\n## 문제 (요약)\n단일 연결 리스트 `L0 → L1 → … → Ln-1`이 있어요. 이걸 `L0 → Ln-1 → L1 → Ln-2 → L2 → …` 순서로 바꾸세요. 맨 앞, 맨 뒤, 그다음 앞, 그다음 뒤… 순서예요. 노드의 **값을 바꾸지 말고 노드 연결만** 바꿔야 해요. 반환값은 없어요(제자리 수정).\n\n## 제약\n- 노드 수 1 ~ 50,000, 1 ≤ Node.val ≤ 1,000\n- 채점기는 함수가 끝난 뒤 **처음 받은 head**부터 따라가서 비교해요. 새 리스트를 만들어 `return`해도 채점기는 보지 않아요.\n- 노드는 `lib.ListNode`(`val`, `next`)예요.\n\n## 함수\n```python\ndef reorder_list(head: ListNode) -> None\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요. 종이에 상자를 그리면서 하세요.\n2. `python algo/judge.py 36/lc0143` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: \"맨 뒤\"로 갈 수가 없어요<\/summary>\n\n단일 연결 리스트에서는 뒤로 못 가요. 매번 끝까지 걸어가면 O(n²)이에요. 그런데 결과를 다시 보세요. 앞 절반 `L0, L1, L2…`와 뒤 절반을 **거꾸로 읽은** `Ln-1, Ln-2…`를 번갈아 놓은 거예요. 뒤 절반이 거꾸로 돼 있다면 어떨까요?\n<\/details>\n\n<details><summary>힌트 2: 루틴 세 개를 조립하기<\/summary>\n\n1. 중간을 찾아 둘로 끊는다 (빠른·느린 포인터, 36장 6단계)\n2. 뒤 절반을 뒤집는다 (제자리 뒤집기, 4단계)\n3. 두 사슬에서 하나씩 번갈아 이어 붙인다\n\n각 루틴을 따로 짜서 따로 확인하는 게 실수를 줄여요. 36장 7단계 조합 ①이 이 문제예요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 중간에서 **끊지 않으면**(`slow.next = None`을 빼먹으면) 고리가 생겨요. 출력이 끝없이 길어지면 이거예요.\n- 앞 동이 뒤 동보다 **길거나 같게** 끊어야 3번이 깔끔하게 끝나요. `fast = head.next`로 출발하면 짝수 길이에서 앞쪽 중간을 잡아요.\n- 번갈아 붙일 때 두 사슬의 다음 노드를 **먼저 저장**하세요. 뒤집기와 같은 이유예요.\n- 새 노드로 리스트를 만들어 `return`하면 안 돼요. 채점기는 처음 받은 `head`를 봐요.\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 143 Reorder List\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"앞에서 하나, 뒤에서 하나씩 번갈아 다시 잇기. 제자리, 값 변경 금지.\" 확인할 것:\n- 값을 바꿔도 되나요? → **아니요**, 연결만 바꿔요.\n- 추가 메모리 제한이 있나요? → 명시는 없지만 면접에서는 O(1)을 기대해요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`1 2 3 4` → `1 4 2 3`, `1 2 3 4 5` → `1 5 2 4 3`.\n경계: 노드 하나·둘(바뀌는 게 없음), 셋(`1 3 2`), 중복 값(값으로 노드를 구별하면 안 돼요).\n\n## 3. 브루트포스와 그 복잡도 (2분)\n- **O(n²)**: 매번 끝까지 걸어가 꼬리를 떼어 와서 앞에 끼워요. 노드 5만 개에서 12억 번이라 안 돼요(실제로 십수 초 걸려요).\n- **O(n) 시간, O(n) 공간**: 노드를 배열에 모아 두 포인터(`i`, `j`)로 순서를 정하고 다시 이어요. 채점기의 `brute.py`가 이 방법이고 정답이에요. 면접관은 \"추가 공간 없이\"를 물을 거예요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n배열 방법이 공간을 쓰는 이유는 \"뒤에서부터 읽기\"가 필요해서예요. 뒤 절반을 **뒤집어 두면** 뒤에서부터 읽기가 앞에서부터 읽기가 돼요. 그러면 할 일이 셋으로 나뉘고, 셋 다 36장에서 만든 루틴이에요.\n1. 중간 찾기 → 빠른·느린 포인터\n2. 뒤 절반 뒤집기 → 제자리 뒤집기\n3. 번갈아 붙이기 → 두 사슬 합치기(더미 없이도 돼요. 머리가 L0 그대로라서요)\n\n트리거 단어: \"앞뒤를 번갈아 재배열\", \"제자리\" → 중간 + 뒤집기 + 병합(36장 7단계 조합 ①).\n\n## 5. 코드\n```python\ndef reorder_list(head):\n    slow, fast = head, head.next          # 앞 동이 길거나 같게\n    while fast and fast.next:\n        slow, fast = slow.next, fast.next.next\n    second = slow.next\n    slow.next = None                      # 끊기\n\n    prev = None                           # 뒤 동 뒤집기\n    while second:\n        nxt = second.next\n        second.next = prev\n        prev, second = second, nxt\n    second = prev\n\n    first = head                          # 번갈아 붙이기\n    while second:\n        f_nxt, s_nxt = first.next, second.next\n        first.next = second\n        second.next = f_nxt\n        first, second = f_nxt, s_nxt\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: 끊은 뒤 앞 동(`head`부터) 길이는 뒤 동 길이 이상이에요. 합치는 동안 `first`와 `second`는 각각 아직 안 붙인 부분의 맨 앞이에요.\n- **빠뜨리지 않는 이유**: 뒤 동을 뒤집으면 L(n−1), L(n−2), …가 앞에서부터 나와서, 번갈아 붙이기만 하면 L0, L(n−1), L1, …이 돼요. 앞 동이 길거나 같아서 `f_nxt`가 필요할 때 비어 있지 않아요.\n- **끝나는 이유**: 세 단계 모두 포인터가 한 칸씩만 나아가니 O(n), 추가 메모리 O(1)이에요.\n- **깨지는 가정**: `slow.next = None`으로 두 동을 끊는다는 점에 기대요. 빼면 `[1, 2, 3, 4]`에서 3이 자기 자신을 가리키는 순환이 생겨요.\n\n## 6. 예제로 추적 (확인)\n`1 → 2 → 3 → 4 → 5`\n- 중간 찾기: `(slow, fast)` = (1, 2) → (2, 4) → (3, None). `slow = 3`. 끊으면 앞 `1 2 3`, 뒤 `4 5`.\n- 뒤집기: 뒤가 `5 4`.\n- 번갈아 붙이기:\n\n| 반복 | first | second | 저장 (f_nxt, s_nxt) | 이은 뒤 앞부분 |\n|---|---|---|---|---|\n| 1 | 1 | 5 | 2, 4 | 1 → 5 → 2 … |\n| 2 | 2 | 4 | 3, None | 1 → 5 → 2 → 4 → 3 |\n| — | 3 | None | — | 멈춤. 3.next는 끊을 때 이미 None |\n\n짝수 `1 2 3 4`: `(1, 2)` → `(2, 4)`에서 `fast.next`가 None이라 멈춰 `slow = 2`. 앞 `1 2`, 뒤 `3 4` → `4 3`. 결과 `1 4 2 3`. `fast = head`로 출발했다면 `slow = 3`이 되어 앞 `1 2 3`, 뒤 `4`로 끊기는데, 이 문제에서는 그래도 결과가 같아요. 다만 앞 동이 더 짧아지는 쪽으로 끊으면 3번에서 `first`가 먼저 None이 되어 터지니 \"앞이 길거나 같게\"를 기준으로 기억하세요.\n\n## 7. 복잡도\n세 단계 모두 한 번씩 훑어요 → 시간 **O(n)**, 공간 **O(1)**.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `slow.next = None` 빠짐 | 고리가 생겨 출력이 끝없이 길어짐 (`[1, 4, 2, 3, 3, 3, …]`) | 손 케이스 \"짝수 길이\" (직접 돌려 확인했어요) |\n| 새 노드로 재배열한 리스트를 `return` | 원래 head는 그대로라 `[1, 2, 3, 4]` | 손 케이스 \"짝수 길이\" (확인) |\n| 매번 꼬리를 찾아 떼어 오기 | 정답이지만 O(n²) | 큰 입력 (확인, 십수 초 뒤 실패) |\n| 번갈아 붙일 때 다음 노드를 저장 안 함 | 사슬을 잃어 노드가 빠짐 | 손 케이스 \"짝수 길이\" |\n\n## 9. 면접에서 30초로 설명하기\n\"단일 연결 리스트라 뒤에서부터 읽을 수 없으니, 뒤 절반을 뒤집어서 앞에서부터 읽게 만듭니다. 빠른·느린 포인터로 중간을 찾아 끊고, 뒤 절반을 제자리에서 뒤집고, 두 사슬을 하나씩 번갈아 잇습니다. 세 단계 모두 O(n), 추가 공간 O(1)입니다. 각 단계를 함수로 나눠 따로 테스트할 수 있습니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **Palindrome Linked List(LeetCode 234)는 어떻게 하나요?** 같은 조립이에요. 중간 찾기 + 뒤 절반 뒤집기 + 3단계를 \"붙이기\" 대신 \"값 비교\"로 바꿔요. 면접에서는 끝난 뒤 뒤 절반을 다시 뒤집어 원래대로 돌려 놓는다고 말하면 좋아요.\n2. **중간을 찾을 때 `fast = head`와 `fast = head.next`는 어떻게 다른가요?** 홀수 길이에서는 같고, 짝수 길이에서 `head`는 뒤쪽 중간, `head.next`는 앞쪽 중간을 잡아요(36장 6단계).\n3. **배열에 모으는 방법은 왜 안 되나요?** 안 되는 건 아니에요. 시간 O(n)이고 코드가 짧아요. 공간 O(n)을 쓴다는 걸 말하고, O(1)이 필요하면 이 방법으로 간다고 하면 돼요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 15분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 234 Palindrome Linked List, LeetCode 876 Middle of the Linked List.\n", "starter": "# LeetCode 143 — 함수 몸통을 채우세요.  채점: python algo/judge.py 36/lc0143\n# 반환값은 보지 않아요. 함수가 끝난 뒤 처음 받은 head부터 따라가서 비교해요(제자리 수정).\nfrom lib import ListNode  # noqa: F401  (val, next)\n\n\ndef reorder_list(head: ListNode) -> None:\n    pass\n"}, {"id": "36/lc0146", "chapter": "36", "slug": "lc0146", "title": "LeetCode 146 LRU Cache", "kind": "func", "ext": ".py", "tier": "Medium (LeetCode)", "role": "핵심", "target": "35분", "url": "https://leetcode.com/problems/lru-cache/", "time_limit": 0.6, "ref_time": 0.08639404099085368, "problem": "# LeetCode 146 LRU Cache\n\n- 원문: https://leetcode.com/problems/lru-cache/\n- 난이도: Medium (LeetCode) · 역할: 핵심 · 목표 시간: 35분\n- 짝이 되는 장: 36. 연결 리스트\n\n## 문제 (요약)\n용량이 정해진 캐시 클래스 `LRUCache`를 만드세요.\n- `LRUCache(capacity)`: 용량을 정해 만들어요.\n- `get(key)`: 키가 있으면 값을, 없으면 `-1`을 돌려줘요.\n- `put(key, value)`: 키가 있으면 값을 바꾸고, 없으면 넣어요. 넣은 뒤 개수가 용량을 넘으면 **가장 오래 안 쓰인** 키를 버려요.\n- `get`과 `put` 모두 \"쓴 것\"으로 쳐요. 둘 다 **평균 O(1)**이어야 해요.\n\n## 제약\n- 1 ≤ capacity ≤ 3,000, 0 ≤ key ≤ 10,000, 0 ≤ value ≤ 100,000\n- `get`과 `put`은 합쳐서 최대 200,000번 불려요.\n\n## 채점 방식 (클래스 문제라서)\nLeetCode는 호출 기록을 두 배열로 줘요. `ops = [\"LRUCache\", \"put\", \"get\", …]`, `args = [[2], [1, 1], [1], …]`. 기대 출력은 호출마다 반환값을 모은 배열이에요(생성과 `put`은 `null`).\n`my.py` 맨 아래의 `run_ops(ops, args)`가 이 기록을 그대로 재생해서 반환값 배열을 만들어요. **여러분은 위쪽의 `LRUCache` 클래스만 채우면 돼요.** `run_ops`는 고치지 마세요.\n\n연습 규칙: `OrderedDict`나 `functools.lru_cache` 없이 한 번은 직접 만들어 보세요. 채점기는 이걸 막지 못하지만, 면접에서 묻는 게 바로 그 안쪽이에요.\n\n## 함수\n```python\nclass LRUCache:\n    def __init__(self, capacity: int): ...\n    def get(self, key: int) -> int: ...\n    def put(self, key: int, value: int) -> None: ...\n\ndef run_ops(ops: list[str], args: list[list[int]]) -> list   # 이미 써 있어요\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 36/lc0146` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고(`run_ops`는 빼고 클래스만), `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 할 일을 셋으로 나누기<\/summary>\n\n필요한 일은 세 가지예요. ① 키로 값 찾기 ② \"방금 쓴 것\"을 가장 최근 자리로 옮기기 ③ 가장 오래된 것을 찾아 버리기. 각각을 O(1)로 해 주는 자료구조는 무엇인가요? `dict` 하나로는 어느 것이 안 되나요?\n<\/details>\n\n<details><summary>힌트 2: 두 자료구조를 엮기<\/summary>\n\n`dict`는 ①을 해 주지만 순서를 몰라요. 사용 순서는 **이중 연결 리스트**로 들고, `dict`의 값으로 **노드 자체**를 저장해요. 그러면 키로 노드를 O(1)에 받고, 받은 노드를 O(1)에 떼어 맨 앞에 붙여요. 맨 뒤가 가장 오래된 거예요(36장 7단계 조합 ③).\n\n머리와 꼬리에 **더미 노드**를 하나씩 두면 \"맨 앞에 붙이기\"와 \"맨 뒤 떼기\"에 경계 분기가 없어져요(36장 5단계).\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 노드에 **키도** 저장하세요. 꼬리를 버릴 때 `dict`에서도 지워야 하는데, 노드만 보고 키를 알아야 해요.\n- 이미 있는 키에 `put`하면 값만 바꾸고 맨 앞으로 옮겨요. 이때는 **아무것도 버리지 않아요.** 용량 검사를 그보다 먼저 하면 틀려요.\n- `get`도 \"쓴 것\"이에요. 맨 앞으로 옮기세요.\n- 값이 0일 수 있어요. `if self.map.get(key):`처럼 참/거짓으로 검사하면 0을 없는 것으로 봐요.\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 146 LRU Cache\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"고정 크기 캐시. get/put 둘 다 '사용'. 넘치면 가장 오래 안 쓴 것 하나를 버림. 둘 다 O(1).\" 확인할 것:\n- 있는 키에 `put`하면 사용으로 치나요? → 네, 값도 바뀌어요.\n- 용량이 1일 수 있나요? → 네\n- 스레드 안전해야 하나요? → 이 문제에서는 아니요(꼬리 질문 3)\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n용량 2: `put(1,10) put(2,20) get(1)→10 put(3,30)` → 2가 가장 오래돼서 버려짐 → `get(2)→-1`, `get(3)→30`, `get(1)→10`.\n경계(손 케이스에 다 있어요): 있는 키 갱신이 순서를 바꿈, 꽉 찬 상태에서 있는 키 갱신은 버리지 않음, `get`도 순서를 바꿈, 용량 1, 키 0·값 0.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n`dict` + 키를 사용 순서대로 담은 리스트. 쓸 때마다 `list.remove(key)` 후 `append`, 버릴 때 `pop(0)`. 연산 하나가 O(capacity)예요. 채점기의 `brute.py`가 이 방법이고, 큰 입력(용량 3,000, 호출 20만 번)에서 1초가 넘어 시간 제한 0.6초에 걸려요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n느린 곳은 \"순서 리스트에서 그 키를 찾아 빼기\"예요. 위치를 찾는 데 O(n), 빼면서 미는 데 O(n).\n- **이중 연결 리스트**는 쥐고 있는 노드를 O(1)에 뺄 수 있어요(앞뒤 노드를 직접 알고 있으니까요). 단일이면 앞 노드를 찾아야 해서 안 돼요.\n- 그런데 \"그 노드를 쥐는 것\"이 문제예요 → `dict`의 값으로 **노드를 저장**하면 키로 노드를 O(1)에 받아요.\n- 두 약점이 서로 메워져요. `dict`는 순서를 모르고, 연결 리스트는 키로 못 찾아요.\n\n트리거 단어: \"O(1)에 쓰고, 순서도 유지하고, 가장 오래된 걸 버린다\" → 해시맵 + 이중 연결 리스트(36장 7단계 조합 ③, 패턴 트리거 4번).\n\n## 5. 코드\n```python\nclass Node:\n    __slots__ = ('key', 'val', 'prev', 'next')\n    def __init__(self, key=0, val=0):\n        self.key, self.val = key, val\n        self.prev = self.next = None\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.map = {}\n        self.head, self.tail = Node(), Node()        # 더미 둘\n        self.head.next, self.tail.prev = self.tail, self.head\n\n    def _remove(self, node):\n        node.prev.next = node.next\n        node.next.prev = node.prev\n\n    def _add_front(self, node):\n        node.prev, node.next = self.head, self.head.next\n        self.head.next.prev = node\n        self.head.next = node\n\n    def get(self, key):\n        node = self.map.get(key)\n        if node is None:\n            return -1\n        self._remove(node)\n        self._add_front(node)\n        return node.val\n\n    def put(self, key, value):\n        node = self.map.get(key)\n        if node is not None:                 # 있는 키: 갱신 + 맨 앞, 버리지 않음\n            node.val = value\n            self._remove(node)\n            self._add_front(node)\n            return\n        if len(self.map) == self.cap:        # 새 키인데 꽉 참: 꼬리 버리기\n            lru = self.tail.prev\n            self._remove(lru)\n            del self.map[lru.key]\n        node = Node(key, value)\n        self.map[key] = node\n        self._add_front(node)\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `map`의 키와 리스트의 노드는 정확히 일대일이고, 리스트는 `head` 쪽이 가장 최근, `tail` 쪽이 가장 오래전에 쓴 키예요. `len(map) <= cap`이에요.\n- **빠뜨리지 않는 이유**: `get`과 `put` 모두 쓴 노드를 맨 앞으로 옮기니, 꽉 찼을 때 `tail.prev`가 곧 LRU예요. 있는 키를 `put`하면 버리지 않고 갱신만 해요.\n- **끝나는 이유**: 해시 조회와 더미 덕분에 분기 없는 포인터 교체만 있어 연산마다 O(1)이에요.\n- **깨지는 가정**: 노드가 `key`를 들고 있어서 버린 노드를 `map`에서도 지울 수 있어요. key가 없으면 capacity 1에서 `put(1,1)`, `put(2,2)` 뒤 `get(1)`이 -1이 아니라 옛 값을 돌려줘요.\n\n## 6. 예제로 추적 (확인)\n용량 2 (실행해서 기록했어요. 순서는 head 쪽 = 최근)\n| 호출 | 반환 | 리스트 (최근 ⇄ 오래됨) | map의 키 |\n|---|---|---|---|\n| put(1, 10) | null | 1:10 | 1 |\n| put(2, 20) | null | 2:20 ⇄ 1:10 | 1, 2 |\n| get(1) | 10 | 1:10 ⇄ 2:20 | 1, 2 |\n| put(3, 30) | null | 3:30 ⇄ 1:10 (2 버림) | 1, 3 |\n| get(2) | -1 | 3:30 ⇄ 1:10 | 1, 3 |\n| get(3) | 30 | 3:30 ⇄ 1:10 | 1, 3 |\n| get(1) | 10 | 1:10 ⇄ 3:30 | 1, 3 |\n\n3번째 줄이 핵심이에요. `get(1)`이 1을 앞으로 옮겼기 때문에 4번째 줄에서 1이 아니라 2가 버려졌어요.\n\n## 7. 복잡도\n`get`, `put` 모두 dict 조회 + 포인터 몇 개 → 평균 **O(1)**. 메모리 O(capacity). 큰 입력에서 0.1초 안팎이에요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 있는 키 `put`에서 맨 앞으로 안 옮김 | 방금 갱신한 키가 버려짐 | 손 케이스 \"있는 키에 put하면…\" (직접 돌려 확인했어요) |\n| 용량 검사를 \"있는 키\" 검사보다 먼저 | 갱신만 했는데 다른 키가 버려짐 | 손 케이스 \"꽉 찬 상태에서 있는 키 갱신…\" (확인) |\n| `if not node` 대신 값으로 참/거짓 검사 | 값 0을 없는 것으로 봐서 -1 | 손 케이스 \"키 0, 값 0\" (확인) |\n| 꼬리를 버릴 때 `del self.map[...]` 빠짐 | 버린 키가 옛 값으로 살아남 | 손 케이스 \"꽉 차면…\" (확인) |\n| 리스트 `remove` + `append`로 순서 관리 | 정답이지만 O(capacity) | 큰 입력 1.07초 > 0.6초 (확인) |\n| `get`에서 맨 앞으로 안 옮김 | 방금 읽은 키가 버려짐 | 손 케이스 \"꽉 차면…\" |\n\n## 9. 면접에서 30초로 설명하기\n\"해시맵과 이중 연결 리스트를 함께 씁니다. 해시맵은 키에서 노드로 바로 가고, 리스트는 사용 순서를 유지합니다. get은 노드를 찾아 떼어서 맨 앞에 붙입니다. put은 있으면 갱신 후 맨 앞으로, 없으면 맨 앞에 넣고 꽉 찼으면 꼬리를 떼고 해시맵에서도 지웁니다. 이중이어야 쥔 노드를 O(1)에 뗄 수 있고, 양 끝에 더미를 두면 경계 분기가 사라집니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **파이썬이면 `OrderedDict`로 끝나지 않나요?** 실무에서는 그게 맞아요. `move_to_end`가 O(1)인 이유가 내부의 이중 연결 리스트이고, `functools.lru_cache` 소스에도 원형 이중 연결 리스트가 있어요. \"표준 라이브러리도 이 구조이고, 직접 쓰면 이렇습니다\"가 가장 좋은 답이에요(36장 7단계).\n2. **LFU(가장 적게 쓰인 것 버리기)는요?** 횟수마다 이중 연결 리스트를 하나씩 두고, \"키 → 노드\" 맵과 \"횟수 → 리스트\" 맵, 그리고 최소 횟수 변수를 들어요. 모두 O(1)이에요(LeetCode 460, Hard).\n3. **여러 스레드가 동시에 쓰면?** `get`도 리스트를 고치는 쓰기 연산이라 읽기 잠금으로는 안 돼요. 전체에 잠금 하나를 걸거나, 키를 해시로 나눠 조각마다 잠금을 두는 방식(샤딩)을 써요. 실무 캐시(Redis 등)는 정확한 LRU 대신 표본을 뽑아 근사하기도 해요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 20분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 460 LFU Cache, LeetCode 1472 Design Browser History.\n", "starter": "# LeetCode 146 — LRUCache 클래스를 채우세요.  채점: python algo/judge.py 36/lc0146\n# 채점기는 맨 아래 run_ops를 불러요. run_ops는 고치지 마세요.\n# 연습 규칙: OrderedDict / functools.lru_cache 없이, dict + 직접 만든 노드로 한 번은 써 보세요.\n\n\nclass LRUCache:\n    def __init__(self, capacity: int):\n        pass\n\n    def get(self, key: int) -> int:\n        pass\n\n    def put(self, key: int, value: int) -> None:\n        pass\n\n\ndef run_ops(ops, args):\n    \"\"\"LeetCode 형식의 호출 기록을 그대로 재생해요. ops[0]은 \"LRUCache\"(생성), 나머지는 get/put.\"\"\"\n    cache = LRUCache(*args[0])\n    out = [None]\n    for op, a in zip(ops[1:], args[1:]):\n        out.append(getattr(cache, op)(*a))\n    return out\n"}, {"id": "36/lc0206", "chapter": "36", "slug": "lc0206", "title": "LeetCode 206 Reverse Linked List", "kind": "func", "ext": ".py", "tier": "Easy (LeetCode)", "role": "워밍업", "target": "15분", "url": "https://leetcode.com/problems/reverse-linked-list/", "time_limit": 0.1, "ref_time": 0.002399165998212993, "problem": "# LeetCode 206 Reverse Linked List\n\n- 원문: https://leetcode.com/problems/reverse-linked-list/\n- 난이도: Easy (LeetCode) · 역할: 워밍업 · 목표 시간: 15분\n- 짝이 되는 장: 36. 연결 리스트\n\n## 문제 (요약)\n단일 연결 리스트의 첫 노드 `head`가 주어져요. 노드 순서를 거꾸로 뒤집고, 뒤집은 리스트의 첫 노드를 돌려주세요. 빈 리스트(`None`)도 올 수 있어요.\n\n## 제약\n- 노드 수 0 ~ 5,000, -5,000 ≤ Node.val ≤ 5,000\n- 채점기의 큰 입력은 노드 100,000개예요.\n- 노드는 `lib.ListNode`(`val`, `next`)예요. 채점기가 `[1, 2, 3]` 같은 배열을 노드로 바꿔서 넘기고, 돌려받은 노드를 다시 배열로 바꿔 비교해요.\n\n## 함수\n```python\ndef reverse_list(head: ListNode | None) -> ListNode | None\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요. 종이에 상자를 그리면서 하세요.\n2. `python algo/judge.py 36/lc0206` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 한 노드에서 할 일<\/summary>\n\n새 노드를 만들지 않고 화살표 방향만 바꾸면 돼요. 노드 2에 서 있다고 해 봐요. 2의 화살표를 1 쪽으로 돌리면, 원래 2 뒤에 있던 3은 어떻게 찾아가나요?\n<\/details>\n\n<details><summary>힌트 2: 상자 세 개<\/summary>\n\n`prev`(이미 뒤집은 쪽의 머리), `cur`(지금 노드), `nxt`(아직 안 뒤집은 쪽)를 들고 한 칸씩 걸어요. 순서는 **`nxt` 저장 → 화살표 뒤집기 → 전진**이에요(36장 4단계 루틴 ①).\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- `cur.next = prev`를 **먼저** 하면 뒤쪽 사슬을 잃어요. 결과가 `[1]`만 나오면 이거예요.\n- 끝나면 `cur`는 `None`이에요. 돌려줄 건 `prev`예요.\n- 재귀로 써도 맞지만 파이썬은 기본 재귀 한도가 1,000이라 노드 100,000개에서 `RecursionError`가 나요.\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 206 Reverse Linked List\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"사슬의 화살표 방향을 전부 반대로, 새 머리 반환.\" 확인할 것:\n- 새 노드를 만들어도 되나요? → 보통 \"제자리에서, 추가 메모리 O(1)로\"를 기대해요.\n- 빈 리스트가 오나요? → 네, `None`을 그대로 돌려줘요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`1 → 2 → 3 → None`이 `3 → 2 → 1 → None`. 경계: 빈 리스트, 노드 하나, 노드 둘(손 케이스에 모두 있어요).\n\n## 3. 브루트포스와 그 복잡도 (1분)\n값을 배열에 모아서 거꾸로 새 노드를 만들어요. 시간 O(n), 공간 O(n). 채점기의 `brute.py`가 이 방법이에요. 답은 맞지만 면접관은 \"추가 공간 없이 해 보세요\"라고 할 거예요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n필요한 건 각 노드의 `next`를 앞 노드로 바꾸는 것뿐이에요. 문제는 `cur.next`를 바꾸는 순간 원래 다음 노드로 가는 유일한 길이 사라진다는 거예요(36장 4단계 \"화살표를 뒤집으면 뒤가 안 보여요\"). 그래서 바꾸기 **전에** 다음 노드를 `nxt`에 잡아 둬요.\n\n트리거 단어: \"뒤집기\" → 제자리 뒤집기 루틴(상자 세 개: `prev`, `cur`, `nxt`).\n\n## 5. 코드\n```python\ndef reverse_list(head):\n    prev, cur = None, head\n    while cur:\n        nxt = cur.next\n        cur.next = prev\n        prev, cur = cur, nxt\n    return prev\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: 반복마다 `prev`는 이미 뒤집은 앞부분의 머리이고, `cur`는 아직 손대지 않은 나머지의 머리예요.\n- **빠뜨리지 않는 이유**: `cur.next`를 덮기 전에 `nxt`에 저장하니 나머지 리스트를 잃지 않고, 모든 노드가 정확히 한 번 `prev` 쪽으로 옮겨져요.\n- **끝나는 이유**: `cur`가 한 칸씩 나아가 `None`에 닿으니 n번 반복, O(n)·O(1)이에요.\n- **깨지는 가정**: `nxt`를 먼저 저장한다는 점에 기대요. 저장하지 않고 `cur = cur.next`로 넘어가면 `[1, 2]`에서 2를 잃고 `[1]`이 나와요.\n\n## 6. 예제로 추적 (확인)\n`1 → 2 → 3` (실행해서 기록했어요)\n| 반복 | cur | nxt (저장) | cur.next ← | 전진 후 prev, cur | prev부터 읽으면 |\n|---|---|---|---|---|---|\n| 1 | 1 | 2 | None | 1, 2 | [1] |\n| 2 | 2 | 3 | 1 | 2, 3 | [2, 1] |\n| 3 | 3 | None | 2 | 3, None | [3, 2, 1] |\n`cur`가 None이 되어 멈추고 `prev = 3`을 돌려줘요.\n\n## 7. 복잡도\n노드마다 한 번 → 시간 **O(n)**, 공간 **O(1)** (변수 세 개).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `nxt` 저장 없이 `cur.next = prev` 후 `cur = cur.next` | 첫 칸에서 사슬을 잃어 `[1]` | 손 케이스 \"다섯 개\" (직접 돌려 확인했어요) |\n| `return cur` | 항상 `None` → `[]` | 손 케이스 \"다섯 개\" (확인) |\n| 재귀 버전 | 작은 입력은 맞지만 깊이 100,000에서 RecursionError | 큰 입력 (확인) |\n| 매번 꼬리를 찾아 앞으로 옮기기 | O(n²) | 큰 입력 |\n\n## 9. 면접에서 30초로 설명하기\n\"prev, cur, nxt 세 포인터로 한 번 훑습니다. 매 노드에서 다음 노드를 nxt에 먼저 저장하고, cur.next를 prev로 돌린 뒤, prev와 cur를 한 칸씩 전진합니다. 끝나면 prev가 새 head입니다. 시간 O(n), 공간 O(1)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **재귀로도 써 보세요.** `new_head = reverse(head.next); head.next.next = head; head.next = None; return new_head`. 공간이 O(n)(호출 스택)이고 파이썬 기본 한도 1,000을 넘으면 터진다는 걸 함께 말해요(36장 4단계).\n2. **m번째부터 n번째까지만 뒤집으라면?** (LeetCode 92) 더미 노드를 두고 m − 1번째 노드까지 간 뒤, 같은 루틴을 n − m + 1번 돌리고 앞뒤를 다시 이어요. 머리가 바뀔 수 있으니 더미가 필요해요(36장 5단계).\n3. **k개씩 묶어서 뒤집으라면?** (LeetCode 25, Hard) 묶음마다 이 루틴을 쓰고, 묶음 사이를 잇는 포인터를 따로 들고 다녀요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 5분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 92 Reverse Linked List II, LeetCode 234 Palindrome Linked List.\n", "starter": "# LeetCode 206 — 함수 몸통을 채우세요.  채점: python algo/judge.py 36/lc0206\n# head는 연결 리스트의 첫 노드(빈 리스트면 None)예요. 채점기가 [1, 2, 3] 같은 배열을 노드로 바꿔서 넘겨요.\nfrom lib import ListNode  # noqa: F401  (val, next)\n\n\ndef reverse_list(head: ListNode | None) -> ListNode | None:\n    pass\n"}, {"id": "36/pg81303", "chapter": "36", "slug": "pg81303", "title": "프로그래머스 81303 표 편집", "kind": "func", "ext": ".py", "tier": "Lv. 3 (프로그래머스, 2021 카카오 채용연계형 인턴십)", "role": "도전", "target": "50분", "url": "https://school.programmers.co.kr/learn/courses/30/lessons/81303", "time_limit": 0.5, "ref_time": 0.1337293749966193, "problem": "# 프로그래머스 81303 표 편집\n\n- 원문: https://school.programmers.co.kr/learn/courses/30/lessons/81303\n- 난이도: Lv. 3 (프로그래머스, 2021 카카오 채용연계형 인턴십) · 역할: 도전 · 목표 시간: 50분\n- 짝이 되는 장: 36. 연결 리스트\n\n## 문제 (요약)\n행이 n개인 표가 있고, 행 번호는 0부터 n−1이에요. 처음에는 k번 행이 선택돼 있어요. 명령을 차례로 실행한 뒤, 처음 표의 각 행이 남아 있으면 `O`, 지워졌으면 `X`로 적은 길이 n 문자열을 돌려주세요.\n- `U X`: 선택을 위로 X칸 (지금 **남아 있는** 행 기준)\n- `D X`: 선택을 아래로 X칸\n- `C`: 선택한 행을 지우고, 바로 아래 행을 선택해요. 지운 행이 맨 아래였으면 바로 위 행을 선택해요.\n- `Z`: **가장 최근에 지운** 행을 원래 자리에 되돌려요. 선택한 행은 바뀌지 않아요.\n\n## 제약\n- 5 ≤ n ≤ 1,000,000, 0 ≤ k < n\n- 명령 수 ≤ 200,000, 모든 `U X`·`D X`의 X를 더해도 1,000,000 이하\n- 표 밖으로 나가는 이동, 행이 하나도 안 남는 삭제, 지운 게 없을 때의 `Z`는 주어지지 않아요.\n- 원래 문제에는 효율성 테스트가 따로 있어요. 채점기의 큰 입력이 그 역할이에요.\n\n## 함수\n```python\ndef solution(n: int, k: int, cmd: list[str]) -> str\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 36/pg81303` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 프로그래머스에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 무엇이 느린가<\/summary>\n\n행을 리스트에서 정말로 빼면(`pop(i)`, `insert(i)`) 한 번에 O(n)이에요. 지웠다는 표시만 하면(`alive[i] = False`) 삭제는 O(1)이지만, `U`/`D`를 할 때 지운 행을 하나씩 건너뛰어야 해요. 지운 행이 수십만 개 몰려 있으면요? **이동도, 삭제도, 되돌리기도** 모두 O(1)에 가까워야 해요. 그런 성질을 가진 자료구조가 무엇이었나요?\n<\/details>\n\n<details><summary>힌트 2: 배열로 만든 이중 연결 리스트<\/summary>\n\n행마다 \"위 행 번호\" `prv[i]`와 \"아래 행 번호\" `nxt[i]`를 배열로 들어요(36장 3단계 \"길 3의 변형\"). 삭제는 이웃 둘이 서로를 가리키게 바꾸는 O(1)이고, 이동은 `prv`/`nxt`를 X번 따라가면 지운 행을 저절로 건너뛰어요. 지운 행 번호는 스택에 쌓아요(되돌리기는 가장 최근 것부터니까요).\n<\/details>\n\n<details><summary>힌트 3: 되돌리기와 구현 함정<\/summary>\n\n- 지운 행의 `prv[r]`, `nxt[r]`를 **지우지 말고 그대로 두세요.** 그 두 값이 \"원래 어디 있었는지\"를 기억해요. 되돌릴 때 `nxt[prv[r]] = r`, `prv[nxt[r]] = r` 두 줄이면 끝이에요. 스택 순서대로 되돌리니 그 이웃들은 그때 살아 있어요.\n- 되돌릴 때 `alive`만 `True`로 바꾸고 연결을 안 고치면, 결과 문자열은 맞아 보여도 그 행이 이후 이동에서 투명 인간이 돼요.\n- 맨 아래 행을 지우면 **위로** 가요. 맨 위·맨 아래는 `-1`과 `n`을 \"없음\" 표시로 쓰고 이웃을 고칠 때 범위를 검사하세요.\n- `U X`의 X는 두 자리 이상일 수 있어요. `c[2]`가 아니라 `int(c[2:])`예요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 프로그래머스 81303 표 편집\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (2분)\n\"행 n개, 커서 하나. 커서 이동(남은 행 기준), 삭제(아래로, 없으면 위로), 최근 삭제 되돌리기. 마지막에 행별 생존 여부.\" 확인할 것:\n- 이동 거리는 **남아 있는 행** 기준인가요? → 네\n- 되돌리면 커서는요? → 그대로예요. 되돌린 행이 커서 위에 끼어도 같은 **행**을 계속 가리켜요.\n- n이 100만이에요. 명령 20만 개 × O(n)은 안 돼요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (5분)\n원문 예제 1(`n = 8, k = 2`)을 6절에서 표로 따라가요.\n경계(손 케이스에 다 있어요):\n- 맨 아래 행 삭제 → 위로 (손 케이스 \"마지막 행을 지우면 위로\")\n- 맨 위 행부터 계속 삭제\n- 되돌린 행이 커서 위에 낌 → 선택은 그대로\n- 되돌린 행이 이후 이동·삭제에 다시 걸림\n- 지운 행 구간을 가로지르는 이동\n\n## 3. 브루트포스와 그 복잡도 (3분)\n살아 있는 행 번호를 리스트에 들고 커서를 인덱스로 둬요. `C`는 `pop(cur)`, `Z`는 이분 탐색으로 자리를 찾아 `insert`. 명령 하나가 O(n)이라 최악 20만 × 100만. 채점기의 `brute.py`가 이 방법이고, 큰 입력에서 13초 넘게 걸렸어요.\n\n## 3½. 중간 풀이와 왜 부족한가
