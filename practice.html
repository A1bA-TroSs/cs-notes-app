<script id="data" type="application/json">{"problems": [{"id": "20/pg144855", "chapter": "20", "slug": "pg144855", "title": "프로그래머스 144855 카테고리 별 도서 판매량 집계하기", "kind": "sql", "ext": ".sql", "tier": "Lv. 3", "role": "핵심", "target": "25분", "url": "https://school.programmers.co.kr/learn/courses/30/lessons/144855", "time_limit": 2.0, "ref_time": null, "problem": "# 프로그래머스 144855 카테고리 별 도서 판매량 집계하기\n\n- 원문: https://school.programmers.co.kr/learn/courses/30/lessons/144855\n- 난이도: Lv. 3 · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 20. 코딩 테스트를 위한 SQL\n\n## 문제 (요약)\n도서 정보 `BOOK`과 날짜별 판매 기록 `BOOK_SALES`가 있어요. **2022년 1월**에 팔린 양을 **카테고리별로** 합해서, 카테고리와 총 판매량을 구하세요. 카테고리 이름순으로 정렬해요.\n\n## 테이블\n`BOOK`\n| 컬럼 | 타입 | 뜻 |\n|---|---|---|\n| BOOK_ID | INTEGER | 도서 ID |\n| CATEGORY | VARCHAR | 카테고리 (경제, 인문, …) |\n| AUTHOR_ID | INTEGER | 저자 ID |\n| PRICE | INTEGER | 가격 |\n| PUBLISHED_DATE | DATE | 출간일 |\n\n`BOOK_SALES`\n| 컬럼 | 타입 | 뜻 |\n|---|---|---|\n| BOOK_ID | INTEGER | 도서 ID |\n| SALES_DATE | DATE | 판매일 |\n| SALES | INTEGER | 그날 판매량 |\n\n## 출력\n컬럼 두 개: `CATEGORY`, `TOTAL_SALES` (카테고리순). 채점기는 값과 행 순서만 비교해요.\n\n> 프로그래머스는 MySQL이지만 이 채점기는 SQLite로 돌려요. SQLite에는 `DATE_FORMAT`과 `YEAR()`가 없어요. 날짜가 `'YYYY-MM-DD'` 글자라서 범위 비교(`>=`, `<`)나 `strftime('%Y-%m', 컬럼)`을 쓰세요.\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.sql`에 쿼리를 써요. 타이머를 켜세요.\n2. `python algo/judge.py 20/pg144855` → 손으로 만든 데이터 → 랜덤 데이터 30세트 순서로, 참고 쿼리와 결과를 비교해요. 틀리면 반례 데이터가 `반례.txt`에 저장돼요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 프로그래머스에도 MySQL로 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 필요한 정보가 어느 테이블에 있나<\/summary>\n\n판매량과 판매일은 `BOOK_SALES`에, 카테고리는 `BOOK`에 있어요. 두 테이블을 `BOOK_ID`로 이어 붙여야 판매 한 건마다 카테고리를 알 수 있어요. 그다음은 \"기간으로 거르기\"와 \"카테고리별 합\"이에요.\n<\/details>\n\n<details><summary>힌트 2: 순서대로 쌓기<\/summary>\n\n`FROM BOOK JOIN BOOK_SALES ON BOOK_ID` → `WHERE 판매일이 2022년 1월` → `GROUP BY CATEGORY` → `SUM(SALES)` → `ORDER BY CATEGORY`. 20장 1단계의 실행 순서 그대로예요. 1월 판매가 없는 카테고리를 0으로 보여 달라는 말은 **없어요**. 그러니 `INNER JOIN`으로 충분해요(20장 5단계 마지막 단락).\n<\/details>\n\n<details><summary>힌트 3: 자주 틀리는 곳<\/summary>\n\n- 거르는 날짜는 `SALES_DATE`(판매일)예요. `PUBLISHED_DATE`(출간일)가 아니에요.\n- \"1월\"만 보면 안 되고 \"2022년 1월\"이에요. 월만 비교하면 다른 해의 1월이 섞여요.\n- 1월 31일과 1월 1일을 빠뜨리지 마세요. 범위는 `>= '2022-01-01' AND < '2022-02-01'`로 쓰면 경계 실수가 없어요.\n- 판매 **건수**(`COUNT`)가 아니라 판매**량**의 합(`SUM(SALES)`)이에요.\n- 묶는 기준은 `CATEGORY`예요. `BOOK_ID`로 묶으면 책마다 한 줄이 돼요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 프로그래머스 144855 카테고리 별 도서 판매량 집계하기\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"판매 기록을 책 정보와 붙여서, 2022년 1월 판매만 남기고, 카테고리별로 판매량을 더한다.\" 확인할 것은 이거예요.\n- 결과 한 줄 = 카테고리 하나 → `GROUP BY CATEGORY`\n- 1월 판매가 없는 카테고리도 0으로 보여 줘야 하나요? → **아니요**. 그래서 `INNER JOIN`이면 돼요.\n- 기간의 기준 날짜는? → 판매일 `SALES_DATE`.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n손 케이스 01: 1월 판매는 1번 책(경제) 3 + 5, 3번 책(경제) 2, 2번 책(인문) 6. 2번 책의 2월 판매 4는 빠져요 → 경제 10, 인문 6.\n경계: 1월 판매가 없는 카테고리(결과에 없어야 함), 출간일만 2022년 1월인 책, 다른 해의 1월, 1월 1일·31일, 한 카테고리에 책이 여러 권.\n\n## 3. 가장 단순한 시도와 그 문제 (2분)\n```sql\nSELECT CATEGORY, SUM(SALES) FROM BOOK_SALES GROUP BY CATEGORY;\n```\n`BOOK_SALES`에는 `CATEGORY`가 없어서 오류예요. 카테고리를 알려면 조인이 먼저예요. 그리고 기간 조건이 빠졌어요.\n\n## 4. 조각을 실행 순서대로 쌓기 (핵심)\n| 실행 순서 | 하는 일 | 쓰는 것 |\n|---|---|---|\n| FROM / JOIN | 판매 한 건마다 그 책의 카테고리를 붙임 | `BOOK B JOIN BOOK_SALES S ON B.BOOK_ID = S.BOOK_ID` |\n| WHERE | 2022년 1월 판매만 남김 | `S.SALES_DATE >= '2022-01-01' AND S.SALES_DATE < '2022-02-01'` |\n| GROUP BY | 카테고리별로 묶음 | `GROUP BY B.CATEGORY` |\n| SELECT | 묶음마다 판매량 합 | `SUM(S.SALES)` |\n| ORDER BY | 카테고리순 | `ORDER BY B.CATEGORY` |\n\n날짜 조건을 범위로 쓴 이유는 20장 8단계예요. `DATE_FORMAT(SALES_DATE, …)`처럼 컬럼을 함수로 감싸면 인덱스를 못 써요. 코딩 테스트에서는 셋 다 통과하지만, 면접에서 \"이 쿼리를 개선해 보세요\"가 나오면 범위 비교가 답이에요.\n\n트리거 단어: \"두 테이블의 정보를 함께\" → `JOIN`, \"~별 합계\" → `GROUP BY` + `SUM`, \"2022년 1월\" → 날짜 범위 (20장 「이름 붙이기」).\n\n## 5. 쿼리\nSQLite(채점기):\n```sql\nSELECT B.CATEGORY, SUM(S.SALES) AS TOTAL_SALES\nFROM BOOK B\nJOIN BOOK_SALES S ON B.BOOK_ID = S.BOOK_ID\nWHERE S.SALES_DATE >= '2022-01-01'\n  AND S.SALES_DATE <  '2022-02-01'\nGROUP BY B.CATEGORY\nORDER BY B.CATEGORY;\n```\n이 쿼리는 MySQL에서도 그대로 돌아요. MySQL에서 자주 쓰는 다른 모양은 이거예요.\n```sql\nWHERE DATE_FORMAT(S.SALES_DATE, '%Y-%m') = '2022-01'        -- MySQL 전용\nWHERE YEAR(S.SALES_DATE) = 2022 AND MONTH(S.SALES_DATE) = 1 -- MySQL 전용\n```\nSQLite에서는 `strftime('%Y-%m', S.SALES_DATE) = '2022-01'`이 첫 번째에 해당해요.\n\n## 왜 이 코드가 정답인가\n- **맞는 행만 남는 이유**: `JOIN`은 판매 한 건마다 `BOOK_ID`가 같은 책을 붙여요. `BOOK_ID`가 책마다 하나라서 판매 행이 불어나지 않고, 카테고리를 모르는 판매도 생기지 않아요.\n- **빠뜨리지 않는 이유**: `>= '2022-01-01' AND < '2022-02-01'`은 반열린 범위라 1월 1일과 31일이 모두 들어가고 2월 1일은 빠져요. 날짜가 `'YYYY-MM-DD'` 글자라 글자 비교가 날짜 순서와 같아요.\n- **묶음이 맞는 이유**: `WHERE`가 `GROUP BY`보다 먼저 돌아서, `SUM(S.SALES)`는 카테고리마다 1월 판매만 더해요. 1월 판매가 없는 카테고리는 행이 다 사라져 결과에 없는데, 문제가 원하는 게 그거예요.\n- **깨지는 가정**: `BOOK`에 같은 `BOOK_ID`가 두 줄이면 판매가 두 번 더해져요. 날짜에 시각이 붙으면(`'2022-01-31 10:00'`) 지금 범위는 괜찮지만 `<= '2022-01-31'`로 쓰면 그 행이 빠져요.\n\n## 6. 예제로 추적 (확인)\n손 케이스 01에서 조인한 결과예요(채점기 데이터로 직접 돌렸어요).\n| BOOK_ID | CATEGORY | SALES_DATE | SALES | WHERE |\n|---|---|---|---|---|\n| 1 | 경제 | 2022-01-02 | 3 | 남음 |\n| 1 | 경제 | 2022-01-21 | 5 | 남음 |\n| 2 | 인문 | 2022-01-09 | 6 | 남음 |\n| 2 | 인문 | 2022-02-14 | 4 | 탈락 |\n| 3 | 경제 | 2022-01-09 | 2 | 남음 |\n`GROUP BY` → 경제: 3 + 5 + 2 = 10, 인문: 6 → 결과 `경제 10`, `인문 6` ✓\n\n## 7. 복잡도\n판매 S건, 책 B권이면 조인이 해시 조인으로 O(S + B), 묶기가 O(S)예요. `SALES_DATE`에 인덱스가 있고 범위 비교를 쓰면 1월 판매만 골라 읽어서 S 전체를 훑지 않아도 돼요. 함수로 감싸면 S 전체를 읽어요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `PUBLISHED_DATE`로 거름 | 엉뚱한 책의 판매가 합쳐짐 | 손 케이스 01 |\n| 월만 비교 (`strftime('%m', …) = '01'`) | 2021·2023년 1월이 섞임 | 손 케이스 04 |\n| `LEFT JOIN` + `ON`에 날짜 + `IFNULL(…, 0)` | 1월 판매가 없는 카테고리가 0으로 나옴 | 손 케이스 02 |\n| `COUNT(*)` | 판매량 대신 판매 건수 | 손 케이스 01 |\n| `GROUP BY B.BOOK_ID` | 책마다 한 줄 | 손 케이스 01 |\n| `> '2022-01-01' AND < '2022-01-31'` | 1일과 31일이 빠짐 | 손 케이스 03 |\n\n참고로 `S.SALES_DATE LIKE '2022-01%'`는 SQLite에서 통과해요. 날짜가 글자로 저장돼서예요. MySQL의 `DATE` 타입에서도 대개 돌지만, 글자로 바꿔 비교하는 셈이라 인덱스를 못 써요.\n\n## 9. 면접에서 30초로 설명하기\n\"카테고리는 `BOOK`에, 판매량과 판매일은 `BOOK_SALES`에 있어서 `BOOK_ID`로 조인합니다. 판매일이 2022년 1월인 행만 `WHERE`에서 범위로 거르고, `CATEGORY`로 묶어 `SUM(SALES)`를 구합니다. 판매가 없는 카테고리를 0으로 보여 달라는 조건이 없으니 `INNER JOIN`으로 충분합니다. 날짜는 컬럼을 함수로 감싸지 않고 범위로 비교해야 인덱스를 탈 수 있습니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **판매가 없는 카테고리도 0으로 보여 달라면?** `BOOK`을 왼쪽에 두고 `LEFT JOIN`하고, 날짜 조건을 **`ON`으로** 옮기고, `IFNULL(SUM(S.SALES), 0)`으로 감싸요. 날짜 조건을 `WHERE`에 두면 짝 없는 행이 다시 지워져서 `INNER JOIN`과 같아져요(20장 5단계 「두 번째로 비싼 함정」).\n2. **`BETWEEN '2022-01-01' AND '2022-01-31'`은 괜찮나요?** 컬럼이 `DATE`면 맞아요. 하지만 `DATETIME`이면 `'2022-01-31 15:00:00'`이 `'2022-01-31'`(= 자정)보다 커서 31일 낮 판매가 빠져요. `>= 시작 AND < 다음 달 1일`은 두 타입 모두에서 안전해요.\n3. **카테고리별 판매 금액(가격 × 판매량)은?** `SUM(B.PRICE * S.SALES)`예요. 조인 덕분에 같은 행에 가격과 판매량이 같이 있어요. 프로그래머스 144856 「저자 별 카테고리 별 매출액 집계하기」가 이 변형이에요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 7분 안에 통과하면 졸업. 비슷한 문제: 프로그래머스 144856 「저자 별 카테고리 별 매출액 집계하기」, 131117 「5월 식품들의 총매출 조회하기」.\n", "starter": "-- 프로그래머스 144855 카테고리 별 도서 판매량 집계하기 — 여기에 쿼리를 쓰세요.  채점: python algo/judge.py 20/pg144855\n-- SQLite에서 돌아요. 날짜는 'YYYY-MM-DD' 글자로 저장돼 있어요. 쿼리는 한 문장만 쓰세요.\n\n"}, {"id": "20/pg59041", "chapter": "20", "slug": "pg59041", "title": "프로그래머스 59041 동명 동물 수 찾기", "kind": "sql", "ext": ".sql", "tier": "Lv. 2", "role": "워밍업", "target": "15분", "url": "https://school.programmers.co.kr/learn/courses/30/lessons/59041", "time_limit": 2.0, "ref_time": null, "problem": "# 프로그래머스 59041 동명 동물 수 찾기\n\n- 원문: https://school.programmers.co.kr/learn/courses/30/lessons/59041\n- 난이도: Lv. 2 · 역할: 워밍업 · 목표 시간: 15분\n- 짝이 되는 장: 20. 코딩 테스트를 위한 SQL\n\n## 문제 (요약)\n보호소에 들어온 동물 목록 `ANIMAL_INS`가 있어요. 동물 이름 가운데 **두 번 이상** 쓰인 이름과, 그 이름이 쓰인 횟수를 구하세요. 이름이 없는 동물은 세지 않아요. 결과는 이름순으로 정렬해요.\n\n## 테이블\n`ANIMAL_INS`\n| 컬럼 | 타입 | NULL |\n|---|---|---|\n| ANIMAL_ID | VARCHAR | 불가 |\n| ANIMAL_TYPE | VARCHAR | 불가 |\n| DATETIME | DATETIME | 불가 |\n| INTAKE_CONDITION | VARCHAR | 불가 |\n| NAME | VARCHAR | **가능** |\n| SEX_UPON_INTAKE | VARCHAR | 불가 |\n\n## 출력\n컬럼 두 개: `NAME`, `COUNT` (이름순). 채점기는 값과 행 순서만 비교하고 컬럼 이름은 보지 않아요.\n\n> 프로그래머스는 MySQL이지만 이 채점기는 SQLite로 돌려요. 이 문제는 두 곳에서 같은 쿼리가 그대로 통해요.\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.sql`에 쿼리를 써요. 타이머를 켜세요.\n2. `python algo/judge.py 20/pg59041` → 손으로 만든 데이터 → 랜덤 데이터 30세트 순서로, 참고 쿼리와 결과를 비교해요. 틀리면 반례 데이터가 `반례.txt`에 저장돼요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 프로그래머스에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 결과 한 줄이 무엇인가<\/summary>\n\n결과의 한 줄은 동물 한 마리가 아니라 **이름 하나**예요. 여러 행을 이름별로 한 줄로 합쳐야 해요. 그리고 조건이 두 종류예요. \"이름이 없는 동물은 빼기\"는 **동물 한 마리**를 보고 정하고, \"두 번 이상\"은 **이름 묶음**을 보고 정해요.\n<\/details>\n\n<details><summary>힌트 2: 조건마다 자리가 다르다<\/summary>\n\n20장 1단계의 실행 순서 `FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY`를 떠올리세요. 행 하나를 보는 조건은 `WHERE`, 묶음을 보는 조건(`COUNT(*) >= 2`)은 `HAVING`이에요(20장 4단계). `WHERE`에는 아직 묶음이 없어서 집계 함수를 쓸 수 없어요.\n<\/details>\n\n<details><summary>힌트 3: 자주 틀리는 곳<\/summary>\n\n- `NAME IS NOT NULL`을 빼고 `COUNT(*)`를 쓰면, 이름 없는 동물들이 **하나의 NULL 묶음**이 돼서 결과에 나와요(20장 3단계).\n- \"두 번 이상\"은 `>= 2`예요. `> 2`가 아니에요.\n- `NULL` 비교는 `= NULL`이 아니라 `IS NULL` / `IS NOT NULL`이에요.\n- `ORDER BY NAME`을 빼지 마세요. 묶은 결과의 순서는 보장되지 않아요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 프로그래머스 59041 동명 동물 수 찾기\n\nSQL 문제도 순서는 같아요. 쿼리를 쓰기 전에 **결과표의 한 줄이 무엇인지**부터 정하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"이름별로 묶어서 센다. 이름 없는 동물은 빼고, 2번 이상인 이름만, 이름순.\" 확인할 것은 이거예요.\n- 결과 한 줄 = 이름 하나 → `GROUP BY NAME`\n- `NAME`은 `NULL`이 될 수 있어요 → 빼라고 했으니 처리가 필요해요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n이름이 `Max, Bella, Max, Coco, Bella, Max`이면 → `Bella 2`, `Max 3`. `Coco`는 1번이라 빠져요.\n경계: 이름 없는 동물이 2마리 이상(NULL 묶음이 생기는지), 겹치는 이름이 하나도 없음(빈 결과), 정확히 2번(경계값), 빈 테이블.\n\n## 3. 가장 단순한 시도와 그 문제 (2분)\n```sql\nSELECT NAME, COUNT(*) FROM ANIMAL_INS GROUP BY NAME;\n```\n이건 **모든** 이름의 횟수를 내요. 1번짜리도, `NULL` 묶음도 같이 나와요. 여기에 조건 두 개를 **맞는 자리에** 붙이면 끝이에요.\n\n## 4. 조건을 자리에 배치하기 (핵심)\n| 조건 | 무엇을 보고 정하나 | 자리 |\n|---|---|---|\n| 이름이 없는 동물은 제외 | 행 하나 | `WHERE NAME IS NOT NULL` |\n| 두 번 이상 쓰인 이름 | 묶음 하나 (`COUNT`) | `HAVING COUNT(*) >= 2` |\n| 이름순 | 결과 | `ORDER BY NAME` |\n\n트리거 단어: \"~별 개수\" → `GROUP BY` + 집계, \"n건 이상인 ~만\" → `HAVING` (20장 「이름 붙이기: 열두 개의 패턴」 4·5번째 줄).\n\n## 5. 쿼리\n```sql\nSELECT NAME, COUNT(*) AS COUNT\nFROM ANIMAL_INS\nWHERE NAME IS NOT NULL\nGROUP BY NAME\nHAVING COUNT(*) >= 2\nORDER BY NAME;\n```\nMySQL(프로그래머스)과 SQLite(채점기)에서 똑같이 돌아요.\n\n## 왜 이 코드가 정답인가\n- **맞는 행만 남는 이유**: `WHERE NAME IS NOT NULL`이 묶기 전에 돌아서 NULL 묶음이 아예 생기지 않아요. `GROUP BY NAME`은 NULL끼리도 한 묶음으로 모으기 때문에 이 줄이 없으면 NULL 행이 나와요.\n- **빠뜨리지 않는 이유**: 이름이 있는 행은 전부 자기 이름 묶음에 들어가고, `COUNT(*)`는 그 묶음의 행 수를 그대로 세요. `HAVING COUNT(*) >= 2`는 묶음 단위 조건이라 정확히 2번인 이름도 남아요.\n- **순서**: `ORDER BY NAME`은 마지막에 결과 행에만 걸려서 개수에 영향이 없어요.\n- **깨지는 가정**: 이 조건을 `WHERE COUNT(*) >= 2`로 옮기면 집계 전이라 오류예요. `COUNT(NAME)`으로 세고 `WHERE`를 빼도 NULL 묶음이 `0`으로 남아 `HAVING`에서 걸러지지만, `COUNT(*)`에 `WHERE`가 없으면 NULL 묶음이 출력돼요.\n\n## 6. 예제로 추적 (확인)\n손 케이스 02의 데이터(이름: `NULL, NULL, NULL, Gia, Gia`)를 실행 순서대로 따라가요.\n| 단계 | 남은 것 |\n|---|---|\n| FROM | 5행 |\n| WHERE NAME IS NOT NULL | 2행 (Gia, Gia) |\n| GROUP BY NAME | 묶음 1개: Gia(2) |\n| HAVING COUNT(*) >= 2 | Gia(2) |\n| SELECT / ORDER BY | `Gia 2` |\n\n`WHERE`를 빼면 `GROUP BY` 단계에서 묶음이 2개가 돼요: `NULL(3)`, `Gia(2)`. 둘 다 `HAVING`을 통과해서 `NULL 3`이 결과 첫 줄에 나와요. 손 케이스 02가 이걸 잡아요.\n\n## 7. 복잡도\nSQL은 복잡도를 직접 쓰지는 않지만, 엔진이 하는 일은 \"N행을 한 번 훑으며 이름별로 세기\"예요. 해시로 묶으면 O(N), 정렬로 묶으면 O(N log N)이에요. `NAME`에 인덱스가 있으면 이미 정렬된 순서로 읽어서 정렬 단계를 건너뛸 수 있어요(17장).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `WHERE NAME IS NOT NULL`을 빼고 `COUNT(*)` | `NULL 3` 같은 줄이 생김 | 손 케이스 02 |\n| `HAVING COUNT(*) > 2` | 2번짜리 이름이 빠짐 | 손 케이스 01 |\n| `WHERE COUNT(*) >= 2` | 오류 \"misuse of aggregate\" | 손 케이스 01 (SQL 에러) |\n| `ORDER BY COUNT(*) DESC` | 순서가 다름 | 손 케이스 01 |\n| `ORDER BY`를 아예 뺌 | SQLite에선 우연히 이름순이라 통과할 수 있지만, MySQL은 보장 안 함 | 채점기가 못 잡을 수 있어요. 직접 조심 |\n\n참고로 `WHERE` 없이 `COUNT(NAME)`을 쓰는 방법도 맞아요. `NULL` 묶음에서 `COUNT(NAME)`은 0이라 `HAVING`에서 떨어지거든요. 하지만 의도가 덜 드러나서 `WHERE`가 더 읽기 좋아요.\n\n## 9. 면접에서 30초로 설명하기\n\"이름별로 묶어 세야 하니 `GROUP BY NAME`입니다. 이름이 없는 동물을 빼는 건 행 하나를 보는 조건이라 묶기 전에 `WHERE`에서, 두 번 이상이라는 건 묶음을 보는 조건이라 묶은 뒤 `HAVING`에서 거릅니다. 실행 순서가 `WHERE → GROUP BY → HAVING`이라 `WHERE`에는 `COUNT`를 쓸 수 없습니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **`WHERE`와 `HAVING` 둘 다에 쓸 수 있는 조건은 어디에 쓰나요?** 예를 들어 `NAME <> 'Max'`는 둘 다 가능해요. `WHERE`에 쓰는 게 좋아요. 묶기 **전에** 행을 줄이니 묶을 데이터가 적어지고, 인덱스도 탈 수 있어요.\n2. **`COUNT(*)`와 `COUNT(NAME)`의 차이는?** `COUNT(*)`는 행 수, `COUNT(NAME)`은 `NULL`이 아닌 값의 수예요. 20장 3단계에서 8과 7로 갈렸던 그 차이예요. 7단계의 `LEFT JOIN` 뒤에서는 이 차이가 오답을 만들어요.\n3. **이름의 대소문자가 다르면(`lucy`, `Lucy`)?** MySQL 기본 콜레이션은 대소문자를 구별하지 않아서 한 묶음이 되고, SQLite는 두 묶음이 돼요. 실무에서는 `LOWER(NAME)`으로 묶을지 정책을 정해야 해요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 5분 안에 통과하면 졸업. 비슷한 문제: 프로그래머스 59040 「고양이와 개는 몇 마리 있을까」, 131116 「식품분류별 가장 비싼 식품의 정보 조회하기」(20장 끝까지 따라가기 ①).\n", "starter": "-- 프로그래머스 59041 동명 동물 수 찾기 — 여기에 쿼리를 쓰세요.  채점: python algo/judge.py 20/pg59041\n-- SQLite에서 돌아요. 쿼리는 한 문장만 쓰세요.\n\n"}, {"id": "20/pg59042", "chapter": "20", "slug": "pg59042", "title": "프로그래머스 59042 없어진 기록 찾기", "kind": "sql", "ext": ".sql", "tier": "Lv. 3", "role": "핵심", "target": "25분", "url": "https://school.programmers.co.kr/learn/courses/30/lessons/59042", "time_limit": 2.0, "ref_time": null, "problem": "# 프로그래머스 59042 없어진 기록 찾기\n\n- 원문: https://school.programmers.co.kr/learn/courses/30/lessons/59042\n- 난이도: Lv. 3 · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 20. 코딩 테스트를 위한 SQL\n\n## 문제 (요약)\n보호소의 입소 기록 `ANIMAL_INS`와 입양 기록 `ANIMAL_OUTS`가 있어요. 실수로 일부 동물의 입소 기록이 지워졌어요. **입양 기록은 있는데 입소 기록이 없는** 동물의 ID와 이름을 ID순으로 구하세요.\n\n## 테이블\n`ANIMAL_INS`: ANIMAL_ID, ANIMAL_TYPE, DATETIME, INTAKE_CONDITION, NAME(**NULL 가능**), SEX_UPON_INTAKE\n`ANIMAL_OUTS`: ANIMAL_ID, ANIMAL_TYPE, DATETIME, NAME(**NULL 가능**), SEX_UPON_OUTCOME\n두 테이블의 `ANIMAL_ID`는 같은 동물을 가리켜요. `ANIMAL_ID`는 NULL이 될 수 없어요.\n\n## 출력\n컬럼 두 개: `ANIMAL_ID`, `NAME` (ID순). 채점기는 값과 행 순서만 비교해요.\n\n> 프로그래머스는 MySQL이지만 이 채점기는 SQLite로 돌려요. 이 문제는 두 곳에서 같은 쿼리가 그대로 통해요.\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.sql`에 쿼리를 써요. 타이머를 켜세요.\n2. `python algo/judge.py 20/pg59042` → 손으로 만든 데이터 → 랜덤 데이터 30세트 순서로, 참고 쿼리와 결과를 비교해요. 틀리면 반례 데이터가 `반례.txt`에 저장돼요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 프로그래머스에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 어느 테이블이 기준인가<\/summary>\n\n답이 될 수 있는 동물은 전부 `ANIMAL_OUTS`에 있어요. 그중에서 `ANIMAL_INS`에 **짝이 없는** 것을 골라야 해요. 그런데 `INNER JOIN`은 짝이 있는 행만 남겨요. 짝이 없는 행을 **지우지 않고 남겨 두는** 조인이 필요해요.\n<\/details>\n\n<details><summary>힌트 2: 짝이 없다는 표시<\/summary>\n\n`ANIMAL_OUTS`를 **왼쪽**에 두고 `LEFT JOIN ANIMAL_INS`하면, 짝이 없는 입양 기록은 오른쪽 컬럼이 전부 `NULL`인 채로 남아요. 그 행만 `WHERE`로 고르면 돼요. 20장 5단계의 \"안티 조인\"이에요.\n<\/details>\n\n<details><summary>힌트 3: 자주 틀리는 곳<\/summary>\n\n- `IS NULL`은 오른쪽 테이블의 **NULL이 될 수 없는 컬럼**(`I.ANIMAL_ID`)으로 검사해요. `I.NAME`으로 검사하면 \"짝은 있는데 이름이 NULL\"인 동물이 섞여요.\n- 왼쪽·오른쪽이 바뀌면 \"입소는 있는데 입양이 없는\" 정반대 문제를 풀게 돼요.\n- `ORDER BY O.ANIMAL_ID`를 빼지 마세요. 조인 결과의 순서는 보장되지 않아요.\n- `NOT IN (서브쿼리)`도 되지만, 서브쿼리에 NULL이 하나라도 섞이면 결과가 0행이 돼요(20장 3단계).\n<\/details>\n", "walk": "# 풀이 walkthrough: 프로그래머스 59042 없어진 기록 찾기\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"OUTS에는 있고 INS에는 없는 동물. ID와 이름, ID순.\" 확인할 것은 이거예요.\n- 결과 한 줄 = 입양 기록 하나 → `ANIMAL_OUTS`가 기준(왼쪽)\n- 출력하는 `NAME`은 어느 테이블 것? → INS에는 짝이 없으니 **OUTS의 이름**밖에 없어요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\nINS: A300100, A300200, A300300 / OUTS: A300100, A300250, A300200, A300050 → OUTS에만 있는 건 A300050(Bori), A300250(Luna). A300300은 INS에만 있으니 상관없어요.\n경계: 짝은 있는데 INS 쪽 이름이 NULL(함정), 없어진 기록의 이름이 NULL(그래도 출력), 없어진 기록이 하나도 없음(빈 결과), INS가 통째로 비어 있음.\n\n## 3. 가장 단순한 시도와 그 문제 (2분)\n```sql\nSELECT O.ANIMAL_ID, O.NAME\nFROM ANIMAL_OUTS O JOIN ANIMAL_INS I ON O.ANIMAL_ID = I.ANIMAL_ID;\n```\n`INNER JOIN`은 **짝이 있는 행만** 남겨요. 우리가 찾는 건 짝이 없는 행이라, 원하는 행이 조인 단계에서 이미 사라져요. 여기에 `WHERE I.ANIMAL_ID IS NULL`을 붙여도 항상 빈 결과예요.\n\n## 4. \"없는 것\"을 남기는 방법 (핵심)\n`LEFT JOIN`은 왼쪽 행을 **전부** 남기고, 짝이 없으면 오른쪽 컬럼을 `NULL`로 채워요. 그러면 \"짝이 없다\"가 `I.ANIMAL_ID IS NULL`이라는 **눈에 보이는 표시**가 돼요.\n어느 컬럼으로 검사할지도 중요해요. `I.ANIMAL_ID`는 원래 NULL이 될 수 없으니, 이게 NULL이면 **반드시** 짝이 없어서예요. `I.NAME`은 원래부터 NULL일 수 있어서 두 경우를 구별 못 해요.\n\n트리거 단어: \"A에는 있고 B에는 없는\" → `A LEFT JOIN B ... WHERE B.key IS NULL` (20장 5단계 안티 조인, 「이름 붙이기」 7번째 줄).\n\n## 5. 쿼리\n```sql\nSELECT O.ANIMAL_ID, O.NAME\nFROM ANIMAL_OUTS O\nLEFT JOIN ANIMAL_INS I ON O.ANIMAL_ID = I.ANIMAL_ID\nWHERE I.ANIMAL_ID IS NULL\nORDER BY O.ANIMAL_ID;\n```\nMySQL과 SQLite에서 똑같이 돌아요.\n\n## 왜 이 코드가 정답인가\n- **맞는 행만 남는 이유**: `LEFT JOIN`은 `ANIMAL_OUTS`의 행을 하나도 버리지 않고, INS에 짝이 없을 때만 `I.ANIMAL_ID`를 NULL로 채워요. `ANIMAL_ID`는 원래 NULL이 될 수 없으니 `I.ANIMAL_ID IS NULL`은 \"짝 없음\"과 정확히 같은 말이에요.\n- **빠뜨리지 않는 이유**: 짝이 없는 OUTS 행은 전부 NULL 표시를 받아 `WHERE`를 통과해요. 이름이 NULL인 기록도 `O.NAME`을 그대로 내니 빠지지 않아요.\n- **겹치지 않는 이유**: 짝이 있는 행은 `I.ANIMAL_ID`가 값이라 걸러져요. INS 쪽 `ANIMAL_ID`가 동물마다 하나라 OUTS 행이 불어나지도 않아요.\n- **깨지는 가정**: `I.NAME IS NULL`로 검사하면 짝은 있는데 INS 이름이 NULL인 동물이 섞여 들어와요. `INNER JOIN`으로 바꾸면 찾는 행이 조인 단계에서 사라져 항상 빈 결과예요.\n\n## 6. 예제로 추적 (확인)\n손 케이스 01에서 `LEFT JOIN`까지만 실행한 중간 결과예요(채점기 데이터로 직접 돌렸어요).\n| O.ANIMAL_ID | O.NAME | I.ANIMAL_ID | I.NAME | `WHERE I.ANIMAL_ID IS NULL` |\n|---|---|---|---|---|\n| A300050 | Bori | NULL | NULL | 남음 |\n| A300100 | Max | A300100 | Max | 탈락 |\n| A300200 | Coco | A300200 | Coco | 탈락 |\n| A300250 | Luna | NULL | NULL | 남음 |\n결과: `A300050 Bori`, `A300250 Luna` ✓\n\n손 케이스 02에서는 A400100이 INS에 **이름 NULL로** 있어요. `WHERE I.NAME IS NULL`로 쓰면 이 행이 남아서 답에 섞여요.\n\n## 7. 복잡도\n엔진은 OUTS의 행마다 INS에서 같은 ID를 찾아요. `ANIMAL_ID`에 인덱스(보통 기본 키)가 있으면 행마다 O(log N)이라 전체 O(M log N), 없으면 해시 조인으로 O(N + M)이에요. 인덱스도 해시도 없으면 O(N × M)이에요. 30장의 `x in list`와 같은 이야기예요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `WHERE I.NAME IS NULL` | 이름 없는 동물(짝은 있음)이 섞임 | 손 케이스 02 |\n| INS를 왼쪽에 둠 | 아직 보호 중인 동물이 나옴 | 손 케이스 01 |\n| `INNER JOIN` + `IS NULL` | 항상 빈 결과 | 손 케이스 01 |\n| `ORDER BY` 없음 | 조인 순서대로 나옴 | 손 케이스 01 |\n| `ORDER BY O.DATETIME` | ID순이 아님 | 손 케이스 05 |\n\n`WHERE ANIMAL_ID NOT IN (SELECT ANIMAL_ID FROM ANIMAL_INS)`와 `NOT EXISTS`도 이 문제에서는 맞아요. `ANIMAL_ID`가 NULL이 될 수 없어서 `NOT IN`의 함정이 안 생기거든요.\n\n## 9. 면접에서 30초로 설명하기\n\"입양 기록이 기준이라 `ANIMAL_OUTS`를 왼쪽에 두고 `LEFT JOIN`합니다. 짝이 없는 행은 오른쪽 컬럼이 NULL로 채워지니, 원래 NULL이 될 수 없는 `I.ANIMAL_ID`가 NULL인 행만 고르면 '입소 기록이 없는 입양'이 됩니다. 이름 같은 NULL 가능 컬럼으로 검사하면 짝은 있는데 이름이 없는 행이 섞여서 키로 검사합니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **`NOT IN`, `NOT EXISTS`, `LEFT JOIN ... IS NULL` 중 무엇을 쓰나요?** 결과가 같다면 `NOT EXISTS`나 `LEFT JOIN`이에요. `NOT IN`은 서브쿼리에 NULL이 하나라도 있으면 전체가 0행이 돼요. 성능은 최신 옵티마이저가 셋을 비슷한 안티 조인 계획으로 바꾸는 경우가 많아서, `EXPLAIN`으로 확인해요.\n2. **반대로 \"입소는 했는데 아직 입양 안 된 동물\"은?** 왼쪽·오른쪽만 바꿔요. 다음 문제(59044)가 그거예요.\n3. **실무에서 이런 \"고아 기록\"을 막으려면?** `ANIMAL_OUTS.ANIMAL_ID`에 `ANIMAL_INS`를 가리키는 외래 키를 걸면 DB가 짝 없는 입양 기록을 거절해요. 대신 쓰기마다 확인 비용이 들어서, 대규모 서비스는 외래 키 없이 애플리케이션에서 검사하기도 해요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 5분 안에 통과하면 졸업. 비슷한 문제: 프로그래머스 59043 「있었는데요 없었습니다」(같은 두 테이블, 날짜 비교), 59044 「오랜 기간 보호한 동물(1)」.\n", "starter": "-- 프로그래머스 59042 없어진 기록 찾기 — 여기에 쿼리를 쓰세요.  채점: python algo/judge.py 20/pg59042\n-- SQLite에서 돌아요. 쿼리는 한 문장만 쓰세요.\n\n"}, {"id": "20/pg59044", "chapter": "20", "slug": "pg59044", "title": "프로그래머스 59044 오랜 기간 보호한 동물(1)", "kind": "sql", "ext": ".sql", "tier": "Lv. 3", "role": "핵심", "target": "25분", "url": "https://school.programmers.co.kr/learn/courses/30/lessons/59044", "time_limit": 2.0, "ref_time": null, "problem": "# 프로그래머스 59044 오랜 기간 보호한 동물(1)\n\n- 원문: https://school.programmers.co.kr/learn/courses/30/lessons/59044\n- 난이도: Lv. 3 · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 20. 코딩 테스트를 위한 SQL\n\n## 문제 (요약)\n입소 기록 `ANIMAL_INS`와 입양 기록 `ANIMAL_OUTS`가 있어요. **아직 입양되지 않은** 동물 가운데 보호소에 가장 오래 있었던 3마리의 이름과 입소 일시를 구하세요. 보호 기간이 긴 순서로 출력해요.\n\n## 테이블\n`ANIMAL_INS`: ANIMAL_ID, ANIMAL_TYPE, DATETIME(입소 일시), INTAKE_CONDITION, NAME(**NULL 가능**), SEX_UPON_INTAKE\n`ANIMAL_OUTS`: ANIMAL_ID, ANIMAL_TYPE, DATETIME(입양 일시), NAME(**NULL 가능**), SEX_UPON_OUTCOME\n입양 기록이 있는 동물은 모두 입소 기록도 있다고 가정해요. 입소 일시는 동물마다 서로 달라요.\n\n## 출력\n컬럼 두 개: `NAME`, `DATETIME` (보호 기간이 긴 순, 최대 3행). 이름이 NULL이면 NULL 그대로 출력해요. 채점기는 값과 행 순서만 비교해요.\n\n> 프로그래머스는 MySQL이지만 이 채점기는 SQLite로 돌려요. 이 문제는 두 곳에서 같은 쿼리가 그대로 통해요.\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.sql`에 쿼리를 써요. 타이머를 켜세요.\n2. `python algo/judge.py 20/pg59044` → 손으로 만든 데이터 → 랜덤 데이터 30세트 순서로, 참고 쿼리와 결과를 비교해요. 틀리면 반례 데이터가 `반례.txt`에 저장돼요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 프로그래머스에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 문제를 두 조각으로<\/summary>\n\n조각 ①: \"아직 입양되지 않은 동물\" = 입소 기록은 있는데 입양 기록이 **없는** 동물. 바로 앞 문제(59042)와 방향만 반대예요.\n조각 ②: \"가장 오래 보호한 3마리\" = 어떤 기준으로 정렬해서 앞의 3개. 그런데 보호 기간 컬럼은 테이블에 없어요. 어떤 컬럼의 순서와 같을까요?\n<\/details>\n\n<details><summary>힌트 2: 보호 기간을 정렬 기준으로 번역하기<\/summary>\n\n아직 안 나갔으니 보호 기간 = 오늘 − 입소 일시예요. 오늘은 모두에게 같으니, 보호 기간이 길수록 **입소 일시가 이르다**예요. 그래서 `ORDER BY I.DATETIME` (오름차순) + `LIMIT 3`이에요. 조각 ①은 `ANIMAL_INS LEFT JOIN ANIMAL_OUTS ... WHERE O.ANIMAL_ID IS NULL`(20장 5단계 안티 조인).\n<\/details>\n\n<details><summary>힌트 3: 자주 틀리는 곳<\/summary>\n\n- \"오래 = 큰 값\"이라고 생각해서 `DESC`를 붙이기 쉬워요. 입소 일시는 **작을수록** 오래예요.\n- 정렬은 `I.DATETIME`(입소)이에요. `O.DATETIME`은 이 행들에서 전부 NULL이에요.\n- 날짜만 잘라서(`DATE(...)`) 정렬하면 같은 날 들어온 동물의 순서가 틀어져요.\n- 보호 중인 동물이 3마리보다 적어도 `LIMIT 3`은 있는 만큼만 내요. 따로 처리할 필요 없어요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 프로그래머스 59044 오랜 기간 보호한 동물(1)\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"INS에는 있고 OUTS에는 없는 동물 중, 입소가 가장 이른 3마리의 이름과 입소 일시.\" 확인할 것은 이거예요.\n- 결과 한 줄 = 보호 중인 동물 한 마리 → `ANIMAL_INS`가 기준(왼쪽)\n- \"보호 기간\"은 테이블에 없어요 → 있는 컬럼으로 **번역**해야 해요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n손 케이스 01: 입소 순서는 Max(2013-11) → Coco(2013-12) → Shadow → Nabi → Bori → Lucy. Max와 Coco는 입양됐으니 빼면 Shadow, Nabi, Bori가 답이에요. **가장 먼저 들어온 동물이 이미 입양된 경우**가 이 문제의 핵심 경계예요. 안티 조인을 빼먹으면 Max, Coco가 나와요.\n경계: 보호 중인 동물이 3마리 미만, 같은 날 다른 시각, 모두 입양됨(빈 결과), 입양이 하나도 없음, 이름이 NULL.\n\n## 3. 가장 단순한 시도와 그 문제 (2분)\n```sql\nSELECT NAME, DATETIME FROM ANIMAL_INS ORDER BY DATETIME LIMIT 3;\n```\n정렬과 자르기는 맞지만 **이미 입양된 동물을 빼지 않았어요.** 손 케이스 01에서 Max, Coco, Shadow가 나와요.\n\n## 4. 두 패턴을 쌓기 (핵심)\n1. 보호 중인 동물 고르기 → `ANIMAL_INS I LEFT JOIN ANIMAL_OUTS O ON ... WHERE O.ANIMAL_ID IS NULL` (59042의 반대 방향)\n2. \"보호 기간이 길다\"를 번역 → 보호 기간 = 오늘 − 입소 일시. 오늘은 모두 같으니 **입소 일시가 이를수록** 길어요 → `ORDER BY I.DATETIME` 오름차순\n3. \"3마리\" → `LIMIT 3`\n\n20장 1단계의 실행 순서로 보면 `FROM/JOIN → WHERE → ORDER BY → LIMIT`이라, 거른 다음에 정렬하고 마지막에 잘라요. 그래서 \"보호 중인 동물 중 앞 3마리\"가 돼요.\n\n트리거 단어: \"A에는 있고 B에는 없는\" → 안티 조인, \"가장 ~한 n개\" → `ORDER BY` + `LIMIT n` (20장 「이름 붙이기」 2·7번째 줄).\n\n## 5. 쿼리\n```sql\nSELECT I.NAME, I.DATETIME\nFROM ANIMAL_INS I\nLEFT JOIN ANIMAL_OUTS O ON I.ANIMAL_ID = O.ANIMAL_ID\nWHERE O.ANIMAL_ID IS NULL\nORDER BY I.DATETIME\nLIMIT 3;\n```\nMySQL과 SQLite에서 똑같이 돌아요. 오라클이라면 `LIMIT 3` 대신 `FETCH FIRST 3 ROWS ONLY`예요(20장 8단계).\n\n## 왜 이 코드가 정답인가\n- **맞는 행만 남는 이유**: `LEFT JOIN` 뒤 `O.ANIMAL_ID IS NULL`은 입양 기록이 없는 동물, 즉 아직 보호 중인 동물만 남겨요. `ANIMAL_ID`가 NULL이 될 수 없어서 이 표시는 \"짝 없음\"과 같아요.\n- **빠뜨리지 않는 이유**: 실행 순서가 `WHERE → ORDER BY → LIMIT`이라, 입양된 동물을 먼저 다 지우고 남은 동물 중에서 입소가 이른 순으로 3마리를 잘라요. 보호 기간 = 오늘 − 입소 일시라서 `ORDER BY I.DATETIME` 오름차순이 곧 기간이 긴 순이에요.\n- **동점 문제가 없는 이유**: 문제가 입소 일시는 동물마다 다르다고 했으니 `LIMIT 3`이 자르는 경계가 하나로 정해져요.\n- **깨지는 가정**: 입소 일시가 같은 동물이 있으면 `LIMIT 3`이 그중 아무거나 골라 답이 흔들려요. 보호 중인 동물이 3마리 미만이면 있는 만큼만 나오는데, 문제도 \"최대 3행\"이라 맞아요.\n\n## 6. 예제로 추적 (확인)\n손 케이스 01의 `LEFT JOIN` 결과를 입소 일시순으로 놓은 거예요(채점기 데이터로 직접 돌렸어요).\n| I.ANIMAL_ID | I.NAME | I.DATETIME | O.ANIMAL_ID | WHERE | LIMIT 3 |\n|---|---|---|---|---|---|\n| A100010 | Max | 2013-11-03 10:15 | A100010 | 탈락 | |\n| A100060 | Coco | 2013-12-01 08:00 | A100060 | 탈락 | |\n| A100020 | Shadow | 2014-01-26 13:48 | NULL | 남음 | 1 |\n| A100040 | Nabi | 2014-07-29 11:43 | NULL | 남음 | 2 |\n| A100050 | Bori | 2015-03-02 09:30 | NULL | 남음 | 3 |\n| A100030 | Lucy | 2016-08-25 14:08 | NULL | 남음 | 잘림 |\n결과: Shadow, Nabi, Bori ✓\n\n## 7. 복잡도\n조인은 59042와 같고(인덱스가 있으면 O(N log M)), 그다음 남은 K행 정렬이 O(K log K)예요. 엔진은 `ORDER BY ... LIMIT 3`을 보면 전체를 정렬하지 않고 **크기 3짜리 힙**으로 위의 3개만 유지하기도 해요. 30장 6단계 도구 4 `heapq`의 \"상위 k개\" 쓰임과 같아요(O(K log 3)).\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 안티 조인 없이 정렬만 | 입양된 동물이 나옴 | 손 케이스 01 |\n| `ORDER BY I.DATETIME DESC` | 가장 최근 입소 3마리가 나옴 | 손 케이스 01 |\n| `LIMIT 3`을 빠뜨림 | 보호 중인 동물이 전부 나옴 | 손 케이스 01 |\n| `ORDER BY O.DATETIME` | 전부 NULL이라 순서가 엉망 | 손 케이스 01 |\n| `ORDER BY DATE(I.DATETIME)` | 같은 날 들어온 동물 순서가 틀어짐 | 손 케이스 03 |\n| `O.ANIMAL_ID IS NULL`을 `ON`에 씀 | 걸러지지 않아서 입양된 동물이 남음 | 손 케이스 01 |\n\n## 9. 면접에서 30초로 설명하기\n\"아직 입양 안 된 동물이니 `ANIMAL_INS`를 왼쪽에 두고 `ANIMAL_OUTS`를 `LEFT JOIN`해서 `O.ANIMAL_ID IS NULL`인 행만 남깁니다. 보호 기간은 오늘 빼기 입소 일시라 입소 일시가 이를수록 길어서, 입소 일시 오름차순으로 정렬하고 `LIMIT 3`으로 자릅니다. 실행 순서상 거르기 → 정렬 → 자르기라 보호 중인 동물 중 상위 3마리가 됩니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **입소 일시가 같은 동물이 있으면?** 3등 자리에 동점이 있으면 `LIMIT 3`은 그중 아무거나 하나를 골라서 결과가 실행마다 달라질 수 있어요. 두 번째 정렬 기준(`ORDER BY I.DATETIME, I.ANIMAL_ID`)을 붙이거나, 동점을 모두 보여 줘야 하면 `RANK() OVER (ORDER BY I.DATETIME) <= 3`을 바깥에서 걸러요(20장 6단계).\n2. **입양된 동물 중 보호 기간이 가장 길었던 2마리는?** 59045 「오랜 기간 보호한 동물(2)」예요. 이번엔 `INNER JOIN`하고 `O.DATETIME - I.DATETIME`(MySQL은 `DATEDIFF`) 내림차순이에요. 기간을 계산할 수 있으니 직접 정렬해요.\n3. **보호 중인 동물이 1억 마리라면?** `ANIMAL_OUTS.ANIMAL_ID`에 인덱스가 있어야 안티 조인이 행마다 O(log M)이에요. 그리고 `ANIMAL_INS.DATETIME` 인덱스가 있으면 엔진이 입소 순으로 읽다가 보호 중인 3마리를 찾자마자 멈출 수 있어요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 5분 안에 통과하면 졸업. 비슷한 문제: 프로그래머스 59045 「오랜 기간 보호한 동물(2)」, 59043 「있었는데요 없었습니다」.\n", "starter": "-- 프로그래머스 59044 오랜 기간 보호한 동물(1) — 여기에 쿼리를 쓰세요.  채점: python algo/judge.py 20/pg59044\n-- SQLite에서 돌아요. 쿼리는 한 문장만 쓰세요.\n\n"}, {"id": "20/pg59413", "chapter": "20", "slug": "pg59413", "title": "프로그래머스 59413 입양 시각 구하기(2)", "kind": "sql", "ext": ".sql", "tier": "Lv. 4", "role": "도전", "target": "45분", "url": "https://school.programmers.co.kr/learn/courses/30/lessons/59413", "time_limit": 2.0, "ref_time": null, "problem": "# 프로그래머스 59413 입양 시각 구하기(2)\n\n- 원문: https://school.programmers.co.kr/learn/courses/30/lessons/59413\n- 난이도: Lv. 4 · 역할: 도전 · 목표 시간: 45분\n- 짝이 되는 장: 20. 코딩 테스트를 위한 SQL\n\n## 문제 (요약)\n입양 기록 `ANIMAL_OUTS`가 있어요. **0시부터 23시까지 각 시간대**에 입양이 몇 건 있었는지 구하세요. 입양이 한 건도 없는 시간대도 0으로 빠짐없이 나와야 해요. 시간대순으로 정렬해요.\n\n## 테이블\n`ANIMAL_OUTS`: ANIMAL_ID, ANIMAL_TYPE, DATETIME(입양 일시, `'YYYY-MM-DD HH:MM:SS'`), NAME(NULL 가능), SEX_UPON_OUTCOME\n\n## 출력\n컬럼 두 개: `HOUR`(0~23의 정수), `COUNT` (시간대순, 항상 24행). 채점기는 값과 행 순서만 비교해요.\n\n> 프로그래머스는 MySQL이지만 이 채점기는 SQLite로 돌려요. SQLite에는 `HOUR()`가 없어요. `CAST(strftime('%H', DATETIME) AS INTEGER)`를 쓰세요. `WITH RECURSIVE`는 두 곳 모두에서 돼요(MySQL 8.0 이상).\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.sql`에 쿼리를 써요. 타이머를 켜세요.\n2. `python algo/judge.py 20/pg59413` → 손으로 만든 데이터 → 랜덤 데이터 30세트 순서로, 참고 쿼리와 결과를 비교해요. 틀리면 반례 데이터가 `반례.txt`에 저장돼요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 프로그래머스에도 MySQL로 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: GROUP BY가 못 하는 것<\/summary>\n\n시각별로 묶어서 세는 쿼리는 쉽게 쓸 수 있어요. 그런데 결과가 24행이 안 나와요. `GROUP BY`는 **데이터에 있는 값으로만** 묶음을 만들어요. 입양이 없는 3시는 데이터에 없으니 묶음도 없어요. 결과에 나와야 할 24개의 시간대를 **어딘가에서 먼저** 만들어야 해요.\n<\/details>\n\n<details><summary>힌트 2: 숫자를 만들어서 왼쪽에 두기<\/summary>\n\n0부터 23까지 24행짜리 표를 만들고, 그 표를 **왼쪽**에 두고 입양 기록을 `LEFT JOIN`해요. 왼쪽 행은 전부 남으니 24행이 보장돼요. 24행은 `WITH RECURSIVE`로 만들어요: 시작 `SELECT 0`, 규칙 `SELECT H + 1 ... WHERE H < 23`. 20장 7단계예요.\n<\/details>\n\n<details><summary>힌트 3: 자주 틀리는 곳<\/summary>\n\n- `LEFT JOIN` 뒤에 `COUNT(*)`를 쓰면 빈 시간대가 **1**로 나와요. 짝이 없어도 NULL로 채운 행이 하나 있거든요. `COUNT(o.ANIMAL_ID)`처럼 오른쪽 컬럼을 세요(20장 7단계 「🎬의 범인」).\n- 멈추는 조건은 `H < 23`이에요. `H <= 23`이면 24까지 25행이 돼요.\n- SQLite의 `strftime('%H', …)`는 `'07'` 같은 **글자**예요. 숫자 H와 그대로 비교하면 한 번도 같지 않아요. `CAST(... AS INTEGER)`로 바꾸세요.\n- 오른쪽 테이블 조건을 `WHERE`에 쓰면 빈 시간대가 다시 지워져요. 조인 조건은 `ON`에 써요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 프로그래머스 59413 입양 시각 구하기(2)\n\n도전 문제라서 중간 풀이(거의 맞지만 부족한 것)를 먼저 보고, 그게 왜 안 되는지에서 출발해요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"0~23시 24개 시간대마다 입양 건수. 0건인 시간대도 0으로.\" 확인할 것은 이거예요.\n- 결과는 **항상 24행**이에요. 데이터가 비어 있어도요.\n- 날짜는 상관없고 **시**만 봐요. 2013년 9시와 2019년 9시는 같은 묶음이에요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n손 케이스 01: 10시 2건, 13시 1건, 18시 3건 → 결과 24행 중 이 세 줄만 0이 아니에요.\n경계: 입양 기록이 하나도 없음(24행 모두 0), 0시와 23시(양 끝), 한 자리 시각(07시), 모든 입양이 한 시간대에 몰림.\n\n## 3. 중간 풀이: 「입양 시각 구하기(1)」의 쿼리 (아직 부족)\n```sql\n-- MySQL\nSELECT HOUR(DATETIME) AS HOUR, COUNT(*) AS COUNT\nFROM ANIMAL_OUTS\nGROUP BY HOUR\nORDER BY HOUR;\n```\n손 케이스 01에서 결과는 `10 2`, `13 1`, `18 3` **세 줄**이에요. 숫자는 맞는데 21줄이 없어요. `GROUP BY`는 데이터에 있는 값으로만 묶음을 만들기 때문이에요. 0건인 시간대는 \"0인 묶음\"이 아니라 **묶음 자체가 없어요.** 쿼리를 아무리 고쳐도 `ANIMAL_OUTS`에서 출발하는 한 없는 행은 생기지 않아요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n생각을 뒤집어요. \"입양 기록을 세서 시간대를 만든다\"가 아니라 **\"시간대 24개를 먼저 만들고, 거기에 입양 기록을 붙인다\"**예요.\n1. 0~23 숫자 24행 만들기 → `WITH RECURSIVE` (시작값 0 + \"23 미만이면 +1\" 규칙)\n2. 24행을 전부 남기면서 붙이기 → 숫자 표를 **왼쪽**에 둔 `LEFT JOIN`\n3. 빈 시간대가 0이 되게 세기 → `COUNT(오른쪽 컬럼)`. `COUNT(*)`는 NULL로 채운 행도 1로 세요.\n\n트리거 단어: \"0건인 구간도 포함해서 전부\", \"빠짐없이\" → `WITH RECURSIVE` + `LEFT JOIN` + `COUNT(오른쪽컬럼)` (20장 7단계, 「이름 붙이기」 9번째 줄).\n\n## 5. 쿼리\nSQLite(채점기):\n```sql\nWITH RECURSIVE hours AS (\n    SELECT 0 AS H\n    UNION ALL\n    SELECT H + 1 FROM hours WHERE H < 23\n)\nSELECT h.H AS HOUR, COUNT(o.ANIMAL_ID) AS COUNT\nFROM hours h\nLEFT JOIN ANIMAL_OUTS o\n       ON CAST(strftime('%H', o.DATETIME) AS INTEGER) = h.H\nGROUP BY h.H\nORDER BY h.H;\n```\nMySQL(프로그래머스): 조인 조건만 `ON HOUR(o.DATETIME) = h.H`로 바꾸면 돼요.\n\nMySQL에서 자주 보이는 다른 풀이도 있어요. 세션 변수로 0~23을 돌며 시간대마다 서브쿼리로 세는 방식이에요.\n```sql\nSET @HOUR = -1;\nSELECT (@HOUR := @HOUR + 1) AS HOUR,\n       (SELECT COUNT(*) FROM ANIMAL_OUTS WHERE HOUR(DATETIME) = @HOUR) AS COUNT\nFROM ANIMAL_OUTS\nWHERE @HOUR < 23;\n```\n돌아가긴 하지만 `ANIMAL_OUTS`가 24행 이상이라는 가정에 기대고, MySQL 8.0부터 `SELECT` 안에서 변수에 값을 넣는 문법은 없어질 예정이라고 경고가 나와요. 표준인 재귀 CTE를 익혀 두세요.\n\n## 왜 이 코드가 정답인가\n- **24행이 보장되는 이유**: `hours`는 0에서 시작해 `H < 23`인 동안만 `H + 1`을 더해서 정확히 0~23의 24행이에요. 이 표가 `LEFT JOIN`의 왼쪽이라 짝이 없어도 행이 남아요.\n- **빠뜨리지 않는 이유**: 입양 기록마다 `strftime('%H', ...)`의 시는 0~23 중 하나라서 정확히 한 시간대 행에 붙어요. 날짜는 보지 않으니 다른 해의 같은 시도 같은 묶음이에요.\n- **0이 나오는 이유**: 짝이 없는 시간대는 `o.ANIMAL_ID`가 NULL 한 줄이고, `COUNT(o.ANIMAL_ID)`는 NULL을 세지 않아 0이에요.\n- **끝나는 이유**: 재귀는 `WHERE H < 23`이 거짓이 되는 순간 새 행을 만들지 않아요.\n- **깨지는 가정**: `COUNT(*)`로 바꾸면 빈 시간대가 1이 돼요. `CAST(... AS INTEGER)`를 빼면 글자 `'09'`, `'13'`을 정수 `9`, `13`과 비교하게 돼 짝이 하나도 안 맞고, SQLite에서는 24행이 모두 0이 돼요.\n\n## 6. 예제로 추적 (확인)\n손 케이스 01에서 `LEFT JOIN` 직후의 일부와, 묶은 뒤 두 가지 `COUNT`예요(채점기 데이터로 직접 돌렸어요).\n| h.H | 붙은 o.ANIMAL_ID | `COUNT(o.ANIMAL_ID)` | `COUNT(*)` |\n|---|---|---|---|\n| 9 | NULL | 0 | **1** |\n| 10 | A100001, A100002 | 2 | 2 |\n| 11 | NULL | 0 | **1** |\n| 12 | NULL | 0 | **1** |\n| 13 | A100003 | 1 | 1 |\n| 14 | NULL | 0 | **1** |\n| 18 | A100004, A100005, A100006 | 3 | 3 |\n나머지 시간대도 전부 `NULL` 한 행이라 `COUNT(o.ANIMAL_ID)`는 0, `COUNT(*)`는 1이에요. 정답은 왼쪽 열이에요 ✓\n\n## 7. 복잡도\n숫자 표가 24행, 입양 기록이 N행이면 조인은 해시로 O(N + 24)예요. 조인 조건이 컬럼을 함수로 감싸서(`HOUR(o.DATETIME)`) 인덱스는 못 써요. 코딩 테스트 규모에서는 상관없고, 실무에서 시간대별 집계가 잦으면 `HOUR` 값을 미리 계산한 컬럼이나 집계 테이블을 둬요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 중간 풀이처럼 `ANIMAL_OUTS`만 `GROUP BY` | 입양이 있는 시간대만 나옴 | 손 케이스 01 |\n| `COUNT(*)` | 빈 시간대가 1 | 손 케이스 01 |\n| `WHERE H <= 23` | 24시까지 25행 | 손 케이스 01 |\n| `strftime('%H', …) = h.H` (CAST 없음, SQLite) | 글자와 숫자가 같지 않아 전부 0 | 손 케이스 01 |\n| `ANIMAL_OUTS`를 왼쪽에 둠 | 빈 시간대가 안 생김 | 손 케이스 01 |\n| 오른쪽 테이블 조건을 `WHERE`에 씀 | 빈 시간대가 다시 지워짐 | 손 케이스 01 |\n\n## 9. 면접에서 30초로 설명하기\n\"`GROUP BY`는 데이터에 있는 값으로만 묶음을 만들어서, 입양이 없는 시간대는 결과에 아예 안 나옵니다. 그래서 재귀 CTE로 0부터 23까지 24행을 먼저 만들고, 그걸 왼쪽에 두고 입양 기록을 `LEFT JOIN`합니다. 짝이 없는 시간대도 NULL로 채운 행이 하나 남기 때문에 `COUNT(*)`가 아니라 `COUNT(o.ANIMAL_ID)`로 세야 0이 나옵니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **재귀 CTE가 없는 DB(MySQL 5.7)라면?** 0~23을 직접 `SELECT 0 UNION ALL SELECT 1 ... UNION ALL SELECT 23`으로 적거나, 숫자 테이블을 미리 만들어 둬요. 위의 세션 변수 방식도 이 시절의 우회로예요.\n2. **\"이번 달 모든 날짜별 주문 수\"라면?** 같은 모양이에요. 재귀 CTE로 1일부터 말일까지 날짜를 만들고(`SELECT DATE_ADD(d, INTERVAL 1 DAY) ... WHERE d < 말일`), 주문을 `LEFT JOIN`해요(20장 7단계 표).\n3. **멈추는 조건을 빼면 어떻게 되나요?** 무한히 늘어나요. MySQL은 `cte_max_recursion_depth`(기본 1,000)에서 오류로 멈추고, SQLite는 메모리가 허락하는 한 계속 돌아요. 재귀 CTE는 \"시작값 + 규칙 + 멈춤 조건\" 세 개가 한 세트예요.\n\n## 11. 다시 풀기\n1일 뒤, 3일 뒤, 1주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 프로그래머스 59412 「입양 시각 구하기(1)」(중간 풀이 그대로 + 9~19시 조건), LeetCode 185 「Department Top Three Salaries」(같은 난도대의 윈도우 함수 문제, 20장 6단계).\n", "starter": "-- 프로그래머스 59413 입양 시각 구하기(2) — 여기에 쿼리를 쓰세요.  채점: python algo/judge.py 20/pg59413\n-- SQLite에서 돌아요. HOUR(DATETIME) 대신 CAST(strftime('%H', DATETIME) AS INTEGER)를 쓰세요. 쿼리는 한 문장만.\n\n"}, {"id": "30/boj10816", "chapter": "30", "slug": "boj10816", "title": "백준 10816 숫자 카드 2", "kind": "stdio", "ext": ".py", "tier": "Silver IV (solved.ac)", "role": "워밍업", "target": "15분", "url": "https://solved.ac/problems/id/10816", "time_limit": 2.0, "ref_time": 0.42286375002004206, "problem": "# 백준 10816 숫자 카드 2\n\n- 원문: https://solved.ac/problems/id/10816\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Silver IV (solved.ac) · 역할: 워밍업 · 목표 시간: 15분\n- 짝이 되는 장: 30. 빅오\n\n## 문제 (요약)\n상근이가 숫자 카드 N장을 갖고 있어요. 같은 숫자가 적힌 카드가 여러 장일 수 있어요. 정수 M개가 주어지면, 각 정수가 적힌 카드를 상근이가 **몇 장** 갖고 있는지 출력하세요.\n\n## 제약\n- 1 ≤ N, M ≤ 500,000\n- 카드와 질문의 수는 -10,000,000 이상 10,000,000 이하\n- 입력: 첫 줄 `N`, 둘째 줄 카드 N개, 셋째 줄 `M`, 넷째 줄 질문 M개\n- 출력: 질문 순서대로 개수 M개를 공백으로 구분해 한 줄에\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요. 코드를 쓰기 전에 **N, M으로 목표 복잡도부터** 적어 보세요.\n2. `python algo/judge.py 30/boj10816` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 먼저 예산부터<\/summary>\n\n질문 하나마다 카드 N장을 다 훑으면 N × M = 2,500억 번이에요. 파이썬 1초 예산은 약 3,500만 번이에요(30장 1단계). 질문 하나를 **훑지 않고** 답할 방법이 필요해요. 그러려면 카드 쪽을 미리 한 번 손질해 둬야 해요.\n<\/details>\n\n<details><summary>힌트 2: 어떤 연산을 싸게 만들어야 하나<\/summary>\n\n가장 자주 하는 연산은 \"이 수가 몇 개인가\"예요. 30장 6단계 도구 상자에서 찾으면 두 가지가 있어요.\n- `Counter`(dict): 카드를 한 번 세어 두면 질문마다 평균 O(1). 전체 O(N + M).\n- 정렬 + `bisect`: `bisect_right(a, q) - bisect_left(a, q)`가 q의 개수. 전체 O((N + M) log N).\n\n1920 「수 찾기」의 `set`은 \"있나/없나\"만 알려 줘요. 이번엔 **개수**가 필요해요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- `a.count(q)`는 한 줄이지만 안에서 N번 돌아요(30장 5단계 \"숨은 O(N)\"). 결국 O(N × M)이에요.\n- 입력이 100만 개예요. `sys.stdin.buffer.read().split()`이나 `sys.stdin.readline`을 쓰세요.\n- 출력도 50만 개예요. `print`를 반복문 안에서 부르지 말고 `' '.join(...)`으로 한 번에 내보내요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 10816 숫자 카드 2\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"카드 N장, 질문 M개. 질문마다 그 수가 카드에 몇 장 있는지.\" 확인 질문은 이거예요.\n- 같은 수가 여러 장일 수 있나요? → **있음** (그래서 `set`으로는 안 돼요)\n- 음수도 있나요? → 있음, -1,000만까지. 리스트 인덱스로 바로 세려면 오프셋이 필요해요.\n- 질문이 중복될 수 있나요? → 있음. 같은 답을 두 번 내면 돼요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n카드 `4 -2 4 9 4 -2 0`, 질문 `4 -2 7 0 9` → `3 2 0 1 1`.\n경계: 카드에 없는 수(0 출력), 카드가 전부 같은 수, 범위 양 끝(-1,000만, 1,000만), N = 1.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n질문마다 카드를 처음부터 끝까지 세요. O(N × M) = 50만 × 50만 = **2,500억 번**이에요. 1초에 3,500만 번이면 약 2시간이에요. 30장 4단계 표로 보면 N = 50만은 O(N log N) 이하를 요구하는 크기예요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n브루트포스는 질문이 올 때마다 **같은 카드 더미를 다시** 훑어요. 카드는 바뀌지 않는데요. 그러니 카드를 **한 번만** 정리해서, 질문은 정리된 결과에서 바로 꺼내면 돼요.\n- 정리 방법 ①: 수마다 개수를 dict에 세어 두기(`Counter`). 만들기 O(N), 꺼내기 평균 O(1).\n- 정리 방법 ②: 정렬해 두고 `bisect`로 그 수가 차지하는 구간의 양 끝을 찾기. 만들기 O(N log N), 꺼내기 O(log N).\n\n트리거 단어: \"N, M ≤ 50만\" + \"여러 번 묻는다\" → 한 번 전처리하고 질문은 O(1)이나 O(log N)으로 (30장 6단계 도구 2·6·8).\n\n## 5. 코드\n```python\nimport sys\nfrom collections import Counter\n\ndata = sys.stdin.buffer.read().split()\nn = int(data[0])\ncnt = Counter(map(int, data[1:1 + n]))       # O(N): 수마다 개수\nm = int(data[1 + n])\nqs = map(int, data[2 + n:2 + n + m])\nsys.stdout.write(' '.join(str(cnt[q]) for q in qs) + '\\n')   # 없는 수는 0\n```\n`Counter`는 없는 키를 물으면 `KeyError` 대신 0을 줘요. 그래서 \"카드에 없는 수\" 처리가 따로 필요 없어요.\n\n## 왜 이 코드가 정답인가\n- **불변식**: `Counter`를 만든 뒤 `cnt[v]`는 카드 `data[1:1+n]` 중 값이 `v`인 장 수와 같아요. 질문을 처리하는 동안 `cnt`는 바뀌지 않아요.\n- **빠뜨리지 않는 이유**: 카드 N장을 전부 한 번씩 세었으니 어떤 수의 개수도 빠지지 않아요. 카드에 없는 수는 `Counter`가 0을 돌려줘서 따로 처리할 게 없어요.\n- **끝나는 이유**: 세기 O(N), 질문마다 평균 O(1) 조회라 전체 O(N + M)이에요.\n- **깨지는 가정**: dict 키라서 음수(-1,000만)도 오프셋 없이 돼요. 대신 개수를 리스트 인덱스로 세면 음수에서 깨지고, `set`으로 바꾸면 같은 수가 여러 장일 때 1만 나와요.\n\n## 6. 예제로 추적 (확인)\n| 넣은 카드 | cnt |\n|---|---|\n| 4 | {4: 1} |\n| -2 | {4: 1, -2: 1} |\n| 4 | {4: 2, -2: 1} |\n| 9 | {4: 2, -2: 1, 9: 1} |\n| 4 | {4: 3, -2: 1, 9: 1} |\n| -2 | {4: 3, -2: 2, 9: 1} |\n| 0 | {4: 3, -2: 2, 9: 1, 0: 1} |\n\n질문 `4 -2 7 0 9` → `cnt[4]=3`, `cnt[-2]=2`, `cnt[7]=0`, `cnt[0]=1`, `cnt[9]=1` → `3 2 0 1 1` ✓\n\n## 7. 복잡도\n시간 O(N + M) 평균, 공간 O(서로 다른 수의 개수) ≤ O(N). 채점기 큰 입력(N = M = 50만)에서 이 코드가 약 0.4초, 정렬 + `bisect` 풀이가 약 0.9초였어요. `a.count(q)` 풀이는 6초에서 강제 종료됐어요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 1920처럼 `set`으로 있나/없나만 출력 | 개수 대신 1/0이 나옴 | 손 케이스 01 |\n| `a.count(q)`를 질문마다 | 답은 맞지만 O(N × M) | 큰 입력 (시간 초과) |\n| `bisect_left`만 쓰고 개수를 안 구함 | 위치가 출력됨 | 손 케이스 01 |\n| `cnt = {}` 후 `cnt[q]`로 바로 꺼냄 | 없는 수에서 `KeyError` | 손 케이스 01 (7이 없음) |\n| 질문마다 `print` | 답은 맞지만 느려짐 (채점기에선 0.4초 → 0.54초로 통과, 줄 수가 더 많은 문제에선 위험) | 큰 입력 시간 |\n\n## 9. 면접에서 30초로 설명하기\n\"질문마다 카드를 훑으면 O(N × M)이라 2,500억 번입니다. 카드는 바뀌지 않으니 한 번만 해시맵으로 개수를 세 두고, 질문은 해시맵에서 O(1)로 꺼냅니다. 전체 O(N + M)입니다. 정렬 후 `bisect_right - bisect_left`로 개수를 구해도 O((N + M) log N)으로 통과합니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **해시와 정렬 중 무엇을 고르나요?** 이 문제만 보면 해시가 빨라요. 하지만 질문이 \"q 이하인 카드는 몇 장?\"으로 바뀌면 해시는 못 쓰고 정렬 + `bisect_right`만 돼요. 해시는 \"정확히 같은 값\"만 빠르다는 30장 6단계 도구 2의 주의점이에요.\n2. **수의 범위가 작다면?** 범위가 2,000만 칸이라 리스트 `cnt[x + 10**7]`로 세는 계수 방식도 가능해요. 해시보다 상수가 작지만 메모리를 범위만큼 써요(2,000만 칸이면 파이썬 리스트로 160MB). 범위가 작을 때만 써요.\n3. **카드가 계속 추가·삭제되면?** `Counter`는 그대로 O(1)로 갱신돼요. \"q 이하 개수\"까지 필요하면 정렬 리스트에 `insort`는 넣기가 O(N)이라 느리고, 펜윅 트리 같은 구조로 가요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 1920 「수 찾기」(30장 끝까지 따라가기 ①), 백준 14425 「문자열 집합」.\n", "starter": "# 백준 10816 숫자 카드 2 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 30/boj10816\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "30/boj1629", "chapter": "30", "slug": "boj1629", "title": "백준 1629 곱셈", "kind": "stdio", "ext": ".py", "tier": "Silver I (solved.ac)", "role": "핵심", "target": "25분", "url": "https://solved.ac/problems/id/1629", "time_limit": 0.5, "ref_time": 3.5666016628965735e-05, "problem": "# 백준 1629 곱셈\n\n- 원문: https://solved.ac/problems/id/1629\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Silver I (solved.ac) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 30. 빅오\n\n## 문제 (요약)\n자연수 A를 B번 곱한 값을 C로 나눈 나머지를 출력하세요.\n\n## 제약\n- A, B, C는 모두 2,147,483,647(= 2³¹ − 1) 이하의 자연수\n- 입력: 한 줄에 `A B C` / 출력: 나머지 하나\n- 파이썬 내장 `pow(a, b, c)`가 바로 답을 줘요. 그건 마지막에 확인용으로만 쓰고, **직접** 짜 보세요.\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요. B의 최댓값을 보고 **반복 횟수 상한**부터 정하세요.\n2. `python algo/judge.py 30/boj1629` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: B번 곱하면 몇 초?<\/summary>\n\nB가 약 21억이에요. 한 번 곱하고 나머지를 구하는 데 수십 ns라 해도 1분이 넘어요. 30장 4단계 표의 마지막 줄 \"N이 10억 이상이면 O(N)도 안 됨 → 수식이나 O(log N)\"이 이 경우예요. 곱셈 횟수를 **log B**로 줄여야 해요.\n<\/details>\n\n<details><summary>힌트 2: 반으로 쪼개기<\/summary>\n\nA^B = A^(B/2) × A^(B/2)예요. B가 홀수면 A를 한 번 더 곱해요. A^(B/2)를 **한 번만** 구해서 두 번 쓰면, B가 매번 절반이 되니 호출은 약 31번이에요(30장 3단계 \"매번 절반 → log\"). 그리고 곱할 때마다 C로 나눈 나머지만 들고 다녀도 답이 같아요: (x × y) mod C = ((x mod C) × (y mod C)) mod C.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- `power(a, b//2) * power(a, b//2)`처럼 **두 번** 부르면 호출이 B번에 가까워져요. 다시 O(B)예요.\n- 기저를 `b == 1`일 때 `return a`로 두면 A ≥ C이고 B = 1일 때 나머지를 안 구한 A가 출력돼요. `a % c`로 돌려주거나 `b == 0`에서 `1 % c`를 돌려주세요. C = 1이면 답은 항상 0이에요.\n- `a ** b % c`는 21억 제곱을 먼저 다 계산해요. 수가 수십억 자리가 돼서 끝나지 않아요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 1629 곱셈\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"A^B mod C. 세 수 모두 21억 이하.\" 확인 질문은 이거예요.\n- B = 0이 들어오나요? → 아니요, 자연수예요. 그래도 재귀 기저로 B = 0을 쓰면 편해요.\n- C = 1이면? → 어떤 수든 1로 나눈 나머지는 0이에요.\n- 중간 값이 넘치지 않나요? → 나머지끼리 곱하면 최대 (2³¹)² ≈ 4.6 × 10¹⁸. 파이썬은 큰 정수가 되니 괜찮고, C++이면 `long long`이 필요해요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`10 11 12` → 10² = 100 ≡ 4, 10⁴ ≡ 4 × 4 = 16 ≡ 4 … 결국 4.\n경계: B = 1이면서 A ≥ C (`7 1 3` → 1), C = 1 (답 0), A = B = C = 2³¹ − 1 (답 0), 모두 최대에 가까운 큰 입력.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n`r = r * a % c`를 B번. O(B) = 최대 **21억 번**이에요. 1초 3,500만 번이면 약 60초예요. 30장 4단계 표의 \"N이 10억 이상\"에 해당해요. 입력 크기는 숫자 세 개뿐인데, **값의 크기**가 반복 횟수를 정해요. 이게 이 문제의 포인트예요.\n나머지를 안 구하고 `a ** b % c`로 쓰면 더 나빠요. 2³¹을 21억 번 곱한 수는 약 650억 비트라 메모리부터 안 돼요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n브루트포스는 A를 하나씩 곱해요. 그런데 A⁸을 구하려면 A⁴만 있으면 되고(A⁴ × A⁴), A⁴는 A²만 있으면 돼요. **같은 계산을 반복하는 대신 결과를 제곱해서 재사용**하면 지수가 매번 절반이 돼요.\n- B가 짝수: A^B = (A^(B/2))²\n- B가 홀수: A^B = (A^(B/2))² × A (B/2는 버림)\n- 곱할 때마다 mod C를 해도 답이 같아요. 그래서 수가 C² 이하로 유지돼요.\n\n트리거 단어: \"B ≤ 21억\" 같은 **10억 이상의 값**을 반복 횟수로 쓰는 문제 → O(log B) 분할 정복 (30장 3단계 \"매번 절반으로 줄어든다 → log\", 4단계 표 마지막 줄).\n\n## 5. 코드\n```python\ndef power(a, b, c):\n    if b == 0:\n        return 1 % c                 # C = 1이면 0\n    half = power(a, b // 2, c)       # 딱 한 번만 부른다\n    res = half * half % c\n    if b % 2 == 1:\n        res = res * a % c\n    return res\n\na, b, c = map(int, input().split())\nprint(power(a % c, b, c))\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `power(a, b, c)`는 항상 a^b mod c를 돌려줘요. `half`가 a^(b//2) mod c이면 `half * half`는 a^(2·(b//2))이고, b가 홀수일 때만 a를 한 번 더 곱해서 지수가 정확히 b가 돼요.\n- **빠뜨리지 않는 이유**: 곱할 때마다 `% c`를 해도 (x·y) mod c = ((x mod c)·(y mod c)) mod c라서 답이 같아요. 그래서 `a % c`로 시작해도 돼요.\n- **끝나는 이유**: 부를 때마다 b가 `b // 2`로 절반이 되고 `power`는 한 번만 불러서, 깊이는 log₂ B ≤ 31이에요.\n- **깨지는 가정**: `power(a, b // 2, c)`를 두 번 부르면 호출이 B개로 불어나 다시 O(B)예요. 기저에서 `1 % c` 대신 `1`을 돌려주면 C = 1, B = 0일 때 1이 나오는데, 이 문제는 B ≥ 1이라 그 경우가 실제로는 안 와요.\n\n## 6. 예제로 추적 (확인)\n`power(10, 11, 12)`의 호출이 쌓였다가 돌아오는 순서예요.\n| b | half | half² mod 12 | 홀수? | 돌려주는 값 |\n|---|---|---|---|---|\n| 0 | — | — | — | 1 |\n| 1 | 1 | 1 | 예 → ×10 | 10 |\n| 2 | 10 | 4 | 아니요 | 4 |\n| 5 | 4 | 4 | 예 → ×10 | 40 mod 12 = 4 |\n| 11 | 4 | 4 | 예 → ×10 | 40 mod 12 = 4 |\n답 4 ✓. 호출이 5번이에요. 11을 2진수로 쓰면 `1011`, 네 자리 + 기저 하나예요.\n\n## 7. 복잡도\n호출마다 b가 절반이 되니 깊이는 ⌊log₂ B⌋ + 2 ≈ 32. 시간 **O(log B)**, 재귀 스택 공간 O(log B). 채점기 큰 입력에서 약 0.04초예요(대부분이 파이썬 시작 시간). 같은 일을 하는 O(B) 반복은 강제 종료돼요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| B번 반복해서 곱함 | 답은 맞지만 O(B) | 손 케이스 04 (시간 초과) |\n| `power(b//2) * power(b//2)` 두 번 호출 | 호출 수가 다시 O(B) | 손 케이스 04 (시간 초과) |\n| 기저 `b == 1: return a` (mod 없음) | `7 1 3`에서 7 출력 | 손 케이스 02 |\n| `a ** b % c` | 수가 너무 커져서 끝나지 않음 | 손 케이스 04 (시간 초과) |\n| 재귀 안에서는 mod를 빼고 마지막에만 `% c` | 중간 수가 수십억 자리로 커짐 | 손 케이스 04 (시간 초과) |\n\n## 9. 면접에서 30초로 설명하기\n\"B가 21억까지라 B번 곱하는 O(B)는 안 됩니다. A^B를 A^(B/2)의 제곱으로 구하고 B가 홀수면 A를 한 번 더 곱하면 지수가 매번 절반이 되어 O(log B), 약 31번입니다. 곱할 때마다 C로 나눈 나머지만 들고 다녀도 결과가 같아서 수가 커지지 않습니다. 핵심은 A^(B/2)를 한 번만 계산해서 재사용하는 것입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **재귀 말고 반복문으로 짤 수 있나요?** 네. B를 2진수로 보고 오른쪽 비트부터 처리해요. `while b: if b & 1: r = r * a % c; a = a * a % c; b >>= 1`. 스택을 쓰지 않아 공간 O(1)이에요. 파이썬 내장 `pow(a, b, c)`도 이 방식이에요.\n2. **half를 두 번 부르면 정확히 얼마나 느려지나요?** T(B) = 2T(B/2) + O(1)이라 호출 수가 약 2B개, O(B)예요. 분할 정복이 빠른 건 쪼개서가 아니라 **쪼갠 결과를 재사용해서**예요. 42장 DP의 메모이제이션과 같은 생각이에요.\n3. **어디에 또 쓰이나요?** 피보나치 N번째 항을 2×2 행렬의 거듭제곱으로 O(log N)에 구할 때(백준 11444), 그리고 RSA 암호화가 거대한 지수의 모듈러 거듭제곱이에요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 재귀와 반복 두 방식 다 10분 안에 짜면 졸업. 비슷한 문제: 백준 10830 「행렬 제곱」, 백준 11444 「피보나치 수 6」.\n", "starter": "# 백준 1629 곱셈 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 30/boj1629\n# 내장 pow(a, b, c)는 쓰지 말고 직접 짜 보세요. (채점기는 막지 않아요)\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "30/boj2143", "chapter": "30", "slug": "boj2143", "title": "백준 2143 두 배열의 합", "kind": "stdio", "ext": ".py", "tier": "Gold III (solved.ac)", "role": "도전", "target": "50분", "url": "https://solved.ac/problems/id/2143", "time_limit": 2.0, "ref_time": 0.22112379199825227, "problem": "# 백준 2143 두 배열의 합\n\n- 원문: https://solved.ac/problems/id/2143\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold III (solved.ac) · 역할: 도전 · 목표 시간: 50분\n- 짝이 되는 장: 30. 빅오\n\n## 문제 (요약)\n정수 배열 A(길이 n)와 B(길이 m), 그리고 정수 T가 주어져요. A의 연속 부분 배열 하나와 B의 연속 부분 배열 하나를 골라 두 합을 더했을 때 T가 되는 **고르는 방법의 수**를 출력하세요. 부분 배열은 원소가 하나 이상이고, 위치가 다르면 합이 같아도 다른 부분 배열이에요.\n\n## 제약\n- -1,000,000,000 ≤ T ≤ 1,000,000,000\n- 1 ≤ n, m ≤ 1,000\n- 각 원소의 절댓값은 1,000,000 이하\n- 입력: `T` / `n` / A의 원소 n개 / `m` / B의 원소 m개 (각 한 줄)\n- 출력: 방법의 수 하나 (32비트 정수를 넘을 수 있어요)\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요. 먼저 **부분 배열이 몇 개인지** 세고, 쌍을 전부 보면 몇 번인지 계산해 보세요.\n2. `python algo/judge.py 30/boj2143` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 개수부터 세기<\/summary>\n\n길이 1,000인 배열의 연속 부분 배열은 1,000 × 1,001 / 2 = 500,500개예요. A쪽 50만 개와 B쪽 50만 개를 짝지어 보면 2,500억 쌍이에요. 쌍을 나열하는 순간 끝이에요. 그런데 50만 개를 **각각 한 번씩** 만드는 건 30장 1단계 예산 안이에요. A쪽과 B쪽을 **따로** 처리할 방법을 생각해 보세요.\n<\/details>\n\n<details><summary>힌트 2: 짝 찾기를 싸게<\/summary>\n\nB의 부분합 s를 하나 정하면, A에서 필요한 합은 정확히 `T − s` 하나로 정해져요. 그러면 질문은 \"A의 부분합 중 `T − s`가 몇 개인가\"가 돼요. 이건 10816 「숫자 카드 2」와 같은 질문이에요. A의 부분합 50만 개를 `Counter`에 세어 두면 질문마다 O(1)이에요(30장 6단계 도구 2·8). 정렬 + `bisect` 두 번이어도 돼요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 부분합이 같은 부분 배열이 여러 개일 수 있어요. `set`으로 있나/없나만 보면 개수를 놓쳐요. 원소가 전부 0이면 답이 2,500억이 넘어요.\n- 부분합을 만들 때 길이 1짜리(원소 하나)도 넣어야 해요.\n- 부분합을 만들 때 `sum(a[i:j+1])`을 쓰면 하나에 O(n)이라 전체 O(n³)이에요. 시작점을 고정하고 오른쪽으로 더해 가면 하나에 O(1)이에요.\n- 정렬 + 투 포인터로 갈 거면 **같은 값 묶음끼리 곱하기**를 잊지 마세요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 2143 두 배열의 합\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요. 도전 문제라서 중간 풀이(통과 못 하는 것과 겨우 통과하는 것)도 같이 적었어요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"A에서 연속 구간 하나, B에서 연속 구간 하나. 두 합의 합이 T인 (구간, 구간) 쌍의 개수.\" 확인 질문은 이거예요.\n- 음수와 0이 있나요? → **있음**. 그래서 32장의 투 포인터(합이 단조로 변한다는 전제)는 한 배열 안에서는 못 써요.\n- 답이 얼마나 커질 수 있나요? → 최대 500,500² ≈ 2.5 × 10¹¹. 파이썬은 괜찮고, C++이면 `long long`이에요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\nT = 4, A = `2 -1 2`, B = `1 2`.\nA의 부분합 6개: `2, 1, 3, -1, 1, 2`. B의 부분합 3개: `1, 3, 2`.\nB가 1이면 A에서 3이 필요 → 1개. B가 3이면 A에서 1 → 2개. B가 2이면 A에서 2 → 2개. 답 5.\n경계: 원소가 전부 0(T = 0이면 모든 쌍이 답 → 아주 큰 수), 만들 수 없는 T(답 0), n = m = 1, T가 음수, 원소가 ±100만인 경우.\n\n## 3. 브루트포스와 그 복잡도 (2분)\nA의 (i, j), B의 (k, l) 네 끝점을 전부 고르고 매번 직접 더해요. 쌍이 O(n²m²)이고 더하기가 O(n + m)이라 **O(n²m²(n + m))**, n = m = 1,000이면 10¹⁴ 단위예요. 채점기의 `brute.py`가 이 방식이라 n, m ≤ 7에서만 써요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n**중간 풀이 ① (아직 부족): 누적 합으로 더하기를 O(1)로.**\n`pa[j] - pa[i] + pb[l] - pb[k] == T`로 바꾸면 더하기는 사라져요. 그래도 쌍이 **2,500억 개**예요. 1초 3,500만 번이면 2시간이에요. 채점기에서는 손 케이스 07(n = m = 1,000)에서 강제 종료돼요. 더하기를 줄여도 **쌍을 나열하는 구조**가 남아 있으면 안 된다는 뜻이에요.\n\n**관찰: 쌍을 나열하지 말고, 한쪽을 정하면 다른 쪽은 값 하나로 정해진다.**\nB의 부분합 s를 고르면 A에서 필요한 합은 `T − s` 하나뿐이에요. 그러니 A쪽은 \"합 → 그 합을 가진 부분 배열 개수\"로 미리 정리해 두고, B쪽 부분합 50만 개마다 한 번씩 묻기만 하면 돼요. 10816 「숫자 카드 2」를 50만 번 하는 셈이에요.\n\n**중간 풀이 ② (통과하지만 최선은 아님): 정렬 + `bisect`.**\nA의 부분합을 정렬해 두고, B의 부분합 s마다 `bisect_right(sa, T−s) − bisect_left(sa, T−s)`. O(n² log n² + m² log n²). 채점기 큰 입력에서 약 0.64초로 통과해요.\n\n**최종: `Counter`로 O(1) 조회.**\nO(n² + m²). 같은 입력에서 약 0.23초예요.\n\n트리거 단어: \"두 집합에서 하나씩 골라 합이 T\" + \"각 집합은 나열할 수 있지만 쌍은 못 나열함\" → 한쪽을 해시맵에 넣고 다른 쪽에서 `T − x`를 찾기(Two Sum의 확장, meet in the middle). 30장 끝까지 따라가기 ②의 (5)번이 바로 Two Sum이에요.\n\n## 5. 코드\n```python\nfrom collections import Counter\n\ndef sub_sums(arr):\n    out = []\n    for i in range(len(arr)):\n        s = 0\n        for j in range(i, len(arr)):   # 시작점 고정, 오른쪽으로 하나씩\n            s += arr[j]\n            out.append(s)\n    return out\n\ncnt_a = Counter(sub_sums(a))                       # A쪽: 합 → 개수\nprint(sum(cnt_a[t - s] for s in sub_sums(b)))      # B쪽: 짝의 개수를 더함\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `cnt_a[x]`는 A의 연속 부분 배열 중 합이 x인 것의 개수예요. `sub_sums`는 시작점 `i`마다 `j`를 오른쪽으로 늘리며 `s`를 하나씩 더해서, 모든 `(i, j)`의 합을 정확히 한 번씩 내요.\n- **빠뜨리지 않는 이유**: B의 부분 배열 하나(합 s)를 고르면 짝이 되는 A의 합은 `t - s` 하나뿐이고, 그 개수가 `cnt_a[t - s]`예요. B의 부분 배열을 전부 돌며 더하니 모든 (A구간, B구간) 쌍을 한 번씩 센 셈이에요.\n- **끝나는 이유**: 부분합이 A쪽 n(n+1)/2, B쪽 m(m+1)/2개라 O(n² + m²)이고, 조회는 평균 O(1)이에요.\n- **깨지는 가정**: 음수와 0이 있어도 맞아요. 합의 크기 순서를 쓰지 않고 값이 같은지만 보니까요. 그래서 한 배열 안에서 투 포인터로 바꾸면 깨져요. 답은 2.5 × 10¹¹까지라 고정 폭 정수 언어에서는 64비트가 필요해요.\n\n## 6. 예제로 추적 (확인)\nA의 부분합을 센 결과: `cnt_a = {2: 2, 1: 2, 3: 1, -1: 1}`\n| B 구간 | B 합 s | 필요한 A 합 T − s | cnt_a[T − s] | 누적 답 |\n|---|---|---|---|---|\n| [0, 0] | 1 | 3 | 1 | 1 |\n| [0, 1] | 3 | 1 | 2 | 3 |\n| [1, 1] | 2 | 2 | 2 | 5 |\n답 5 ✓\n\n## 7. 복잡도\n부분합 만들기 O(n²) + O(m²), 세기 O(n²), 조회 O(m²) × O(1) → **O(n² + m²)**, 메모리 O(n² + m²) (리스트 대신 B쪽을 바로 조회하면 B쪽 메모리는 줄일 수 있어요). n = m = 1,000이면 약 100만 번이라 1초 예산의 3% 정도예요.\n\n| 풀이 | 복잡도 | 채점기 결과 (n = m = 1,000) |\n|---|---|---|\n| 브루트포스 | O(n²m²(n + m)) | 작은 입력 전용 |\n| 중간 ① 누적 합 + 쌍 나열 | O(n²m²) | 손 케이스 07에서 강제 종료 |\n| 중간 ② 정렬 + `bisect` | O((n² + m²) log n) | 0.64초 통과 |\n| 최종 `Counter` | O(n² + m²) | 0.23초 통과 |\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `set`으로 있나/없나만 셈 | 같은 합이 여러 개일 때 적게 나옴 | 손 케이스 01 |\n| 정렬 + 투 포인터에서 같으면 둘 다 한 칸씩만 이동 | 같은 값 묶음의 곱을 놓침 | 손 케이스 01 |\n| 부분합에서 길이 1을 빠뜨림 (`range(i + 1, n)`) | 적게 나옴 | 손 케이스 01 (04도 원소 하나씩이라 걸려요) |\n| 누적 합으로 네 끝점을 전부 나열 | 답은 맞지만 O(n²m²) | 손 케이스 07 (시간 초과) |\n| `sum(a[i:j+1])`로 부분합을 만듦 | O(n³), 약 1.7억 번 복사·덧셈 | 큰 입력 (2.7초, 제한 2초) |\n\n## 9. 면접에서 30초로 설명하기\n\"각 배열의 부분 배열은 50만 개씩이라 하나씩 만드는 건 되지만, 쌍은 2,500억 개라 나열할 수 없습니다. B의 부분합 s를 정하면 A에서 필요한 합은 T − s 하나로 정해지니까, A의 부분합을 해시맵에 개수로 세 두고 B의 부분합마다 T − s의 개수를 더합니다. O(n² + m²)입니다. 같은 합이 여러 번 나오니 집합이 아니라 개수를 세야 합니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **메모리를 줄이려면?** A쪽 `Counter`는 필요하지만 B쪽은 리스트로 만들 필요 없이 만들면서 바로 조회하면 돼요. 정렬 + 투 포인터(같은 값 묶음 곱하기)는 해시 없이 정렬된 두 리스트만으로 풀려서, 해시 충돌 걱정이 없고 메모리가 예측 가능해요.\n2. **배열이 네 개(A + B + C + D = 0)라면?** 백준 7453 「합이 0인 네 정수」예요. A + B의 합 n²개를 세 두고 C + D의 합마다 짝을 찾아요. 둘씩 묶어서 반으로 쪼개는 같은 생각이에요. n = 4,000이라 1,600만 개라 파이썬에서는 정렬 + 투 포인터 쪽이 메모리상 안전해요.\n3. **T를 만드는 쌍이 있는지만 물으면?** 개수 대신 존재만 보면 되니 `set`으로 충분하고, 찾자마자 멈출 수 있어요. 문제의 질문이 \"몇 개\"인지 \"있나\"인지가 자료구조를 정해요.\n\n## 11. 다시 풀기\n3일 뒤, 1주 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 25분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 7453 「합이 0인 네 정수」, 백준 1208 「부분수열의 합 2」(부분집합 버전, meet in the middle), LeetCode 454 「4Sum II」.\n", "starter": "# 백준 2143 두 배열의 합 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 30/boj2143\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "30/boj2559", "chapter": "30", "slug": "boj2559", "title": "백준 2559 수열", "kind": "stdio", "ext": ".py", "tier": "Silver III (solved.ac)", "role": "핵심", "target": "25분", "url": "https://solved.ac/problems/id/2559", "time_limit": 1.0, "ref_time": 0.01460850000148639, "problem": "# 백준 2559 수열\n\n- 원문: https://solved.ac/problems/id/2559\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Silver III (solved.ac) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 30. 빅오\n\n## 문제 (요약)\n매일 잰 온도가 N일치 있어요. **연속한 K일**의 온도 합 가운데 가장 큰 값을 출력하세요.\n\n## 제약\n- 2 ≤ N ≤ 100,000, 1 ≤ K ≤ N\n- 온도는 -100 이상 100 이하의 정수\n- 입력: 첫 줄 `N K`, 둘째 줄 온도 N개 / 출력: 최댓값 하나\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요. 먼저 **느린 풀이를 그대로 짜서** 채점기로 시간을 재 보고, 그다음 빠른 풀이로 바꿔 보세요. 같은 답, 다른 시간을 직접 보는 게 이 문제의 목적이에요.\n2. `python algo/judge.py 30/boj2559` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 느린 풀이의 횟수를 세 보기<\/summary>\n\n시작점마다 K개를 더하면 (N − K + 1) × K번이에요. K = 50,000이면 약 25억 번이에요. 30장 1단계 예산(1초에 3,500만 번)의 70배가 넘어요. 그럼 시작점이 한 칸 옮겨 갈 때, 바로 전 합과 **무엇이 달라지는지** 보세요.\n<\/details>\n\n<details><summary>힌트 2: 한 칸 밀면 바뀌는 건 두 개뿐<\/summary>\n\n`[i, i+K-1]`에서 `[i+1, i+K]`로 가면 왼쪽 끝 하나가 빠지고 오른쪽 끝 하나가 들어와요. 나머지 K − 1개는 그대로예요. 그래서 새 합 = 이전 합 − 나간 값 + 들어온 값, O(1)이에요. 누적 합 `p[i+K] - p[i]`로 구해도 같은 O(N)이에요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 최댓값의 처음 값을 0으로 두면 온도가 전부 음수일 때 틀려요. **첫 창의 합**으로 시작하세요.\n- 마지막 창까지 봐야 해요. 시작점은 0부터 N − K까지, 총 N − K + 1개예요.\n- `sum(a[i:i+K])`를 반복문 안에서 부르면 슬라이스 복사와 합이 매번 K번이에요(30장 5단계 \"숨은 O(N)\"). 짧아 보여도 O(NK)예요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 2559 수열\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"길이 K짜리 연속 구간의 합 중 최댓값.\" 확인 질문은 이거예요.\n- 음수가 있나요? → **있음**, -100까지. 답이 음수일 수 있어요.\n- K = N이면? → 구간이 하나뿐이고 전체 합이 답이에요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`2 -1 4 0 -3 5 6 -2 1 3`, K = 3 → 창의 합은 5, 3, 1, 2, 8, **9**, 5, 2 → 답 9 (`5 6 -2`).\n경계: 전부 음수(답이 음수), K = N(창 하나), K = 1(최댓값 원소), 답이 **마지막 창**에 있는 경우.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n시작점 N − K + 1개마다 K개를 더해요. O((N − K + 1) × K)이고, K = N/2일 때 가장 커서 약 N²/4 = **25억 번**이에요. 30장 4단계 표에서 N = 10만은 O(N log N) 이하를 요구해요. 이 풀이는 떨어져요.\n`max(sum(a[i:i+k]) for i in ...)`처럼 한 줄로 써도 같아요. 슬라이스는 K개를 복사하고 `sum`은 K개를 더해요. 채점기 큰 입력에서 3초에 강제 종료됐어요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n브루트포스는 이웃한 두 창에서 **겹치는 K − 1개를 매번 다시** 더해요. 겹치는 부분은 이미 알고 있으니, 바뀌는 두 값만 반영하면 돼요.\n- 창을 한 칸 밀기: `합 += 들어온 값 − 나간 값`. 한 번에 O(1).\n- 또는 누적 합 `p[j] = a[0] + … + a[j-1]`을 한 번 만들어 두면 구간 합이 `p[i+K] − p[i]`로 O(1).\n\n트리거 단어: \"연속한 K개\" + \"N = 10만\" → 고정 길이 창 또는 누적 합으로 O(N). 32장 슬라이딩 윈도의 템플릿 A가 바로 이 모양이에요.\n\n## 5. 코드\n```python\nwindow = sum(a[:k])          # 첫 창만 O(K)로 다 더하기\nbest = window\nfor i in range(k, n):        # i = 새로 들어오는 칸\n    window += a[i] - a[i - k]    # 들어온 값 더하고, 나간 값 빼기\n    if window > best:\n        best = window\nprint(best)\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: 반복을 시작할 때 `window`는 `a[i-k] + … + a[i-1]`, 즉 바로 앞 길이 K 창의 합이에요. `a[i]`를 더하고 `a[i-k]`를 빼면 다음 창 `a[i-k+1..i]`의 합이 돼요.\n- **빠뜨리지 않는 이유**: 시작점이 0부터 N−K까지인 창 N−K+1개를 하나도 건너뛰지 않고 차례로 보고, 매번 `best`와 비교해요.\n- **끝나는 이유**: 첫 창 O(K), 그다음 창마다 O(1)이라 전체 O(N)이에요.\n- **깨지는 가정**: `best`를 0으로 시작하지 않고 첫 창의 합으로 시작해서, 온도가 전부 음수여도 맞아요. 0으로 시작하면 모든 창의 합이 음수일 때 0이 나와요.\n\n## 6. 예제로 추적 (확인)\n| i | 들어온 a[i] | 나간 a[i−K] | window | best |\n|---|---|---|---|---|\n| 시작 | 2, -1, 4 | — | 5 | 5 |\n| 3 | 0 | 2 | 3 | 5 |\n| 4 | -3 | -1 | 1 | 5 |\n| 5 | 5 | 4 | 2 | 5 |\n| 6 | 6 | 0 | 8 | 8 |\n| 7 | -2 | -3 | 9 | 9 |\n| 8 | 1 | 5 | 5 | 9 |\n| 9 | 3 | 6 | 2 | 9 |\n답 9 ✓\n\n## 7. 복잡도\n첫 창 O(K) + 밀기 N − K번 × O(1) = **O(N)**, 추가 메모리 O(1) (누적 합 방식은 O(N)). 채점기 큰 입력에서 약 0.04초예요. 같은 답을 내는 브루트포스는 3초를 넘겼어요. 25억 대 10만, 차수 하나 차이가 이만큼이에요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `best = 0`으로 시작 | 전부 음수일 때 0이 출력됨 | 손 케이스 02, 06 |\n| `range(k, n - 1)` 등으로 마지막 창을 빠뜨림 | 답이 끝에 있으면 틀림 | 손 케이스 02, 05 |\n| `sum(a[i:i+k])`를 시작점마다 | 답은 맞지만 O(NK) | 큰 입력 (시간 초과) |\n| 누적 합에서 `p[i+k-1] - p[i]` | 창 길이가 K − 1이 됨 | 손 케이스 01 |\n\n## 9. 면접에서 30초로 설명하기\n\"시작점마다 K개를 더하면 O(NK)라 K가 N/2일 때 25억 번입니다. 이웃한 두 창은 K − 1개가 겹치니, 창을 한 칸 밀 때 들어온 값을 더하고 나간 값을 빼면 O(1)에 다음 합이 나옵니다. 전체 O(N), 메모리 O(1)입니다. 답이 음수일 수 있어서 최댓값은 첫 창의 합으로 시작합니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **누적 합과 창 밀기 중 무엇이 나은가요?** 둘 다 O(N)이에요. 창 밀기는 메모리 O(1), 누적 합은 O(N)이지만 **임의의 구간 합**을 여러 번 물을 때 재사용할 수 있어요. 질문이 \"K가 여러 개\"로 바뀌면 누적 합이 유리해요.\n2. **길이가 고정이 아니라 \"합이 S 이상인 가장 짧은 구간\"이면?** 창의 길이가 변해요. 값이 양수면 두 포인터(백준 1806, 32장)로 O(N)이에요. 음수가 섞이면 단조성이 깨져서 누적 합 + 단조 덱이 필요해요.\n3. **K개 중 최댓값(합이 아니라 max)이라면?** 빠진 값을 \"빼는\" 연산이 없어서 이 방법이 안 돼요. 단조 덱으로 O(N)에 풀어요(LeetCode 239).\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 11659 「구간 합 구하기 4」, 백준 21921 「블로그」.\n", "starter": "# 백준 2559 수열 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 30/boj2559\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "31/boj1764", "chapter": "31", "slug": "boj1764", "title": "백준 1764 듣보잡", "kind": "stdio", "ext": ".py", "tier": "Silver IV (solved.ac)", "role": "워밍업", "target": "15분", "url": "https://solved.ac/problems/id/1764", "time_limit": 1.5, "ref_time": 0.3337972089939285, "problem": "# 백준 1764 듣보잡\n\n- 원문: https://solved.ac/problems/id/1764\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Silver IV (solved.ac) · 역할: 워밍업 · 목표 시간: 15분\n- 짝이 되는 장: 31. 배열과 해싱\n\n## 문제 (요약)\n이름 명단이 두 개 있어요. 첫 번째는 \"들어 본 적 없는 사람\" N명, 두 번째는 \"본 적 없는 사람\" M명이에요. **두 명단에 모두 있는** 사람의 수를 먼저 출력하고, 그 사람들의 이름을 **사전 순**으로 한 줄에 하나씩 출력하세요.\n\n## 제약\n- 1 ≤ N, M ≤ 500,000\n- 이름은 영어 소문자로만 되어 있고, 길이는 20 이하\n- 한 명단 안에서는 같은 이름이 두 번 나오지 않아요\n- 입력: 첫 줄 `N M`, 다음 N줄에 첫 명단, 그다음 M줄에 둘째 명단 / 출력: 개수 한 줄, 이어서 이름들\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 31/boj1764` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 실제로 묻는 것<\/summary>\n\n둘째 명단의 이름 하나하나에 대해 묻는 질문은 딱 하나예요. \"이 이름이 첫 명단에 **있나?**\" 이 질문을 리스트로 답하면 한 번에 몇 번 비교하나요? 그걸 M번 하면요?\n<\/details>\n\n<details><summary>힌트 2: \"있나?\"를 O(1)로<\/summary>\n\n31장의 가격표를 떠올리세요. \"이 값 있나\"는 리스트가 O(N), 해시 테이블이 평균 O(1)이에요. 첫 명단을 `set`에 담아 두면 31장 \"네 가지 해싱 기법\"의 ① 본 적 있는 집합이에요. `set`끼리 `&`(교집합)를 써도 돼요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- `set`은 순서가 없어요. 출력 전에 꼭 `sorted()`를 하세요.\n- 개수를 먼저 한 줄 출력해야 해요.\n- 100만 줄을 읽어요. `sys.stdin.read().split()`으로 한 번에 읽고, 출력도 `\"\\n\".join()`으로 한 번에 쓰세요. `print`를 50만 번 부르면 느려요.\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 1764 듣보잡\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"명단 두 개의 공통 이름을 세고, 사전 순으로 출력.\" 확인 질문은 이래요.\n- 한 명단 안에 같은 이름이 또 나오나요? → **안 나와요.** 그래서 개수 세기가 필요 없고, \"있나/없나\"만 보면 돼요.\n- 공통 이름이 하나도 없으면? → `0` 한 줄만 출력해요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n첫 명단 `minsu jiwoo haneul daeho`, 둘째 명단 `sora haneul yuna minsu taeyang` → 공통은 `haneul`, `minsu`. 사전 순으로 `haneul`이 먼저예요. 출력은 `2`, `haneul`, `minsu`.\n경계: 공통 0명(`0`만), 이름 하나씩인데 같음(`1`), 입력 순서와 사전 순이 다름(`b ab a ba aa` 같은 경우), 한 이름이 다른 이름의 앞부분(`app`, `apple`)이라 사전 순 비교가 헷갈리는 경우.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n둘째 명단의 이름마다 첫 명단 리스트를 처음부터 훑어요(`name in list`도 똑같아요). O(N·M) = 50만 × 50만 = 2,500억 번 → 절대 안 끝나요.\n**면접 팁**: `x in some_list`는 한 줄이라 빨라 보이지만 안에서는 반복문이에요. 이걸 말로 짚으면 좋은 신호예요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n병목은 \"이 이름이 첫 명단에 있나?\"를 매번 **비교로** 답하는 거예요. 31장의 핵심 문장 그대로, 찾지 않고 **계산해서** 꺼내면 돼요. 첫 명단을 해시 `set`에 넣으면 이 질문이 평균 O(1)이에요.\n\n트리거 단어: \"두 목록에 모두 있는\", \"있나/없나\", N이 수십만 → 해시 set 멤버십 (31장 네 가지 해싱 기법 ①). 출력 순서 요구가 붙어 있으니 정렬은 따로 해요.\n\n## 5. 코드\n```python\ndata = sys.stdin.read().split()\nn, m = int(data[0]), int(data[1])\nunheard = set(data[2:2 + n])\nboth = sorted(name for name in data[2 + n:2 + n + m] if name in unheard)\nsys.stdout.write(f\"{len(both)}\\n\" + \"\".join(name + \"\\n\" for name in both))\n```\n`set(data[2:2+n]) & set(data[2+n:])`처럼 교집합 연산자를 써도 같아요.\n\n## 왜 이 코드가 정답인가\n- **불변식**: `unheard`는 첫 명단 N명을 정확히 담은 집합이고, 둘째 명단을 도는 동안 바뀌지 않아요.\n- **빠뜨리지 않는 이유**: 둘째 명단의 이름을 하나도 빼지 않고 `name in unheard`로 물어서, 두 명단에 모두 있는 이름은 전부 `both`에 들어가요.\n- **겹치지 않는 이유**: 한 명단 안에서 같은 이름이 두 번 나오지 않는다는 제약 덕에 `both`에 중복이 생기지 않아요.\n- **끝나는 이유**: 집합 만들기 O(N), 조회 M번 평균 O(1), 정렬 O(K log K)예요.\n- **깨지는 가정**: 둘째 명단에 같은 이름이 두 번 나오면 그 이름이 두 번 출력돼요. 그때는 `set(...) & set(...)`처럼 양쪽을 다 집합으로 만들어야 해요.\n\n## 6. 예제로 추적 (확인)\n`unheard = {minsu, jiwoo, haneul, daeho}`\n| 둘째 명단 이름 | `in unheard`? | both (정렬 전) |\n|---|---|---|\n| sora | 아니요 | [] |\n| haneul | 예 | [haneul] |\n| yuna | 아니요 | [haneul] |\n| minsu | 예 | [haneul, minsu] |\n| taeyang | 아니요 | [haneul, minsu] |\n정렬해도 `[haneul, minsu]`. 출력 `2 / haneul / minsu` ✓\n\n## 7. 복잡도\n`set` 만들기 O(N), 조회 M번 평균 O(M), 공통 K명 정렬 O(K log K) → **O(N + M + K log K)**. 메모리는 set에 O(N). 문자열 해시는 길이(≤ 20)에 비례하지만 상수로 봐요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 정렬을 빼먹음 | 입력 순서(또는 set 순서)로 출력 | 손 케이스 04 |\n| 리스트로 `in` 검사 | 정답이지만 O(N·M) | 큰 입력 (시간 초과) |\n| 개수 줄을 빼먹음 | 첫 토큰이 이름 | 손 케이스 01 |\n\n## 9. 면접에서 30초로 설명하기\n\"첫 명단을 해시 셋에 담고, 둘째 명단의 이름마다 셋에 있는지 평균 O(1)로 확인해 공통 이름을 모읍니다. 셋은 순서가 없으니 마지막에 정렬합니다. 리스트로 확인하면 O(N·M)인데, 셋으로 바꾸면 O(N + M)에 정렬 비용 O(K log K)가 더해집니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **메모리가 부족해서 set을 못 쓰면?** 두 명단을 각각 정렬한 뒤 두 포인터로 같이 훑어요(머지처럼). O(N log N + M log M)이고, 결과가 이미 사전 순이라 정렬이 따로 필요 없어요(32장으로 이어져요).\n2. **한 명단에 같은 이름이 여러 번 나올 수 있다면?** \"공통 이름을 몇 번씩\"을 물으면 `Counter`끼리 `&`(최솟값)를 써요. 31장 기법 ③이에요.\n3. **두 명단이 각각 다른 서버에 있고 아주 크다면?** 이름을 해시해서 같은 해시값끼리 같은 머신으로 보낸 뒤 머신마다 교집합을 구해요. DB의 해시 조인과 같은 생각이에요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 10분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 백준 10815 「숫자 카드」, 프로그래머스 「폰켓몬」, LeetCode 349 Intersection of Two Arrays.\n", "starter": "# 백준 1764 듣보잡 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 31/boj1764\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "31/boj2015", "chapter": "31", "slug": "boj2015", "title": "백준 2015 수들의 합 4", "kind": "stdio", "ext": ".py", "tier": "Gold IV (solved.ac)", "role": "핵심", "target": "35분", "url": "https://solved.ac/problems/id/2015", "time_limit": 1.0, "ref_time": 0.04593329198542051, "problem": "# 백준 2015 수들의 합 4\n\n- 원문: https://solved.ac/problems/id/2015\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Gold IV (solved.ac) · 역할: 핵심 · 목표 시간: 35분\n- 짝이 되는 장: 31. 배열과 해싱\n\n## 문제 (요약)\n정수 N개로 된 배열과 정수 K가 주어져요. **연속한** 구간 중 합이 **정확히 K**인 구간이 몇 개인지 출력하세요. 배열에는 음수와 0도 들어 있어요.\n\n## 제약\n- 1 ≤ N ≤ 200,000\n- 배열의 각 값은 절댓값이 10,000 이하인 정수\n- K는 절댓값이 2,000,000,000 이하인 정수\n- 입력: 첫 줄 `N K`, 둘째 줄 배열 / 출력: 개수 하나 (32비트 정수 범위를 넘을 수 있어요)\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 31/boj2015` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 구간 합을 O(1)로<\/summary>\n\n구간 합을 매번 더하지 말고, 앞에서부터의 누적 합 `P`를 생각해 보세요. 구간 `(i..j)`의 합은 `P[j] - P[i-1]`이에요. 그래도 모든 쌍 `(i, j)`를 보면 O(N²) = 200억이에요. 그리고 음수가 있어서 \"늘리고 줄이는\" 윈도는 쓸 수 없어요(32장 6단계).\n<\/details>\n\n<details><summary>힌트 2: 식을 뒤집으면 Two Sum<\/summary>\n\n`P[j] - P[i-1] = K`를 `P[i-1] = P[j] - K`로 바꿔 보세요. 끝 `j`를 고정하면 \"지금까지 나온 누적 합 중에서 값이 `P[j] - K`인 게 **몇 개**인가?\"라는 질문이 돼요. 31장 Two Sum의 보수 조회(기법 ②)에 빈도 세기(기법 ③)를 합친 모양이에요. 누적 합 → 등장 횟수를 dict에 세면서 한 번 훑으세요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 시작할 때 `count[0] = 1`을 넣어 두세요. 배열의 맨 앞부터 시작하는 구간(빈 앞부분의 합 0)을 세려면 필요해요.\n- **조회 먼저, 그다음 등록**이에요. 순서를 바꾸면 K = 0일 때 길이 0인 빈 구간까지 세요.\n- 답이 32비트 정수를 넘을 수 있어요(파이썬은 괜찮아요).\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 2015 수들의 합 4\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"연속 구간 중 합이 정확히 K인 것의 개수.\" 확인 질문은 이래요.\n- 값에 음수나 0이 있나요? → **있어요.** 이 한 줄이 풀이를 결정해요.\n- 같은 값을 가진 다른 위치의 구간은 따로 세나요? → 네, 위치가 다르면 다른 구간이에요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`1 2 -4 10 -7 3`, K = 3 → `[1, 2]`, `[10, -7]`, `[3]`으로 **3개**예요.\n경계: 전부 0이고 K = 0(모든 구간이 정답, N = 5면 5·6/2 = 15개), 답이 0개, 원소 하나가 곧 K, K가 아주 커서(20억) 절대 안 나오는 경우, 한 구간 안에 다른 정답 구간이 겹쳐 들어 있는 경우.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n모든 `(i, j)`에 대해 합을 구해요. 매번 다시 더하면 O(N³), 누적 합을 쓰면 O(N²) = 약 200억 → 둘 다 시간 초과예요.\n**왜 윈도가 안 되나**: 32장 6단계 그대로예요. 음수가 있으면 늘렸는데 합이 줄 수 있어서 \"모자라면 늘린다\"는 판단이 틀려요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\nO(N²) 풀이의 안쪽 반복은 \"끝이 j인 구간 중 합이 K인 시작 i를 **찾는** 일\"이에요. 식을 정리하면 `P[i-1] = P[j] - K`. 즉 **지나온 누적 합들 중에 `P[j] - K`라는 값이 몇 번 나왔는지**만 알면 돼요. \"이 값이 있나 / 몇 개인가\"는 찾지 말고 해시로 꺼내면 돼요. Two Sum이 \"두 원소의 합 = target\"에서 `target - x`를 찾았듯, 여기선 \"두 누적 합의 차 = K\"에서 `P - K`를 찾아요.\n이 방법은 늘릴지 줄일지 판단하지 않고 그냥 한 번 훑으며 세기만 해서, 음수가 있어도 괜찮아요.\n\n트리거 단어: \"연속 구간\", \"합이 정확히 K\", \"음수 포함\" → 누적 합 + 해시맵 (32장 6단계, 31장 기법 ②+③). LeetCode 560과 같은 구조예요.\n\n## 5. 코드\n```python\ncount = defaultdict(int)\ncount[0] = 1            # 빈 앞부분\ntotal = ans = 0\nfor x in a:\n    total += x\n    ans += count[total - k]   # 조회 먼저\n    count[total] += 1         # 그다음 등록\nprint(ans)\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `x`를 처리하기 직전 `count[v]`는 지금까지 지나온 누적 합(빈 앞부분 0 포함) 중 값이 `v`인 것의 개수예요. `total`은 현재 위치까지의 누적 합이에요.\n- **빠뜨리지 않는 이유**: 끝이 현재 위치인 구간의 합이 K라는 말은 앞의 누적 합이 `total - k`라는 말과 같아요. 그 개수를 모두 `ans`에 더하니 끝점마다 모든 시작점을 센 거예요. `count[0] = 1`이 맨 앞에서 시작하는 구간을 맡아요.\n- **겹치지 않는 이유**: 조회를 등록보다 먼저 해서, 길이 0인 구간(자기 자신과의 차)은 세지 않아요.\n- **끝나는 이유**: 한 번 훑기에 조회와 등록이 평균 O(1)이라 O(N)이에요.\n- **깨지는 가정**: 음수와 0이 있어도 맞아요. 합이 커지는지 줄어드는지를 쓰지 않으니까요. 등록을 조회보다 먼저 하면 K = 0일 때 빈 구간까지 세서 답이 N만큼 커져요.\n\n## 6. 예제로 추적 (확인)\n`a = [1, 2, -4, 10, -7, 3]`, K = 3, 처음 `count = {0: 1}`\n| x | total (P) | 찾는 값 P − K | 찾은 개수 | ans | 등록 후 새로 생긴 키 |\n|---|---|---|---|---|---|\n| 1 | 1 | −2 | 0 | 0 | 1 |\n| 2 | 3 | 0 | 1 (빈 앞부분 → `[1, 2]`) | 1 | 3 |\n| −4 | −1 | −4 | 0 | 1 | −1 |\n| 10 | 9 | 6 | 0 | 1 | 9 |\n| −7 | 2 | −1 | 1 (P = −1 다음부터 → `[10, −7]`) | 2 | 2 |\n| 3 | 5 | 2 | 1 (P = 2 다음부터 → `[3]`) | 3 | 5 |\n답 3 ✓. `count[0] = 1`이 없었다면 둘째 줄에서 0을 찾지 못해 `[1, 2]`를 놓쳐요.\n\n## 7. 복잡도\n한 번 훑으면서 dict 조회·갱신이 평균 O(1) → **O(N)**. 메모리는 서로 다른 누적 합의 수만큼 O(N). 참고로 `defaultdict`에 `count[total - k]`로 조회하면 없는 키도 0으로 만들어 넣어서 dict가 두 배쯤 커질 수 있어요. 신경 쓰이면 `count.get(total - k, 0)`을 쓰세요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `count[0] = 1`을 빼먹음 | 맨 앞에서 시작하는 구간을 놓쳐 2가 나옴 | 손 케이스 01 |\n| 등록 먼저, 조회 나중 | K = 0일 때 빈 구간까지 세서 많게 나옴 | 손 케이스 02 |\n| 32장 가변 윈도를 그대로 씀 | 음수 때문에 정답 구간을 지나쳐 버림 | 손 케이스 01 |\n| 누적 합 + 이중 반복 | 정답이지만 O(N²) | 큰 입력 |\n\n## 9. 면접에서 30초로 설명하기\n\"구간 합은 누적 합의 차이라서, 합이 K인 구간은 'P[j] − K와 같은 이전 누적 합'의 개수와 같습니다. 그래서 누적 합의 등장 횟수를 해시맵에 세면서 한 번 훑고, 각 위치에서 P − K의 횟수를 답에 더합니다. 빈 앞부분을 위해 0을 한 번 넣고 시작합니다. 음수가 있어도 판단 없이 세기만 하니 안전하고, O(N) 시간에 O(N) 공간입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **값이 전부 양수라면?** 단조성이 생겨서 32장 가변 윈도로 O(1) 공간에 풀 수 있어요(백준 2003). 해시맵 방식도 여전히 맞지만 공간이 O(N)이에요.\n2. **\"합이 K 이상\"인 구간의 개수라면?** 해시맵은 정확히 같은 키만 찾아요. \"P[j] − K 이하인 이전 누적 합의 개수\"를 세야 하니 누적 합을 정렬된 구조(펜윅 트리 + 좌표 압축, 또는 머지 소트로 세기)에 넣어 O(N log N)으로 가요.\n3. **개수가 아니라 가장 긴 구간의 길이라면?** dict에 횟수 대신 **처음 나온 위치**만 저장해요(LeetCode 325). 나중에 같은 누적 합이 나와도 덮어쓰지 않는 게 포인트예요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 15분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: LeetCode 560 Subarray Sum Equals K(같은 문제), LeetCode 974 Subarray Sums Divisible by K(나머지를 키로).\n", "starter": "# 백준 2015 수들의 합 4 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 31/boj2015\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "31/boj9375", "chapter": "31", "slug": "boj9375", "title": "백준 9375 패션왕 신해빈", "kind": "stdio", "ext": ".py", "tier": "Silver III (solved.ac)", "role": "핵심", "target": "25분", "url": "https://solved.ac/problems/id/9375", "time_limit": 1.0, "ref_time": 0.000856707978527993, "problem": "# 백준 9375 패션왕 신해빈\n\n- 원문: https://solved.ac/problems/id/9375\n- 참고: 백준(BOJ)은 2026-04-28에 서비스를 종료했어요(BOJ 서비스 종료). 링크는 solved.ac의 문제 정보(티어·태그)로 바꿨고, 채점은 이 리포의 채점기로만 해요.\n- 난이도: Silver III (solved.ac) · 역할: 핵심 · 목표 시간: 25분\n- 짝이 되는 장: 31. 배열과 해싱\n\n## 문제 (요약)\n옷 목록이 있고, 옷마다 이름과 종류(모자, 안경 같은)가 붙어 있어요. 같은 종류는 **한 번에 하나까지만** 입을 수 있고, 매일 옷 조합을 바꿔요. **최소 한 개는** 입어야 할 때, 서로 다른 조합이 몇 가지인지 출력하세요. 테스트 케이스가 여러 개 들어와요.\n\n## 제약\n- 테스트 케이스 수 ≤ 100\n- 한 케이스의 옷 수 n: 0 ≤ n ≤ 30\n- 같은 이름의 옷은 한 케이스 안에 두 번 나오지 않아요. 이름과 종류는 영어 소문자(와 밑줄)로 된 20자 이하 문자열\n- 입력: 첫 줄 테스트 수, 케이스마다 `n`과 n줄의 `이름 종류` / 출력: 케이스마다 조합 수 한 줄\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 31/boj9375` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 이름은 필요한가<\/summary>\n\n조합의 수를 세는 데 옷의 **이름**이 쓰이나요? 모자가 `redcap`이든 `bluecap`이든 답은 같아요. 정말 필요한 정보는 \"종류마다 옷이 **몇 벌**인가\"예요. 그리고 옷 30벌의 부분집합을 다 만들면 2³⁰ ≈ 10억 개예요.\n<\/details>\n\n<details><summary>힌트 2: 종류마다 고를 수 있는 가짓수<\/summary>\n\n종류별 개수는 31장 기법 ③ 빈도 세기(`Counter`)로 구해요. 그다음 한 종류만 보세요. 모자가 2개면 모자에서 할 수 있는 선택은 \"모자1, 모자2, **안 쓰기**\"로 3가지예요. 종류끼리는 서로 독립이니 곱하면 돼요. 마지막으로 \"모든 종류를 안 입은\" 경우가 하나 섞여 있어요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- 곱할 때 `c`가 아니라 `c + 1`이에요.\n- 마지막에 1을 빼요 (아무것도 안 입는 경우).\n- `n = 0`인 케이스가 있어요. 답은 0이고, 다음 줄을 옷으로 읽으면 안 돼요.\n- `Counter`의 키는 이름이 아니라 **종류**예요 (`이름 종류` 순서로 들어와요).\n<\/details>\n", "walk": "# 풀이 walkthrough: 백준 9375 패션왕 신해빈\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"종류마다 0개 또는 1개를 고르고, 전체로는 1개 이상. 그런 조합의 수.\" 확인 질문은 이래요.\n- 아무것도 안 입는 건 세나요? → **안 세요.** 최소 하나는 입어요.\n- 옷이 0벌인 케이스가 있나요? → 있어요. 답은 0이에요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n모자 2개(`redcap`, `bluecap`), 안경 1개, 신발 1개. 모자 선택 3가지 × 안경 2가지 × 신발 2가지 = 12, 아무것도 안 입는 1가지를 빼서 **11**이에요.\n경계: n = 0(답 0), 종류 하나뿐(n벌이면 답 n), 종류가 전부 다름(n벌이면 2ⁿ − 1, n = 30이면 약 10억이라 큰 수 출력), 테스트 케이스 여러 개가 이어짐.\n\n## 3. 브루트포스와 그 복잡도 (2분)\n옷의 부분집합을 전부 만들고, 같은 종류가 두 번 들어간 것만 버려요. 부분집합이 2ⁿ개, 하나 검사에 O(n) → O(2ⁿ · n). n = 30이면 약 300억 번 → 시간 초과예요. (`solution/brute.py`가 이 방식이에요.)\n\n## 4. 병목 → 패턴 찾기 (핵심)\n브루트포스는 `redcap`을 고른 조합과 `bluecap`을 고른 조합을 **따로따로** 만들어요. 그런데 둘은 \"모자 하나를 골랐다\"는 점에서 똑같이 행동해요. 그러니 이름은 버리고 **종류별 개수**만 남기면 돼요. 이게 31장 기법 ③ 빈도 세기예요.\n개수만 있으면 경우의 수 공식으로 바로 끝나요. 종류 하나에서의 선택지는 \"c벌 중 하나 또는 안 입기\"로 c + 1가지, 종류끼리는 독립이라 곱하고, 전부 안 입은 경우 하나를 빼요.\n\n트리거 단어: \"종류별로\", \"몇 가지 조합\" → `Counter` + 곱의 법칙 (31장 프로그래머스 해시 Kit「의상」과 같은 유형).\n\n## 5. 코드\n```python\nfor _ in range(t):\n    n = int(data[pos]); pos += 1\n    kinds = Counter(data[pos + 2 * i + 1] for i in range(n))   # 종류 → 개수\n    pos += 2 * n\n    ans = 1\n    for c in kinds.values():\n        ans *= c + 1\n    out.append(ans - 1)\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: `kinds[c]`는 이 케이스에서 종류 c인 옷의 수예요. `pos`는 케이스가 끝날 때 다음 케이스의 `n` 자리를 가리켜요(`2 * n`칸을 건너뜀).\n- **빠뜨리지 않는 이유**: 종류마다 \"c벌 중 하나 또는 안 입기\"로 c + 1가지이고 종류끼리 독립이라, 곱 `ans`는 모든 입는 방법(아무것도 안 입기 포함)을 정확히 한 번씩 세요. 거기서 전부 안 입기 하나를 빼요.\n- **끝나는 이유**: 케이스마다 O(n)이고, 반복은 테스트 수 `t`만큼이에요.\n- **깨지는 가정**: 같은 이름의 옷이 두 번 나오지 않는다는 제약에 기대요. 같은 옷이 두 줄 있으면 `Counter`가 두 벌로 세서 답이 커져요. n = 0이면 `ans`가 1로 남아 0이 나오니 맞아요.\n\n## 6. 예제로 추적 (확인)\n`kinds = {headgear: 2, eyewear: 1, shoes: 1}`\n| 종류 | 개수 c | c + 1 | ans |\n|---|---|---|---|\n| (시작) | | | 1 |\n| headgear | 2 | 3 | 3 |\n| eyewear | 1 | 2 | 6 |\n| shoes | 1 | 2 | 12 |\n마지막에 1을 빼서 **11** ✓\n\n## 7. 복잡도\n케이스마다 세기 O(n), 곱하기 O(종류 수) → **O(n)**. 메모리는 종류 수만큼 O(n). 전체로는 모든 옷의 수에 비례해요.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| `c + 1` 대신 `c`를 곱함 | \"안 입기\"를 빼먹어 2 × 1 × 1 − 1 = 1이 나옴 | 손 케이스 01 |\n| 마지막 `- 1`을 빼먹음 | 1 크게 나옴 (12) | 손 케이스 01 |\n| `Counter`에 이름을 넣음 | 종류가 모두 달라 보여 2ⁿ − 1 (15) | 손 케이스 01 |\n| `n = 0`에서 다음 줄을 옷으로 읽음 | 케이스가 밀리거나 런타임 에러 | 손 케이스 02 |\n| 부분집합 전부 만들기 | 정답이지만 2³⁰ | 큰 입력 |\n\n## 9. 면접에서 30초로 설명하기\n\"옷 이름은 답에 영향이 없으니 종류별 개수만 해시맵으로 셉니다. 종류 하나에서 할 수 있는 선택은 그 종류의 옷 c벌 중 하나를 입거나 안 입는 것이라 c + 1가지이고, 종류끼리는 독립이라 모두 곱합니다. 여기에는 전부 안 입은 경우가 하나 들어 있으니 1을 뺍니다. O(n)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **답이 아주 커지면?** 파이썬은 정수 크기 제한이 없어요. 자바/C++이면 `long`을 쓰고, 문제가 요구하면 곱할 때마다 `% MOD`를 해요.\n2. **\"정확히 k종류를 입는\" 조합 수를 물으면?** 곱의 법칙으로는 안 돼요. 종류를 하나씩 보면서 `dp[j]`(j종류를 입은 조합 수)를 `dp[j] += dp[j-1] * c`로 갱신해요. O(종류 수 × k)이고 42장 DP로 이어져요.\n3. **종류마다 최대 두 개까지 입을 수 있다면?** 종류 하나의 선택지가 `1 + c + C(c, 2)`로 바뀔 뿐 나머지는 그대로예요. 공식의 각 항이 무엇을 세는지 알면 변형이 쉬워요.\n\n## 11. 다시 풀기\n3일 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 15분 안에 힌트 없이 통과하면 졸업. 비슷한 문제: 프로그래머스 「의상」(같은 문제), 프로그래머스 「완주하지 못한 선수」(Counter 뺄셈).\n", "starter": "# 백준 9375 패션왕 신해빈 — 여기에 풀이를 쓰세요.  채점: python algo/judge.py 31/boj9375\nimport sys\n\ninput = sys.stdin.readline\n\n"}, {"id": "31/lc0041", "chapter": "31", "slug": "lc0041", "title": "LeetCode 41 First Missing Positive", "kind": "func", "ext": ".py", "tier": "Hard (LeetCode)", "role": "도전", "target": "50분", "url": "https://leetcode.com/problems/first-missing-positive/", "time_limit": 0.3, "ref_time": 0.007159458007663488, "problem": "# LeetCode 41 First Missing Positive\n\n- 원문: https://leetcode.com/problems/first-missing-positive/\n- 난이도: Hard (LeetCode) · 역할: 도전 · 목표 시간: 50분\n- 짝이 되는 장: 31. 배열과 해싱\n\n## 문제 (요약)\n정렬되지 않은 정수 배열 `nums`가 주어져요. 배열에 **없는 가장 작은 양의 정수**를 돌려주세요. 단, 시간은 **O(n)**, 추가 메모리는 **O(1)** 이어야 해요. (입력 배열은 고쳐도 돼요.)\n\n## 제약\n- 1 ≤ n ≤ 100,000\n- 값은 -2³¹ 이상 2³¹ − 1 이하. 0, 음수, 중복이 다 나올 수 있어요\n\n## 함수 시그니처\n```python\ndef first_missing_positive(nums: list[int]) -> int:\n```\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 31/lc0041` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요.\n   - 채점기는 **메모리를 재지 않아요.** `set`이나 정렬로 통과했다면 아직 절반이에요. 추가 메모리 O(1) 풀이로 한 번 더 통과하세요.\n   - 채점기는 함수를 강제로 끊지 않아요. 몇 초가 지나도 안 끝나면 무한 루프예요. Ctrl+C로 멈추세요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 답의 범위<\/summary>\n\n길이가 n인 배열이면 답은 **1 이상 n + 1 이하**예요. 왜 그런지 말로 설명해 보세요. 그러면 0, 음수, n보다 큰 값은 답에 아무 영향이 없어요. 공간 제약이 없다면 `set`에 넣고 1부터 확인하면 끝이에요. 그 `set`이 하는 일을 배열 하나로 대신할 수 있을까요?\n<\/details>\n\n<details><summary>힌트 2: 값이 곧 칸 번호<\/summary>\n\n31장 3단계의 직접 주소 지정을 떠올리세요. 값의 범위가 1~n으로 좁으니, \"값 v가 있나?\"를 표시할 칸으로 **입력 배열의 v−1번 칸**을 쓸 수 있어요. 31장 면접 질문 8번의 꼬리 질문이 바로 이 기법이에요. 각 값 v를 제자리(v−1번)로 **바꿔치기(swap)** 해서 옮겨 놓은 뒤, 처음으로 `nums[i] != i + 1`인 i를 찾으세요.\n<\/details>\n\n<details><summary>힌트 3: 구현에서 자주 틀리는 곳<\/summary>\n\n- `while 1 <= nums[i] <= n and nums[nums[i] - 1] != nums[i]` 처럼 **목적지에 이미 같은 값이 있으면** 멈춰야 해요. `nums[i] != i + 1`로 조건을 쓰면 `[1, 1]`에서 무한 루프예요.\n- 파이썬의 `nums[i], nums[nums[i]-1] = nums[nums[i]-1], nums[i]`는 왼쪽부터 대입해서 두 번째 칸 번호가 바뀐 `nums[i]`로 계산돼요. 목적지 번호 `j`를 먼저 변수에 담으세요.\n- 다 제자리면 답은 `n + 1`이에요.\n- 범위 검사(`<= n`)를 빼면 큰 값에서 `IndexError`가 나요.\n<\/details>\n", "walk": "# 풀이 walkthrough: LeetCode 41 First Missing Positive\n\n면접이나 코딩 테스트에서 실제로 머릿속에서 일어나야 하는 순서대로 적었어요. 코드만 보지 말고 **1~4단계를 내가 했는지** 먼저 비교하세요. 도전 문제라서 중간 풀이 두 개를 거쳐 가요.\n\n## 1. 문제를 내 말로 다시 말하기 (1분)\n\"배열에 없는 가장 작은 양수. 시간 O(n), 추가 공간 O(1).\" 확인 질문은 이래요.\n- 입력 배열을 바꿔도 되나요? → **돼요.** 이게 O(1) 공간의 열쇠예요. (안 된다고 하면 O(1) 공간은 사실상 불가능해요.)\n- 0은 양수인가요? → 아니요. 답은 1부터예요.\n\n## 2. 예제를 손으로, 그리고 경계 케이스 (3분)\n`[4, 3, 2, 7, 8, 2, 3, 1]` → 1, 2, 3, 4는 있고 5가 없어요. 답 **5**.\n**답의 범위**: 길이 n인 배열에 1~n이 전부 들어 있을 때 답이 가장 커서 n + 1이에요. 하나라도 빠지면 그게 답이라 n 이하예요. 그래서 답은 항상 1~n+1 사이이고, 그 밖의 값(0, 음수, n 초과)은 무시해도 돼요.\n경계: 1이 없음(답 1), 1~n이 다 있음(답 n+1), 0과 음수만, `[1, 1]` 같은 중복, 2³¹ − 1 같은 큰 값.\n\n## 3. 브루트포스와 그 복잡도 (2분)\nk = 1부터 `k in nums`를 확인하며 올려요. 한 번 확인이 O(n)이고 최대 n+1번 → O(n²). n = 10만이면 50억 번이라 시간 초과예요.\n\n## 4. 병목 → 패턴 찾기 (핵심)\n**중간 풀이 ①: 해시 set (시간 O(n), 공간 O(n))**\n```python\nseen = set(nums)\nk = 1\nwhile k in seen:\n    k += 1\nreturn k\n```\n\"있나?\"를 O(1)로 바꿨으니 시간은 해결이에요(31장 기법 ①). 그런데 set이 n칸을 더 써요. 면접관은 \"공간을 O(1)로 줄여 보세요\"라고 할 거예요.\n\n**중간 풀이 ②: 정렬 (시간 O(n log n), 공간 O(1)에 가까움)**\n정렬하고 1부터 차례로 맞춰 가요. 공간은 줄었지만 시간이 O(n log n)이라 조건을 못 맞춰요.\n\n**병목은 \"있나?\" 표시판이 따로 필요하다는 것**이에요. 그런데 2단계에서 본 대로 의미 있는 값은 1~n뿐이고, 배열에는 칸이 정확히 n개 있어요. 값의 범위와 칸 번호의 범위가 같아요. 그러니 **배열 자체를 표시판으로** 쓰면 돼요. 31장 3단계의 직접 주소 지정(\"값이 곧 번호\")을 입력 배열 위에서 하는 거예요. 값 v를 v−1번 칸으로 바꿔치기해서 옮겨 두면, 마지막에 `nums[i] == i + 1`이 아닌 첫 i가 답이에요.\n\n트리거 단어: \"O(1) 추가 공간\", \"값이 1~n 범위(로 좁힐 수 있음)\", \"없는 수/중복된 수\" → 배열을 해시처럼 쓰기(제자리 놓기, cyclic sort).\n\n## 5. 코드\n```python\ndef first_missing_positive(nums):\n    n = len(nums)\n    for i in range(n):\n        while 1 <= nums[i] <= n and nums[nums[i] - 1] != nums[i]:\n            j = nums[i] - 1\n            nums[i], nums[j] = nums[j], nums[i]\n    for i in range(n):\n        if nums[i] != i + 1:\n            return i + 1\n    return n + 1\n```\n\n## 왜 이 코드가 정답인가\n- **불변식**: 첫 반복에서 바꿔치기가 끝나면, 1~n 사이 값 v가 배열에 있을 때 `nums[v - 1] == v`가 돼요. 한 번 제자리에 놓인 값은 다시 옮겨지지 않아요.\n- **빠뜨리지 않는 이유**: 답은 항상 1~n+1 안이에요(칸이 n개라 1~n을 다 채워야 n+1). 그래서 범위 밖 값(0, 음수, n 초과)은 버려도 되고, 두 번째 반복에서 `nums[i] != i + 1`인 첫 i가 비어 있는 가장 작은 양수 i + 1이에요.\n- **끝나는 이유**: 바꿔치기 한 번마다 값 하나가 제자리에 놓이고 그 값은 다시 안 움직이니, `while` 바꿔치기는 전부 합쳐 n번 이하예요. 그래서 O(n), 추가 공간 O(1)이에요.\n- **깨지는 가정**: `nums[nums[i] - 1] != nums[i]` 조건이 중복을 막아요. 이걸 `nums[i] != i + 1`로 바꾸면 `[1, 1]`에서 같은 값끼리 끝없이 바꿔요. 입력을 바꾸면 안 되는 조건이면 이 풀이는 못 써요.\n\n## 6. 예제로 추적 (확인)\n`[4, 3, 2, 7, 8, 2, 3, 1]`, n = 8\n| i | 바꿔치기 (i ↔ j) | 바꾼 뒤 배열 |\n|---|---|---|\n| 0 | 4를 3번 칸으로 (0 ↔ 3) | [7, 3, 2, 4, 8, 2, 3, 1] |\n| 0 | 7을 6번 칸으로 (0 ↔ 6) | [3, 3, 2, 4, 8, 2, 7, 1] |\n| 0 | 3을 2번 칸으로 (0 ↔ 2) | [2, 3, 3, 4, 8, 2, 7, 1] |\n| 0 | 2를 1번 칸으로 (0 ↔ 1) | [3, 2, 3, 4, 8, 2, 7, 1] |\n| 0 | 3: 2번 칸에 이미 3 → 멈춤 | (그대로) |\n| 1~3 | 이미 제자리이거나 목적지에 같은 값 | (그대로) |\n| 4 | 8을 7번 칸으로 (4 ↔ 7) | [3, 2, 3, 4, 1, 2, 7, 8] |\n| 4 | 1을 0번 칸으로 (4 ↔ 0) | [1, 2, 3, 4, 3, 2, 7, 8] |\n| 4 | 3: 2번 칸에 이미 3 → 멈춤 | (그대로) |\n| 5~7 | 멈춤 | [1, 2, 3, 4, 3, 2, 7, 8] |\n마지막 훑기: 4번 칸이 3 ≠ 5 → 답 **5** ✓. 바꿔치기는 모두 6번(≤ n)이에요.\n\n## 7. 복잡도\n`while`이 중첩돼 보여도, 바꿔치기 한 번마다 값 하나가 **제자리에 영원히 앉아요**(그 칸은 다시 바뀌지 않아요). 제자리는 n개뿐이라 바꿔치기는 전체에서 n번 이하 → **O(n)**. 32장의 \"안쪽 `while`을 전체에서 세는 법\"과 같은 논리예요. 추가 공간 **O(1)**.\n\n## 8. 흔한 오답과 채점기가 잡는 방식\n| 오답 | 증상 | 어디서 걸리나 |\n|---|---|---|\n| 1~n이 다 있을 때 `n`을 돌려줌 | 1 작게 나옴 | 손 케이스 「1..n이 다 있음」 |\n| 범위 검사 `<= n`을 빼먹음 | 큰 값에서 `IndexError` | 손 케이스 「1이 없음」 |\n| 멈춤 조건을 `nums[i] != i + 1`로 씀 | 중복에서 무한 루프 | 손 케이스 「같은 값만」 (안 끝나요. Ctrl+C) |\n| 한 줄 swap에서 칸 번호를 바뀐 값으로 계산 | 엉뚱한 칸을 덮거나 무한 루프 | 손 케이스 (안 끝나면 Ctrl+C) |\n| `k in nums`로 1부터 확인 | 정답이지만 O(n²) | 큰 입력 |\n| set 또는 정렬 | 통과하지만 공간 O(n) 또는 시간 O(n log n) | 채점기는 못 잡아요. 직접 확인 |\n\n## 9. 면접에서 30초로 설명하기\n\"길이 n이면 답은 1부터 n+1 사이라서 그 밖의 값은 무시해도 됩니다. 값의 범위와 인덱스 범위가 같으니 배열 자체를 해시처럼 씁니다. 각 값 v를 v−1번 칸으로 바꿔치기해 제자리에 앉히고, 목적지에 같은 값이 있으면 멈춰 중복을 처리합니다. 그 뒤 처음으로 nums[i]가 i+1이 아닌 곳이 답이고, 다 맞으면 n+1입니다. 바꿔치기마다 값 하나가 제자리에 고정되니 전체 O(n), 추가 공간 O(1)입니다.\"\n\n## 10. 면접관이 이어서 물을 것 (꼬리 질문)\n1. **바꿔치기 말고 다른 O(1) 방법은?** 부호 표시법이에요. 먼저 범위 밖 값(≤ 0 또는 > n)을 n+1로 바꿔요. 그다음 각 |v| ≤ n에 대해 `nums[|v|-1]`을 음수로 만들어 \"v 있음\"을 표시하고, 처음으로 양수인 칸 i가 답 i+1이에요.\n2. **입력 배열을 바꾸면 안 된다면?** O(n) 시간 + O(1) 공간은 사실상 불가능해요. set(O(n) 공간)이나 정렬된 복사본 중에 골라야 하고, 그 맞교환을 말하면 돼요. 실무 코드라면 호출자의 배열을 바꾸는 건 놀라운 부작용이라 문서로 남겨야 해요.\n3. **같은 기법을 쓰는 다른 문제는?** LeetCode 442 Find All Duplicates, 448 Find All Numbers Disappeared, 287 Find the Duplicate Number. 전부 \"값이 1~n\"이라는 조건이 신호예요.\n\n## 11. 다시 풀기\n3일 뒤, 1주 뒤, 2주 뒤에 **빈 파일에서** 다시 풀어요. 25분 안에 힌트 없이 O(1) 공간으로 통과하면 졸업. 비슷한 문제: LeetCode 448 Find All Numbers Disappeared in an Array, LeetCode 268 Missing Number.\n", "starter": "# LeetCode 41 — 함수 몸통을 채우세요.  채점: python algo/judge.py 31/lc0041\n\n\ndef first_missing_positive(nums: list[int]) -> int:\n    pass\n"}, {"id": "31/lc0380", "chapter": "31", "slug": "lc0380", "title": "LeetCode 380 Insert Delete GetRandom O(1)", "kind": "func", "ext": ".py", "tier": "Medium (LeetCode)", "role": "핵심", "target": "30분", "url": "https://leetcode.com/problems/insert-delete-getrandom-o1/", "time_limit": 0.3, "ref_time": 0.01444383300258778, "problem": "# LeetCode 380 Insert Delete GetRandom O(1)\n\n- 원문: https://leetcode.com/problems/insert-delete-getrandom-o1/\n- 난이도: Medium (LeetCode) · 역할: 핵심 · 목표 시간: 30분\n- 짝이 되는 장: 31. 배열과 해싱\n\n## 문제 (요약)\n정수를 담는 집합 클래스 `RandomizedSet`을 만들어요. 메서드 세 개가 **모두 평균 O(1)** 이어야 해요.\n- `insert(val)`: 없으면 넣고 `True`, 이미 있으면 아무것도 안 하고 `False`\n- `remove(val)`: 있으면 빼고 `True`, 없으면 `False`\n- `getRandom()`: 지금 들어 있는 값 중 하나를 **모두 같은 확률로** 골라 돌려줘요\n\n## 제약\n- 값은 -2³¹ 이상 2³¹ − 1 이하\n- 세 메서드 호출은 합쳐서 최대 200,000번\n- `getRandom`은 집합이 비어 있지 않을 때만 불려요\n\n## 함수 시그니처\n```python\nclass RandomizedSet:\n    def __init__(self): ...\n    def insert(self, val: int) -> bool: ...\n    def remove(self, val: int) -> bool: ...\n    def getRandom(self) -> int: ...\n```\n`my.py` 아래쪽의 `run_ops`는 채점기가 연산 목록을 실행하는 함수라서 고치지 않아요. 케이스의 `expected`에서 `getRandom` 자리가 `null`인 건 \"지금 들어 있는 값이면 무엇이든 정답\"이라는 뜻이에요. 채점기는 연산을 다시 돌려 보며 확인하고, 같은 집합에서 여러 번 뽑은 케이스에서는 고르게 뽑혔는지도 봐요.\n\n## 하는 법\n1. 이 파일과 원문만 보고 `my.py`에 풀어요. 타이머를 켜세요.\n2. `python algo/judge.py 31/lc0380` → 손 케이스, 큰 입력(시간), 스트레스(브루트포스와 비교) 순서로 채점해요. 채점기는 함수를 강제로 끊지 않아서, 느린 풀이는 큰 입력에서 몇 초 기다린 뒤에 실패로 나와요.\n3. 막히면 `hints.md`를 **한 단계씩만** 열어요. 다 풀었거나 목표 시간의 2배가 지나면 `walkthrough.md`를 읽어요.\n4. 통과했으면 LeetCode에도 제출해 보고, `../../log.md`에 기록해요.\n", "hints": "# 힌트 (한 번에 하나씩)\n\n<details><summary>힌트 1: 하나로는 안 되는 이유<\/summary>\n\n자료구조 하나씩 따져 보세요. `set`/`dict`는 넣기·빼기·있나가 O(1)이지만, \"아무거나 하나 **같은 확률로**\"를 하려면 번호가 필요해요(31장 가격표: 해시는 \"i번째 꺼내기\"가 안 돼요). `list`는 `random.choice`가 O(1)이지만 \"있나\"와 \"중간 빼기\"가 O
