<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F7F6FB" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0F0E17" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Iolite 실전</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("iolite-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
/* Layout: 셀프 체크와 같은 OMR 답안지 팔레트. 목록 화면 → 문제 화면(왼쪽 지문·힌트·해설, 오른쪽 편집기·채점 결과) */
:root{ /* Iolite와 같은 자수정 팔레트 */
  --bg:#F7F6FB; --surface:#fff; --ink:#1C1A29; --muted:#5B5870; --line:#E3E0EE;
  --omr:#5B4BC4; --omr-soft:#ECE9FB; --ok:#1F7A4D; --ok-soft:#E3F3EA; --half:#9A5B00; --half-soft:#FBF0DC; --bad:#C0362C; --bad-soft:#FBE7E5;
  --code-bg:#EFEDF7; --on-omr:#fff;
  --f-body:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0F0E17; --surface:#1A1826; --ink:#F2F0FA; --muted:#A9A5BF; --line:#2E2B40;
  --omr:#9D8FF5; --omr-soft:#2A2550; --ok:#4CC38A; --ok-soft:#16301F; --half:#F0B44C; --half-soft:#33280F; --bad:#FF7B6E; --bad-soft:#3A1C19; --code-bg:#151320; --on-omr:#15112E; color-scheme:dark}
@media (prefers-color-scheme: dark){:root[data-theme="system"]{
  --bg:#0F0E17; --surface:#1A1826; --ink:#F2F0FA; --muted:#A9A5BF; --line:#2E2B40;
  --omr:#9D8FF5; --omr-soft:#2A2550; --ok:#4CC38A; --ok-soft:#16301F; --half:#F0B44C; --half-soft:#33280F; --bad:#FF7B6E; --bad-soft:#3A1C19; --code-bg:#151320; --on-omr:#15112E; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
a{color:var(--omr)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px}
button:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
button.primary{background:var(--omr);border-color:var(--omr);color:var(--on-omr);font-weight:700}
button:disabled{opacity:.5;cursor:default}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);background:var(--surface)}
header.top h1{font-size:1.1rem;margin:0}
.engine{font-size:.82rem;color:var(--muted);font-family:var(--f-mono)}
.engine.ready{color:var(--ok)}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:.75rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.A{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.B{background:var(--half-soft);color:var(--half);border-color:transparent}
.chip.C,.chip.due{background:var(--bad-soft);color:var(--bad);border-color:transparent}
a.back{font-weight:700;text-decoration:none;color:var(--omr)}
.codetab,.codetab-bar{display:none}
html,body{overflow-x:hidden;max-width:100%}
@media (max-width:900px){.CodeMirror{font-size:16px!important}textarea,input{font-size:16px!important}.split{padding:10px 12px}.codetab{display:inline-block}.codetab-bar{display:flex}.split[data-view=doc] .pane.ed{display:none}.split[data-view=code] .pane.docp{display:none}.doc{max-height:none}.CodeMirror{height:58vh}}
.chapter h2{font-size:.85rem;color:var(--muted);margin:22px 0 6px;font-weight:700}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 14px;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent}
.row:first-child{border-top:0}
.row:hover{background:var(--omr-soft)}
.row .t{min-width:0;overflow-wrap:anywhere}
.row .r{font-size:.78rem;color:var(--muted)}
.due-box{background:var(--surface);border:1px solid var(--omr);border-radius:10px;padding:12px 14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;padding:16px 20px;max-width:1500px;margin:0 auto}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 12px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.doc{padding:4px 18px 18px;overflow:auto;max-height:calc(100vh - 170px)}
.doc pre{background:var(--code-bg);padding:10px 12px;border-radius:6px;overflow:auto;font-family:var(--f-mono);font-size:.85rem}
.doc code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:0 4px;border-radius:4px}
.doc pre code{padding:0;background:none}
.doc table{border-collapse:collapse;display:block;overflow-x:auto;font-size:.88rem}
.doc td,.doc th{border:1px solid var(--line);padding:4px 8px}
.doc details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0}
.doc summary{cursor:pointer;font-weight:500}
.lock{padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.CodeMirror{height:430px;font-family:var(--f-mono);font-size:14px;border-bottom:1px solid var(--line)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px}
.timer{font-family:var(--f-mono);color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.out{margin:0 10px 10px;background:var(--code-bg);border-radius:8px;padding:10px 12px;font-family:var(--f-mono);font-size:.84rem;white-space:pre-wrap;overflow:auto;max-height:300px;min-height:60px}
.out .ok{color:var(--ok)} .out .bad{color:var(--bad)}
.verdict{margin:0 10px 10px;padding:10px 12px;border-radius:8px;font-weight:500}
.verdict.pass{background:var(--ok-soft);color:var(--ok)} .verdict.fail{background:var(--bad-soft);color:var(--bad)}
.note{color:var(--muted);font-size:.85rem}
textarea.export{width:100%;min-height:140px;font-family:var(--f-mono);font-size:.82rem;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
</style>
</head>
<body data-page="practice">
<header class="top"><a class="back" id="to-iolite" href="./#prac" hidden>‹ Iolite</a><h1>알고리즘 실전</h1><span class="engine" id="engine">파이썬 엔진 불러오는 중…</span></header>
<div id="app"></div>
<script id="iolite-main" type="text/plain">
const DATA = __CART.practice; // 카트리지의 알고리즘 실전 묶음 (tools/cart_loader.js)
const P = Object.fromEntries(DATA.problems.map(p => [p.id, p]));
const KEY = "algo-practice-v1";
let store = {code: {}, attempts: {}, scale: {}, opened: {}, hints: {}, walk: {}};
try { Object.assign(store, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
/* Iolite 안에서 열렸으면(같은 사이트) 통과 기록을 Iolite 기록(csnotes-selfcheck-v1의 prac)에 바로 남겨요.
   다시 풀 날도 Iolite 기록 기준으로 계산해요. 파일로 연 연습장(algo/web)은 예전처럼 이 페이지 기록만 써요. */
const IN_IOLITE = location.protocol.startsWith("http");
const IKEY = "csnotes-selfcheck-v1";
const iload = () => { try { return JSON.parse(localStorage.getItem(IKEY) || "{}") || {}; } catch (e) { return {}; } };
function ipush(id, a) {
  const st = iload(); st.prac = st.prac || {};
  const arr = st.prac[id] = st.prac[id] || [];
  if (arr.some(x => x.date === a.date && x.grade === a.grade && (x.min === a.minutes || x.ts === a.ts))) return;
  arr.push({ts: a.ts || Date.now(), date: a.date, grade: a.grade, min: a.minutes, hints: a.hints, src: "practice"});
  arr.sort((p, q) => (p.ts || 0) - (q.ts || 0));
  try { localStorage.setItem(IKEY, JSON.stringify(st)); } catch (e) {}
}
if (IN_IOLITE) { // 예전에 이 페이지에만 남은 통과 기록을 한 번 옮겨요
  document.getElementById("to-iolite").hidden = false;
  if (!store.migrated) { for (const [id, arr] of Object.entries(store.attempts)) for (const a of arr) if (a.pass) ipush(id, {...a, ts: Date.parse(a.date + "T12:00:00")}); store.migrated = true; save(); }
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const ymd = t => `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;  // 내 시간대 기준 날짜
const today = () => ymd(new Date());
const addDays = (d, n) => { const t = new Date(d + "T00:00:00"); t.setDate(t.getDate() + n); return ymd(t); };
const app = document.getElementById("app");

/* ---------- 파이썬 워커 (Pyodide) ---------- */
const WORKER_SRC = `
importScripts("https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js");
let py;
const ready = (async () => { py = await loadPyodide(); return py; })();
let sqlLoaded = false;
onmessage = async (e) => {
  const m = e.data;
  try {
    await ready;
    if (m.type === "init") {
      for (const [p, c] of Object.entries(m.files)) {
        const full = "/algo/" + p;
        const dir = full.slice(0, full.lastIndexOf("/"));
        py.FS.mkdirTree(dir);
        py.FS.writeFile(full, c);
      }
      py.runPython("import sys; sys.path.insert(0, '/algo/web'); import webjudge");
      postMessage({type: "ready"});
    } else if (m.type === "judge") {
      if (m.kind === "sql" && !sqlLoaded) { await py.loadPackage("sqlite3"); sqlLoaded = true; }
      py.FS.writeFile("/algo/" + m.pdir + "/" + m.file, m.code);
      py.globals.set("_a", py.toPy([m.pdir, m.file, m.scale, m.rounds]));
      const r = py.runPython("webjudge.run(*_a)").toJs();
      postMessage({type: "result", id: m.id, ok: r[0], out: r[1]});
    } else if (m.type === "exec") {
      py.globals.set("_c", m.code); py.globals.set("_i", m.stdin || "");
      const out = py.runPython(\`
import sys, io, contextlib, traceback
_o = io.StringIO(); _old = sys.stdin
sys.stdin = io.TextIOWrapper(io.BytesIO(_i.encode()), encoding="utf-8")
try:
    with contextlib.redirect_stdout(_o):
        exec(compile(_c, "답안", "exec"), {"__name__": "__main__"})
    _r = _o.getvalue()
except SystemExit:
    _r = _o.getvalue()
except BaseException:
    _r = _o.getvalue() + chr(10) + traceback.format_exc(limit=4)
finally:
    sys.stdin = _old
_r\`);
      postMessage({type: "exec", id: m.id, out});
    } else if (m.type === "calib") {
      py.globals.set("_p", m.pdir);
      const t = py.runPython("webjudge.ref_time(_p)");
      postMessage({type: "calib", id: m.id, t: t === undefined ? null : t});
    }
  } catch (err) {
    postMessage({type: "error", id: m.id, msg: String(err && err.message || err)});
  }
};`;
let worker, workerReady, pending = {}, seq = 0;
const engineEl = document.getElementById("engine");
function startWorker() {
  worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], {type: "text/javascript"})));
  workerReady = new Promise((res, rej) => {
    worker.onmessage = e => {
      const m = e.data;
      if (m.type === "ready") { engineEl.textContent = "파이썬 준비됨 (브라우저 안에서 채점)"; engineEl.className = "engine ready"; res(); return; }
      const cb = pending[m.id]; if (cb) { delete pending[m.id]; cb(m); }
    };
    worker.onerror = e => { engineEl.textContent = "파이썬 엔진 오류: " + (e.message || "인터넷 연결을 확인하세요"); rej(e); };
  });
  worker.postMessage({type: "init", files: DATA.files});
}
startWorker();
function call(msg, timeoutMs) {
  return new Promise(async (res) => {
    await workerReady;
    const id = ++seq;
    const timer = setTimeout(() => {
      delete pending[id];
      worker.terminate();
      engineEl.textContent = "파이썬 다시 불러오는 중…"; engineEl.className = "engine";
      startWorker();
      res({type: "timeout"});
    }, timeoutMs);
    pending[id] = m => {
      clearTimeout(timer);
      if (m.type === "error" && /fatally|call stack|RangeError/i.test(m.msg)) {  // 파이썬이 죽었으면 새로 띄워요
        worker.terminate(); engineEl.textContent = "파이썬 다시 불러오는 중…"; engineEl.className = "engine"; startWorker();
        m.msg = "브라우저 안 파이썬의 스택이 넘쳤어요. 재귀가 아주 깊거나(수천 단계 이상) 노드 수만 개를 직접 만든 경우예요. 반복문으로 바꾸거나 터미널 채점기(python algo/judge.py)로 확인하세요.";
      }
      res(m);
    };
    worker.postMessage({...msg, id});
  });
}

/* ---------- 기록과 다시 풀기 ---------- */
const GAPS = {A: [30], B: [3, 10], C: [1, 3, 7]};
function status(id) {
  const a = IN_IOLITE ? ((iload().prac || {})[id] || []) : (store.attempts[id] || []).filter(x => x.pass);
  if (!a.length) return null;
  const last = a[a.length - 1];
  const sameGrade = a.filter(x => x.grade === last.grade).length;
  const gaps = GAPS[last.grade];
  const due = sameGrade <= gaps.length ? addDays(last.date, gaps[sameGrade - 1]) : null;
  return {grade: last.grade, date: last.date, due};
}
function dueList() {
  return DATA.problems.filter(p => { const s = status(p.id); return s && s.due && s.due <= today(); });
}

/* ---------- 목록 화면 ---------- */
function home() {
  location.hash = "";
  const solved = DATA.problems.filter(p => status(p.id)).length;
  const due = dueList();
  let h = `<div class="wrap"><p class="note">책의 20·30~43장 실전 문제 ${DATA.problems.length}개. 코드는 이 브라우저 안의 파이썬(Pyodide)에서 돌아가고, 터미널의 <code>python algo/judge.py</code>와 같은 세 단계(손 케이스 → 큰 입력 시간 → 브루트포스 비교)로 채점해요. 첫 실행 때 파이썬을 내려받아서 인터넷이 필요해요.</p>
  <div class="chips"><span class="chip">통과 ${solved} / ${DATA.problems.length}</span><button id="export">기록 내보내기 (log.md 형식)</button></div>`;
  h += mockListHtml();
  if (due.length) h += `<div class="due-box" style="margin-top:14px"><b>오늘 다시 풀 문제 ${due.length}개</b><p class="note">빈 파일에서 다시 풀어요. 목표 시간 안에 힌트 없이 통과하면 간격이 늘어나요.</p><div class="rows">${due.map(rowHtml).join("")}</div></div>`;
  for (const [ch, title] of Object.entries(DATA.chapters)) {
    const ps = DATA.problems.filter(p => p.chapter === ch);
    h += `<section class="chapter"><h2>${esc(title)}</h2><div class="rows">${ps.map(rowHtml).join("")}</div></section>`;
  }
  h += `<div id="exp"></div></div>`;
  app.innerHTML = h;
  app.querySelectorAll(".row[data-id]").forEach(b => b.onclick = () => openProblem(b.dataset.id));
  app.querySelectorAll("[data-mock]").forEach(b => b.onclick = () => openMock(b.dataset.mock));
  document.getElementById("export").onclick = exportLog;
}
function rowHtml(p) {
  const s = status(p.id);
  const chip = s ? `<span class="chip ${s.grade}">${s.grade} · ${s.date.slice(5)}</span>${s.due ? `<span class="chip ${s.due <= today() ? "due" : ""}">다음 ${s.due.slice(5)}</span>` : ""}` : `<span class="chip">${esc(p.target || "")}</span>`;
  return `<button class="row" data-id="${p.id}"><span class="t">${esc(p.title)} <span class="r">· ${esc(p.tier)} · ${esc(p.role)}</span></span><span class="chips">${chip}</span></button>`;
}
function exportLog() {
  const lines = [];
  for (const p of DATA.problems) for (const a of (store.attempts[p.id] || []).filter(x => x.pass)) {
    const s = status(p.id);
    lines.push(`| ${a.date} | ${p.id} | ${a.minutes}분 | ${a.hints} | ${a.grade} | ${s && s.due || "졸업"} | ${a.note || ""} |`);
  }
  document.getElementById("exp").innerHTML = `<p class="note">아래를 복사해서 <code>algo/log.md</code> 표에 붙이세요.</p><textarea class="export" id="exptext" readonly>${esc(lines.sort().join("\n") || "아직 통과한 문제가 없어요.")}</textarea>`;
  document.getElementById("exptext").select();
}

/* ---------- 문제 화면 ---------- */
let cm, cur, tickTimer, lastTab = "problem";
function openProblem(id) {
  cur = P[id];
  location.hash = id;
  if (!store.opened[id] || store.opened[id].day !== today()) { store.opened[id] = {day: today(), at: Date.now()}; store.hints[id] = 0; store.walk[id] = false; save(); }
  app.innerHTML = `<div class="split" id="split" data-view="doc">
    <div class="pane docp"><div class="tabs" id="tabs">
      <button id="back">← 목록</button><button data-t="problem" aria-pressed="true">문제</button><button data-t="hints">힌트</button><button data-t="walk">해설</button><button class="codetab" data-t="code">코드</button>
    </div><div class="doc" id="doc"></div></div>
    <div class="pane ed"><div class="tabs codetab-bar"><button class="codetab" id="to-doc">← 문제 보기</button></div><textarea id="code"></textarea>
      <div class="bar"><button class="primary" id="run">채점</button><button id="reset">시작 코드로</button><button id="copy">코드 복사</button><a id="tutor" class="note" href="#" target="_blank" rel="noopener" title="첫 손 케이스로 한 줄씩 실행해 변수 변화를 봐요">한 줄씩 실행 보기 ↗</a><span class="timer" id="timer"></span></div>
      <div id="verdict"></div><div class="out" id="out">채점 결과가 여기에 나와요. 단계: 손 케이스 → 큰 입력(시간) → 스트레스(브루트포스와 비교).</div>
    </div></div>`;
  document.getElementById("back").onclick = () => { clearInterval(tickTimer); if (IN_IOLITE) location.href = "./#prac"; else home(); };
  document.querySelectorAll("#tabs [data-t]").forEach(b => b.onclick = () => showTab(b.dataset.t));
  cm = CodeMirror.fromTextArea(document.getElementById("code"), {
    mode: cur.kind === "sql" ? "text/x-sqlite" : "python", lineNumbers: true, lineWrapping: matchMedia("(max-width:900px)").matches, indentUnit: 4, tabSize: 4, indentWithTabs: false,
    extraKeys: {Tab: c => c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection("    "), "Ctrl-Enter": runJudge, "Cmd-Enter": runJudge},
  });

      <p class="note">해설: <a href="#${x.id}">문제 화면에서 해설 탭</a> (흔한 오답 표와 30초 설명은 꼭)</p></details>`).join("")}</div>
    <p class="note">0 = 손 케이스 실패·미제출 · 40 = 큰 입력에서 실패 · 70 = 스트레스 반례 · 100 = 전부 통과. 못 푼 문제는 C로 기록돼 1·3·7일 뒤 다시 풀기에 올라가요.</p>
    <p class="note"><b>자기 평가 (각 1~4)</b> 소통 · 문제 해결 · 기술 · 테스트, 그리고 가장 크게 시간을 잃은 곳 한 줄:</p>
    <textarea id="self" class="export" style="min-height:80px" placeholder="소통 3, 문제 해결 2, 기술 3, 테스트 2. B-2에서 방향 전환 처리를 손으로 안 따라가서 25분 잃음"></textarea>
    <div class="bar" style="padding:8px 0"><button class="primary" id="saveself">평가 저장</button><button id="back">← 목록</button></div></div>`;
  document.getElementById("back").onclick = backToList;
  document.getElementById("saveself").onclick = () => { rec.self = document.getElementById("self").value; if (IN_IOLITE) { const st = iload(); const arr = (st.mock || {})[m.set] || []; const r = arr.find(x => x.ts === rec.ts); if (r) r.self = rec.self; try { localStorage.setItem(IKEY, JSON.stringify(st)); } catch (e) {} } save(); backToList(); };
}
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id.startsWith("mock-")) { if (!document.getElementById("mock")) openMock(id.slice(5)); } else if (id && P[id] && (!cur || cur.id !== id)) openProblem(id); });
const start = location.hash.slice(1);
if (start.startsWith("mock-") && MOCK[start.slice(5)]) openMock(start.slice(5)); else if (start && P[start]) openProblem(start); else home();
</script>
<script>/* Iolite 카트리지 꽂기 (공개 앱에는 공부 내용이 없어요).
   카트리지 = 노트 하나의 내용 전부를 담은 JSON 파일 하나(docs/CARTRIDGE.md).
   꽂는 법: ① 파일에서 고르기 ② 내 비공개 GitHub 저장소의 cartridges/ 폴더에서 받기(기록 동기화와 같은 토큰).
   꽂은 카트리지는 이 기기 브라우저(IndexedDB)에만 저장돼요. 다 읽으면 #iolite-main 스크립트를 실행해요. */
(function(){
  const DB="iolite", ST="carts", AKEY="iolite-cart-active", GHKEY="csnotes-gh-v1", DIR="cartridges";
  const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open(DB,1); r.onupgradeneeded=()=>r.result.createObjectStore(ST,{keyPath:"id"}); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error);});
  const tx=async(mode,fn)=>{const d=await idb(); return new Promise((ok,no)=>{const t=d.transaction(ST,mode); const q=fn(t.objectStore(ST)); t.oncomplete=()=>ok(q&&q.result); t.onerror=()=>no(t.error);});};
  const all=()=>tx("readonly",s=>s.getAll()), put=c=>tx("readwrite",s=>s.put(c)), del=id=>tx("readwrite",s=>s.delete(id));
  const gh=()=>{try{const g=JSON.parse(localStorage.getItem(GHKEY)); return g&&g.owner&&g.repo&&g.token?g:null}catch(e){return null}};
  const active=()=>{try{return localStorage.getItem(AKEY)}catch(e){return null}}, setActive=id=>{try{localStorage.setItem(AKEY,id)}catch(e){}};
  function check(c){ // 카트리지 형식 검사: 형식 이름, id, 제목, 장 목록
    if(!c||c.format!=="iolite-cartridge") throw new Error("Iolite 카트리지 파일이 아니에요");
    if(!c.id||!/^[a-z0-9-]+$/.test(c.id)) throw new Error("카트리지 id가 없거나 이상해요");
    if(!c.title||!Array.isArray(c.chapters)||!c.chapters.length) throw new Error("제목이나 장 목록이 비었어요");
    c.chapters.forEach((ch,i)=>{ if(!ch||!ch.num||!ch.title) throw new Error(`${i+1}번째 장에 num이나 title이 없어요`); ch.self=ch.self||[]; ch.quick=ch.quick||[]; ch.sessions=ch.sessions||[]; ch.optional=ch.optional||[]; });
    return c;
  }
  async function ghFetch(g,path,raw){
    const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}?t=${Date.now()}`,{headers:{"Authorization":"Bearer "+g.token,"Accept":raw?"application/vnd.github.raw":"application/vnd.github+json"}});
    if(r.status===404) return null; if(!r.ok) throw new Error("GitHub "+r.status); return raw?r.text():r.json();
  }
  async function fromGitHub(g){ // cartridges/*.json 을 전부 받아 꽂아요. 바뀐 것(sha)만 다시 받아요
    const list=await ghFetch(g,DIR); if(!Array.isArray(list)) return 0;
    const have=Object.fromEntries((await all()).map(c=>[c.id,c.src&&c.src.sha]));
    let n=0;
    for(const f of list.filter(f=>f.type==="file"&&/\.json$/.test(f.name))){
      if(Object.values(have).includes(f.sha)) continue;
      const c=check(JSON.parse(await ghFetch(g,f.path,true))); c.src={kind:"github",path:f.path,sha:f.sha}; await put(c); n++;
    }
    return n;
  }
  async function fromFile(file){ const c=check(JSON.parse(await file.text())); c.src={kind:"file",name:file.name}; await put(c); setActive(c.id); return c; }
  const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
  const pickFile=()=>new Promise(ok=>{const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json"; i.onchange=()=>ok(i.files[0]||null); i.click();});
  function emptyView(msg){ // 카트리지가 없을 때: 빈 Iolite
    const app=document.getElementById("app"), g=gh();
    if(document.body.dataset.page==="practice"){ app.innerHTML=`<div class="wrap"><p class="note">${esc(msg||"꽂은 카트리지가 없어요.")} <a href="./">Iolite</a>에서 카트리지를 먼저 꽂아요.</p></div>`; return; }
    app.innerHTML=`<header><h1 class="word">Iolite</h1></header>
    <div class="card"><p class="q">카트리지를 꽂아 주세요</p><p class="note">Iolite는 빈 공부 앱이에요. 노트 카트리지(JSON 파일 하나)를 꽂으면 그 노트로 회차 타이머, 체크, 간격 복습을 할 수 있어요. 카트리지는 이 기기 안에만 저장돼요.</p>
      <div class="bar"><button class="primary" id="cart-file">파일에서 꽂기</button></div></div>
    <div class="card"><p class="q">내 GitHub 저장소에서 받기</p><p class="note">비공개 저장소의 <code>${DIR}/</code> 폴더에 있는 카트리지를 받아요. 같은 저장소의 records.json에 공부 기록도 동기화돼요. 토큰은 이 기기에만 저장돼요.</p>
      <input id="cg-owner" placeholder="GitHub 아이디" value="${esc(g?g.owner:"")}" autocapitalize="off"><input id="cg-repo" placeholder="저장소 이름" value="${esc(g?g.repo:"")}" autocapitalize="off"><input id="cg-token" type="password" placeholder="${g?"저장된 토큰 쓰기":"토큰 (Contents 읽기·쓰기)"}">
      <div class="bar"><button id="cart-gh">받기</button></div></div>
    <p class="note" id="cart-msg" role="status">${esc(msg||"")}</p>`;
    const say=t=>{document.getElementById("cart-msg").textContent=t};
    document.getElementById("cart-file").onclick=async()=>{const f=await pickFile(); if(!f) return; try{await fromFile(f); location.reload();}catch(e){say(e.message)}};
    document.getElementById("cart-gh").onclick=async()=>{
      const o=document.getElementById("cg-owner").value.trim(), r=document.getElementById("cg-repo").value.trim(), t=document.getElementById("cg-token").value.trim()||(g&&g.token);
      if(!o||!r||!t){say("아이디, 저장소, 토큰을 모두 넣어요");return}
      const ng={owner:o,repo:r,token:t,path:"records.json"}; say("받는 중…");
      try{ const n=await fromGitHub(ng); if(!n&&!(await all()).length){say(`${o}/${r}의 ${DIR}/ 폴더에 카트리지가 없어요`);return} localStorage.setItem(GHKEY,JSON.stringify(ng)); location.reload(); }catch(e){say("못 받았어요: "+e.message)}
    };
  }
  function runMain(c,list){
    if(document.body.dataset.page==="practice"&&!c.practice){ emptyView(`'${c.title}' 카트리지에는 알고리즘 실전 문제가 없어요.`); return; }
    window.__CART=c;
    window.IoliteCart={list:list.map(x=>({id:x.id,title:x.title,sub:x.sub||"",src:x.src})),active:c.id,
      use:id=>{setActive(id); location.reload();},
      addFile:async()=>{const f=await pickFile(); if(!f) return; const n=await fromFile(f); location.reload(); return n;},
      refresh:async()=>{const g=gh(); if(!g) throw new Error("GitHub 연결이 없어요"); const n=await fromGitHub(g); if(n) location.reload(); return n;},
      remove:async id=>{await del(id); if(id===active()) try{localStorage.removeItem(AKEY)}catch(e){} location.reload();}};
    const s=document.createElement("script"); s.textContent=document.getElementById("iolite-main").textContent; document.body.appendChild(s);
  }
  async function boot(){
    if(window.__CART_INLINE){ runMain(window.__CART_INLINE,[window.__CART_INLINE]); return; } // 로컬 파일용 빌드(내용이 페이지에 들어 있음)
    let list=[]; try{list=await all()}catch(e){ emptyView("이 브라우저는 카트리지를 저장할 수 없어요(사파리 개인정보 보호 모드라면 끄고 열어요)"); return; }
    const g=gh();
    if(!list.length&&g){ document.getElementById("app").innerHTML=`<p class="note" style="padding:24px">카트리지를 받는 중…</p>`; try{await fromGitHub(g); list=await all();}catch(e){ emptyView("GitHub에서 카트리지를 못 받았어요: "+e.message); return; } }
    if(!list.length){ emptyView(); return; }
    const c=list.find(x=>x.id===active())||list[0];
    runMain(c,list);
    if(g) setTimeout(()=>fromGitHub(g).catch(()=>{}),4000); // 새 버전은 다음에 열 때 반영돼요
  }
  boot();
})();
</script>
