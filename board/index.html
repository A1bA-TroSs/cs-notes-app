<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Iolite 디자인 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@800&amp;text=Iolite&amp;display=swap">
<style>
/* Iolite design board v2 — "the jeweler's atelier", carried through every screen.
   1 Layout: every screen = header → bench (the one object, under a warm lamp) → one primary action in thumb reach → details in velvet trays.
   2 Material: night velvet ground, inset trays, a single champagne-gold hairline as the only metal.
   3 Colour roles: water = rough/unread, violet = being cut, honey = polished. Nothing else carries colour.
   4 Type: SUIT only (serif only in the wordmark). Scale 28/20/16/14/12, fixed weights, engraved labels, tabular numbers. */
.t-dark{--bg:#110F1A;--tray:#0C0A14;--surface:#1A1728;--s2:#242036;--line:#2A2640;--ink:#EFEBF8;--sub:#A8A2BE;--mute:#7F7996;
 --gold:#C9AE7C;--goldA:rgba(201,174,124,.38);--pri:#A99CFF;--onpri:#15112E;--violet:#9A82FF;--water:#5BB0E6;--honey:#F0B93A;--honeyInk:#F6D27A;
 --violetT:rgba(154,130,255,.14);--waterT:rgba(91,176,230,.13);--honeyT:rgba(240,185,58,.14);--uncut:#2A2639;--uncut2:#232030;--table:#16131F;--gap:#110F1A;
 --lamp:radial-gradient(closest-side,rgba(255,214,150,.13),rgba(255,214,150,.04) 55%,transparent);--velvet:radial-gradient(120% 90% at 30% 0%,#2C2470 0%,#1B1650 45%,#120F33 100%);
 --tabbg:#15121F;--shadowIn:inset 0 1px 0 rgba(255,255,255,.035),inset 0 -1px 0 rgba(0,0,0,.4)}
.t-light{--bg:#F4F1F8;--tray:#ECE7F3;--surface:#FFFFFF;--s2:#E6E0EF;--line:#DDD6E8;--ink:#1B1730;--sub:#5E5873;--mute:#7A7490;
 --gold:#9C7B45;--goldA:rgba(156,123,69,.35);--pri:#5443C8;--onpri:#FFFFFF;--violet:#6E4FD6;--water:#2F86BF;--honey:#D9981A;--honeyInk:#8A5F07;
 --violetT:rgba(110,79,214,.10);--waterT:rgba(47,134,191,.10);--honeyT:rgba(217,152,26,.12);--uncut:#E3DDEF;--uncut2:#D9D2E8;--table:#FBFAFE;--gap:#F4F1F8;
 --lamp:radial-gradient(closest-side,rgba(255,200,120,.22),rgba(255,200,120,.06) 55%,transparent);--velvet:radial-gradient(120% 90% at 30% 0%,#6F5DE0 0%,#4C3DB8 50%,#33297F 100%);
 --tabbg:#FFFFFF;--shadowIn:inset 0 1px 2px rgba(40,20,90,.06)}
*{box-sizing:border-box}
body{margin:0;background:#08070C;color:#ddd;font-family:"SUIT Variable",-apple-system,sans-serif}
.intro{padding:40px 48px 0;color:#bdb8cc;max-width:980px;font-size:14px;line-height:1.7}
.intro b{color:#fff}
.board{display:flex;flex-wrap:wrap;gap:72px 48px;padding:40px 48px 80px}
.fwrap{display:flex;flex-direction:column;gap:10px}
.fname{font-size:13px;color:#9a96ad;font-weight:600}
.frame{width:390px;height:844px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);font-family:"SUIT Variable",-apple-system,sans-serif;font-size:14px;line-height:1.55;border-radius:38px;box-shadow:0 0 0 1px #262335}
.sheet{width:1280px;height:900px;border-radius:20px}
/* type scale */
.t28{font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.4px;margin:0}
.t20{font-size:20px;line-height:27px;font-weight:700;letter-spacing:-.2px;margin:0}
.t16{font-size:16px;line-height:24px;font-weight:600;margin:0}
.t14{font-size:14px;line-height:22px;font-weight:400;margin:0;color:var(--sub)}
.t12{font-size:12px;line-height:17px;font-weight:500;margin:0;color:var(--mute)}
.eng{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.14em;color:var(--gold);margin:0}
.num{font-variant-numeric:tabular-nums}
/* anatomy */
.scr{position:absolute;inset:0;padding:52px 20px 96px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.hdr{display:flex;align-items:center;gap:10px;min-height:36px}
.hdr .logo{width:30px;height:30px;object-fit:contain}
.hdr .word{font-family:"Noto Serif KR",Georgia,serif;font-weight:800;font-size:22px;letter-spacing:-.3px}
.hdr .ctx{margin-left:auto;font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center}
.hair{height:1px;background:linear-gradient(90deg,transparent,var(--goldA) 18%,var(--goldA) 82%,transparent)}
.bench{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 4px;text-align:center}
.bench::before{content:"";position:absolute;left:50%;top:-6px;width:340px;height:300px;transform:translateX(-50%);background:var(--lamp);pointer-events:none}
.bench>*{position:relative}
.act{display:flex;flex-direction:column;gap:8px}
.btn{height:52px;border-radius:16px;border:0;font:800 16px "SUIT Variable";display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.pri{background:var(--pri);color:var(--onpri)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600;font-size:15px;height:46px}
.btn.sm{height:38px;width:auto;padding:0 14px;font-size:13px;font-weight:600;border-radius:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tray{background:var(--tray);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadowIn);border:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kv .k{font-size:14px;font-weight:600;color:var(--ink)}.kv .v{font-size:14px;color:var(--sub)}.kv .v.done{color:var(--honeyInk)}
.field{border-radius:14px;padding:12px 14px;color:var(--mute);font-size:14px;background:var(--surface);border:1px solid var(--line)}
.ans{border-radius:16px;padding:14px;font-size:14px;line-height:22px;white-space:pre-line;background:var(--surface);border:1px solid var(--line)}
.ans .eng{margin-bottom:6px}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;letter-spacing:.02em}
.c-w{background:var(--waterT);color:var(--water)}.c-v{background:var(--violetT);color:var(--violet)}.c-h{background:var(--honeyT);color:var(--honeyInk)}.c-n{background:var(--s2);color:var(--sub)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade div{border-radius:14px;padding:11px 4px;text-align:center;font-weight:800;font-size:14px}
.grade small{display:block;font-weight:500;font-size:11px;margin-top:1px}
.g1{background:var(--waterT);color:var(--water)}.g2{background:var(--violetT);color:var(--violet)}.g3{background:var(--honeyT);color:var(--honeyInk)}
/* tab bar: velvet with a gold diamond above the active tab */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--tabbg);border-top:1px solid var(--line);display:flex;padding:8px 6px 26px}
.tabbar::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--goldA),transparent)}
.tabbar span{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:11px;color:var(--mute);position:relative;font-weight:500}
.tabbar span.on{color:var(--ink);font-weight:700}
.tabbar span.on::before{content:"";position:absolute;top:-6px;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);border-radius:1px}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar span.on svg{color:var(--pri)}
/* appraisal tag (서재 summary card) */
.tag{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px 16px 16px 6px;padding:14px 14px 14px 30px;display:flex;flex-direction:column;gap:8px}
.tag::before{content:"";position:absolute;left:11px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--goldA)}
.tag::after{content:"";position:absolute;left:-16px;top:50%;width:27px;height:1px;background:var(--goldA)}
.tag.empty{background:transparent;border-style:dashed}
.veil{height:9px;border-radius:5px;background:var(--s2)}
.velvetbox{border-radius:26px;background:var(--velvet);padding:18px;display:flex;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.shelf{display:flex;flex-direction:column;gap:8px}
.stones{display:flex;flex-wrap:wrap;gap:8px 10px;padding:10px 0 12px;position:relative}
.stones::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:var(--line);box-shadow:0 1px 0 var(--goldA)}
.stone{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--sub)}
.loupe{display:flex;align-items:center;gap:10px;border-radius:14px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);color:var(--mute)}
.loupe svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.8}
.big{font-size:44px;line-height:1;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.sheet .scr{padding:40px;flex-direction:row;flex-wrap:wrap;gap:30px;align-content:flex-start}
.grp{display:flex;flex-direction:column;gap:10px}
.ann{font-size:12px;color:var(--mute);max-width:280px}
</style>
</head>
<body>
<div class="intro"><b>Iolite 디자인 보드 v2 · 보석 아틀리에</b><br>모든 화면이 같은 구조예요: 머리말 → <b>작업대</b>(그 화면의 물건 하나, 따뜻한 램프 아래) → 엄지 닿는 곳의 <b>주 행동 하나</b> → 아래 <b>벨벳 트레이</b>의 세부. 금빛 머리카락 선이 유일한 금속이고, 색은 상태(물빛·보랏빛·꿀빛)만 말해요. 글꼴은 SUIT 하나(로고만 세리프), 크기는 28·20·16·14·12.</div>
<div class="board" id="board"></div>
<script>
const C={uncut:"var(--uncut)",water:"var(--water)",violet:"var(--violet)",honey:"var(--honey)"};
function stone(states,size=40,label){
  const n=Math.max(3,states.length),R=size/2-1,r=R*.6,cx=size/2,P=(rad,a)=>[cx+rad*Math.cos(a),cx+rad*Math.sin(a)].map(v=>v.toFixed(1)).join(",");
  let g="";for(let i=0;i<n;i++){const a0=-Math.PI/2-Math.PI/n+2*Math.PI*i/n,a1=a0+2*Math.PI/n;g+=`<polygon points="${P(R,a0)} ${P(R,a1)} ${P(r,a1)} ${P(r,a0)}" fill="${C[states[i]||"uncut"]}" stroke="var(--gap)" stroke-width="${size>70?2.2:1.3}"/>`;}
  const all=states.length&&states.every(s=>s==="honey"),ring=Array.from({length:n},(_,i)=>P(r,-Math.PI/2-Math.PI/n+2*Math.PI*i/n)).join(" ");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${g}<polygon points="${ring}" fill="${all?"var(--honey)":"var(--table)"}" stroke="var(--goldA)" stroke-width="1"/>${label?`<text x="${cx}" y="${cx+size*.085}" text-anchor="middle" font-family="SUIT Variable" font-size="${size*.22}" font-weight="800" fill="${all?"#3A2D12":"var(--sub)"}">${label}</text>`:""}</svg>`;}
const pip=(st,w=18)=>{const h=Math.round(w*36/30),c=st&&C[st];return `<svg width="${w}" height="${h}" viewBox="0 0 30 36"><path d="M15 2l12 14-12 18L3 16z" fill="${c||"none"}" stroke="${c||"var(--mute)"}" stroke-width="2" stroke-linejoin="round"/>${c?`<path d="M15 2l12 14H3z" fill="#fff" fill-opacity=".3"/><path d="M15 16v18L3 16z" fill="#000" fill-opacity=".12"/>`:""}</svg>`;};
function cut(lit,size=236,tone="violet"){const R=size/2-4,r=R*.78,t=R*.5,c=size/2,P=(rad,a)=>[c+rad*Math.cos(a),c+rad*Math.sin(a)].map(v=>v.toFixed(1)).join(",");
  const on=tone==="honey"?["var(--honey)","#D9A445"]:tone==="water"?["var(--water)","#4A93C2"]:["var(--violet)","var(--pri)"];
  let g="";for(let i=0;i<12;i++){const a0=(-105+30*i)*Math.PI/180,a1=a0+Math.PI/6;g+=`<polygon points="${P(R,a0)} ${P(R,a1)} ${P(r,a1)} ${P(r,a0)}" fill="${i<lit?on[i%2]:(i%2?"var(--uncut)":"var(--uncut2)")}" stroke="var(--gap)" stroke-width="3"/>`;
   g+=`<polygon points="${P(r,a0)} ${P(r,a1)} ${P(t,a0+Math.PI/12)}" fill="var(--table)" opacity="${i%2?.75:1}"/>`;}
  const ring=Array.from({length:12},(_,i)=>P(t,(-90+30*i)*Math.PI/180)).join(" ");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${g}<polygon points="${ring}" fill="var(--table)" stroke="var(--goldA)"/></svg>`;}
const ICON={today:'<path d="M12 3l8 9-8 9-8-9z"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',rev:'<path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/>',tim:'<circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5"/>',prac:'<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 9h6M9 13h6M9 17h3"/>',shelf:'<path d="M4 6h16M4 18h16"/><path d="M7 6v12M11 6v12M15.5 6.5l3 11"/>'};
const TABS=[["today","오늘"],["check","체크"],["rev","복습"],["tim","타이머"],["prac","실전"],["shelf","서재"]];
const tabbar=on=>`<div class="tabbar">${TABS.map(([k,l])=>`<span class="${k===on?"on":""}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${l}</span>`).join("")}</div>`;
const hdr=(ctx="CS 인터뷰 노트")=>`<div class="hdr"><img class="logo" src="logo-96.png" alt=""><span class="word">Iolite</span><span class="ctx">${ctx} <span style="color:var(--mute)">· 동기화됨</span></span></div>`;
const loupeI='<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>';
const Q="세 기능에 동시성 제어를 골라요. (a) 콘서트 좌석 재고 한 행에 초당 2,000건 차감 (b) 사내 위키 문서 편집 (c) 잔액 차감. 각각 한 줄 UPDATE, 비관적 락, 낙관적 락 중 무엇이고 왜인가요?";
const A="• (a) 한 줄 UPDATE: stock = stock - 1 WHERE stock >= 1. 충돌이 잦아 낙관적 락은 재시도가 폭주해요.\n• (b) 낙관적 락(version). 충돌이 드물고, 몇 분씩 락을 쥐면 남이 기다려요.\n• (c) 외부 조회는 트랜잭션 밖에서, 짧은 트랜잭션에서 FOR UPDATE.";
const VQ="(a) 게시글 좋아요 수, 한 행에 초당 3,000번 증가 (b) 상품 설명 편집, 한 번에 10분 (c) 공연 예약 확정, 외부 결제 승인 2초. 각각 무엇을 고르고 왜인가요?";
const F=[],add=(name,theme,html,cls="")=>F.push({name,theme,html,cls});
const s18=["honey","honey","violet","violet","water","uncut"];
add("00 Components / sheet","dark",`<div class="scr">
 <div class="grp"><p class="eng">원석 · 장 하나, 단계마다 한 면</p><div style="display:flex;gap:12px;align-items:center">${stone(["uncut","uncut","uncut","uncut","uncut","uncut"],64,"18")}${stone(["water","water","uncut","uncut","uncut","uncut"],64,"18")}${stone(["violet","violet","water","water","uncut","uncut"],64,"18")}${stone(s18,64,"18")}${stone(Array(6).fill("honey"),64,"18")}</div><p class="ann">깎지 않음 → 물빛(읽음) → 보랏빛(떠올림) → 꿀빛(며칠 뒤 다시 떠올림). 가운데 테이블은 모든 면이 꿀빛일 때만 꿀빛.</p></div>
 <div class="grp"><p class="eng">커팅 타이머 · 12분 = 12면</p>${cut(7,150)}</div>
 <div class="grp" style="width:300px"><p class="eng">감정서 태그 · 서재의 한 줄 요약</p><div class="tag"><div class="kv"><span class="k">${pip("violet",14)} 2회차 · 4~7단계</span><span class="v num">10.22</span></div><div class="veil"></div><div class="veil" style="width:62%"></div></div><div class="tag empty"><span class="t12">3회차 · 아직 깎지 않았어요</span></div></div>
 <div class="grp" style="width:290px"><p class="eng">벨벳 트레이 · 세부</p><div class="tray"><div class="kv"><span class="k">회차</span><span class="v num">3 / 4~6</span></div><div class="kv"><span class="k">복습</span><span class="v done">오늘 몫 끝</span></div></div></div>
 <div class="grp" style="width:290px"><p class="eng">주 행동과 보조 행동</p><button class="btn pri">블록 준비</button><button class="btn sec">노션에서 8단계</button></div>
 <div class="grp" style="width:290px"><p class="eng">채점 · 다음 간격을 함께</p><div class="grade"><div class="g1">못 함<small>내일</small></div><div class="g2">반쯤<small>3일</small></div><div class="g3">맞음<small>7일 뒤</small></div></div></div>
 <div class="grp" style="width:290px"><p class="eng">돋보기 검색</p><div class="loupe">${loupeI}요약에서 찾기</div></div>
 <div class="grp" style="width:300px"><p class="eng">글꼴 · SUIT 하나</p><p class="t28">28 화면 제목</p><p class="t20">20 작업대 제목</p><p class="t16">16 강조 본문</p><p class="t14">14 본문 · 설명</p><p class="t12">12 보조 · 날짜</p><p class="eng">11 새긴 라벨</p></div>
 <div class="grp" style="width:300px"><p class="eng">색 · 상태만 말해요</p><div style="display:flex;gap:8px"><span class="chip c-w">물빛 · 아직</span><span class="chip c-v">보랏빛 · 깎는 중</span><span class="chip c-h">꿀빛 · 다듬음</span></div><p class="ann">금빛 머리카락 선은 라벨·구분선·탭 표시에만. 그림자·유리 효과 없음. 램프 빛은 작업대 뒤에만.</p></div>
 <div class="grp" style="width:300px"><p class="eng">움직임</p><p class="ann">깎기(cut): 상태가 바뀌면 그 면만 180ms로 채워져요. 빛 받기: 무언가 얻었을 때만 한 번 반짝 + 숫자 올라감. 길게 누르기: 가장자리가 시계 방향으로 채워짐. 동작 줄이기 설정이면 즉시 전환.</p></div>
</div>`,"sheet");
add("01 서재 / home / dark","dark",`<div class="scr">${hdr("서재")}<div class="bench"><p class="eng">노트</p><div class="velvetbox">${stone(s18,108,"CS")}</div><p class="t20">CS 인터뷰 노트</p><p class="t14">본 경로 40장 · 31 / 222회차 · 통과한 장 4</p></div>
 <div class="act"><button class="btn pri">노트 펼치기</button></div><div class="hair"></div>
 <div class="tray"><div class="kv"><span class="k">요약 서재</span><span class="v num">128장 · 오늘 6장</span></div><div class="shelf"><p class="eng">4부 · 데이터베이스</p><div class="stones">${["17","18","19","20"].map((n,i)=>`<span class="stone">${stone([["honey","honey","violet","water","uncut"],s18,["water","water","uncut","uncut"],["uncut","uncut","uncut","uncut","uncut"]][i],40)}${n}</span>`).join("")}</div></div></div>
