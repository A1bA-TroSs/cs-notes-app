<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#12101C"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Iolite β">
<title>Iolite</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@800&amp;text=Iolite&amp;display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* Iolite — 보석 이름처럼 한 가지 보랏빛만 쓰고 나머지는 차분한 중성색. iOS식 큰 제목, 묶은 목록, 떠 있는 탭 막대 */
:root{ /* 밤 테마 하나. 색은 상태만 말해요: 물빛(아직) · 보랏빛(익히는 중, 지금 할 것) · 꿀빛(익힘) */
  --bg:#12101C; --surface:#1C1930; --surface-2:#262240; --border:#2D2945; --text:#F1EEFA; --text-2:#B0AAC7;
  --primary:#A99CFF; --on-primary:#14102A; --primary-tint:#2A2546; --primary-ink:#D3CDFF; --violet:#9A82FF; --empty:#6C6690;
  --water:#5BB0E6; --water-tint:#172838; --water-ink:#A9D8F6;
  --honey:#F0B93A; --honey-tint:#3A2D12; --honey-ink:#F6D27A;
  --wash:radial-gradient(120% 40% at 100% 0%,rgba(150,160,255,.16),transparent 70%),radial-gradient(90% 30% at 0% 100%,rgba(232,180,100,.06),transparent 70%);
  --cardsheen:linear-gradient(160deg,rgba(150,140,255,.08),rgba(120,150,255,0) 45%);
  --success:var(--honey); --success-tint:var(--honey-tint); --warning:var(--primary-ink); --warning-tint:var(--primary-tint); --danger:#FF7B6E; --danger-tint:#3A1C19;
  --shadow:none; --glass:rgba(26,23,38,.78); color-scheme:dark;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:22px;
  --f-body:"SUIT Variable",SUIT,Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.9,.25,1.05);
  --omr:var(--primary); --omr-soft:var(--primary-tint); --ok:var(--honey); --ok-soft:var(--honey-tint); --half:var(--primary-ink); --half-soft:var(--primary-tint);
  --muted:var(--text-2); --line:var(--border); --ink:var(--text); --text-3:#8A85A0;
  --hero:linear-gradient(135deg,#231E64 0%,#352F8E 34%,#3F56AE 70%,#5470BE 100%);
  --facet-off:#2A2639; --facet-off2:#252133; --facet-star:#1E1B2C; --facet-table:#171522; --facet-gap:#12101C;
}
/* 라이트 모드: 기록 탭에서 고르거나(라이트), 시스템을 따를 때 기기가 라이트면 */
:root[data-theme="light"]{--bg:#F6F3FA; --surface:#FFFFFF; --surface-2:#EEEAF6; --border:#E4DFEE; --text:#1B1730; --text-2:#5E5873; --text-3:#7A7490;
  --primary:#5443C8; --on-primary:#FFFFFF; --primary-tint:#ECE8FA; --primary-ink:#2B2674; --violet:#6E4FD6; --empty:#9892B0;
  --water:#2F86BF; --water-tint:#E3F0F8; --water-ink:#1D5E88; --honey:#D9981A; --honey-tint:#FBF0D8; --honey-ink:#8A5F07;
  --wash:radial-gradient(120% 40% at 100% 0%,rgba(110,90,230,.10),transparent 70%),radial-gradient(90% 30% at 0% 100%,rgba(230,170,80,.07),transparent 70%);
  --cardsheen:linear-gradient(160deg,rgba(84,67,200,.05),rgba(84,100,200,0) 45%);
  --hero:linear-gradient(140deg,#6652DC 0%,#5443C8 45%,#3D3EA6 100%);
  --facet-off:#E7E2F3; --facet-off2:#DED8EE; --facet-star:#F1EEF8; --facet-table:#FBFAFE; --facet-gap:#F6F3FA;
  --danger:#C0362C; --danger-tint:#FBE7E5; --glass:rgba(255,255,255,.8); color-scheme:light;}
@media (prefers-color-scheme: light){:root[data-theme="system"]{--bg:#F6F3FA; --surface:#FFFFFF; --surface-2:#EEEAF6; --border:#E4DFEE; --text:#1B1730; --text-2:#5E5873; --text-3:#7A7490;
  --primary:#5443C8; --on-primary:#FFFFFF; --primary-tint:#ECE8FA; --primary-ink:#2B2674; --violet:#6E4FD6; --empty:#9892B0;
  --water:#2F86BF; --water-tint:#E3F0F8; --water-ink:#1D5E88; --honey:#D9981A; --honey-tint:#FBF0D8; --honey-ink:#8A5F07;
  --wash:radial-gradient(120% 40% at 100% 0%,rgba(110,90,230,.10),transparent 70%),radial-gradient(90% 30% at 0% 100%,rgba(230,170,80,.07),transparent 70%);
  --cardsheen:linear-gradient(160deg,rgba(84,67,200,.05),rgba(84,100,200,0) 45%);
  --hero:linear-gradient(140deg,#6652DC 0%,#5443C8 45%,#3D3EA6 100%);
  --facet-off:#E7E2F3; --facet-off2:#DED8EE; --facet-star:#F1EEF8; --facet-table:#FBFAFE; --facet-gap:#F6F3FA;
  --danger:#C0362C; --danger-tint:#FBE7E5; --glass:rgba(255,255,255,.8); color-scheme:light;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--wash),var(--bg);background-attachment:fixed;color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px;padding:8px 2px 2px}
header .word{font-family:'Noto Serif KR',Georgia,serif;font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1;margin:0}
header .sync{margin-left:auto;text-align:right;max-width:46%}
header .logo{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(67,53,168,.25))}
header h1{font-size:2rem;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.03em}
header .sub{display:flex;flex-direction:column;min-width:0}
.sync{font-size:.75rem;color:var(--text-2)} .sync.ok{color:var(--success)}
.note{color:var(--text-2);font-size:.85rem}
h2,.part h2{font-size:.8rem;font-weight:600;color:var(--text-2);margin:12px 4px 6px;letter-spacing:.02em}
/* 버튼 */
button{font:inherit;cursor:pointer;border-radius:var(--r-m);border:0;background:var(--surface-2);color:var(--text);padding:11px 16px;min-height:44px;font-weight:500;transition:transform .18s var(--ease),background .2s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default;transform:none}
button.primary{background:var(--primary);color:var(--on-primary);font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],input:not([type]),input[type=password],input[type=date],input[type=number],select,textarea{font:inherit;border:1px solid var(--border);border-radius:var(--r-m);background:var(--surface);color:var(--text);padding:11px 13px;min-width:0}
input[type=search]{flex:1 1 200px;background:var(--surface-2);border-color:transparent}
textarea{width:100%;min-height:104px;resize:vertical;background:var(--bg)}
code{font-family:var(--f-mono);font-size:.85em;background:var(--surface-2);border-radius:6px;padding:1px 6px}
/* 카드와 묶은 목록 */
.card{background:var(--cardsheen),var(--bg);border:1px solid var(--border);border-radius:var(--r-xl);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.rows{background:var(--cardsheen),var(--bg);border:1px solid var(--border);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:2.6rem 1fr auto;gap:12px;align-items:center;padding:12px 16px;min-height:56px;width:100%;text-align:left;border-radius:0;background:transparent;position:relative;font-weight:400}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--border)}
.row:hover{background:var(--surface-2)}
.num{font-family:var(--f-mono);color:var(--primary-ink);font-size:.85rem;font-weight:600;background:var(--primary-tint);border-radius:8px;text-align:center;padding:4px 0}
.ttl{min-width:0;font-size:.95rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:.72rem;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text-2);background:var(--surface-2);font-weight:600}
.chip.pass{background:var(--success-tint);color:var(--success)}
.chip.fail{background:var(--primary-tint);color:var(--primary-ink)}
.chip.new{background:var(--water-tint);color:var(--water-ink)}
.stats{display:flex;gap:14px;flex-wrap:wrap;color:var(--text-2);font-size:.85rem;font-variant-numeric:tabular-nums;padding:0 4px}
.stats b{color:var(--text)}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;color:var(--text-2);font-size:.85rem}
/* 퀴즈 */
.bubbles{display:flex;gap:6px}
.bub{flex:1;height:5px;border-radius:999px;background:var(--surface-2)}
.bub.on{background:var(--water)} .bub.ok{background:var(--honey)} .bub.half{background:var(--primary)}
.q{font-size:1.15rem;font-weight:600;margin:0;line-height:1.5;letter-spacing:-.01em}
.ans{background:var(--surface-2);border-radius:var(--r-l);padding:14px 16px;white-space:pre-line;animation:reveal .28s var(--ease)}
.ans .lbl,.tail .lbl{font-size:.72rem;letter-spacing:.06em;color:var(--primary-ink);font-weight:700;display:block;margin-bottom:6px}
.tail{background:var(--primary-tint);border-radius:var(--r-l);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tail .q{font-size:1rem}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .g-ok{background:var(--success-tint);color:var(--success);font-weight:700}
.grade .g-half{background:var(--warning-tint);color:var(--warning);font-weight:700}
.grade .g-no{background:var(--water-tint);color:var(--water-ink);font-weight:700}
.lv{font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-weight:600}
.lv.hi{background:var(--primary-tint);color:var(--primary-ink)}
.result h2{margin:0;font-size:1.35rem;color:var(--text)}
.big{font-size:3rem;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pass-box{scroll-margin-top:16px;background:var(--success-tint);color:var(--success);padding:12px 14px;border-radius:var(--r-m);font-weight:600}
.fail-box{background:var(--warning-tint);color:var(--warning);padding:12px 14px;border-radius:var(--r-m);font-weight:600}
.missed{display:flex;flex-direction:column;gap:10px}
.missed div{border-top:1px solid var(--border);padding-top:10px;font-size:.92rem}
.practice{border-top:1px solid var(--border);padding-top:12px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.practice code{white-space:nowrap}
/* 타이머 */
.ring{width:min(260px,74vw);aspect-ratio:1;margin:4px auto;display:grid;place-items:center}
.ring>svg{grid-area:1/1;width:100%;height:100%}
.core{grid-area:1/1;position:relative;width:52%;aspect-ratio:1;min-height:auto;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;color:var(--text);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.core:active{transform:none}
.core .clock{grid-area:auto;font-size:2.5rem}
.core-ic svg{width:20px;height:20px;fill:currentColor;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;color:var(--text-2)}
.core.held .core-ic svg{color:var(--primary)}
.core.held .clock{color:var(--text-2)}
.hold-ring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg);pointer-events:none}
.hold-ring circle{fill:none;stroke:var(--danger);stroke-width:4;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .15s ease-out}
.core.pressing .hold-ring circle{stroke-dashoffset:0;transition:stroke-dashoffset 1.2s linear}
@media (prefers-reduced-motion:reduce){.core.pressing .hold-ring circle{transition:none;stroke-dashoffset:0}}
.gem{display:inline-block;vertical-align:middle;flex:none}
.gems{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;min-height:48px}
.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center}
.boxes div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--text-2)}
.boxes b{font-size:1rem;color:var(--text);font-variant-numeric:tabular-nums}
.clock{grid-area:1/1;position:relative;font-size:2.9rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:center}
.phase{text-align:center;font-weight:700;color:var(--primary-ink);font-size:.95rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.75rem;font-variant-numeric:tabular-nums}
.week div{background:var(--surface-2);border-radius:10px;padding:6px 0;color:var(--text-2)}
.week .on{background:var(--honey-tint);color:var(--honey-ink);font-weight:700}
/* 오늘: 지금 할 것 한 장 + 숫자 두 칸 + 이번 주 보석 */
.dateline{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.pill{flex:none;white-space:nowrap;font-size:.75rem;font-weight:600;color:var(--text-2);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums}
.hero{position:relative;overflow:hidden;border-radius:28px;color:#fff;padding:24px;display:flex;flex-direction:column;gap:6px;min-height:196px;background:var(--hero);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.07)}
.hero>svg.tex{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*:not(svg){position:relative}
.hero .eyebrow{font-size:13px;line-height:18px;font-weight:700;opacity:.9}
.hero .t{margin:0;color:#fff;font-size:30px;line-height:36px;font-weight:800;letter-spacing:-.5px}
.hero .s{margin:0;font-size:16px;line-height:24px;font-weight:500}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .go{min-height:48px;padding:0 24px;border:0;border-radius:24px;background:#fff;color:#2B2674;font-size:16px;font-weight:800}
.hero .go2{display:inline-flex;align-items:center;min-height:48px;padding:0 18px;border-radius:24px;border:1.5px solid rgba(255,255,255,.55);color:#fff;font-weight:700;font-size:15px;text-decoration:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--cardsheen),var(--bg);border:1px solid var(--border);border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:auto;font-weight:400}
.tile .lab{font-size:14px;color:var(--text-2);font-weight:600}
.tile .n{font-size:32px;line-height:38px;font-weight:800;color:var(--primary-ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .sub{font-size:14px;color:var(--text-2)}
.tile:disabled{opacity:1}.tile:disabled .n{color:var(--text-3)}
.nlink{font-size:.88rem;font-weight:600;color:var(--primary-ink);text-decoration:none;align-self:flex-start}
.crumb{align-self:flex-start;min-height:32px;padding:4px 12px;border-radius:999px;background:transparent;border:1px solid var(--border);color:var(--text-2);font-size:13px;font-weight:600}
.nbcard{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:left;border-radius:28px;padding:22px;color:#fff;min-height:auto;background:var(--hero);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.07);font-weight:400}
.nbcard .eyebrow{font-size:13px;font-weight:700;opacity:.85}.nbcard .t{font-size:26px;font-weight:800;letter-spacing:-.5px}.nbcard .s{font-size:14px;opacity:.85}.nbcard .meta{color:rgba(255,255,255,.85);font-size:13px}.nbcard .gems{min-height:36px;justify-content:flex-start;gap:4px}
.spines{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.spine{position:relative;width:34px;height:78px;min-height:78px;padding:0;border-radius:8px;border:1px solid var(--border);background:var(--surface);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.spine .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--violet),#5B4BC4);opacity:.85}
.spine .lbl{position:relative;font-size:11px;font-weight:700;color:var(--text);padding-bottom:4px;font-variant-numeric:tabular-nums}
.spine:disabled{opacity:.45;border-style:dashed}
.whenbox{border:1px solid var(--border);border-radius:16px;padding:8px 14px;background:var(--cardsheen),var(--bg)}
.whenbox p{margin:6px 0 2px}
.linkbtn{min-height:auto;padding:0;background:none;color:var(--primary-ink);font-weight:700;font-size:inherit;text-decoration:underline}
.strip{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:12px 16px;font-size:13px;color:var(--text-2)}
.strip>span:first-child{font-size:15px;font-weight:700;color:var(--text)}
.round{width:44px;height:44px;min-height:44px;padding:0;border-radius:22px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:20px}
.grade button small{display:block;font-size:.72rem;font-weight:500;opacity:.85}
/* 오늘·실전·기록 */
.todo{display:flex;flex-direction:column;gap:8px}
.todo button{text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:52px;border-radius:var(--r-l)}
.todo input:not([type=checkbox]){width:100%}
.prog{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden} .prog>i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .6s var(--ease)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:.92rem;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--text-2)}
.gate{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;line-height:1.5}
.gate input{margin-top:4px;width:18px;height:18px;accent-color:var(--primary);flex:none}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.prow>.row{display:block;min-height:0}
.pitem{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--border)}
.popen{display:grid;grid-template-columns:1fr auto;column-gap:12px;row-gap:3px;align-items:center;color:inherit;text-decoration:none;min-width:0}
.popen .ptitle{grid-column:1;font-size:.95rem;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.popen .pmeta{grid-column:1;font-size:.8rem;color:var(--text-3)}
.popen .pgo{grid-column:2;grid-row:1/3;font-size:.82rem;font-weight:700;color:var(--primary-ink);background:var(--primary-tint);padding:8px 14px;border-radius:999px;white-space:nowrap}
.pact{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.pact .sp{flex:1}
.pbtn{min-height:36px;padding:6px 12px;font-size:.8rem;font-weight:600;border-radius:999px;background:transparent;border:1px solid var(--border);color:var(--text-2)}
.pbtn.on{border-color:var(--primary);color:var(--primary-ink)}
.pform{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 0 12px}
.pform input[type=number]{width:5.5em}
.mdx{font-size:.92rem;line-height:1.6;min-width:0}.mdx table{border-collapse:collapse;display:block;overflow-x:auto;font-size:.85rem}.mdx td,.mdx th{border:1px solid var(--border);padding:4px 8px;vertical-align:top}.mdx pre{background:var(--surface-2);padding:10px;border-radius:var(--r-s);overflow-x:auto;font-size:.82rem}.mdx code{font-family:var(--f-mono);font-size:.88em}.mdx details{border:1px solid var(--border);border-radius:var(--r-m);padding:6px 12px;margin:8px 0}.mdx h2{font-size:1rem;color:var(--text);margin:16px 0 6px}.mdx h3{font-size:.95rem;margin:12px 0 4px}

function navHtml(){const due=dueIds().length; return `<nav class="nav" aria-label="메뉴">`+NAV.map(([t,l])=>`<button data-tab="${t}" ${tab===t?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[t]}</svg><span>${l}</span>${t==="rev"&&due?`<span class="badge">${due}</span>`:""}</button>`).join("")+`</nav>`}

let shelf=true; // 처음 열면 서재. 블록이 돌고 있거나 탭 주소로 열면 바로 노트로
function shelfHtml(){
  const ws=weekStart(), wSess=store.steps.filter(x=>x.date>=ws).length, passed=Object.values(store.attempts).filter(a=>a.some(x=>x.pass)).length;
  const path=pathChapters(), sT=path.reduce((a,n)=>a+((chapterOf(n)||{}).sessions||[]).length,0), sD=path.reduce((a,n)=>a+(store.sess[n]||[]).length,0);
  return `<p class="note" style="margin:0">서재 · 공부할 노트를 골라요</p>
  ${NOTEBOOKS.map(nb=>`<button class="nbcard" data-nb="${nb.id}"><span class="eyebrow">노트</span><span class="t">${esc(nb.title)}</span><span class="s">${esc(nb.sub)}</span>
    <span class="gems">${Array.from({length:Math.max(wkOf(ws).goal,wSess)},(_,i)=>gem(i<wSess?"done":"empty",22)).join("")}</span>
    <span class="meta"><span>${esc(scopeLabel())} · ${sD}/${sT}회차</span><span>통과한 장 ${passed}</span></span></button>`).join("")}
  ${IoliteCart.list.filter(c=>c.id!==NB.id).map(c=>`<button class="nbcard" data-cart="${esc(c.id)}"><span class="eyebrow">노트</span><span class="t">${esc(c.title)}</span><span class="s">${esc(c.sub)}</span></button>`).join("")}
  <div class="card"><p class="q">카트리지</p><p class="note">노트 하나 = 카트리지 파일 하나. 꽂은 카트리지는 이 기기에만 저장되고, 기록은 노트마다 따로예요. GitHub에 연결돼 있으면 비공개 저장소의 cartridges/ 폴더에서 새 버전을 받아요.</p>
    <div class="bar"><button id="cart-add">파일에서 꽂기</button>${gh&&gh.token?`<button id="cart-refresh">GitHub에서 새로 받기</button>`:""}<button id="cart-remove">'${esc(NB.title)}' 빼기</button></div><p class="note" id="cart-msg" role="status"></p></div>`;
}
function home(){
  if(shelf){ app.innerHTML=`<header><img class="logo" src="data:image/png;base64,${LOGO}" alt=""><h1 class="word">Iolite</h1><span id="sync" class="sync ${gh&&gh.token?"ok":""}">${headSync()}</span></header>`+shelfHtml();
    app.querySelectorAll("[data-nb]").forEach(b=>b.onclick=()=>{shelf=false; home(); window.scrollTo(0,0);});
    app.querySelectorAll("[data-cart]").forEach(b=>b.onclick=()=>IoliteCart.use(b.dataset.cart));
    const cmsg=t=>{document.getElementById("cart-msg").textContent=t};
    document.getElementById("cart-add").onclick=()=>IoliteCart.addFile().catch(e=>cmsg(e.message));
    const cr=document.getElementById("cart-refresh"); if(cr) cr.onclick=()=>{cmsg("확인하는 중…"); IoliteCart.refresh().then(n=>cmsg(n?"새 버전을 받았어요":"이미 최신이에요")).catch(e=>cmsg("못 받았어요: "+e.message));};
    document.getElementById("cart-remove").onclick=()=>{ if(confirm(`'${NB.title}' 카트리지를 이 기기에서 뺄까요? 공부 기록은 지워지지 않아요. 다시 꽂으면 이어서 해요.`)) IoliteCart.remove(NB.id); };
    return; }
  let h=`<header><img class="logo" src="data:image/png;base64,${LOGO}" alt=""><h1 class="word">Iolite</h1><span id="sync" aria-live="polite" class="sync ${syncState==="ok"||(gh&&gh.token)?"ok":""}">${headSync()}</span></header>`+navHtml();
  const view={today:todayHtml,tim:timerHtml,rev:revHtml,prac:pracHtml,stats:statsHtml,self:selfHtml}[tab]||selfHtml;
  app.innerHTML=h+`<div class="bar" style="justify-content:space-between"><button class="crumb" id="to-shelf">‹ Iolite · ${esc(NB.title)}</button><button class="crumb" data-guide>사용법</button></div>`+(guideView?guideHtml():whenBox(tab)+view());
  document.getElementById("to-shelf").onclick=()=>{shelf=true; guideView=false; home(); window.scrollTo(0,0);};
  app.querySelectorAll("[data-guide]").forEach(b=>b.onclick=()=>{guideView=true; home(); window.scrollTo(0,0);});
  if(guideView){ document.getElementById("guide-close").onclick=()=>{guideView=false; home(); window.scrollTo(0,0);}; bindTabs(); return; }
  bindTabs();
  ({today:bindToday,tim:bindTimer,rev:bindRev,prac:bindPrac,stats:bindStats,self:bindSelf}[tab]||bindSelf)();
}
function selfHtml(){
  const passed=Object.values(store.attempts).filter(a=>a.some(x=>x.pass)).length;
  let h=`<div class="stats"><span>통과한 장 <b>${passed}</b> / ${DATA.length}</span><span>장마다 5문항 · 4점 이상 통과</span></div>
  <div class="bar"><input type="search" id="q" placeholder="장 번호나 제목으로 찾기 (예: 62, 도커)" value="${esc(filter)}"></div>`;
  const scp=scopeParts();
  for(const [pi,[name,test]] of PARTS.entries()){ if(scp&&!scp.includes(pi)&&!filter) continue;
    const cs=DATA.filter(c=>test(numOf(c))&&(!filter||(c.num+" "+c.title).toLowerCase().includes(filter.toLowerCase())));
    if(!cs.length)continue;
    h+=`<section class="part"><h2>${name}</h2><div class="rows">`+cs.map(c=>{
      const l=last(c.num), ok=(store.attempts[c.num]||[]).some(x=>x.pass);
      const sd=(store.sess[c.num]||[]).length, sn=(c.sessions||[]).length;
      const chip=(sn&&!ok?`<span class="chip">${sd*2<sn?`${sd}/${sn}회차`:`남은 ${sn-sd}회차`}</span>`:"")+(l?`<span class="chip ${ok?"pass":"fail"}">${ok?"통과":"재도전"} · ${l.score}/5 · ${l.date.slice(5)}</span>`:(sn?"":`<span class="chip">${c.self.length}문항</span>`));
      return `<button class="row" data-num="${c.num}"><span class="num">${c.num}</span><span class="ttl">${esc(c.title.replace(/^\d+b?\.\s*/,""))}</span>${chip}</button>`}).join("")+`</div></section>`;
  }
  return h;
}
function bindSelf(){
  const q=document.getElementById("q"); if(q){q.oninput=e=>{filter=e.target.value;const p=q.selectionStart;home();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)}}
  app.querySelectorAll(".row").forEach(b=>b.onclick=()=>startChapter(b.dataset.num));
}

function pick(pool,n){ // 적용·평가·꼬리 문항을 최소 3개 넣고 나머지를 채워요

}

function weekPlan(ws){ // {chs: 이번 주 장, carried: 그중 지난 주들에서 넘어온 장, row: 달력상 이번 주 계획 행}
  const wk=weekNo(); if(scopeParts()||!wk||wk<1||!APP.plan.length) return null;
  const cur=Math.min(wk,APP.plan.length), row=wk<=APP.plan.length?APP.plan[wk-1]:null, mine=new Set(row?planChs(wk-1):[]);
  const doneNow=n=>store.steps.some(x=>x.ch===n&&x.date>=ws)||(store.attempts[n]||[]).some(x=>x.pass&&x.date>=ws);
  const all=[...new Set([...Array(cur)].flatMap((_,i)=>planChs(i)))].filter(n=>!chDone(n)||doneNow(n));
  const chs=all.slice(0,Math.max(WEEK_CH,mine.size));
  return {chs,carried:chs.filter(n=>!mine.has(n)),row};
}

/* 보석 나무 (카트리지 atelier:"tree", 성경 원어 노트): 금실로 꼰 보석 진열 나무. 왼쪽 가지 = 첫째 부, 오른쪽 = 둘째 부.

      for(let j=0;j<per;j++){ const k=t*per+j; if(k>=slots[pi]) break;
        const u=.3+j*.21, bx=(1-u)**3*x0+3*(1-u)**2*u*(cx+s*L*.35)+3*(1-u)*u*u*(cx+s*L*.7)+u**3*x1, by=(1-u)**3*(y+10)+3*(1-u)**2*u*(y-2)+3*(1-u)*u*u*(y-4)+u**3*ty;

   꽂은 카트리지는 이 기기 브라우저(IndexedDB)에만 저장돼요. 다 읽으면 #iolite-main 스크립트를 실행해요. */
(function(){
  const DB="iolite", ST="carts", AKEY="iolite-cart-active", GHKEY="csnotes-gh-v1", DIR="cartridges";
  const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open(DB,1); r.onupgradeneeded=()=>r.result.createObjectStore(ST,{keyPath:"id"}); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error);});
  const tx=async(mode,fn)=>{const d=await idb(); return new Promise((ok,no)=>{const t=d.transaction(ST,mode); const q=fn(t.objectStore(ST)); t.oncomplete=()=>ok(q&&q.result); t.onerror=()=>no(t.error);});};
  const all=()=>tx("readonly",s=>s.getAll()), put=c=>tx("readwrite",s=>s.put(c)), del=id=>tx("readwrite",s=>s.delete(id));
  const gh=()=>{try{const g=JSON.parse(localStorage.getItem(GHKEY)); return g&&g.owner&&g.repo&&g.token?g:null}catch(e){return null}};
  const active=()=>{try{return localStorage.getItem(AKEY)}catch(e){return null}}, setActive=id=>{try{localStorage.setItem(AKEY,id)}catch(e){}};
  function check(c){ // 카트리지 형식 검사: 형식 이름, id, 제목, 장 목록
    if(!c||c.format!=="iolite-cartridge") throw new Error("Iolite 카트리지 파일이 아니에요");
    if(!c.id||!/^[a-z0-9-]+$/.test(c.id)) throw new Error("카트리지 id가 없거나 이상해요");
    if(!c.title||!Array.isArray(c.chapters)||!c.chapters.length) throw new Error("제목이나 장 목록이 비었어요");
    c.chapters.forEach((ch,i)=>{ if(!ch||!ch.num||!ch.title) throw new Error(`${i+1}번째 장에 num이나 title이 없어요`); ch.self=ch.self||[]; ch.quick=ch.quick||[]; ch.sessions=ch.sessions||[]; ch.optional=ch.optional||[]; });
    return c;
  }
  async function ghFetch(g,path,raw){
    const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}?t=${Date.now()}`,{headers:{"Authorization":"Bearer "+g.token,"Accept":raw?"application/vnd.github.raw":"application/vnd.github+json"}});
    if(r.status===404) return null; if(!r.ok) throw new Error("GitHub "+r.status); return raw?r.text():r.json();
  }
  async function fromGitHub(g){ // cartridges/*.json 을 전부 받아 꽂아요. 바뀐 것(sha)만 다시 받아요
    const list=await ghFetch(g,DIR); if(!Array.isArray(list)) return 0;
    const have=Object.fromEntries((await all()).map(c=>[c.id,c.src&&c.src.sha]));
    let n=0;
    for(const f of list.filter(f=>f.type==="file"&&/\.json$/.test(f.name))){
      if(Object.values(have).includes(f.sha)) continue;
      const c=check(JSON.parse(await ghFetch(g,f.path,true))); c.src={kind:"github",path:f.path,sha:f.sha}; await put(c); n++;
    }
    return n;
  }
  async function fromFile(file){ const c=check(JSON.parse(await file.text())); c.src={kind:"file",name:file.name}; await put(c); setActive(c.id); return c; }
  const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
  const pickFile=()=>new Promise(ok=>{const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json"; i.onchange=()=>ok(i.files[0]||null); i.click();});
  function emptyView(msg){ // 카트리지가 없을 때: 빈 Iolite
    const app=document.getElementById("app"), g=gh();
    if(document.body.dataset.page==="practice"){ app.innerHTML=`<div class="wrap"><p class="note">${esc(msg||"꽂은 카트리지가 없어요.")} <a href="./">Iolite</a>에서 카트리지를 먼저 꽂아요.</p></div>`; return; }
    app.innerHTML=`<header><h1 class="word">Iolite</h1></header>
    <div class="card"><p class="q">카트리지를 꽂아 주세요</p><p class="note">Iolite는 빈 공부 앱이에요. 노트 카트리지(JSON 파일 하나)를 꽂으면 그 노트로 회차 타이머, 체크, 간격 복습을 할 수 있어요. 카트리지는 이 기기 안에만 저장돼요.</p>
      <div class="bar"><button class="primary" id="cart-file">파일에서 꽂기</button></div></div>
    <div class="card"><p class="q">내 GitHub 저장소에서 받기</p><p class="note">비공개 저장소의 <code>${DIR}/</code> 폴더에 있는 카트리지를 받아요. 같은 저장소의 records.json에 공부 기록도 동기화돼요. 토큰은 이 기기에만 저장돼요.</p>
      <input id="cg-owner" placeholder="GitHub 아이디" value="${esc(g?g.owner:"")}" autocapitalize="off"><input id="cg-repo" placeholder="저장소 이름" value="${esc(g?g.repo:"")}" autocapitalize="off"><input id="cg-token" type="password" placeholder="${g?"저장된 토큰 쓰기":"토큰 (Contents 읽기·쓰기)"}">
      <div class="bar"><button id="cart-gh">받기</button></div></div>
    <p class="note" id="cart-msg" role="status">${esc(msg||"")}</p>`;
    const say=t=>{document.getElementById("cart-msg").textContent=t};
    document.getElementById("cart-file").onclick=async()=>{const f=await pickFile(); if(!f) return; try{await fromFile(f); location.reload();}catch(e){say(e.message)}};
    document.getElementById("cart-gh").onclick=async()=>{
      const o=document.getElementById("cg-owner").value.trim(), r=document.getElementById("cg-repo").value.trim(), t=document.getElementById("cg-token").value.trim()||(g&&g.token);
      if(!o||!r||!t){say("아이디, 저장소, 토큰을 모두 넣어요");return}
      const ng={owner:o,repo:r,token:t,path:"records.json"}; say("받는 중…");
      try{ const n=await fromGitHub(ng); if(!n&&!(await all()).length){say(`${o}/${r}의 ${DIR}/ 폴더에 카트리지가 없어요`);return} localStorage.setItem(GHKEY,JSON.stringify(ng)); location.reload(); }catch(e){say("못 받았어요: "+e.message)}
    };
  }
  function runMain(c,list){
    if(document.body.dataset.page==="practice"&&!c.practice){ emptyView(`'${c.title}' 카트리지에는 알고리즘 실전 문제가 없어요.`); return; }
    window.__CART=c;
    window.IoliteCart={list:list.map(x=>({id:x.id,title:x.title,sub:x.sub||"",src:x.src})),active:c.id,
      use:id=>{setActive(id); location.reload();},
      addFile:async()=>{const f=await pickFile(); if(!f) return; const n=await fromFile(f); location.reload(); return n;},
      refresh:async()=>{const g=gh(); if(!g) throw new Error("GitHub 연결이 없어요"); const n=await fromGitHub(g); if(n) location.reload(); return n;},
      remove:async id=>{await del(id); if(id===active()) try{localStorage.removeItem(AKEY)}catch(e){} location.reload();}};
    const s=document.createElement("script"); s.textContent=document.getElementById("iolite-main").textContent; document.body.appendChild(s);
  }
  async function boot(){
    if(window.__CART_INLINE){ runMain(window.__CART_INLINE,[window.__CART_INLINE]); return; } // 로컬 파일용 빌드(내용이 페이지에 들어 있음)
    let list=[]; try{list=await all()}catch(e){ emptyView("이 브라우저는 카트리지를 저장할 수 없어요(사파리 개인정보 보호 모드라면 끄고 열어요)"); return; }
    const g=gh();
    if(!list.length&&g){ document.getElementById("app").innerHTML=`<p class="note" style="padding:24px">카트리지를 받는 중…</p>`; try{await fromGitHub(g); list=await all();}catch(e){ emptyView("GitHub에서 카트리지를 못 받았어요: "+e.message); return; } }
    if(!list.length){ emptyView(); return; }
    const c=list.find(x=>x.id===active())||list[0];
    runMain(c,list);
    if(g) setTimeout(()=>fromGitHub(g).catch(()=>{}),4000); // 새 버전은 다음에 열 때 반영돼요
  }
  boot();
})();
</script>


</body></html>
